function importAusfuehren(){
  const z = {};
  document.querySelectorAll("[data-map]").forEach(s=>{ if(s.value!=="") z[s.getAttribute("data-map")]=Number(s.value); });
  if(z.name===undefined){ toast("Firmenname muss zugeordnet sein"); return; }

  const setBranche = $("#impBranche").value;
  const setStatus  = $("#impStatus").value;
  const setWeg     = $("#impWeg").value;
  const setQuelle  = $("#impQuelle").value;
  const dubPruefen = $("#impDub").checked;
  const restInNotiz= $("#impRest").checked;
  const ausSkip    = $("#impAus") ? $("#impAus").checked : false;
  const belegt     = new Set(Object.values(z));

  /* Kopf-Index-Map: erlaubt den Zugriff auf die Flag- und Anrede-Spalten
     der Kaltakquise-Liste ueber ihren Namen, ganz ohne manuelle Zuordnung. */
  const H = {};
  Import.kopf.forEach((k,i)=> H[String(k==null?"":k).trim().toUpperCase()] = i);

  const vorhanden = new Set(Store.data.firmen.map(f=>(f.name||"").toLowerCase().trim()+"|"+(f.ort||"").toLowerCase().trim()));
  let neu=0, uebersprungen=0, ausgelassen=0, gesperrtN=0;

  for (const zeile of Import.zeilen){
    const w = k => z[k]!==undefined ? String(zeile[z[k]]||"").trim() : "";
    const name = w("name");
    if(!name){ uebersprungen++; continue; }
    const ort = w("ort");
    const schluessel = name.toLowerCase()+"|"+ort.toLowerCase();
    if(dubPruefen && vorhanden.has(schluessel)){ uebersprungen++; continue; }
    vorhanden.add(schluessel);

    /* Zugriff auf Listen-Spalten ueber den Kopfnamen, unabhaengig von
       der manuellen Zuordnung. */
    const zell = nm => { const i=H[nm]; return i!==undefined ? String(zeile[i]==null?"":zeile[i]).trim() : ""; };

    /* Zeilen, die in der Liste ausgeschlossen sind (tot, erloschen,
       Wettbewerber, ausser Reichweite), gar nicht erst uebernehmen. */
    if(ausSkip && zell("AUSSCHLUSS")){ ausgelassen++; uebersprungen++; continue; }

    const kat = w("kategorie") || w("branche") || name;

    /* Fremde Branchenbezeichnung übersetzen statt verwerfen */
    let branche = setBranche;
    if(!branche){
      const roh = w("branche");
      branche = BRANCHEN.includes(roh) ? roh : brancheVorschlag(roh);
    }

    /* Zwei neue Achsen: GRUPPE (Brief-Winkel) aus der Rohbranche plus
       Grosspraxis-Flag, SEGMENT (Prioritaet/Kanal) aus den Flag-Spalten. */
    const grosspraxis = /ja/i.test(zell("GROSSPRAXIS"));
    const gruppe  = gruppeVorschlag(w("branche") || kat, grosspraxis);
    const segment = segmentAusFlags(zeile, H);

    /* Der Kontaktweg haengt am Segment, nicht mehr an der Branche. Steht in
       der Liste ausdruecklich etwas, gilt das. */
    let weg = setWeg || w("kontaktweg");
    if(!WEGE.includes(weg)) weg = wegVorschlag(segment);

    /* Anrede kommt fertig aus der Liste und ist dort schon nach
       Namensqualitaet gefiltert. Sicherheitshalber: nur bei BRIEFFAEHIG
       eine persoenliche Anrede und einen Ansprechpartner uebernehmen. */
    const nq = zell("NAME_QUALITAET").toUpperCase();
    let briefanrede   = zell("BRIEFANREDE");
    let ansprechpartner = w("ansprechpartner");
    if(nq && nq !== "BRIEFFAEHIG"){
      if(briefanrede && briefanrede.indexOf("Damen und Herren")<0) briefanrede = "Sehr geehrte Damen und Herren";
      ansprechpartner = "";
    }
    /* Auch als brieffaehig gemeldete Namen koennen einen Strassennamen
       oder eine Rolle enthalten. Steckt im Anrede-Namensteil so ein
       Stoerwort, lieber neutral anschreiben. */
    if(briefanrede && briefanrede.indexOf("Damen und Herren")<0){
      const namensteil = briefanrede.replace(/^Sehr geehrte[rs]?\s+(Herrn?|Frau)\s+/i, "");
      if(KEIN_NAME.test(namensteil)){ briefanrede = "Sehr geehrte Damen und Herren"; ansprechpartner = ""; }
    }
    if(ansprechpartner && KEIN_NAME.test(ansprechpartner)) ansprechpartner = "";

    /* Status/Quelle aus der Sperrliste ableiten. Kunden bleiben wertvoll
       (Fruehjahrs-Anschreiben), echte Sperrer werden vom Versand
       ausgenommen, aber nachvollziehbar mitgefuehrt. */
    let status = STATUS.includes(w("status")) ? w("status") : setStatus;
    if(!status) status = "Interessent";
    let quelle = setQuelle || w("quelle");
    let gesperrt = false;
    let sperrHinweis = "";
    const sg = zell("SPERRGRUND").toLowerCase();
    if(zell("SPERRE")){
      if(sg.indexOf("aktiver kunde")>=0){ status="Kunde"; if(!setQuelle) quelle="Bestandskunde"; }
      else if(sg.indexOf("ehemaliger kunde")>=0){ status="Ehemaliger Kunde"; if(!setQuelle) quelle="Ehemaliger Kunde"; }
      else if(sg.indexOf("interessent")>=0){ weg="Aktiv"; }
      else { gesperrt = true; gesperrtN++; }
      sperrHinweis = zell("SPERRGRUND");
    }

    /* Was nicht zugeordnet wurde, geht als Klartext in die Notiz –
       sonst wären Angaben wie Beschäftigtenzahl oder Quelle verloren. */
    let notiz = w("notiz");
    if(restInNotiz){
      const rest = [];
      Import.kopf.forEach((k,i)=>{
        if(belegt.has(i)) return;
        const wert = String(zeile[i]==null?"":zeile[i]).trim();
        if(wert) rest.push(k+": "+wert);
      });
      if(rest.length) notiz = [notiz, rest.join(" · ")].filter(Boolean).join("\n");
    }
    /* Die Originalbezeichnung der Branche bleibt erhalten, auch wenn sie
       auf eine der eigenen Kategorien übersetzt wurde. */
    const rohBranche = w("branche");
    if(rohBranche && rohBranche !== branche)
      notiz = [notiz, "Branche laut Datei: "+rohBranche].filter(Boolean).join("\n");
    if(sperrHinweis)
      notiz = [notiz, "Aus Liste vermerkt: "+sperrHinweis].filter(Boolean).join("\n");

    neueFirma({
      name, branche, gruppe, segment, kontaktweg:weg, status,
      quelle, ansprechpartner, briefanrede,
      telefon:w("telefon"), email:w("email"), website:w("website"),
      strasse:[w("strasse"), w("hausnummer")].filter(Boolean).join(" "),
      plz:w("plz"), ort, notiz, gesperrt
    });
    neu++;
  }
  Store.data.meta.importMapping = { kopf:Import.kopf, zuordnung:z };
  Store.save();
  layerSchliessen();
  render();
  toast(neu+" Firmen importiert"+(uebersprungen?", "+uebersprungen+" übersprungen":"")+(ausgelassen?" ("+ausgelassen+" ausgeschlossen)":"")+(gesperrtN?" · "+gesperrtN+" gesperrt":""));
}

<script>
"use strict";

/* ---------- 10b. Serienbrief-Export Track Passiv ---------------
   Der Massenversand legt bewusst keinen Vorgang an (Konzept 9b), sondern
   nur einen Vermerk an der Firma. Hier fällt die Adressdatei für die
   Seriendruck-Funktion von Word an, dazu die fertige Anrede. */

function anredeZeile(f){
  /* Aus der Kaltakquise-Liste kommt die Anrede fertig und schon nach
     Namensqualitaet gefiltert. Wenn vorhanden, hat sie Vorrang. */
  const fertig = (f.briefanrede||"").trim();
  if(fertig) return fertig;
  const ap = (f.ansprechpartner||"").trim();
  if(!ap) return "Sehr geehrte Damen und Herren";
  if(/^frau\b/i.test(ap))  return "Sehr geehrte "+ap;
  if(/^herrn?\b/i.test(ap)) return "Sehr geehrter "+ap.replace(/^herr\b/i,"Herrn");
  return "Sehr geehrte Damen und Herren";   // Name ohne Anrede: nicht raten
}

function serienbriefExport(ids){

/* ---------- Empfaenger-Auswahl vor dem Briefexport ----------------
   Vor jeder Brief-Datei wird gefragt, welche Zielgruppen angeschrieben
   werden – Kunden (z.B. Saisonstart Glasreinigung), Ehemalige
   („Wir sind noch da"), Altangebote, Kaltakquise. Erkannt wird am Status
   und an der Quelle (Ausgangsliste). Die Zielgruppe kommt als eigene
   Spalte in die Serienbrief-Datei, so kann Word je Gruppe anderen Text
   einsetzen. */
/* „Interessent" heisst bei A.C.S.: hat frueher ein Angebot bekommen
   (Quelle Altangebot) oder kam selbst mit einer Anfrage/Empfehlung.
   Alle anderen sind Kaltakquise. */
const ZIELGRUPPEN = ["Kunde","Ehemaliger Kunde","Interessent (Angebot erhalten)","Kaltakquise","Kein Interesse / Verloren"];
function zielgruppe(f){
  if(f.status==="Kunde" || (f.quelle==="Bestandskunde" && f.status!=="Ehemaliger Kunde")) return "Kunde";
  if(f.status==="Ehemaliger Kunde" || f.quelle==="Ehemaliger Kunde") return "Ehemaliger Kunde";
  if(f.status==="Kein Interesse" || f.status==="Verloren") return "Kein Interesse / Verloren";
  if(f.quelle==="Altangebot" || f.quelle==="Empfehlung" || f.quelle==="Eingehende Anfrage") return "Interessent (Angebot erhalten)";
  return "Kaltakquise";
}
function empfaengerWahl(liste, titel, weiter){
  const n = new Map(ZIELGRUPPEN.map(z=>[z,0]));
  for(const f of liste) n.set(zielgruppe(f), n.get(zielgruppe(f))+1);
  const da = ZIELGRUPPEN.filter(z=>n.get(z));
  /* B28: Kunden und „Kein Interesse" sind vorab abgewählt – bestehende
     Kunden bekommen keinen Akquise-Brief. Wer kuerzlich schon einen Brief
     bekommen hat, wird nicht doppelt angeschrieben. */
  const zuletzt = f => (f.briefe||[]).reduce((m,b)=>(b.datum||"") > m ? b.datum : m, "");
  const kuerzlich = tage => liste.filter(f => { const d = zuletzt(f); return d && tageBis(d) !== null && -tageBis(d) < tage; }).length;
  const hinweis = { "Kunde":"nur mit eigenem Anlass, z.B. Saisonstart", "Ehemaliger Kunde":"eigener Text: „Kommen Sie zurück“",
    "Interessent (Angebot erhalten)":"an das frühere Angebot anknüpfen" };
  layerZeigen('<div class="modal"><div class="drawer-head"><h2>'+esc(titel)+" – wen anschreiben?</h2></div>"+
    '<div class="drawer-body">'+
      '<div class="hint" style="margin-bottom:12px">'+liste.length+" Firmen in der Auswahl. Wähle die Gruppen, die diesen Brief bekommen. "+
        "Die Spalte „Zielgruppe“ steht in der Datei – damit setzt Word je Gruppe den passenden Text ein.</div>"+
      da.map(z=>'<label style="display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer">'+
        '<input type="checkbox" data-zg="'+esc(z)+'"'+(z==="Kein Interesse / Verloren"||z==="Kunde"?"":" checked")+">"+
        "<span>"+esc(z)+'</span><span class="muted tiny">('+n.get(z)+")"+(hinweis[z]?" · "+esc(hinweis[z]):"")+"</span></label>").join("")+
      '<label style="display:flex;gap:8px;align-items:center;margin-top:12px;cursor:pointer">'+
        '<input type="checkbox" id="zgDoppelt" checked>'+
        '<span>Nicht anschreiben, wer in den letzten <input type="number" id="zgTage" value="90" min="1" max="730" style="width:62px;padding:2px 6px;display:inline-block"> Tagen schon einen Brief bekam '+
        '<span class="muted tiny" id="zgDoppeltN">('+kuerzlich(90)+")</span></span></label>"+
      '<label style="display:block;margin-top:14px" class="tiny">Anlass für den Brief-Vermerk (optional)'+
        '<input type="text" id="zgAnlass" placeholder="z.B. Saisonstart Glasreinigung" style="width:100%;margin-top:4px"></label>'+
    "</div>"+
    '<div class="drawer-foot"><button class="btn primary" id="zgOk">Weiter</button>'+
    '<button class="btn ghost" data-close="1">Abbrechen</button></div></div>', {}, true);
  const tageEl = $("#zgTage");
  if(tageEl) tageEl.oninput = () => { const z = $("#zgDoppeltN"); if(z) z.textContent = "("+kuerzlich(Number(tageEl.value)||0)+")"; };
  $("#zgOk").onclick = () => {
    const gruppen = new Set([...document.querySelectorAll("[data-zg]")].filter(x=>x.checked).map(x=>x.getAttribute("data-zg")));
    const anlass = ($("#zgAnlass").value||"").trim();
    let gewaehlt = liste.filter(f=>gruppen.has(zielgruppe(f)));
    if(!gewaehlt.length){ toast("Keine Gruppe gewählt"); return; }
    if(($("#zgDoppelt")||{}).checked){
      const tage = Number((tageEl||{}).value) || 0;
      const vorher = gewaehlt.length;
      gewaehlt = gewaehlt.filter(f => { const d = zuletzt(f); return !(d && tageBis(d) !== null && -tageBis(d) < tage); });
      if(vorher > gewaehlt.length) toast((vorher-gewaehlt.length)+" kürzlich angeschriebene ausgelassen");
      if(!gewaehlt.length){ toast("Alle gewählten wurden kürzlich schon angeschrieben"); return; }
    }
    layerSchliessen();
    weiter(gewaehlt, anlass);
  };
}

function serienbriefExport2(ids, wahl){
  let liste = ids.length
    ? Store.data.firmen.filter(f=>ids.includes(f.id))
    : firmenGefiltert();
  const gesperrtRaus = liste.filter(f=>f.gesperrt||f.ablage).length;
  liste = liste.filter(f=>!f.gesperrt && !f.ablage);
  if(!liste.length){ toast("Keine anschreibbaren Firmen (alle gesperrt?)"); return; }
  if(!wahl){
    if(gesperrtRaus) toast(gesperrtRaus+" gesperrte Firma"+(gesperrtRaus>1?"n":"")+" ausgelassen");
    empfaengerWahl(liste, "Serienbrief", (l, anlass) => serienbriefExport2(ids, { ids:new Set(l.map(f=>f.id)), anlass }));
    return;
  }
  liste = liste.filter(f=>wahl.ids.has(f.id));

  const ohneAdresse = liste.filter(f=>!(f.strasse||"").trim() || !(f.ort||"").trim()).length;

  const spalten = ["Firmenname","Anrede","Ansprechpartner","Strasse","PLZ","Ort",
                   "Branche","Kontaktweg","Status","Zielgruppe","Telefon","E-Mail","AQT-ID"];
  const feld = w => {
    const s = String(w==null?"":w);
    return /[";\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const zeilen = liste.map(f=>[
    f.name, anredeZeile(f), f.ansprechpartner, f.strasse, f.plz, f.ort,
    f.branche, f.kontaktweg, f.status, zielgruppe(f), f.telefon, f.email, f.id
  ].map(feld).join(";"));

  /* BOM voran, sonst zeigt Word/Excel die Umlaute falsch an */
  const csv = "\ufeff" + [spalten.join(";")].concat(zeilen).join("\r\n") + "\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "AQT-Serienbrief-"+ISO(new Date())+".csv";
  a.click(); URL.revokeObjectURL(a.href);

  const idsRaus = liste.map(f=>f.id);
  bestaetigen("Datei erzeugt – Vermerk setzen?",
    liste.length+" Adressen exportiert"+(ohneAdresse?" ("+ohneAdresse+" davon ohne vollständige Adresse)":"")+
    ". Soll bei diesen Firmen jetzt „Brief verschickt am "+fmtDatum(ISO(new Date()))+"“ vermerkt werden?",
    "Ja, vermerken", ()=>{ briefVermerkSetzen(idsRaus, wahl.anlass || undefined); });
}

function briefVermerkSetzen(ids, anlass){
  const heuteISO = ISO(new Date());
  let n = 0;
  for (const id of ids){
    const f = DB.firma(id); if(!f) continue;
    f.briefe = f.briefe || [];
    f.briefe.push({ id:uid(), datum:heuteISO, anlass:anlass||"Serienbrief" });
    n++;
  }
  Store.save(); render();
  toast(n+" Brief-Vermerke gesetzt – keine Vorgänge angelegt");
}

/* ---------- 11b. Digitalpost-Export (Deutsche Post) -------------
   Aus v5.4 übernommen. Die Post erwartet beim Hochladen genau fünf
   Spalten: NAME · STRASSE · NUMMER · PLZ · STADT.

   Eine .xlsx-Datei ist innendrin nur ein ZIP mit ein paar XML-Dateien.
   Das schreiben wir selbst, ohne Fremdbibliothek – so läuft der Export
   auch ohne Internetverbindung. Das ZIP wird unkomprimiert abgelegt
   (Methode 0), das spart die Deflate-Routine; bei ein paar hundert
   Adressen ist die Dateigröße ohne Belang.
------------------------------------------------------------------- */

const _CRC_TAB = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n] = c>>>0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = _CRC_TAB[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

function zipBauen(dateien){
  const enc = new TextEncoder();
  const teile = [], zentral = [];
  let versatz = 0;

  const u16 = n => [n&0xFF, (n>>>8)&0xFF];
  const u32 = n => [n&0xFF, (n>>>8)&0xFF, (n>>>16)&0xFF, (n>>>24)&0xFF];

  for(const d of dateien){
    const name = enc.encode(d.name);
    const inhalt = enc.encode(d.inhalt);
    const crc = crc32(inhalt);

    const kopf = [].concat(
      [0x50,0x4B,0x03,0x04], u16(20), u16(0), u16(0),
      u16(0), u16(0),
      u32(crc), u32(inhalt.length), u32(inhalt.length),
      u16(name.length), u16(0));
    teile.push(new Uint8Array(kopf), name, inhalt);

    zentral.push(new Uint8Array([].concat(
      [0x50,0x4B,0x01,0x02], u16(20), u16(20), u16(0), u16(0),
      u16(0), u16(0),
      u32(crc), u32(inhalt.length), u32(inhalt.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(versatz))), name);

    versatz += kopf.length + name.length + inhalt.length;
  }

  let zLaenge = 0;
  for(const z of zentral) zLaenge += z.length;

  const ende = new Uint8Array([].concat(
    [0x50,0x4B,0x05,0x06], u16(0), u16(0),
    u16(dateien.length), u16(dateien.length),
    u32(zLaenge), u32(versatz), u16(0)));

  const out = new Uint8Array(versatz + zLaenge + ende.length);
  let p = 0;
  for(const t of teile){ out.set(t,p); p += t.length; }
  for(const z of zentral){ out.set(z,p); p += z.length; }
  out.set(ende,p);
  return out;
}

function xmlEsc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;")
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");   /* Excel verweigert Steuerzeichen */
}

function xlsxSpalte(i){
  let s = "", n = i + 1;
  while(n>0){ const r=(n-1)%26; s = String.fromCharCode(65+r)+s; n = Math.floor((n-1)/26); }
  return s;
}

/* Alle Werte gehen als Text raus – sonst frisst Excel die führende Null
   bei PLZ wie 01067. */
function xlsxBauen(spalten, zeilen, blattName){
  const alle = [spalten].concat(zeilen);
  let blatt = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  alle.forEach((zeile,ri)=>{
    blatt += '<row r="'+(ri+1)+'">';
    zeile.forEach((wert,ci)=>{
      const txt = String(wert==null?"":wert);
      if(!txt) return;
      blatt += '<c r="'+xlsxSpalte(ci)+(ri+1)+'" t="inlineStr"><is><t xml:space="preserve">'+
        xmlEsc(txt)+"</t></is></c>";
    });
    blatt += "</row>";
  });
  blatt += "</sheetData></worksheet>";

  const bn = String(blattName||"Tabelle1").replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31) || "Tabelle1";

  return zipBauen([
    { name:"[Content_Types].xml", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      "</Types>" },
    { name:"_rels/.rels", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      "</Relationships>" },
    { name:"xl/workbook.xml", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets><sheet name="'+xmlEsc(bn)+'" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name:"xl/_rels/workbook.xml.rels", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
      "</Relationships>" },
    { name:"xl/worksheets/sheet1.xml", inhalt: blatt }
  ]);
}

/* ---------- Vorgaben der Deutschen Post ------------------------
   Aus "Aufbereitungshinweise für die Adressliste" (PMP). Spaltennamen
   und Reihenfolge müssen genau der Vorlage entsprechen, sonst ordnet
   die Post die Spalten falsch zu. Die Feldlängen sind harte Grenzen:
   ist ein Feld länger, wird der ganze Adresssatz beim Einlesen
   verworfen und als fehlerhaft protokolliert.
------------------------------------------------------------------- */
const POST_SPALTEN = ["Firma","Firma 2","Firma 3","Anrede","Titel","Vorname",
  "Nachname","Adresszusatz","Straße","Hausnummer","Postfach","PLZ","Ort"];

const POST_LAENGE = { "Firma":120, "Firma 2":40, "Firma 3":40, "Anrede":30,
  "Titel":30, "Vorname":30, "Nachname":40, "Adresszusatz":40, "Straße":35,
  "Hausnummer":10, "Postfach":7, "PLZ":5, "Ort":35 };

/* Straße und Hausnummer stehen im Tool in einem Feld, die Post will sie
   getrennt. Der Zahlenblock am Ende wird abgeschnitten:
   "Hanauer Landstraße 187a" -> "Hanauer Landstraße" + "187a" */
function adresseTrennen(strasse){
  const s = String(strasse||"").trim().replace(/\s+/g," ").replace(/[,\s]+$/,"");
  if(!s) return { strasse:"", nummer:"" };
  const m = s.match(/^(.*?)[\s,]+(\d+\s*[a-zA-Z]?(?:\s*[-\/]\s*\d+\s*[a-zA-Z]?)?)\.?$/);
  if(m && m[1].trim()) return { strasse:m[1].trim().replace(/,$/,""), nummer:m[2].replace(/\s+/g,"") };
  return { strasse:s, nummer:"" };
}

/* Bis 120 Zeichen bleibt der Firmenname in einem Feld – die Post bricht
   selbst auf "Firma 2" und "Firma 3" um. Nur wenn er länger ist, teilen
   wir selbst auf, sonst wird der Satz abgewiesen. */
function firmaTeilen(name){
  const n = String(name||"").trim().replace(/\s+/g," ");
  if(n.length <= POST_LAENGE["Firma"]) return { teile:[n,"",""], rest:"" };
  const worte = n.split(" ");
  const bloecke = ["","",""];
  let i = 0, rest = [];
  for (const w of worte){
    let gesetzt = false;
    while(i < 3){
      const kand = bloecke[i] ? bloecke[i]+" "+w : w;
      if(kand.length <= 40){ bloecke[i] = kand; gesetzt = true; break; }
      i++;
    }
    if(!gesetzt) rest.push(w);
  }
  return { teile:bloecke, rest:rest.join(" ") };
}

/* Wörter, die keine Person bezeichnen. Steht so etwas im Feld
   Ansprechpartner, geht es in den Adresszusatz – sonst druckt die Post
   "Herr Einkauf" auf den Umschlag. */
const POST_KEIN_NAME = /leitung|einkauf|verwaltung|geschäftsführ|geschaeftsführ|sekretariat|hausmeister|facility|objektbetreu|zentrale|empfang|abteilung|z\.?\s?h(d|dn)?\.?|technik|personal|buchhalt/i;

/* "Herr Dr. Max Muster" -> Anrede/Titel/Vorname/Nachname */
function personTeilen(ansprechpartner){
  const aus = { anrede:"", titel:"", vorname:"", nachname:"", zusatz:"" };
  let s = String(ansprechpartner||"").split(",")[0].trim().replace(/\s+/g," ");
  if(!s) return aus;

  const mA = s.match(/^(Herrn|Herr|Hr\.?|Frau|Fr\.?)\s+/i);
  if(mA){
    aus.anrede = /^f/i.test(mA[1]) ? "Frau" : "Herr";
    s = s.slice(mA[0].length).trim();
  }

  const tt = [];
  while(true){
    const mT = s.match(/^(Prof\.?|Dr\.?(?:\s?(?:med|rer\.?\s?nat|jur|phil|h\.?\s?c)\.?)?|Dipl\.-?[A-Za-zÄÖÜäöü]+\.?|Mag\.?|Ing\.?)\s+/i);
    if(!mT) break;
    tt.push(mT[1].trim());
    s = s.slice(mT[0].length).trim();
  }
  aus.titel = tt.join(" ");

  /* Keine Anrede und ein Funktionsbegriff statt eines Namens */
  if(!aus.anrede && POST_KEIN_NAME.test(s)){
    aus.titel = "";
    aus.zusatz = s;
    return aus;
  }

  const teile = s.split(" ").filter(Boolean);
  if(teile.length === 1) aus.nachname = teile[0];
  else if(teile.length > 1){
    aus.nachname = teile[teile.length-1];
    aus.vorname  = teile.slice(0,-1).join(" ");
  }
  return aus;
}

function dateiSpeichern(bytes, dateiname, typ){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes],{type:typ}));
  a.download = dateiname;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* Baut einen Adresssatz nach den Postvorgaben und meldet zurück, was
   fehlt (Satz wird nicht exportiert) und was gekürzt wurde. */
function postSatzBauen(f){
  const adr = adresseTrennen(f.strasse);
  const fa  = firmaTeilen(f.name);
  const p   = personTeilen(f.ansprechpartner);

  const satz = {
    "Firma":fa.teile[0], "Firma 2":fa.teile[1], "Firma 3":fa.teile[2],
    "Anrede":p.anrede, "Titel":p.titel, "Vorname":p.vorname,
    "Nachname":p.nachname, "Adresszusatz":p.zusatz,
    "Straße":adr.strasse, "Hausnummer":adr.nummer, "Postfach":"",
    "PLZ":String(f.plz||"").trim(), "Ort":String(f.ort||"").trim()
  };

  /* Pflichtangaben laut Vorgabe */
  const fehlt = [];
  if(!satz["Firma"] && !satz["Vorname"] && !satz["Nachname"]) fehlt.push("kein Name");
  if(!satz["Straße"] && !satz["Postfach"]) fehlt.push("keine Straße");
  if(!satz["PLZ"]) fehlt.push("keine PLZ");
  else if(!/^\d{5}$/.test(satz["PLZ"])) fehlt.push("PLZ „"+satz["PLZ"]+"“ ist nicht 5-stellig");
  if(!satz["Ort"]) fehlt.push("kein Ort");

  /* Feldlängen einhalten – zu lange Sätze weist die Post komplett ab */
  const gekuerzt = [];
  for (const sp of POST_SPALTEN){
    const max = POST_LAENGE[sp];
    if(satz[sp].length > max){
      gekuerzt.push(sp+" ("+satz[sp].length+" statt "+max+")");
      satz[sp] = satz[sp].slice(0, max).trim();
    }
  }
  if(fa.rest) gekuerzt.push("Firmenname zu lang, abgeschnitten: „"+fa.rest+"“");

  /* Sind alle drei Firma-Felder gefüllt, wird der Adresszusatz nicht
     gedruckt (max. 6 Adresszeilen) – dann lassen wir ihn gleich weg. */
  if(satz["Firma"] && satz["Firma 2"] && satz["Firma 3"]) satz["Adresszusatz"] = "";

  return { zeile: POST_SPALTEN.map(sp=>satz[sp]), fehlt, gekuerzt };
}

function digitalpostExport(ids){
  let liste = (ids && ids.length)
    ? Store.data.firmen.filter(f=>ids.includes(f.id))
    : firmenGefiltert();
  /* Sicherheitsnetz: wenn die Auswahl ueber den aktuellen Filter hinausgeht,
     erst fragen. Ein Postversand laesst sich nicht zurueckholen. */
  if(ids && ids.length){
    const sicht = new Set(firmenGefiltert().map(x=>x.id));
    const drueber = ids.filter(id=>!sicht.has(id)).length;
    if(drueber){
      bestaetigen("Auswahl größer als der Filter",
        ids.length+" Firmen sind markiert, davon "+drueber+" außerhalb des aktuellen Filters. "+
        "Alle "+ids.length+" kommen in die Datei. Weiter?",
        "Ja, alle "+ids.length,
        ()=>{ digitalpostExport2(ids); });
      return;
    }
  }
  return digitalpostExport2(ids);
}

function digitalpostExport2(ids, wahl){
  let liste = (ids && ids.length)
    ? Store.data.firmen.filter(f=>ids.includes(f.id))
    : firmenGefiltert();
  const gesperrtRaus = liste.filter(f=>f.gesperrt||f.ablage).length;
  liste = liste.filter(f=>!f.gesperrt && !f.ablage);
  if(!liste.length){ toast("Keine anschreibbaren Firmen (alle gesperrt?)"); return; }
  if(!wahl){
    if(gesperrtRaus) toast(gesperrtRaus+" gesperrte Firma"+(gesperrtRaus>1?"n":"")+" ausgelassen");
    empfaengerWahl(liste, "Digitalpost", (l, anlass) => digitalpostExport2(ids, { ids:new Set(l.map(f=>f.id)), anlass }));
    return;
  }
  liste = liste.filter(f=>wahl.ids.has(f.id));

  const zeilen = [], gut = [], raus = [], hinweise = [];
  for (const f of liste){
    const r = postSatzBauen(f);
    const wer = f.name || "Ohne Namen";
    if(r.fehlt.length){ raus.push(wer+" – "+r.fehlt.join(", ")); continue; }
    if(r.gekuerzt.length) hinweise.push(wer+" – gekürzt: "+r.gekuerzt.join("; "));
    zeilen.push(r.zeile);
    gut.push(f.id);
  }

  const anz = n => n+(n===1 ? " Adresse" : " Adressen");

  if(!zeilen.length){
    toast(anz(raus.length)+" unvollständig – keine exportierbar");
    return;
  }

  const losgehts = () => {
    const bytes = xlsxBauen(POST_SPALTEN, zeilen, "Tabelle1");
    dateiSpeichern(bytes, "Digitalpost_"+ISO(new Date())+".xlsx",
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    bestaetigen("Datei erzeugt – Vermerk setzen?",
      anz(zeilen.length)+" exportiert. Soll bei diesen Firmen jetzt "+
      "„Brief verschickt am "+fmtDatum(ISO(new Date()))+"“ vermerkt werden?",
      "Ja, vermerken", ()=>{ briefVermerkSetzen(gut, wahl.anlass || "Digitalpost "+ISO(new Date()).slice(0,7)); });
  };

  /* Vorher zeigen, was übersprungen und was gekürzt wird */
  if(raus.length || hinweise.length){
    const kurz = arr => arr.slice(0,10).join("\n") +
      (arr.length>10 ? "\n… und "+(arr.length-10)+" weitere" : "");
    let txt = "";
    if(raus.length)
      txt += "Übersprungen, weil die Post sie beim Einlesen abweist ("+
             anz(raus.length)+"):\n"+kurz(raus)+"\n\n";
    if(hinweise.length)
      txt += "Auf die zulässige Feldlänge gekürzt ("+
             anz(hinweise.length)+"):\n"+kurz(hinweise)+"\n\n";
    txt += zeilen.length+" von "+liste.length+" Adressen kommen in die Datei.";
    bestaetigen("Prüfung der Adressliste", txt,
      zeilen.length+" exportieren", losgehts);
    return;
  }
  losgehts();
}

function renderZahlen(){
  /* B28: Angebote und Kaltakquise getrennt auswerten. Ein „kein Interesse"
     am Telefon ist kein verlorenes Angebot. */
  const ALLE = Store.data.vorgaenge, F = Store.data.firmen;
  const V = ALLE.filter(v=>istDeal(v));
  const AK = ALLE.filter(v=>!istDeal(v));
  const offen = V.filter(v=>!v.ergebnis);
  const gewonnen = V.filter(v=>v.ergebnis==="gewonnen");
  const verloren = V.filter(v=>v.ergebnis==="verloren");
  const ueberfaellig = offen.filter(v=>{ const w=wvNaechste(v); return w && tageBis(w.datum)<0; });
  const ohneTermin = offen.filter(v=>!wvNaechste(v));
  const quote = (gewonnen.length+verloren.length) ? Math.round(gewonnen.length/(gewonnen.length+verloren.length)*100) : null;

  const kpi = (v,l,cls) => '<div class="kpi '+(cls||"")+'"><div class="v">'+v+'</div><div class="l">'+esc(l)+"</div></div>";

  let h = '<h3 style="margin:4px 0 10px">Angebote</h3><div class="kpis">'+
    kpi(offen.length,"Offene Angebote")+
    kpi(ueberfaellig.length,"Überfällig", ueberfaellig.length?"crit":"")+
    kpi(ohneTermin.length,"Ohne Termin", ohneTermin.length?"crit":"")+
    kpi(gewonnen.length,"Aufträge","ok")+
    kpi(verloren.length,"Absagen")+
    kpi(quote===null?"–":quote+"%","Trefferquote")+
  "</div>";

  /* Kaltakquise */
  const akOffen = AK.filter(v=>!v.ergebnis);
  const akKein = AK.filter(v=>v.ergebnis==="verloren").length;
  const ausAkq = V.filter(v=>v.herkunft==="Kaltakquise").length;

  h += '<h3 style="margin:22px 0 10px">Kaltakquise</h3><div class="kpis">'+

    kpi(akOffen.length,"Offene Kontakte")+
    kpi(anrufe,"Anrufe erfasst")+
    kpi(akKein,"Kein Interesse")+
    kpi(ausAkq,"→ Angebot gewünscht","ok")+
  "</div>";

  /* Verteilung über die Stufen */
  h += '<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Angebote je Stufe</h3></div><div class="panel-body">';
  const inStufe = (v, s) => s.id === "neu" ? (!v.ergebnis && stufenIndex(v) === 0)
    : s.id === "abschluss" ? !!v.ergebnis : (!v.ergebnis && STUFEN[stufenIndex(v)].id === s.id);
  const max = Math.max(1, ...STUFEN.map(s=>V.filter(v=>inStufe(v,s)).length));

      '<div class="mono tiny" style="flex:0 0 30px;text-align:right">'+n+"</div></div>";
  }
  h += "</div></div>";

  /* Absagegründe – nach dem Konzept ab ca. 20 Einträgen auswertbar */
  const gruende = {};
  verloren.forEach(v=>{ if(v.absagegrund) gruende[v.absagegrund]=(gruende[v.absagegrund]||0)+1; });
  const gListe = Object.entries(gruende).sort((a,b)=>b[1]-a[1]);

      : '<div class="tiny muted">Noch keine Absage erfasst. Der Grund wird beim Buchen einer Absage abgefragt.</div>')+
    "</div></div>";

  /* Kontaktweg-Verteilung der Firmen */
  h += '<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Firmen nach Track</h3></div><div class="panel-body">'+
    '<div style="display:flex;gap:20px;flex-wrap:wrap">'+

/* B18: Größe der Daten, Stand der lokalen Kopie, Belegung im Browser */
function spiegelInfoZeigen(){
  const el = $("#spiegelInfo"); if(!el) return;
  const mb = n => (n/1048576).toLocaleString("de-DE", { maximumFractionDigits:1, minimumFractionDigits:1 })+" MB";
  let groesse = 0;
  try{ groesse = JSON.stringify(Store.data).length; }catch(_){}
  const teile = ["Datenmenge ca. "+mb(groesse)];
  const S = Spiegel;
  if(S.fehler) teile.push("lokale Kopie: FEHLER – "+S.fehler);
  else if(S.zuletzt) teile.push("lokale Kopie: aktuell ("+(S.modus==="idb" ? "IndexedDB" : "localStorage, Ersatzweg")+", "+
    S.zuletzt.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" })+" Uhr)");
  else teile.push("lokale Kopie: in dieser Sitzung noch nicht geschrieben");
  const fertig = extra => { const e2 = $("#spiegelInfo"); if(e2) e2.textContent = teile.concat(extra||[]).join(" · "); };
  fertig();
  try{
    if(navigator.storage && navigator.storage.estimate)
      navigator.storage.estimate().then(s => {
        if(s && s.quota) fertig(["Browser-Speicher: "+mb(s.usage||0)+" von "+mb(s.quota)+" belegt"]);
      }).catch(()=>{});
  }catch(_){}
}

      rat = "Die Tabelle aqt_einstellungen fehlt noch. Bitte einstellungen_setup.sql im Supabase SQL Editor ausführen – "+
            "danach hier nochmal prüfen.";

      rat = "Die Tabelle ist da, aber die Rechte fehlen. Den Policy-Teil aus einstellungen_setup.sql noch einmal ausführen.";

    else if(/FEHLER/.test(alles))
      rat = "Unerwarteter Fehler. Die Zeile mit „FEHLER“ bitte kopieren und mir schicken.";

      rat = "Supabase läuft – nur der Speicher dieses Browsers ist blockiert. Das ist verkraftbar, "+
            "gespeichert wird ja in Supabase. Zur Sicherheit zusätzlich „Als Datei sichern“ benutzen.";

      '<div class="modal"><div class="drawer-head"><h2>Speicher prüfen</h2>'+

  vorlagenFelderLesen();

  a.href = URL.createObjectURL(new Blob([JSON.stringify(Vorlagen.aktuell(), null, 2)],
    {type:"application/json"}));
  a.download = "aqt-mailvorlagen-"+ISO(new Date())+".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Vorlagen als Datei gesichert");
}

function vorlagenDateiLaden(datei){
  const leser = new FileReader();
  leser.onload = () => {
    try{
      const d = JSON.parse(String(leser.result));
      if(!d || !Array.isArray(d.stufen) || d.stufen.length !== 3)
        throw new Error("Das ist keine AQT-Vorlagendatei");
      Vorlagen.daten = d;
      Vorlagen.sichern().then(() => { render(); toast("Vorlagen aus der Datei übernommen"); });
    }catch(e){ toast("Datei nicht lesbar: "+(e.message||e)); }
  };
  leser.onerror = () => toast("Datei konnte nicht gelesen werden");
  leser.readAsText(datei);
}

/* Was im Editor steht, in die Vorlagen übernehmen */
function vorlagenFelderLesen(){
  const d = Vorlagen.aktuell();
  const w = s => { const el = $(s); return el ? el.value : undefined; };
  const ich = w("#vlIch");   if(ich !== undefined) d.ich = ich.trim();
  const tg  = w("#vlTage");  if(tg  !== undefined) d.nachfassTage = Math.min(90, Math.max(1, Number(tg)||14));
  if(!Array.isArray(d.stufen)) d.stufen = Vorlagen.standard().stufen;
  for(let i=0;i<3;i++){
    const s = d.stufen[i] || (d.stufen[i] = Vorlagen.standard().stufen[i]);
    const k = w("#vlKurz"+i);    if(k !== undefined) s.kurz = k.trim();
    const n = w("#vlName"+i);    if(n !== undefined) s.name = n.trim();
    const b = w("#vlBetreff"+i); if(b !== undefined) s.betreff = b;
    const t = w("#vlText"+i);    if(t !== undefined) s.text = t;
  }
}

/* ---------- 14. Dialog-Schicht -------------------------------- */
let LayerCtx = {};
/* Wird gesetzt, sobald im offenen Dialog irgendein Feld angefasst wurde.
   Nur dann fragt das Schliessen nach. Jedes Oeffnen und jedes Speichern
   setzt die Markierung zurueck. */
let LayerBeruehrt = false;
function layerZeigen(html, ctx, zentriert){
  LayerCtx = ctx || {};
  LayerBeruehrt = false;
  $("#layer").innerHTML = '<div class="overlay'+(zentriert?" modal-center":"")+'" id="overlay">'+html+"</div>";
  document.body.style.overflow="hidden";
}
function layerSchliessen(){
  entwuerfeVerwerfen();
  LayerBeruehrt = false;
  $("#layer").innerHTML = ""; LayerCtx = {};
  document.body.style.overflow="";
}
/* Abbrechen-Weg: Escape und alle Abbrechen-/Zurueck-Knoepfe. Speichern
   ruft weiterhin direkt layerSchliessen() auf und fragt nichts. */
/* B17: Zurueck aus einem Unterfenster (E-Mail, Nachfass-Mail, Leitfaden,
   Objekt) – fragt nach, wenn dort etwas getippt wurde. */
function layerZurueck(weiter){
  if(LayerBeruehrt &&
     !window.confirm("In diesem Fenster sind ungespeicherte Eingaben.\n\nTrotzdem zurück und verwerfen?"))
    return;
  weiter();
}
function layerAbbrechen(){
  if(LayerBeruehrt &&
     !window.confirm("Dieser Dialog hat ungespeicherte \u00c4nderungen.\n\nWirklich schliessen und verwerfen?"))
    return;
  layerSchliessen();
}
/* Eingaben im Dialog merken. Ein Klick auf einen Knopf zaehlt nicht,
   nur echtes Tippen oder Auswaehlen. */
document.addEventListener("input", e => {
  if(!LayerBeruehrt && $("#overlay") && $("#overlay").contains(e.target)) LayerBeruehrt = true;
}, true);
document.addEventListener("change", e => {
  if(!LayerBeruehrt && $("#overlay") && $("#overlay").contains(e.target)) LayerBeruehrt = true;
}, true);

/* Ein neuer Vorgang bzw. eine neue Firma ist zunächst nur ein Entwurf.
   Wer den Dialog abbricht, soll keine leere Karteileiche hinterlassen. */
function entwuerfeVerwerfen(){
  const vE = Store.data.vorgaenge.filter(v=>v.entwurf).map(v=>v.id);
  if(vE.length){
    Store.data.vorgaenge = Store.data.vorgaenge.filter(v=>!v.entwurf);
    Store.data.aktivitaeten = Store.data.aktivitaeten.filter(a=>!vE.includes(a.vorgangId));
  }
  const fE = Store.data.firmen.filter(f=>f.entwurf).map(f=>f.id);
  if(fE.length){
    Store.data.firmen = Store.data.firmen.filter(f=>!f.entwurf);
    Store.data.objekte = Store.data.objekte.filter(o=>!fE.includes(o.firmaId));
  }
  if(vE.length||fE.length) Store.save();
}

/* Einmalige Bereinigung alter leerer Datensätze aus früheren Versionen */
function altlastenAufraeumen(){
  const vor = Store.data.vorgaenge.length + Store.data.firmen.length;
  Store.data.vorgaenge = Store.data.vorgaenge.filter(v =>
    v.firmaId || (v.titel||"").trim() || DB.aktivitaetenVon(v.id).length);
  Store.data.firmen = Store.data.firmen.filter(f =>
    (f.name||"").trim() && f.name !== "(ohne Namen)");
  if(vor !== Store.data.vorgaenge.length + Store.data.firmen.length) Store.save();
}

function bestaetigen(titel, text, knopf, aktion){
  layerZeigen('<div class="modal"><div class="drawer-head"><h2>'+esc(titel)+"</h2></div>"+

    '<button class="btn ghost" data-close="1">Abbrechen</button></div></div>', {}, true);
  $("#okBtn").onclick = () => { layerSchliessen(); aktion(); };
}

function abschlussDialog(v, art, vorwahl){
  AutoMeldung = "";   /* Nachfass-Hinweise sind mit dem Abschluss hinfällig */
  if(art==="gewonnen"){

  }

    '<div class="drawer-body"><div class="field"><label>Warum haben wir den Auftrag nicht bekommen?</label><select id="grund">'+
      optionen(ABSAGEGRUENDE, vorwahl||"", "— bitte wählen —")+"</select></div>"+
      '<div class="field" style="margin-top:10px"><label>Was genau? (optional)</label>'+

      '<div class="hint" style="margin-top:12px">Der Vorgang verschwindet nicht: in 9 Monaten kommt er als Reaktivierung wieder hoch.</div></div>'+

    '<button class="btn ghost" data-close="1">Abbrechen</button></div></div>', {}, true);

    v.ergebnis="verloren"; v.stufe="abschluss"; v.absagegrund=g;

/* ---------- 15. Ereignisse ------------------------------------ */
document.addEventListener("click", e => {
  if(e.target.closest("a[href]")) return;   /* echte Links normal durchlassen */
  const t = e.target.closest("[data-go],[data-act],[data-vorgang],[data-firma],[data-close],[data-ansicht],[data-wv-done],[data-wv-del],[data-akt-del],[data-akt-auf],[data-objekt],[data-objekt-del],[data-sort],[data-dub-del],[data-dub-merge],[data-dub-do],[data-dub-skip],[data-dub-zurueck],[data-dub-reset],[data-firma-del],[data-fedit],[data-weg-um],[data-mehr],[data-weniger],[data-fansicht]");
  if(!t) return;

  /* Kontaktweg direkt in der Liste umschalten, ohne die Firma zu oeffnen. */
  const wegUm = t.getAttribute("data-weg-um");
  if(wegUm){
    const f = DB.firma(wegUm);
    if(f){
      f.kontaktweg = f.kontaktweg === "Aktiv" ? "Passiv" : "Aktiv";
      Store.save(); render();
      toast(f.name+": "+f.kontaktweg);
    }
    return;
  }

  /* Kanban-Spalte auf-/zuklappen */
  const mehr = t.getAttribute("data-mehr");
  if(mehr){ App.boardOffen.add(mehr); render(); return; }
  const weniger = t.getAttribute("data-weniger");
  if(weniger){ App.boardOffen.delete(weniger); render(); return; }

  const so = t.getAttribute("data-sort");
  /* B28: „Vorgänge" beim ersten Klick absteigend – die meisten oben */
  if(so){ if(App.firmenSort && App.firmenSort.feld===so) App.firmenSort.richtung*=-1; else App.firmenSort={feld:so,richtung:so==="vorgaenge"?-1:1}; render(); return; }
  const fa = t.getAttribute("data-fansicht");
  if(fa){ App.firmenAnsicht = fa; App.auswahl.clear(); render(); return; }

  const fedit = t.getAttribute("data-fedit");
  if(fedit){ feldAuswahlOeffnen(t, fedit, t.getAttribute("data-id")); return; }
  const firmaDel = t.getAttribute("data-firma-del");
  if(firmaDel){
    const f = DB.firma(firmaDel); if(!f) return;
    bestaetigen("Firma löschen?", "„"+(f.name||"(ohne Namen)")+"“ kommt samt Briefen, Objekten, Vorgängen und Aktivitäten in den Papierkorb (30 Tage).", "Löschen", () => {
      const pk = firmenLoeschen([firmaDel]); App.auswahl.delete(firmaDel);
      Store.save(); render(); papierkorbToast("Firma gelöscht", pk);
    });
    return;
  }
  if(t.hasAttribute("data-dub-skip")){ App.dub.skip.add(App.dub.aktuell); App.dub.verlauf.push(App.dub.aktuell); dubSkipSichern(); dublettenZeigen(); return; }
  if(t.hasAttribute("data-dub-zurueck")){ const k = App.dub.verlauf.pop(); if(k) App.dub.skip.delete(k); dubSkipSichern(); dublettenZeigen(k); return; }
  if(t.hasAttribute("data-dub-reset")){ App.dub.skip = new Set(); App.dub.verlauf = []; dubSkipSichern(); dublettenZeigen(); return; }
  const dubMerge = t.getAttribute("data-dub-merge");
  if(dubMerge){ dubMergeOeffnen(dubMerge.split(",")); return; }
  const dubDo = t.getAttribute("data-dub-do");
  if(dubDo){
    const r = document.querySelector('input[name="dubKeep"]:checked');
    if(!r){ toast("Bitte die Firma wählen, die bleibt"); return; }
    dubMergeAusfuehren(dubDo.split(","), r.value); return;
  }

  const dubDel = t.getAttribute("data-dub-del");
  if(dubDel){ const pk = firmenLoeschen([dubDel]); Store.save(); render(); dublettenZeigen(); papierkorbToast("Firma gelöscht", pk); return; }

  const go_ = t.getAttribute("data-go");
  if(go_){ go(go_); return; }

  if(t.hasAttribute("data-close")){ layerAbbrechen(); return; }

  const ans = t.getAttribute("data-ansicht");
  if(ans){ App.pipelineAnsicht=ans; render(); return; }

  const vId = t.getAttribute("data-vorgang");
  if(vId){ layerSchliessen(); vorgangOeffnen(vId); return; }

  const fId = t.getAttribute("data-firma");
  if(fId){ firmaOeffnen(fId); return; }

  /* Objektzeile angeklickt: Firmeneingaben vorher sichern, sonst sind sie
     nach dem Wechsel ins Objektfenster weg */
  const oId = t.getAttribute("data-objekt");
  if(oId){
    const o = DB.objekt(oId); if(!o) return;
    const fx = DB.firma(LayerCtx.firmaId);
    if(fx){ firmaFelderLesen(fx); Store.save(); }
    objektOeffnen(o.firmaId, oId); return;
  }

  const wvDone = t.getAttribute("data-wv-done");
  if(wvDone){
    const v = DB.vorgang(LayerCtx.vorgangId);
    const w = v.wiedervorlagen.find(x=>x.id===wvDone);
    if(w){ w.erledigt=true; vorgangFelderLesen(v); Store.save(); vorgangOeffnen(v.id); render(); }
    return;
  }
  const wvDel = t.getAttribute("data-wv-del");
  if(wvDel){
    const v = DB.vorgang(LayerCtx.vorgangId);
    vorgangFelderLesen(v);
    v.wiedervorlagen = v.wiedervorlagen.filter(x=>x.id!==wvDel);
    Store.save(); vorgangOeffnen(v.id); render(); return;
  }
  /* Langen Eintrag auf- und zuklappen – der Text bleibt erhalten */
  const aAuf = t.getAttribute("data-akt-auf");
  if(aAuf){
    if(App.aktOffen.has(aAuf)) App.aktOffen.delete(aAuf); else App.aktOffen.add(aAuf);
    const v = DB.vorgang(LayerCtx.vorgangId);
    if(v){ vorgangFelderLesen(v); vorgangOeffnen(v.id); }
    return;
  }
  /* Löschen nur mit Rückfrage – hier stehen oft die einzigen Angaben
     aus der Original-Mail drin */
  const aDel = t.getAttribute("data-akt-del");
  if(aDel){
    const a = Store.data.aktivitaeten.find(x=>x.id===aDel); if(!a) return;
    const v = DB.vorgang(LayerCtx.vorgangId);
    if(v) vorgangFelderLesen(v);
    const vid = v ? v.id : "";
    bestaetigen("Eintrag löschen?",
      "Der Chronik-Eintrag („"+(a.typ||"Notiz")+"“ vom "+fmtDatum(a.datum)+") wird endgültig entfernt. "+
      "Wenn du ihn nur zuklappen willst: „weniger“ statt „Löschen“.",
      "Endgültig löschen", () => {
        Store.data.aktivitaeten = Store.data.aktivitaeten.filter(x=>x.id!==aDel);
        Store.save(); if(vid) vorgangOeffnen(vid); toast("Eintrag gelöscht");
      });
    return;
  }
  const oDel = t.getAttribute("data-objekt-del");
  if(oDel){
    const x = DB.firma(LayerCtx.firmaId); firmaFelderLesen(x);
    Store.data.objekte = Store.data.objekte.filter(o=>o.id!==oDel);
    Store.data.vorgaenge.forEach(v=>{ if(v.objektId===oDel) v.objektId=""; });
    Store.save(); firmaOeffnen(x.id); return;
  }

  const act = t.getAttribute("data-act");
  if(act) aktion(act, t);
});
/* B25: offenes ⋯-Menue schliesst bei Klick daneben */
document.addEventListener("click", e => {
  if(e.target.closest && e.target.closest('[data-act="vmenu"],[data-act="fmenu"]')) return;
  document.querySelectorAll(".fx-menu:not(.hidden)").forEach(m => {
    if(!m.contains(e.target)) m.classList.add("hidden");
  });
}, true);

function aktion(act, el){
  const V = () => DB.vorgang(LayerCtx.vorgangId);
  const F = () => DB.firma(LayerCtx.firmaId);

  switch(act){
    /* --- B25: Fenster im neuen Aufbau --- */
    case "vmenu": { const m=$("#vMenu"); if(m) m.classList.toggle("hidden"); return; }
    case "fmenu": { const m=$("#fMenu"); if(m) m.classList.toggle("hidden"); return; }
    case "vtab":  { vTabSetzen(el.getAttribute("data-tab")||"notiz"); const t=$("#aText"); if(t && !t.closest(".hidden")) t.focus(); return; }
    case "stufe-setzen": {
      const v = V(); if(!v) return;
      vorgangFelderLesen(v);
      const neu = el.getAttribute("data-stufe");
      if(!neu || neu === v.stufe) return;
      const alt = v.stufe; v.stufe = neu;
      if(v.ergebnis){ abschlussTermineAbhaken(v); v.ergebnis=""; v.absagegrund=""; }
      const sm = stufenAutomatik(v, alt);
      Store.save(); vorgangOeffnen(v.id); render();
      toast("Stufe: "+stufenName(neu)+(sm ? " · "+sm : "")); return;
    }
    case "wv-eigen": {
      const v = V(); if(!v) return;
      vorgangFelderLesen(v);
      const d = ($("#wvDatum")||{}).value || "";
      const an = (($("#wvAnlass")||{}).value || "").trim();
      if(!d){ toast("Bitte ein Datum wählen"); return; }
      wvSetzen(v, d, an || "Wiedervorlage");
      App.vTab = "notiz";
      Store.save(); vorgangOeffnen(v.id); render();
      toast("Wiedervorlage am "+fmtDatum(d)); return;
    }
    case "zur-firma": {
      const v = V(); if(!v) return;
      vorgangFelderLesen(v);
      if(!v.firmaId){ toast("Bitte erst eine Firma wählen"); return; }
      if(v.entwurf){ toast("Bitte den Vorgang erst speichern"); return; }
      Store.save(); firmaOeffnen(v.firmaId); return;
    }
    case "fkontakt-edit": {
      const a=$("#fKontaktLesen"), b=$("#fKontaktEdit");
      if(a && b){ a.classList.add("hidden"); b.classList.remove("hidden"); const n=$("#fAP"); if(n) n.focus(); }
      if(el && el.classList.contains("linkbtn") && el.textContent==="Bearbeiten") el.classList.add("hidden");
      return;
    }

    /* --- Vorgang --- */
    case "vorgang-neu": {
      if(!Store.data.firmen.length){
        toast("Erst eine Firma anlegen – ein Vorgang hängt immer an einer Firma");
        go("firmen"); return;
      }
      /* B28: Aus der Pipeline entsteht immer ein Angebot */
      const v = neuerVorgang({ firmaId:"", titel:"", entwurf:true,
        herkunft:"Eingehende Anfrage", anfrageAm:ISO(new Date()) });
      vorgangOeffnen(v.id); return;
    }
    case "vorgang-fuer-firma": case "angebot-fuer-firma": {
      const x = F(); firmaFelderLesen(x);
      const angebot = act === "angebot-fuer-firma";
      const anlegen = () => {
        Store.save(); layerSchliessen(); render();
        const v = neuerVorgang(Object.assign(
          { firmaId:x.id, kontaktweg:x.kontaktweg||"Aktiv", titel:"", entwurf:true },
          angebot ? { anfrageAm:ISO(new Date()),
                      herkunft: zielgruppe(x)==="Kunde" ? "Bestandskunde" : "Eingehende Anfrage" } : {}));
        vorgangOeffnen(v.id);
      };
      /* B28: Kaltakquise bei einem aktuellen Kunden nur nach Rueckfrage */
      if(!angebot && zielgruppe(x) === "Kunde"){
        bestaetigen("Aktueller Kunde", "„"+(x.name||"")+"“ ist Kunde. Kaltakquise ist hier nicht vorgesehen – "+
          "für einen weiteren Auftrag besser „+ Angebot“ nehmen. Trotzdem einen Akquise-Kontakt anlegen?",
          "Trotzdem anlegen", anlegen);
        return;
      }
      anlegen(); return;
    }
    case "akq-angebot": {
      /* B28: Kaltakquise-Kontakt will ein Angebot → in die Pipeline */
      const v = V(); if(!v) return;
      vorgangFelderLesen(v);
      delete v.entwurf;
      if(!v.anfrageAm) v.anfrageAm = ISO(new Date());
      if(v.stufe !== "besichtigung") v.stufe = "neu";
      if(!(v.titel||"").trim() || /^(kaltakquise|ohne titel)/i.test(v.titel)) v.titel = "Angebot "+(DB.firmaName(v.firmaId)||"");
      for (const w of (v.wiedervorlagen||[])) if(!w.erledigt) w.erledigt = true;
      wvSetzen(v, plusTage(3), "Angebot erstellen");
      neueAktivitaet({ vorgangId:v.id, typ:"Notiz", datum:ISO(new Date()), text:"Aus der Kaltakquise: Angebot gewünscht – in die Pipeline übernommen" });
      Store.save(); vorgangOeffnen(v.id); render();
      toast("In die Pipeline übernommen · „Angebot erstellen“ in 3 Tagen"); return;
    }
    case "absage-keine-rm": { const v=V(); vorgangFelderLesen(v); abschlussDialog(v,"verloren","keine Rückmeldung"); return; }
    case "vorgang-speichern": {
      const v = V();
      vorgangFelderLesen(v);            /* Automatik laeuft dort mit */

      });
      return;
    }
    case "auswahl-loeschen": {
      const ids = [...App.auswahl];
      /* Eine einzelne Firma: wie frueher der Loeschen-Link in der Zeile –
         sie darf auch mit Vorgaengen geloescht werden, nach Warnung. */
      if(ids.length===1){
        const f = DB.firma(ids[0]);
        if(!f){ App.auswahl.clear(); render(); return; }
        const nv = DB.vorgaengeVon(f.id).length;
        bestaetigen("Firma löschen?", "„"+(f.name||"(ohne Namen)")+"“ kommt samt Briefen, Objekten"+
          (nv ? ", "+nv+(nv===1?" Vorgang":" Vorgängen") : ", Vorgängen")+" und Aktivitäten in den Papierkorb (30 Tage).",
          "Löschen", () => {
            const pk = firmenLoeschen([f.id]); App.auswahl.clear();
            Store.save(); render(); papierkorbToast("Firma gelöscht", pk);
          });
        return;
      }
      const geschuetzt = ids.filter(firmaHatVorgaenge);
      const loeschbar  = ids.filter(id => !firmaHatVorgaenge(id));

      if(!loeschbar.length){
        toast(geschuetzt.length===1
          ? "Diese Firma hat einen Vorgang und bleibt stehen"
          : "Alle "+geschuetzt.length+" haben Vorgänge und bleiben stehen");
        return;
      }

      let text = loeschbar.length+" Firmen werden entfernt, samt ihrer Objekte.";
      if(geschuetzt.length){
        const namen = geschuetzt.slice(0,5)
          .map(id => { const f=DB.firma(id); return f?f.name:""; })
          .filter(Boolean).join(", ");
        text += " "+geschuetzt.length+(geschuetzt.length===1?" Firma bleibt":" Firmen bleiben")+
          " stehen, weil dort Vorgänge hängen"+(namen?": "+namen:"")+
          (geschuetzt.length>5?" und weitere":"")+
          ". Die lassen sich nur einzeln löschen.";
      }
      text += " Vorher wird eine Sicherung heruntergeladen.";

      bestaetigen(loeschbar.length+" Firmen löschen?", text, "Endgültig löschen",
        ()=>{
          sicherungHerunterladen("vor-loeschen");
          firmenLoeschen(loeschbar);
          App.auswahl.clear(); Store.save(); render();
          toast(loeschbar.length+" Firmen gelöscht"+
            (geschuetzt.length?", "+geschuetzt.length+" mit Vorgängen behalten":""));
        });
      return;
    }
    case "filter-reset": { App.firmenFilter={name:"",branche:"",gruppe:"",segment:"",kontaktweg:"",status:"",quelle:"",ort:"",plz:"",ablage:""}; render(); return; }

    /* --- Serienbrief Track Passiv (Abschnitt 9b) --- */
    case "serienbrief": { serienbriefExport([...App.auswahl]); return; }
    case "digitalpost": { digitalpostExport([...App.auswahl]); return; }
    case "brief-sammelvermerk": {
      const ids = [...App.auswahl];
      bestaetigen("Brief vermerken?",
        "Bei "+ids.length+" Firmen wird „Brief verschickt am "+fmtDatum(ISO(new Date()))+"“ eingetragen. "+
        "Es entsteht kein Vorgang – nur der Vermerk an der Firma.",
        "Vermerk setzen", ()=>{ briefVermerkSetzen(ids); });
      return;
    }

    /* --- Import --- */
    case "import-oeffnen": { importOeffnen(); return; }
    case "imp-lesen": {
      const datei = $("#impDatei").files[0];
      const ausText = text => {
        const zeilen = tabelleParsen(text, trennzeichenRaten(text));
        if(zeilen.length < 2){ toast("Zu wenig Daten – Überschriften plus mindestens eine Zeile"); return; }
        zeilenUebernehmen(zeilen);
      };
      if(datei && /\.(xlsx|xlsm)$/i.test(datei.name)){
        datei.arrayBuffer()
          .then(xlsxLesen)
          .then(blaetter => {
            if(!blaetter.length){ toast("Keine Daten gefunden – enthält die Datei Überschriften plus Zeilen?"); return; }
            Import.blaetter = blaetter;
            if(blaetter.length===1) zeilenUebernehmen(blaetter[0].zeilen);
            else blattAuswahlZeigen();
          })
          .catch(e => toast(e.message || "Datei nicht lesbar"));
        return;
      }
      if(datei){ const r=new FileReader(); r.onload=()=>ausText(String(r.result)); r.readAsText(datei,"utf-8"); return; }
      const t = $("#impText").value.trim();
      if(!t){ toast("Datei wählen oder Text einfügen"); return; }
      ausText(t);
      return;
    }
    case "blatt-waehlen": {
      zeilenUebernehmen(Import.blaetter[Number(el.getAttribute("data-blatt"))].zeilen);
      return;
    }
    case "imp-zurueck": { importOeffnen(); return; }
    case "imp-start": { importAusfuehren(); return; }

    /* --- Branchen-Abgleich (B20) --- */
    case "abgleich-oeffnen": { abgleichOeffnen(); return; }
    case "abgleich-zurueck": { abgleichOeffnen(); return; }
    case "abgleich-lesen": {
      const datei = $("#abgleichDatei").files[0];
      if(!datei || !/\.(xlsx|xlsm)$/i.test(datei.name)){ toast("Bitte die xlsx-Datei wählen"); return; }
      datei.arrayBuffer().then(xlsxLesen).then(blaetter => {
        if(!blaetter.length){ toast("Keine Daten in der Datei gefunden"); return; }
        const p = abgleichBerechnen(blaetter[0].zeilen);
        if(p.fehler){ toast(p.fehler); return; }
        Abgleich.plan = p;
        abgleichVorschauZeigen(p);
      }).catch(e => toast(e.message || "Datei nicht lesbar"));
      return;
    }
    case "abgleich-start": { abgleichAnwenden(); return; }

    case "vorlage": {
      const spalten = ["Firmenname","Branche","Kontaktweg","Status","Quelle","Ansprechpartner","Telefon",
                       "E-Mail","Website","Strasse","Hausnummer","PLZ","Ort","Notiz"];
      const beispiel = ["BEISPIEL – diese Zeile löschen","Medizin","Aktiv","Interessent","Bestandskunde","Frau Weber",
                        "069/123456","weber@beispiel.de","https://beispiel.de","Hauptstrasse","12","60311","Frankfurt",""];
      /* BOM voran, sonst zeigt Excel die Umlaute falsch an */
      const csv = "\ufeff" + [spalten, beispiel].map(z=>z.join(";")).join("\r\n") + "\r\n";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download = "AQT-Vorlage-Firmenliste.csv";
      a.click(); URL.revokeObjectURL(a.href);
      toast("Vorlage heruntergeladen – Beispielzeile vor dem Import löschen");
      return;
    }

    /* --- Einstellungen --- */
    case "sb-erneut": {
      if(!Auth.eingeloggt()){ toast("Nicht angemeldet"); return; }
      Sync.fehler = null; Sync.anstossen();
      setTimeout(()=>render(), 1200);
      toast("Übertragung angestossen");
      return;
    }
    case "sb-neuladen": {
      if(!Auth.eingeloggt()){ toast("Nicht angemeldet"); return; }
      bestaetigen("Aus Supabase neu laden?",
        "Nicht übertragene Änderungen gehen dabei verloren.",
        "Neu laden",
        ()=>{ sbLaden().then(()=>{ Sync.grundstellung(); render(); toast("Stand aus Supabase geladen"); })
                       .catch(e=>toast("Fehler: "+e.message)); });
      return;
    }
    case "export": { sicherungHerunterladen(); toast("Sicherung heruntergeladen"); return; }
    case "brief-reset": { briefeEntfernen(); return; }
    case "import-json": {
      const inp = document.createElement("input");
      inp.type="file"; inp.accept=".json";
      inp.onchange = () => {
        const f = inp.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = () => {
          try{
            const d = JSON.parse(String(r.result));
            if(!d.firmen) throw new Error("kein AQT-Format");
            /* Zusammenfuehren statt ersetzen: nur Datensaetze ergaenzen, die
               (per id) noch fehlen. So kann eine Sicherung gefahrlos
               eingespielt werden, ohne vorhandene Daten zu loeschen. */
            let ergaenzt = 0;
            for(const schluessel of ["firmen","objekte","vorgaenge","aktivitaeten","anhaenge"]){
              if(!Array.isArray(Store.data[schluessel])) Store.data[schluessel] = [];
              const da = new Set(Store.data[schluessel].map(x=>x.id));
              for(const rec of (d[schluessel]||[])){
                if(rec && rec.id && !da.has(rec.id)){ Store.data[schluessel].push(rec); da.add(rec.id); ergaenzt++; }
              }
            }
            Store.save(); render();
            toast(ergaenzt+" Einträge aus der Sicherung ergänzt");
          }catch(err){ toast("Datei nicht lesbar: "+err.message); }
        };
        r.readAsText(f);
      };
      inp.click(); return;
    }
    case "reset": {
      bestaetigen("Alles löschen?","Sämtliche Firmen, Objekte, Vorgänge und Aktivitäten werden entfernt. Vorher exportieren?",
        "Alles löschen", ()=>{ Store.replaceAll(Store.empty()); render(); toast("Zurückgesetzt"); });
      return;
    }
  }
}

/* Eingaben in Filterzeile und Schalter */
document.addEventListener("input", e => {
  const fl = e.target.getAttribute && e.target.getAttribute("data-filter");
  if(fl){
    App.firmenFilter[fl] = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const neu = document.querySelector('[data-filter="'+fl+'"]');
    if(neu){ neu.focus(); if(neu.setSelectionRange && pos!=null) try{ neu.setSelectionRange(pos,pos); }catch(_){} }
  }
});
/* Verlaesst man das Auswahlfeld ohne Wahl, kommt die Zelle als Text zurueck. */
document.addEventListener("focusout", e => {
  const fsel = e.target.getAttribute && e.target.getAttribute("data-fsel");
  if(fsel && !e.target._fertig && e.target.isConnected) render();
});
document.addEventListener("change", e => {
  const fsel = e.target.getAttribute && e.target.getAttribute("data-fsel");
  if(fsel){
    e.target._fertig = true;
    const f = DB.firma(e.target.getAttribute("data-id"));
    if(f){ f[fsel] = e.target.value; Store.save(); render(); toast(f.name+": "+(e.target.value||"\u2014")); }
    return;
  }
  if(e.target.id==="fPassiv"){ App.passiveZeigen = e.target.checked; render(); return; }
  if(e.target.id==="chkAll"){
    const ids = firmenGefiltert().map(x=>x.id);
    if(e.target.checked) ids.forEach(i=>App.auswahl.add(i)); else ids.forEach(i=>App.auswahl.delete(i));
    render(); return;
  }
  const pick = e.target.getAttribute && e.target.getAttribute("data-pick");
  if(pick){ e.target.checked ? App.auswahl.add(pick) : App.auswahl.delete(pick); render(); return; }
  if(e.target.id==="vlDatei"){
    const d = e.target.files && e.target.files[0];
    if(d) vorlagenDateiLaden(d);
    e.target.value = ""; return;
  }
  if(e.target.id==="anhInput"){
    const dateien = e.target.files;
    if(dateien && dateien.length) anhDateienAnnehmen(dateien);
    e.target.value = ""; return;
  }
  /* Firmenwechsel im Vorgang lädt die passenden Objekte nach */
  if(e.target.id==="vFirma"){
    const v = DB.vorgang(LayerCtx.vorgangId); if(!v) return;
    vorgangFelderLesen(v); v.objektId="";
    const f = DB.firma(v.firmaId);
    if(f && f.kontaktweg) v.kontaktweg = f.kontaktweg;
    Store.save(); vorgangOeffnen(v.id); return;
  }
});

/* Dateien in den Anhänge-Kasten ziehen */
function anhKasten(e){
  const t = e.target;
  return t && t.closest ? t.closest("#anhZone") : null;
}
document.addEventListener("dragover", e => {
  const z = anhKasten(e); if(!z) return;
  e.preventDefault(); z.style.background = "var(--surface-2)";
});
document.addEventListener("dragleave", e => {
  const z = anhKasten(e); if(z) z.style.background = "";
});
document.addEventListener("drop", e => {
  const z = anhKasten(e); if(!z) return;
  e.preventDefault(); z.style.background = "";
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)
    anhDateienAnnehmen(e.dataTransfer.files);
});

/* Karten per Ziehen in eine andere Stufe schieben */
let ziehId = null;
document.addEventListener("dragstart", e => {
  const c = e.target.closest("[data-vorgang]");
  if(c){ ziehId = c.getAttribute("data-vorgang"); e.dataTransfer.effectAllowed="move";
    if(c.closest("#board")) dropleisteZeigen(); }
});
document.addEventListener("dragover", e => {
  const col = e.target.closest(".col"); if(!col || !ziehId) return;
  e.preventDefault(); col.classList.add("drop");
});
document.addEventListener("dragleave", e => {
  const col = e.target.closest(".col"); if(col) col.classList.remove("drop");
});
document.addEventListener("drop", e => {
  const col = e.target.closest(".col"); if(!col || !ziehId) return;
  e.preventDefault(); col.classList.remove("drop");
  const v = DB.vorgang(ziehId); const neu = col.getAttribute("data-stufe");
  ziehId = null;
  if(!v || v.stufe===neu) return;
  if(neu==="abschluss"){ abschlussDialog(v,"gewonnen"); return; }
  const alt = v.stufe; v.stufe = neu;
  if(v.ergebnis){ abschlussTermineAbhaken(v); v.ergebnis=""; v.absagegrund=""; }
  const sm = stufenAutomatik(v, alt);
  Store.save(); render();
  if(sm) toast(sm);
});

/* B25: Beim Ziehen erscheint unten eine Leiste „Auftrag / Absage“ –
   so schliesst man ab, ohne dass dafuer eine eigene Spalte noetig ist. */
function dropleisteZeigen(){
  if($("#dropLeiste")) return;
  const d = document.createElement("div");
  d.id = "dropLeiste"; d.className = "dropleiste";
  d.innerHTML = '<div class="won" data-drop="gewonnen">Auftrag</div><div class="lost" data-drop="verloren">Absage</div>';
  document.body.appendChild(d);
}
function dropleisteWeg(){ const d = $("#dropLeiste"); if(d) d.remove(); }
document.addEventListener("dragover", e => {
  const z = e.target.closest && e.target.closest("[data-drop]"); if(!z || !ziehId) return;
  e.preventDefault(); z.classList.add("ueber");
});
document.addEventListener("dragleave", e => {
  const z = e.target.closest && e.target.closest("[data-drop]"); if(z) z.classList.remove("ueber");
});
document.addEventListener("drop", e => {
  const z = e.target.closest && e.target.closest("[data-drop]"); if(!z || !ziehId) return;
  e.preventDefault();
  const v = DB.vorgang(ziehId); ziehId = null; dropleisteWeg();
  if(v) abschlussDialog(v, z.getAttribute("data-drop"));
});
document.addEventListener("dragend", () => { dropleisteWeg(); setTimeout(() => { ziehId = null; }, 0); });

document.addEventListener("keydown", e => {
  if(e.key==="Escape" && $("#overlay")) layerAbbrechen();
});



/* Warnung, wenn das Fenster geschlossen wird, waehrend noch etwas
   offen ist: unuebertragene Aenderungen oder ein angefasster Dialog. */
window.addEventListener("beforeunload", e => {
  let offen = 0;
  try{ offen = (typeof Sync!=="undefined" && Sync.offen) ? Sync.offen() : 0; }catch(_){}
  if(offen || (typeof Sync!=="undefined" && Sync.fehler) || LayerBeruehrt){
    e.preventDefault(); e.returnValue = "";
  }
});
