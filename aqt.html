<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akquise &amp; Vertrieb · A.C.S. All Clean Services</title>
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#F7F9FA; --surface-3:#E9EEF1;
  --ink:#14202A; --ink-2:#54646F; --ink-3:#8795A0;
  --line:#D9E0E5; --line-strong:#BAC6CE;
  --accent:#0B5D8F; --accent-2:#0A4B74; --accent-soft:#E1EDF5;
  --warn:#A96A00; --warn-soft:#FAEFD9; --warn-line:#E4C282;
  --crit:#A22B22; --crit-soft:#FAE6E3; --crit-line:#E2AFA8;
  --ok:#1A7448; --ok-soft:#E1F1E8; --ok-line:#A3D2B9;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --r:6px; --nav-w:216px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--ui);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------- Grundtypografie ---------- */
.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3);
}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}
h1{font-size:21px}
h2{font-size:17px}
h3{font-size:14px}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100dvh}
.nav{
  width:var(--nav-w); flex:0 0 var(--nav-w); background:var(--ink); color:#DDE6EC;
  display:flex; flex-direction:column; position:sticky; top:var(--warn-h,0px); height:calc(100dvh - var(--warn-h,0px));
}
.brand{padding:18px 16px 14px; border-bottom:1px solid rgba(255,255,255,.10)}
.brand .logo{font-size:15.5px; font-weight:700; letter-spacing:.03em; color:#fff; line-height:1.25}
.brand .sub{font-size:11px; color:#8AA0AE; letter-spacing:.04em; margin-top:2px}
.nav-list{padding:10px 8px; display:flex; flex-direction:column; gap:2px; flex:1}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; color:#B9C9D4; padding:9px 10px; border-radius:var(--r);
  font-size:14px; font-weight:500;
}
.nav-item:hover{background:rgba(255,255,255,.07); color:#fff}
.nav-item.on{background:var(--accent); color:#fff}
.nav-item .ico{width:18px; text-align:center; opacity:.9; font-size:14px}
.nav-item .badge{
  margin-left:auto; background:var(--crit); color:#fff; font-size:11px; font-weight:700;
  padding:1px 6px; border-radius:20px; font-family:var(--mono);
}
.nav-item.on .badge{background:rgba(0,0,0,.28)}
.nav-foot{padding:10px 14px 16px; font-size:11px; color:#7C919E; border-top:1px solid rgba(255,255,255,.10)}
.nav-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:14px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  position:sticky; top:var(--warn-h,0px); z-index:30;
}
.topbar .spacer{flex:1}
.content{padding:20px 22px 60px; flex:1; min-width:0}

/* ---------- Buttons ---------- */
.btn{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r);
  padding:7px 13px; font-size:13.5px; font-weight:550; color:var(--ink); white-space:nowrap;
}
.btn:hover{background:var(--surface-2); border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:var(--crit); border-color:var(--crit); color:#fff}
.btn.danger:hover{filter:brightness(.92)}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3); color:var(--ink)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---------- Formularfelder ---------- */
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field > label{font-size:11.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
input[type=text],input[type=date],input[type=email],input[type=tel],input[type=url],select,textarea{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r);
  padding:7px 9px; font-size:14px; width:100%; min-width:0;
}
textarea{resize:vertical; min-height:70px; line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);
}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:28px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}

/* ---------- Karten / Panels ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:8px}
.panel-head{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px}
.panel-body{padding:16px}

/* ---------- Signatur: Statusleiste am Vorgang ---------- */
.vcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 12px 10px 15px; position:relative; overflow:hidden; text-align:left;
  width:100%; display:block; margin-bottom:8px;
}
.vcard:hover{border-color:var(--line-strong); box-shadow:0 1px 4px rgba(20,32,42,.09)}
.vcard::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--line-strong);
}
.vcard.u-warn::before{background:var(--warn)}
.vcard.u-crit::before{background:var(--crit)}
.vcard.u-ok::before{background:var(--ok)}
/* Passiv = gestreifte Leiste, Aktiv = durchgezogen */
.vcard.passiv::before{
  background:repeating-linear-gradient(180deg,var(--line-strong) 0 4px,transparent 4px 8px);
}
.vcard.passiv.u-warn::before{background:repeating-linear-gradient(180deg,var(--warn) 0 4px,transparent 4px 8px)}
.vcard.passiv.u-crit::before{background:repeating-linear-gradient(180deg,var(--crit) 0 4px,transparent 4px 8px)}
.vcard.passiv.u-ok::before{background:repeating-linear-gradient(180deg,var(--ok) 0 4px,transparent 4px 8px)}
/* Beide waren inline und klebten deshalb aneinander:
   „MAY BAUTRÄGER GMBH255.2, Aschaffenburg…“ */
.vcard .v-firma{display:block; font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
/* Der Betreff darf zwei Zeilen haben, danach wird gekürzt – sonst
   werden die Karten unterschiedlich hoch und die Spalte unruhig. */
.vcard .v-titel{display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
  overflow:hidden; font-size:13px; font-weight:500; color:var(--ink-2);
  margin:2px 0 6px; line-height:1.32}
.vcard .v-objekt{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:100%; font-size:11.5px; color:var(--ink-3)}
.vcard .v-meta{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2)}

/* ---------- Chips ---------- */
.chip{
  display:inline-flex; align-items:center; gap:4px; border-radius:20px; padding:1px 8px;
  font-size:11px; font-weight:650; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-2);
  white-space:nowrap;
}
.chip.warn{background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn)}
.chip.crit{background:var(--crit-soft); border-color:var(--crit-line); color:var(--crit)}
.chip.ok{background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok)}
.chip.accent{background:var(--accent-soft); border-color:#B4D2E5; color:var(--accent)}
/* Kontaktweg laesst sich direkt in der Tabelle umschalten */
button.wegchip{font:inherit; cursor:pointer; appearance:none}
button.wegchip:hover{filter:brightness(.94)}
button.wegchip:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---------- Kanban ---------- */
.board{display:flex; gap:12px; overflow-x:auto; padding-bottom:14px; scroll-snap-type:x proximity}
.col{flex:1 1 0; min-width:204px; background:var(--surface-3); border-radius:8px; padding:9px;
  scroll-snap-align:start; min-height:180px}
.col-head{display:flex; align-items:baseline; gap:6px; padding:2px 4px 9px}
.col-head .n{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-weight:700}
.col-head .t{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2)}
.col-head .c{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-3)}
.col.drop{outline:2px dashed var(--accent); outline-offset:-3px}
.col-empty{font-size:12px; color:var(--ink-3); padding:8px 4px; font-style:italic}

/* ---------- Tabelle ---------- */
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.data{width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface)}
table.data th{
  text-align:left; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-2); padding:8px 10px; border-bottom:1px solid var(--line-strong); white-space:nowrap;
  background:var(--surface-2); position:sticky; top:0;
}
table.data td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
table.data tbody tr:hover{background:var(--surface-2)}
table.data tr.sel{background:var(--accent-soft)}
table.data tr.sel:hover{background:#D7E7F1}
.cellname{font-weight:600}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:2px}
.konlinks{display:flex;gap:10px;flex-wrap:wrap}
.konlinks a{font-size:12px;white-space:nowrap;color:var(--accent);text-decoration:none;font-weight:600}
.konlinks a:hover{text-decoration:underline}
.minilink{font-size:10.5px;font-weight:600;text-transform:none;letter-spacing:0;margin-left:6px;color:var(--accent)}
.filterrow th{padding:5px 6px; background:var(--surface); border-bottom:1px solid var(--line-strong); position:static}

/* Lange Listen: der Tabellenbereich bekommt eine eigene Hoehe und scrollt
   fuer sich. Nur dadurch koennen Ueberschrift und Filterzeile stehen
   bleiben – bei Seitenscroll haette „sticky" hier keinen Bezugspunkt.
   Die Hoehe setzt tabelleFixieren() nach jedem Rendern. */
.tablewrap.fixhead{overflow:auto}
.tablewrap.fixhead thead th{position:sticky; z-index:5}
.tablewrap.fixhead thead tr:first-child th{top:0; z-index:6}
.tablewrap.fixhead tr.filterrow th{position:sticky; z-index:5}
.tablewrap.fixhead tr.filterrow th::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background:var(--line-strong);
}
/* Zeile ueber der Tabelle: Trefferzahl, bleibt immer sichtbar. */
.listkopf{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 12px; background:var(--surface-2); border-bottom:1px solid var(--line-strong);
  font-size:12.5px; color:var(--ink-2);
}
.listkopf b{color:var(--ink); font-size:14px}
.filterrow input,.filterrow select{padding:4px 6px; font-size:12.5px; background:var(--surface-2)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}

.selbar{
  display:flex; align-items:center; gap:10px; padding:9px 14px; background:var(--ink); color:#fff;
  border-radius:var(--r); margin-bottom:10px; flex-wrap:wrap;
}
.selbar .n{font-family:var(--mono); font-weight:700}

/* ---------- Kennzahlen ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:13px 15px}
.kpi .v{font-family:var(--mono); font-size:26px; font-weight:700; line-height:1.1; letter-spacing:-.02em}
.kpi .l{font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-top:3px}
.kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

/* ---------- Modal / Drawer ---------- */
.overlay{
  position:fixed; inset:var(--warn-h,0px) 0 0 0; background:rgba(20,32,42,.42); z-index:100;
  display:flex; justify-content:flex-end;
}
.drawer{
  background:var(--bg); width:min(660px,100%); height:100dvh; display:flex; flex-direction:column;
  box-shadow:-6px 0 26px rgba(20,32,42,.22);
}
.drawer-head{
  background:var(--surface); border-bottom:1px solid var(--line); padding:14px 18px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.drawer-body{padding:18px; overflow-y:auto; overflow-x:hidden; flex:1; -webkit-overflow-scrolling:touch}
.drawer-foot{
  background:var(--surface); border-top:1px solid var(--line); padding:12px 18px;
  display:flex; gap:9px; align-items:center; flex-wrap:wrap;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}
.modal-center{align-items:center; justify-content:center; padding:16px}
.modal{background:var(--surface); border-radius:10px; width:min(620px,100%); max-height:88dvh; display:flex; flex-direction:column}
/* Breites Dialogfenster für die Firma – zwei Spalten statt langem Scrollen */
.modal.wide{width:min(1060px,100%); height:88dvh}
.dlg2{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start}
/* Ohne min-width:0 sprengen lange Dateinamen und Knopfreihen die Spalte
   und der Inhalt läuft rechts aus dem Fenster heraus. */
.dlg2>*{min-width:0}
.modal{overflow:hidden}

/* Listenzeile: eine Zeile pro Objekt, Klick öffnet die Details */
.lrow{display:flex; align-items:center; gap:4px; border-bottom:1px solid var(--line)}
.lrow .lmain{flex:1; min-width:0; background:none; border:0; text-align:left; padding:8px 6px; border-radius:var(--r)}
.lrow .lmain:hover{background:var(--surface-2)}
.lrow .lt{display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lrow .ls{display:block; font-size:11.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.section{margin-bottom:18px}
.section-t{
  font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  padding-bottom:6px; margin-bottom:10px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.section-t .add{margin-left:auto}

/* ---------- Chronik ---------- */
.akt{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
.akt:last-child{border-bottom:0}
.akt .k{
  flex:0 0 74px; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-2); padding-top:2px;
}
.akt .d{font-family:var(--mono); font-size:11px; color:var(--ink-3); display:block; font-weight:500; letter-spacing:0; text-transform:none}
.akt .b{flex:1; font-size:13.5px; min-width:0; white-space:pre-wrap; word-break:break-word}

.empty{
  text-align:center; padding:44px 20px; color:var(--ink-2); background:var(--surface);
  border:1px dashed var(--line-strong); border-radius:8px;
}
.empty h3{margin-bottom:6px; font-size:15px}
.empty p{margin:0 0 14px; font-size:13.5px; max-width:420px; margin-inline:auto}

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:400;
  background:var(--ink); color:#fff; padding:10px 16px; border-radius:20px; font-size:13.5px;
  box-shadow:0 4px 18px rgba(20,32,42,.3); max-width:90vw;
}
.hidden{display:none !important}
.toolbar{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.seg button{background:none; border:0; padding:6px 12px; font-size:13px; font-weight:550; color:var(--ink-2)}
.seg button.on{background:var(--accent); color:#fff}
.switch{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); white-space:nowrap; cursor:pointer}

.mobilenav{display:none}
.hint{font-size:12px; color:var(--ink-2); background:var(--surface-2); border-left:3px solid var(--line-strong); padding:8px 11px; border-radius:0 var(--r) var(--r) 0}

/* ---------- Fristen, Chronik, Anhänge ---------- */
.stufenleiste{display:flex; gap:3px; margin:10px 0 8px; max-width:520px}
.stufenleiste span{flex:1; height:5px; border-radius:3px; background:var(--line-strong)}
.stufenleiste span.an{background:var(--accent)}
.stufenleiste span.ende{background:var(--ok)}
.statuszeile{font-size:13.5px; color:var(--ink-2)}
.statuszeile b{color:var(--ink); font-weight:650}
.statuszeile .crit{color:var(--crit); font-weight:650}
.statuszeile .warn{color:var(--warn); font-weight:650}
.statuszeile .ok{color:var(--ok); font-weight:650}

.jetzt{
  border:1px solid var(--line-strong); background:var(--surface-2);
  border-radius:8px; padding:12px 14px; margin-bottom:18px;
}
.jetzt.crit{background:var(--crit-soft); border-color:var(--crit-line)}
.jetzt.warn{background:var(--warn-soft); border-color:var(--warn-line)}
.jetzt.ok{background:var(--ok-soft); border-color:var(--ok-line)}
.jetzt .kopf{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
.jetzt.crit .kopf{color:var(--crit)}
.jetzt.warn .kopf{color:var(--warn)}
.jetzt.ok .kopf{color:var(--ok)}
.jetzt .was{font-size:14.5px; font-weight:650; margin-bottom:3px}
.jetzt .warum{font-size:12.5px; color:var(--ink-2); margin-bottom:10px}
.jetzt .tasten{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.jetzt .tasten select{padding:5px 8px; font-size:13px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface)}
.jetzt .fuss{font-size:12px; color:var(--ink-2); margin-top:9px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}

.stamm{border-top:1px solid var(--line); padding-top:10px; margin-bottom:14px}
.stamm>summary{
  list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:8px;
  font-size:13.5px; color:var(--ink); padding:2px 0;
}
.stamm>summary::-webkit-details-marker{display:none}
.stamm>summary .pfeil{color:var(--ink-3); font-size:11px; flex:0 0 auto}
.stamm>summary .zeile{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stamm>summary .tu{color:var(--accent); font-size:12px; font-weight:600; flex:0 0 auto}
.stamm[open]>summary .zeile{color:var(--ink-2)}
.stamm[open]>summary .tu::after{content:" zu"}
.stamm .inhalt{padding-top:12px}
.kontaktrow{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:9px 0 2px; font-size:12px}

/* Kopf des Vorgangsfensters – man muss auf einen Blick sehen,
   um welchen Kunden, welche Anfrage und welchen Menschen es geht. */
.vkopf{min-width:0; flex:1}
.vkopf .firma{font-size:19px; font-weight:700; letter-spacing:-.01em; line-height:1.2;
  color:var(--ink); overflow-wrap:anywhere}
.vkopf .betreff{font-size:15px; font-weight:600; line-height:1.35; margin-top:3px;
  color:var(--ink); overflow-wrap:anywhere}
.vkontakt{display:flex; align-items:center; gap:10px 12px; flex-wrap:wrap; margin-top:8px; font-size:13px}
.vkontakt .name{font-weight:650}
.vkontakt .funk{color:var(--ink-2)}
.vkontakt .funk::before{content:"\00b7\00a0"}
.vkontakt .kein{color:var(--warn); font-weight:600}
.vkontakt .objekt{color:var(--ink-2); width:100%; font-size:12.5px}
.mail-eck{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r);
  padding:11px 13px; margin-bottom:14px; font-size:13px; line-height:1.7; white-space:pre-wrap}

.verlauf .zeile-datei .b{display:flex; align-items:center; gap:8px}
.dropzeile{
  border:1px dashed var(--line-strong); border-radius:var(--r); padding:9px;
  text-align:center; font-size:12px; color:var(--ink-3); margin-top:10px;
}

<script>
"use strict";

/* ============================================================
   AQT – Akquise-Tool
   Grundgerüst nach Konzept "AQT Neuaufbau v3"
   Datenmodell: Firma -> Objekt -> Vorgang -> Aktivität
   ============================================================ */

/* ---------- 1. Speicher-Adapter ---------------------------------
   Drei austauschbare Backends. Die App spricht nur mit Store.*,
   nie direkt mit localStorage oder Supabase. Beim Umstieg auf
   Supabase wird ausschliesslich dieser Block ersetzt.
------------------------------------------------------------------ */
const KEY = "aqt.v1";

const Backends = {
  local: {
    id:"local", label:"Lokal gespeichert", color:"#3FA96B",
    /* B18: Nur lesen pruefen – ein voller Speicher heisst nicht „gesperrt“ */
    available(){ try{ localStorage.getItem("__t"); return true; }catch(e){ return false; } },
    load(){ try{
      /* Liegt die Kopie schon in IndexedDB, ist aqt.v1 veraltet: weg damit */
      if(localStorage.getItem("aqt.spiegel")==="idb"){ try{ localStorage.removeItem(KEY); }catch(_){} return null; }
      const r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return null; } },
    save(d){ Spiegel.planen("daten", d); return true; }
  },
  memory: {
    id:"memory", label:"Nur für diese Sitzung", color:"#C99A2E",
    _d:null,
    available(){ return true; },
    load(){ return this._d; },
    save(d){ this._d = d; return true; }
  },
  supabase: {
    id:"supabase", label:"Supabase (Cloud)", color:"#3ECF8E",
    url:"https://bvkiicbnlyagyxahvzvk.supabase.co",
    key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2a2lpY2JubHlhZ3l4YWh2enZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDA1MjAsImV4cCI6MjA5NjY3NjUyMH0.mYeBzv0kGzkp6rqQHLTscD5bP_T1Ui_0OfBsg_EzIUU",
    available(){ return true; },
    load(){ return null; },   // wird asynchron geladen
    save(){ return true; }    // wird asynchron gespeichert
  }
};

/* ---------- Supabase REST-Helfer -------------------------------- */
const SB = {
  _u: "https://bvkiicbnlyagyxahvzvk.supabase.co",
  _k: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2a2lpY2JubHlhZ3l4YWh2enZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMDA1MjAsImV4cCI6MjA5NjY3NjUyMH0.mYeBzv0kGzkp6rqQHLTscD5bP_T1Ui_0OfBsg_EzIUU",
  _tok: null,      // JWT nach Login
  _refresh: null,  // Refresh-Token, um den JWT vor Ablauf zu erneuern
  _refreshTimer: null,

  hdr(extra){
    const h = {"Content-Type":"application/json","apikey":this._k};
    if(this._tok) h["Authorization"] = "Bearer "+this._tok;
    return Object.assign(h, extra||{});
  },

  async req(methode, pfad, body, extra, _wiederholung){
    const r = await fetch(this._u+pfad, {
      method:methode, headers:this.hdr(extra),
      body: body ? JSON.stringify(body) : undefined
    });
    if(!r.ok){
      const t = await r.text();
      /* Token abgelaufen ("JWT expired" / PGRST303 / 401): einmal
         automatisch erneuern und den Aufruf wiederholen. Verhindert,
         dass Speichern nach ~1 Stunde stillschweigend fehlschlaegt. */
      if(!_wiederholung && this._refresh &&
         (r.status===401 || t.indexOf("JWT expired")>=0 || t.indexOf("PGRST303")>=0)){
        if(await this.tokenErneuern())
          return this.req(methode, pfad, body, extra, true);
      }
      throw new Error("Supabase "+r.status+": "+t.slice(0,200));
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },

  /* Neuen JWT mit dem Refresh-Token holen. Gibt true bei Erfolg. */
  async tokenErneuern(){
    if(!this._refresh) return false;
    try{
      const r = await fetch(this._u+"/auth/v1/token?grant_type=refresh_token", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "apikey":this._k },
        body: JSON.stringify({ refresh_token: this._refresh })
      });
      if(!r.ok) return false;
      const d = JSON.parse(await r.text());
      if(!d || !d.access_token) return false;
      this._tok = d.access_token;
      if(d.refresh_token) this._refresh = d.refresh_token;
      try{ localStorage.setItem("aqt_sb_refresh", this._refresh); }catch(_){}
      return true;
    }catch(_){ return false; }
  },

  /* Regelmaessig vor Ablauf erneuern (JWT haelt ~1h, wir gehen auf Nummer
     sicher mit 45 min), damit es gar nicht erst zum Fehler kommt. */
  _refreshTimerStarten(){
    if(this._refreshTimer) clearInterval(this._refreshTimer);
    this._refreshTimer = setInterval(()=>{ this.tokenErneuern(); }, 45*60*1000);
  },

  async login(email, passwort){
    const d = await this.req("POST","/auth/v1/token?grant_type=password",
      {email, password:passwort});
    this._tok = d.access_token;
    this._refresh = d.refresh_token || null;
    try{ if(this._refresh) localStorage.setItem("aqt_sb_refresh", this._refresh); }catch(_){}
    this._refreshTimerStarten();
    Auth.user = d.user;
    return d;
  },

  async logout(){
    try{ await this.req("POST","/auth/v1/logout"); }catch(_){}
    this._tok = null; this._refresh = null; Auth.user = null;
    if(this._refreshTimer){ clearInterval(this._refreshTimer); this._refreshTimer = null; }
    try{ localStorage.removeItem("aqt_sb_refresh"); }catch(_){}
  },

  /* Alle Zeilen einer Tabelle laden */
  async alle(tabelle){
    let alle=[], von=0, PAGE=1000;
    while(true){
      const chunk = await this.req("GET",
        `/rest/v1/${tabelle}?select=*&order=id&limit=${PAGE}&offset=${von}`);
      alle = alle.concat(chunk||[]);
      if(!chunk||chunk.length<PAGE) break;
      von += PAGE;
    }
    return alle;
  },

  /* Anlegen oder überschreiben. Der Header "resolution=merge-duplicates" ist
     Pflicht: ohne ihn ignoriert Supabase das on_conflict=id und antwortet beim
     zweiten Speichern desselben Satzes mit 409. 200 Zeilen pro Anfrage. */
  async upsert(tabelle, zeile){
    const zeilen = Array.isArray(zeile) ? zeile : [zeile];
    if(!zeilen.length) return;
    for(let i=0;i<zeilen.length;i+=200)
      await this.req("POST", `/rest/v1/${tabelle}?on_conflict=id`,
        zeilen.slice(i,i+200),
        {"Prefer":"resolution=merge-duplicates,return=minimal"});
  },

  /* Alter Name, gleiche Sache */
  async einfuegen(tabelle, zeilen){ await this.upsert(tabelle, zeilen); },

  /* B26: Nur die geaenderten Felder einer Zeile schreiben. So bleibt, was
     ein anderes Geraet in derselben Zeile an ANDEREN Feldern geaendert hat,
     erhalten. Kommt nichts zurueck, wurde die Zeile woanders geloescht –
     dann wird sie mit dem lokalen Stand neu angelegt, denn hier wurde sie
     ja gerade bewusst bearbeitet. */
  /* B27: Aktuellen Cloud-Stand eines Feldes fuer mehrere Zeilen holen.
     Ergebnis: Map id -> Wert. Fehlt eine id, gibt es die Zeile dort nicht. */
  async feldLesen(tabelle, ids, feld){
    const out = new Map();
    for (let i = 0; i < ids.length; i += 100){
      const teil = ids.slice(i, i+100);
      const zeilen = await this.req("GET",
        `/rest/v1/${tabelle}?select=id,${feld}&id=in.(${teil.map(id=>`"${id}"`).join(",")})`);
      for (const z of (zeilen||[])) out.set(z.id, z[feld] || []);
    }
    return out;
  },

  async felderSetzen(tabelle, id, felder, ganz){
    const r = await this.req("PATCH",
      `/rest/v1/${tabelle}?id=eq.${encodeURIComponent(id)}&select=id`,
      felder, {"Prefer":"return=representation"});
    if(Array.isArray(r) && r.length === 0) await this.upsert(tabelle, [ganz]);
  },

  /* Supabase: in-Filter als id=in.("a","b","c"). Paketweise, sonst wird
     die URL bei einer Sammellöschung von 500 Firmen zu lang. */
  async loeschen(tabelle, ids){
    if(!ids || !ids.length) return;
    for(let i=0;i<ids.length;i+=200){
      const teil = ids.slice(i,i+200);
      await this.req("DELETE",
        `/rest/v1/${tabelle}?id=in.(${teil.map(id=>`"${id}"`).join(",")})`,
        null, {"Prefer":"return=minimal"});
    }
  },

  /* ---------- Dateien im Supabase-Speicher ----------------------
     Der Ablagekorb "aqt-anhaenge" ist nicht öffentlich. Hochladen und
     Löschen laufen mit dem Anmelde-Token. Zum Öffnen wird jedes Mal eine
     Adresse mit kurzer Laufzeit erzeugt – so liegt keine Datei dauerhaft
     offen im Netz. Der Inhalt geht roh raus, nicht als JSON, deshalb
     eigene fetch-Aufrufe statt req(). */
  KORB: "aqt-anhaenge",

  _pfadUrl(pfad){
    return this._u+"/storage/v1/object/"+this.KORB+"/"+
      String(pfad).split("/").map(encodeURIComponent).join("/");
  },

  async dateiHoch(pfad, datei){
    const r = await fetch(this._pfadUrl(pfad), {
      method:"POST",
      headers:{ "apikey":this._k, "Authorization":"Bearer "+this._tok,
                "Content-Type": datei.type || "application/octet-stream",
                "x-upsert":"true" },
      body: datei
    });
    if(!r.ok) throw new Error("Speicher "+r.status+": "+(await r.text()).slice(0,200));
    return true;
  },

  async dateiUrl(pfad, sekunden){
    const d = await this.req("POST",
      "/storage/v1/object/sign/"+this.KORB+"/"+
        String(pfad).split("/").map(encodeURIComponent).join("/"),
      { expiresIn: sekunden || 300 });
    const s = d && (d.signedURL || d.signedUrl || d.url);
    if(!s) throw new Error("Keine Adresse erhalten");
    return s.indexOf("http")===0 ? s : this._u+"/storage/v1"+(s[0]==="/"?"":"/")+s;
  },

  /* Einstellungen liegen in einer eigenen kleinen Tabelle: ein Schlüssel,
     ein JSON-Wert. Läuft nicht über den Abgleich-Motor, weil es keine
     Liste von Datensätzen ist, sondern eine Handvoll fester Einträge. */
  async einstellungenLaden(){
    const zeilen = await this.req("GET", "/rest/v1/aqt_einstellungen?select=*");
    const out = {};
    for (const z of (zeilen||[])) out[z.schluessel] = z.wert;
    return out;
  },

  async einstellungSetzen(schluessel, wert){
    await this.req("POST", "/rest/v1/aqt_einstellungen?on_conflict=schluessel",
      [{ schluessel, wert }],
      {"Prefer":"resolution=merge-duplicates,return=minimal"});
  },

  async dateiWeg(pfad){
    const r = await fetch(this._pfadUrl(pfad), {
      method:"DELETE",
      headers:{ "apikey":this._k, "Authorization":"Bearer "+this._tok }
    });
    if(!r.ok) throw new Error("Speicher "+r.status);
    return true;
  }
};

/* ---------- 1a. Lokale Kopie in IndexedDB (B18) -----------------
   localStorage fasst pro Webadresse nur ca. 5 MB – und alle Tools unter
   derselben Adresse teilen sich das. IndexedDB hat ein Vielfaches.
   Schreiben laeuft gebuendelt im Hintergrund; klemmt IndexedDB, wird
   ersatzweise localStorage versucht. Schluessel: "daten", "offen".
------------------------------------------------------------------- */
const Spiegel = {
  NAME:"aqt-spiegel", TAB:"kv",
  _db:null, _warte:{}, _lauf:null,
  modus:"", zuletzt:null, fehler:"",

  _oeffnen(){
    if(this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      let r;
      try{ r = indexedDB.open(this.NAME, 1); }catch(e){ rej(e); return; }
      r.onupgradeneeded = () => { r.result.createObjectStore(this.TAB); };
      r.onsuccess = () => {
        this._db = r.result;
        this._db.onversionchange = () => { try{ this._db.close(); }catch(_){} this._db = null; };
        res(this._db);
      };
      r.onerror   = () => rej(r.error || new Error("IndexedDB lässt sich nicht öffnen"));
      r.onblocked = () => rej(new Error("IndexedDB blockiert"));
    });
  },

  async _put(eintraege){
    const db = await this._oeffnen();
    await new Promise((res, rej) => {
      const tx = db.transaction(this.TAB, "readwrite");
      const st = tx.objectStore(this.TAB);
      for (const k of Object.keys(eintraege)) st.put(eintraege[k], k);
      tx.oncomplete = () => res();
      tx.onerror    = () => rej(tx.error || new Error("Schreiben fehlgeschlagen"));
      tx.onabort    = () => rej(tx.error || new Error("Schreiben abgebrochen"));
    });
  },

  planen(k, wert){
    this._warte[k] = wert;
    if(!this._lauf) this._lauf = this._abarbeiten();
    return this._lauf;
  },

  async _abarbeiten(){
    await new Promise(r => setTimeout(r, 0));   /* mehrere Saves bündeln */
    while(Object.keys(this._warte).length){
      const w = this._warte; this._warte = {};
      /* B24: Zeitstempel mitschreiben. Faellt IndexedDB zeitweise aus und
         der Stand landet in localStorage, kann sonst beim naechsten Login
         die (dann veraltete) IndexedDB-Kopie den neueren Fallback
         verdraengen. */
      if("daten" in w) w.daten_zeit = Date.now();
      try{
        await this._put(w);
        this.modus = "idb"; this.fehler = ""; this.zuletzt = new Date();
        try{
          if("daten" in w){ localStorage.removeItem("aqt.v1"); localStorage.removeItem("aqt.v1.zeit"); localStorage.setItem("aqt.spiegel", "idb"); }
          if("offen" in w) localStorage.removeItem("aqt.offen");
        }catch(_){}
        speicherWarnung("lokal", "");
      }catch(e){
        console.warn("IndexedDB:", e);
        let ok = true;
        try{
          if("daten" in w){
            localStorage.setItem("aqt.v1", JSON.stringify(w.daten));
            localStorage.setItem("aqt.v1.zeit", String(w.daten_zeit || Date.now()));
            localStorage.removeItem("aqt.spiegel");
          }
          if("offen" in w) localStorage.setItem("aqt.offen", JSON.stringify(w.offen || {}));
        }catch(e2){ ok = false; }
        this.modus  = ok ? "localStorage" : "";
        this.fehler = ok ? "" : ((e && e.message) || String(e));
        if(ok) this.zuletzt = new Date();
        speicherWarnung("lokal", ok ? "" :
          "Lokale Sicherung fehlgeschlagen ("+this.fehler+"). Die Cloud speichert weiter – zur Sicherheit unter Einstellungen die Daten exportieren.");
      }
    }
    this._lauf = null;
  },

  async lesen(k){
    if(this._lauf){ try{ await this._lauf; }catch(_){} }
    try{
      const db = await this._oeffnen();
      return await new Promise((res, rej) => {
        const r = db.transaction(this.TAB, "readonly").objectStore(this.TAB).get(k);
        r.onsuccess = () => res(r.result);
        r.onerror   = () => rej(r.error);
      });
    }catch(e){ console.warn("IndexedDB lesen:", e); return undefined; }
  }
};

const Store = {
  backend: Backends.local.available() ? Backends.local : Backends.memory,
  data: null,
  empty(){ return { firmen:[], objekte:[], vorgaenge:[], aktivitaeten:[], anhaenge:[], meta:{ angelegt:new Date().toISOString(), importMapping:null } }; },
  init(){
    const d = this.backend.load();
    this.data = d && d.firmen ? d : this.empty();
    for (const k of ["firmen","objekte","vorgaenge","aktivitaeten","anhaenge"]) if(!Array.isArray(this.data[k])) this.data[k]=[];
    if(!this.data.meta) this.data.meta={};
  },
  saveZaehler: 0,
  save(){
    this.saveZaehler++;
    const ok = this.backend.save(this.data) !== false;
    if(this.backend.id === "supabase"){
      /* Sicherheitsnetz: im Cloud-Modus zusaetzlich immer lokal spiegeln
         (B18: in IndexedDB). Faellt der Cloud-Sync aus, bleibt der Stand
         lokal erhalten und wird beim naechsten Login nachgeholt. */
      Spiegel.planen("daten", this.data);
      /* B17: merken, welche Eintraege noch nicht in der Cloud sind */
      Sync.offenMerken();
      Sync.anstossen();
    }
    try{ NfExport.nachSpeichern(); }catch(_){}   /* B36: Stand fuer Claude */
    if(!ok) speicherWarnung("lokal", "NICHT gespeichert – bitte sofort unter Einstellungen die Daten exportieren.");
    return ok;
  },
  replaceAll(d){ this.data = d; this.save(); }
};

/* ---------- 1b. Abgleich mit Supabase ---------------------------
   Die App ruft an über 20 Stellen nur Store.save() auf. Statt an jeder
   dieser Stellen einen eigenen Supabase-Aufruf einzubauen (den man beim
   nächsten neuen Knopf garantiert vergisst), vergleicht Sync nach jedem
   Speichern den aktuellen Datenstand mit dem zuletzt übertragenen und
   schickt nur die Unterschiede raus. Gebündelt – deshalb funktioniert
   auch ein Import mit 1.300 Zeilen und die Sammellöschung ohne Extra-Code.
------------------------------------------------------------------- */
/* B26: bis zu so vielen geaenderten Zeilen pro Tabelle wird feldweise gespeichert */
const SYNC_FELD_MAX = 40;

/* B27: Felder, die eine ganze Liste enthalten. Wer hier speichert, ersetzt
   sonst die komplette Liste – und ein Termin, den ein anderes Geraet in der
   Zwischenzeit gesetzt oder abgehakt hat, waere weg. Deshalb wird vor dem
   Speichern der Cloud-Stand geholt und Eintrag fuer Eintrag zusammengefuehrt. */
const SYNC_LISTEN = { vorgaenge:"wiedervorlagen", firmen:"briefe" };

/* Dreiwege-Zusammenfuehrung einer Liste. basis = Stand beim letzten
   Abgleich, mein = Stand hier, dort = Stand in der Cloud.
   - hier neu oder hier geaendert: gilt der Stand von hier
   - hier unveraendert: gilt der Stand aus der Cloud (z.B. dort abgehakt)
   - dort neu: kommt dazu
   - hier geloescht: bleibt weg; dort geloescht und hier unveraendert: weg
   Die Reihenfolge von hier bleibt, Neues von dort kommt hinten dran. */
function listeZusammen(basis, mein, dort){
  const sch = x => (x && x.id) ? "i:"+x.id : "k:"+((x&&x.datum)||"")+"|"+((x&&x.anlass)||"");
  const js = JSON.stringify;
  const B = new Map((basis||[]).map(x => [sch(x), x]));
  const T = new Map((dort||[]).map(x => [sch(x), x]));
  const out = [], gesehen = new Set();
  for (const m of (mein||[])){
    const k = sch(m); gesehen.add(k);
    const b = B.get(k), t = T.get(k);
    if(!b || js(m) !== js(b)){ out.push(m); continue; }
    if(t) out.push(t);
  }
  for (const [k, t] of T){
    if(gesehen.has(k) || B.has(k)) continue;
    out.push(t);
  }
  return out;
}

const SYNC_TABELLEN = [

  { schluessel:"vorgaenge",    tabelle:"aqt_vorgaenge",    zuSb:r => appVorgangZuSb(r) },

];

/* B17: Dauerhafter roter Balken bei Speicherfehlern. Bleibt stehen, bis
   wieder erfolgreich gespeichert wurde – ein Toast ist nach 3 Sekunden weg. */
const SpeicherWarn = { lokal:"", cloud:"", anh:"" };
function speicherWarnung(art, text){
  SpeicherWarn[art] = text || "";
  speicherWarnungZeigen();
}
/* B18: Balken steht oben im Seitenfluss und schiebt alles nach unten.
   --warn-h verschiebt Navigation, Kopfzeile und Dialoge mit. */
function warnHoeheSetzen(){
  const el = document.getElementById("speicherWarn");
  document.documentElement.style.setProperty("--warn-h", (el ? el.offsetHeight : 0)+"px");
}
window.addEventListener("resize", warnHoeheSetzen);
function speicherWarnungZeigen(){
  if(!document.body) return;
  let el = document.getElementById("speicherWarn");
  const txt = [SpeicherWarn.lokal, SpeicherWarn.cloud, SpeicherWarn.anh].filter(Boolean).join(" · ");
  if(!txt){ if(el) el.remove(); warnHoeheSetzen(); return; }
  if(!el){
    el = document.createElement("div");
    el.id = "speicherWarn";
    el.style.cssText = "position:sticky;top:0;z-index:500;background:#E0554A;color:#fff;"+
      "padding:8px 14px;font-size:13px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.25)";
    document.body.insertBefore(el, document.body.firstChild);
  }
  el.innerHTML = esc(txt)+(SpeicherWarn.cloud
    ? ' <button id="speicherWarnRetry" style="margin-left:10px;padding:2px 10px;border:1px solid #fff;background:transparent;color:#fff;border-radius:4px;cursor:pointer">Erneut versuchen</button>'
    : "");
  if(SpeicherWarn.anh) el.innerHTML +=
    ' <button id="anhRetry" style="margin-left:10px;padding:2px 10px;border:1px solid #fff;background:transparent;color:#fff;border-radius:4px;cursor:pointer">Anhänge neu laden</button>';
  const b = document.getElementById("speicherWarnRetry");
  if(b) b.onclick = () => Sync.anstossen();
  const b2 = document.getElementById("anhRetry");
  if(b2) b2.onclick = () => anhNeuLaden();
  warnHoeheSetzen();
}

const Sync = {
  stand:  null,    // zuletzt übertragener Zustand: {firmen:Map(id -> JSON), …}
  laeuft: false,
  nochmal:false,   // während des Übertragens kam schon die nächste Änderung
  fehler: null,

  /* Nach dem Laden aus Supabase gilt alles als übertragen */
  grundstellung(){
    this.stand = {};
    for (const t of SYNC_TABELLEN) this.stand[t.schluessel] = this.momentaufnahme(t);
    this.fehler = null; this.laeuft = false; this.anzeigen();
  },

  momentaufnahme(t){
    const m = new Map();
    /* B17: auch alles, was an einem Entwurf haengt, bleibt draussen –
       sonst scheitert der Upload am Fremdschluessel und blockiert den
       gesamten Abgleich. */
    const eF = new Set((Store.data.firmen||[]).filter(f=>f.entwurf).map(f=>f.id));
    const eV = new Set((Store.data.vorgaenge||[]).filter(v=>v.entwurf || eF.has(v.firmaId)).map(v=>v.id));
    const s = t.schluessel;
    for (const r of (Store.data[s]||[])){
      if(r.entwurf) continue;                 // Entwürfe kommen nicht in die Datenbank
      if((s==="objekte" || s==="vorgaenge") && eF.has(r.firmaId)) continue;
      if((s==="aktivitaeten" || s==="anhaenge") && eV.has(r.vorgangId)) continue;
      m.set(r.id, JSON.stringify(t.zuSb(r)));
    }
    return m;
  },

  /* B17: Liste der noch nicht uebertragenen IDs pro Tabelle.
     g = geaendert/neu, w = geloescht. */
  offeneListe(){
    if(!this.stand) return null;
    const l = {};
    for (const t of SYNC_TABELLEN){
      const neu = this.momentaufnahme(t), alt = this.stand[t.schluessel] || new Map();
      const g = [], w = [];
      for (const [id,json] of neu) if(alt.get(id) !== json) g.push(id);
      for (const id of alt.keys()) if(!neu.has(id)) w.push(id);
      if(g.length || w.length) l[t.schluessel] = { g, w };
    }
    return l;
  },
  /* Wird lokal abgelegt. Beim naechsten Login gewinnt fuer genau diese
     Eintraege der lokale Stand – auch wenn es sie in der Cloud schon gibt. */
  offenMerken(){
    try{
      const l = this.offeneListe(); if(!l) return;
      Spiegel.planen("offen", l);         /* B18: in IndexedDB */
    }catch(e){ console.warn(e); }
  },

  anstossen(){
    if(!Auth.eingeloggt() || !this.stand) return;
    if(this.laeuft){ this.nochmal = true; return; }
    this.laeuft = true; this.anzeigen();
    this.durchlauf()
      .then(() => {
        this.fehler = null; speicherWarnung("cloud", ""); this.offenMerken();
        if(this.zusammengefuehrt){
          if(this.meldung) this.meldung += " · Termine vom anderen Gerät ergänzt";
          else toast("Termine vom anderen Gerät ergänzt", true);
          Spiegel.planen("daten", Store.data);
          if(!document.getElementById("overlay")) render();
        }
      })
      .catch(e => {
        this.fehler = e.message || String(e);
        console.error(e);
        /* B26: die wartende Meldung ehrlich abschliessen */
        const m = this.meldung; this.meldung = "";
        toast((m ? m+" – " : "")+"nur lokal gespeichert, wird nachgeholt ("+this.fehler+")", true);
        speicherWarnung("cloud", "Nicht in der Cloud gespeichert: "+this.fehler+
          " – Änderungen sind lokal gesichert und werden nachgeholt.");
      })
      .then(() => {
        this.laeuft = false; this.anzeigen();
        if(this.nochmal){ this.nochmal = false; this.anstossen(); }
        else if(!this.fehler && this.meldung){
          const m = this.meldung; this.meldung = "";
          toast(m+" · in der Cloud \u2713", true);
        }
      });
  },

  zusammengefuehrt: 0,

  async listenAbgleichen(t, geaendert, neuMap){
    const feld = SYNC_LISTEN[t.schluessel];
    if(!feld) return 0;
    const js = JSON.stringify;
    const kand = geaendert.filter(g => js(g.neu[feld]||[]) !== js(g.alt[feld]||[]));
    if(!kand.length) return 0;
    const server = await SB.feldLesen(t.tabelle, kand.map(g => g.id), feld);
    let n = 0;
    for (const g of kand){
      if(!server.has(g.id)) continue;            // dort geloescht – wie bisher
      const mein = g.neu[feld] || [];
      const zusammen = listeZusammen(g.alt[feld] || [], mein, server.get(g.id));
      if(js(zusammen) === js(mein)) continue;
      g.neu[feld] = zusammen;
      neuMap.set(g.id, js(g.neu));
      /* Lokal nur uebernehmen, wenn hier waehrenddessen nichts geaendert wurde */
      const rec = (Store.data[t.schluessel]||[]).find(r => r.id === g.id);
      if(rec && js(rec[feld]||[]) === js(mein)) rec[feld] = zusammen;
      n++;
    }
    return n;
  },

  async durchlauf(){
    this.zusammengefuehrt = 0;
    const jetzt = {}, rauf = [], runter = [], felder = [];
    for (const t of SYNC_TABELLEN){
      const neu = this.momentaufnahme(t);
      const alt = this.stand[t.schluessel] || new Map();
      jetzt[t.schluessel] = neu;
      const anlegen = [], geaendert = [];
      for (const [id, json] of neu){
        const a = alt.get(id);
        if(a === json) continue;
        if(a === undefined) anlegen.push(JSON.parse(json));
        else geaendert.push({ id, alt:JSON.parse(a), neu:JSON.parse(json) });
      }
      /* B27: Listenfelder vor dem Senden mit dem Cloud-Stand zusammenfuehren */
      this.zusammengefuehrt += await this.listenAbgleichen(t, geaendert, neu);
      /* B26: Einzelne Aenderungen gehen feldweise raus. Bei Massenaenderungen
         (Import, Branchen-Abgleich, Sammelaktionen) waeren das tausende
         Einzelanfragen – dort weiter ganze Zeilen in Paketen. */
      if(geaendert.length > SYNC_FELD_MAX){
        for (const g of geaendert) anlegen.push(g.neu);
      } else {
        for (const g of geaendert){
          const diff = {};
          for (const k of Object.keys(g.neu))
            if(JSON.stringify(g.neu[k]) !== JSON.stringify(g.alt[k])) diff[k] = g.neu[k];
          if(Object.keys(diff).length) felder.push({ t, id:g.id, diff, ganz:g.neu });
        }
      }
      const weg = [];
      for (const id of alt.keys()) if(!neu.has(id)) weg.push(id);
      rauf.push({ t, zeilen:anlegen });
      runter.unshift({ t, ids:weg });          // umgekehrte Reihenfolge fürs Löschen
    }
    /* Löschen von unten nach oben: Aktivität, Vorgang, Objekt, Firma.
       Anlegen umgekehrt, damit kein Fremdschlüssel ins Leere zeigt.
       Feldaenderungen zuletzt – dann gibt es eine neu angelegte Firma schon,
       wenn ein Vorgang auf sie umgehaengt wird. */
    for (const x of runter) if(x.ids.length)   await SB.loeschen(x.t.tabelle, x.ids);
    for (const x of rauf)   if(x.zeilen.length) await SB.upsert(x.t.tabelle, x.zeilen);
    for (let i = 0; i < felder.length; i += 6)
      await Promise.all(felder.slice(i, i+6).map(p => SB.felderSetzen(p.t.tabelle, p.id, p.diff, p.ganz)));
    this.stand = jetzt;   // erst wenn alles durch ist – sonst geht bei Fehler was verloren
  },

  /* Offene Änderungen zählen, für die Anzeige in den Einstellungen */
  offen(){
    if(!this.stand) return 0;
    let n = 0;
    for (const t of SYNC_TABELLEN){
      const neu = this.momentaufnahme(t), alt = this.stand[t.schluessel] || new Map();
      for (const [id,json] of neu) if(alt.get(id) !== json) n++;
      for (const id of alt.keys()) if(!neu.has(id)) n++;
    }
    return n;
  },

  anzeigen(){
    if(Store.backend.id !== "supabase") return;
    const el = document.getElementById("storeLabel");
    const dot = document.getElementById("storeDot");
    const txt = this.fehler ? "Nicht gespeichert!" : this.laeuft ? "Speichere…" : "Supabase (Cloud)";
    const farbe = this.fehler ? "#E0554A" : this.laeuft ? "#C99A2E" : "#3ECF8E";
    if(el) el.textContent = txt;
    if(dot) dot.style.background = farbe;
  }
};

/* ---------- 2. Stammdaten / Auswahllisten ---------------------- */
const BRANCHEN = ["Medizin","Schule-Kita","Büro","Einzelhandel","Industrie","Bau","Öffentliche Hand","Sonstige"];
const STATUS   = ["Interessent","Kunde","Ehemaliger Kunde","Verloren","Kein Interesse"];
/* Woher der Datensatz stammt. Wird beim Import einmal gesetzt und danach
   nicht mehr angefasst – im Gegensatz zum Status, der sich bewegt. So
   bleiben die vier Ausgangslisten (Bestand, Ehemalige, Altangebote,
   Kaltakquise) dauerhaft auseinanderzuhalten. */
const QUELLEN  = ["Kaltakquise","Bestandskunde","Ehemaliger Kunde","Altangebot",
                  "Empfehlung","Eingehende Anfrage","Google-Suche","Vermietungsmeldung"];
const WEGE     = ["Aktiv","Passiv"];
const HERKUNFT = ["Kaltakquise","Eingehende Anfrage","Empfehlung","Bestandskunde"];
const AKT_TYPEN= ["Anruf","E-Mail","Brief","Besichtigung","Angebot","Notiz"];
/* B28: Gruende fuer verlorene Angebote. „kein Interesse" bleibt fuer die
   Kaltakquise (Erstkontakt), zaehlt aber nicht als verlorenes Angebot. */
const ABSAGEGRUENDE = ["Preis","Mitbewerber","keine Rückmeldung","Leistung / Umfang passte nicht",
  "Projekt verschoben / gestrichen","Referenzen fehlten","Bestandsdienstleister blieb","kein Interesse","anderes"];

/* B28: Die Pipeline verfolgt nur noch Angebote. Kaltakquise-Kontakte
   (Stufen „neu"/„kontaktiert" ohne Anfrage/Angebot) leben bei den Firmen.
   Die Daten-IDs bleiben, damit nichts umgeschrieben werden muss:
   „neu", „kontaktiert" und „besichtigung" stehen bei einem Angebot alle
   in der ersten Spalte „Angebot zu erstellen". */
const STUFEN = [
  { id:"neu",              name:"Angebot zu erstellen" },
  { id:"angebot_versendet",name:"Angebot abgegeben" },
  { id:"nachfass",         name:"Nachfassen" },
  { id:"abschluss",        name:"Auftrag / Absage" }
];
/* Stufen eines Kaltakquise-Kontakts (nur Anzeige im Vorgangsfenster) */
const AKQ_STUFEN = [
  { id:"neu",         name:"Noch nicht gesprochen" },
  { id:"kontaktiert", name:"Im Gespräch" }
];

/* Namen einer Stufe, auch wenn in den Daten noch ein alter Wert steht
   (früher gab es "Angebot erstellt" als eigene Spalte). */
function stufenName(id){
  const s = STUFEN.find(x => x.id === id);
  if(s) return s.name;
  return ({ angebot_erstellt:"Angebot abgegeben", kontaktiert:"Im Gespräch", besichtigung:"Besichtigung" })[id] || "Angebot zu erstellen";
}

/* Kontaktweg beim Import. Telefonieren lohnt nur bei grossen Arbeitgebern -
   dort ist das Ziel, in den Lieferantenkatalog zu kommen, nicht der schnelle
   Abschluss. Alles andere laeuft ueber den Brief. Frueher entschied hier die
   Branche, was zu viele Anrufziele erzeugte: /Werk/ traf auch Wasserwerk,
   Stadtwerke und Handwerk, /träger/ auch Vermoegenstraeger. */
const WEG_AKTIV_SEGMENTE = ["Gro\u00dfarbeitgeber"];
/* Fremde Branchenbezeichnungen auf die eigene Liste übersetzen.
   Reihenfolge zählt: das erste passende Muster gewinnt. */
const BRANCHE_MUSTER = [
  [/klinik|krankenhaus|mvz|arzt|zahn|praxis|pflege|medizin|reha|dialyse|apothek|labor|gesundheit|rettungsdienst|sozialwesen|klinisch/i, "Medizin"],
  [/schule|kita|kinder|hochschul|universit|bildung|erziehung|training/i, "Schule-Kita"],
  [/bau\b|bauunternehm|baustoff|bautechnik|dachsystem|gebäudetechnik|handwerk|architek|installat|elektro|sanitär/i, "Bau"],
  [/verwaltung|behörde|kommun|landkreis|^kreis|^stadt|\bamt\b|öffentlich|polizei|feuerwehr|justiz|flugsicherung/i, "Öffentliche Hand"],
  [/handel|markt|shop|retail|gastro|hotel|restaurant|filiale|discount|vertrieb/i, "Einzelhandel"],
  [/industri|produktion|fertigung|chemie|pharma|logistik|maschinen|werk\b|automobil|automotive|fahrzeug|reifen|lebensmittel|getränke|haushaltsger|energie|versorgung|entsorgung/i, "Industrie"],
  [/\bit\b|software|technolog|beratung|consult|kanzlei|versicher|bank|finanz|dienstleist|büro|agentur|medien|verlag|service|facility|luftverkehr|luftfahrt|prüfung|zertifiz|forschung|organisation/i, "Büro"]
];
function brancheVorschlag(text){
  const t = String(text||"");
  if(!t.trim()) return "";
  for (const [m,b] of BRANCHE_MUSTER) if(m.test(t)) return b;
  return "Sonstige";
}

function wegVorschlag(segment){
  return WEG_AKTIV_SEGMENTE.includes(String(segment||"")) ? "Aktiv" : "Passiv";
}

/* ---------- 2c. Ansprache-Gruppe und Segment -------------------
   Zwei Achsen fuer die Kaltakquise-Wellen:
   GRUPPE bestimmt den Brief-Winkel (Aerzte anders als Kanzleien),
   SEGMENT bestimmt Prioritaet und Kanal (Grossarbeitgeber -> Telefon).
   Beide werden beim Import automatisch gesetzt und sind filterbar. */
const GRUPPEN = [
  "Medizin \u2013 Gro\u00dfpraxen & Zentren",
  "Zahnarztpraxen einzeln",
  "Arztpraxen einzeln",
  "Kanzleien & Beratung",
  "Banken, Finanzen & Versicherung",
  "Industrie, Handel & Logistik",
  "Einzelhandel & Gesch\u00e4fte",
  "\u00d6ffentliche Hand & Verb\u00e4nde",
  "Hotels & Gastgewerbe",
  "Autoh\u00e4user & Kfz",
  "Bildung & Schulen",
  "Immobilien",
  "Konsulate & Botschaften",
  "Allgemeine Dienstleistung / B\u00fcro"
];
const SEGMENTE = ["Gro\u00dfpraxis","Gro\u00dfarbeitgeber","Filiale","\u00d6ffentlich","Privatschule","Konsulat"];

/* Rohe Branchenbezeichnung -> Ansprache-Gruppe. Reihenfolge zaehlt,
   erstes Muster gewinnt. Der Medizin-Block wird per Grosspraxis-Flag
   in drei Toepfe geteilt: grosse Zentren, einzelne Zahnaerzte, Rest. */
function gruppeVorschlag(roh, grosspraxis){
  const t = String(roh||"").toLowerCase();
  const hat = (...kws)=>kws.some(k=>t.indexOf(k)>=0);
  if(hat("botschaft","konsulat")) return "Konsulate & Botschaften";
  if(hat("schule","bildung","kita","kinder","hochschul","universit","akademie","forschungsinstitut"))
    return "Bildung & Schulen";
  if(hat("verwaltung","beh\u00f6rde","rathaus","kommunal","kirche","vereinigung","organisation","gemeinn\u00fctzig","verein","stiftung"))
    return "\u00d6ffentliche Hand & Verb\u00e4nde";
  if(hat("arzt","zahn","therapiezentrum","gesundheit","radiolog","dialyse","reha","klinik","mvz","poliklinik","medizin","dental","apotheke","praxis","ambulant","physio","labor","tiermedizin")){
    if(grosspraxis) return "Medizin \u2013 Gro\u00dfpraxen & Zentren";
    if(hat("zahn","dental")) return "Zahnarztpraxen einzeln";
    return "Arztpraxen einzeln";
  }
  if(hat("rechtsanwalt","anwalt","kanzlei","berater","beratung","wirtschaftspr\u00fcf","steuerberat","notar"))
    return "Kanzleien & Beratung";
  if(hat("bank","finanz","versicher","sparkasse","verm\u00f6gens")) return "Banken, Finanzen & Versicherung";
  if(hat("hotel","gastst","restaurant","reiseb\u00fcro","pension","gastro")) return "Hotels & Gastgewerbe";
  if(hat("autoh\u00e4ndler","autowerkstatt","kfz","auto","werkstatt")) return "Autoh\u00e4user & Kfz";
  if(hat("gesch\u00e4ft","bekleidung","m\u00f6bel","supermarkt","baumarkt","elektrofach","lebensmittel","laden","einzelhandel","markt"))
    return "Einzelhandel & Gesch\u00e4fte";
  if(hat("hersteller","grossh\u00e4ndler","gro\u00dfh\u00e4ndler","baustoff","generalunternehmer","lager","transport","versand","logistik","produktion","industrie","spedition","handel"))
    return "Industrie, Handel & Logistik";
  if(hat("immobilien","hausverwaltung","makler")) return "Immobilien";
  return "Allgemeine Dienstleistung / B\u00fcro";
}

/* Segment aus den Flag-Spalten der Kaltakquise-Liste ableiten.
   Prioritaet: erstes zutreffende gewinnt, damit jede Firma genau
   ein Segment traegt. H = Kopf-Index-Map, zeile = Rohzeile. */
function segmentAusFlags(zeile, H){
  const j = n => { const i=H[n]; return i!==undefined && /ja/i.test(String(zeile[i]==null?"":zeile[i])); };
  if(j("KONSULAT"))         return "Konsulat";
  if(j("OEFFENTLICH"))      return "\u00d6ffentlich";
  if(j("GROSSARBEITGEBER")) return "Gro\u00dfarbeitgeber";
  if(j("PRIVATSCHULE"))     return "Privatschule";
  if(j("GROSSPRAXIS"))      return "Gro\u00dfpraxis";
  if(j("FILIALE"))          return "Filiale";
  return "";
}

/* ---------- 3. Hilfsfunktionen -------------------------------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const $  = (s,r) => (r||document).querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const heute = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
function ISO(d){ const x=new Date(d); return isNaN(x)?"":x.toISOString().slice(0,10); }
function plusTage(n, ab){ const d = ab?new Date(ab):heute(); d.setDate(d.getDate()+n); return ISO(d); }

/* Einzige Quelle fuer die Nachfassfrist eines Vorgangs. Reihenfolge:
   Wert am Vorgang, sonst Vorlage, sonst 10 Kalendertage. Alle Stellen,
   die eine Wiedervorlage zum Angebot setzen, fragen hier. */
function nachfassFrist(v){
  let t = Number((v||{}).nachfassTage);
  if(!t && typeof Vorlagen!=="undefined") t = Number(Vorlagen.aktuell().nachfassTage);
  return Math.min(90, Math.max(1, t || 14));
}
function plusMonate(n, ab){ const d = ab?new Date(ab):heute(); d.setMonth(d.getMonth()+n); return ISO(d); }
function fmtDatum(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"});
}
function tageBis(iso){
  if(!iso) return null;
  const d=new Date(iso); if(isNaN(d)) return null;
  d.setHours(0,0,0,0);
  return Math.round((d - heute())/86400000);
}
/* Wie es um die Angebotsfrist steht. Solange das Angebot nicht raus ist,
   wird rot angezeigt – das ist der Termin, der wirklich weh tut. */
function fristInfo(v){
  if(!v || !v.frist) return null;
  const t = tageBis(v.frist);
  if(t===null) return null;
  const d = fmtDatum(v.frist);
  if(v.angebotAm) return { cls:"ok",   tage:t, text:"Abgabe war "+d+" · Angebot ist raus", kurz:"Angebot raus" };
  if(v.ergebnis)  return { cls:"",     tage:t, text:"Abgabe war "+d, kurz:"Abgabe "+d };
  if(t < 0)  return { cls:"crit", tage:t, text:"Abgabe war "+d+" · "+Math.abs(t)+(Math.abs(t)===1?" Tag":" Tage")+" überfällig",
                      kurz:"Abgabe "+Math.abs(t)+(Math.abs(t)===1?" Tag":" Tage")+" überfällig" };
  if(t === 0) return { cls:"crit", tage:t, text:"Angebotsabgabe HEUTE ("+d+")", kurz:"Abgabe heute!" };
  if(t === 1) return { cls:"crit", tage:t, text:"Angebotsabgabe morgen ("+d+") · noch 1 Tag", kurz:"Abgabe morgen" };
  return { cls: t<=7 ? "crit" : "warn", tage:t,
           text:"Angebotsabgabe "+d+" · noch "+t+" Tage", kurz:"Abgabe in "+t+" Tagen" };
}

function relativ(iso){
  const t = tageBis(iso);
  if(t===null) return "";
  if(t===0) return "heute";
  if(t===1) return "morgen";
  if(t===-1) return "1 Tag überfällig";
  if(t<0) return Math.abs(t)+" Tage überfällig";
  return "in "+t+" Tagen";
}

/* B17: Hinweise der Termin-Automatik werden an die naechste Meldung
   angehaengt bzw. allein angezeigt, wenn keine folgt. */
let AutoMeldung = "";
function toast(text, roh){
  if(AutoMeldung){
    text = text ? text+" · "+AutoMeldung : AutoMeldung;
    AutoMeldung = "";
  }
  if(!text) return;
  /* B26: Laeuft gerade die Uebertragung in die Cloud, heisst „Gespeichert“
     erst einmal nur „auf diesem Geraet“. Die Bestaetigung (oder der Fehler)
     kommt, sobald die Cloud geantwortet hat. */
  if(!roh && typeof Sync !== "undefined" && Store.backend.id === "supabase" && Sync.laeuft){
    Sync.meldung = text;
    text = text+" · wird übertragen …";
  }
  const host=$("#toastHost");
  if(!host) return;
  host.innerHTML = '<div class="toast">'+esc(text)+"</div>";
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>host.innerHTML="", 2800);
}

function optionen(liste, gewaehlt, leerText){
  let h = leerText ? '<option value="">'+esc(leerText)+"</option>" : "";
  for (const o of liste){
    const v = typeof o==="string" ? o : o.id;
    const n = typeof o==="string" ? o : o.name;
    h += '<option value="'+esc(v)+'"'+(v===gewaehlt?" selected":"")+">"+esc(n)+"</option>";
  }
  return h;
}

/* Kompletten Datenstand aus Supabase holen, ohne ihn schon einzusetzen */
async function sbHolen(){
  let anhFehler = "";
  const [F,O,V,A,N] = await Promise.all([
    SB.alle("aqt_firmen"), SB.alle("aqt_objekte"),
    SB.alle("aqt_vorgaenge"), SB.alle("aqt_aktivitaeten"),
    /* B26: Klemmt nur die Anhang-Tabelle, laeuft der Rest weiter – aber
       nicht mehr still: es erscheint ein Hinweis mit „neu laden“. */
    SB.alle("aqt_anhaenge").catch(e => { anhFehler = e.message || String(e); console.warn("aqt_anhaenge:", anhFehler); return []; })
  ]);
  return {
    firmen: F.map(sbFirmaZuApp), objekte: O.map(sbObjektZuApp),
    vorgaenge: V.map(sbVorgangZuApp), aktivitaeten: A.map(sbAktZuApp),
    anhaenge: N.map(sbAnhangZuApp), anhFehler
  };
}

/* Kompletten Datenstand aus Supabase laden */
async function sbLaden(){
  ladeToast("Daten werden geladen…");
  try{
    const d = await sbHolen();
    Store.data.firmen       = d.firmen;
    Store.data.objekte      = d.objekte;
    Store.data.vorgaenge    = d.vorgaenge;
    Store.data.aktivitaeten = d.aktivitaeten;
    Store.data.anhaenge     = d.anhaenge;
    anhWarnung(d.anhFehler);
    Nachladen.zuletzt = Date.now();
  } finally { ladeToastWeg(); }
}

function anhWarnung(fehler){
  speicherWarnung("anh", fehler
    ? "Anhänge konnten nicht geladen werden ("+fehler+"). Die Dateien sind nicht weg – nur gerade nicht abrufbar."
    : "");
}

/* Nur die Anhaenge nachladen. Was hier schon angehaengt, aber noch nicht
   uebertragen ist, bleibt erhalten. */
async function anhNeuLaden(){
  if(!Auth.eingeloggt()) return;
  try{
    const N = (await SB.alle("aqt_anhaenge")).map(sbAnhangZuApp);
    const da = new Set(N.map(a => a.id));
    const lokal = (Store.data.anhaenge||[]).filter(a => !da.has(a.id));
    Store.data.anhaenge = N.concat(lokal);
    if(Sync.stand){
      const t = SYNC_TABELLEN.find(x => x.schluessel === "anhaenge");
      const m = new Map();
      for (const a of N) m.set(a.id, JSON.stringify(t.zuSb(a)));
      Sync.stand.anhaenge = m;
    }
    anhWarnung("");
    render();
    toast(N.length+" Anhänge geladen", true);
    if(lokal.length) Sync.anstossen();
  }catch(e){
    anhWarnung(e.message || String(e));
  }
}

/* ---------- B26: Nachladen nach einer Pause --------------------
   Was ein anderes Geraet geaendert hat, kam bisher erst beim naechsten
   Login an. Jetzt holt AQT den Stand nach, wenn man nach mindestens
   10 Minuten ins Fenster zurueckkommt – aber nur, wenn hier gerade nichts
   offen ist: kein Dialog, keine unuebertragene Aenderung. Wird waehrend
   des Ladens etwas gespeichert, wird das Geladene verworfen.
------------------------------------------------------------------- */
const Nachladen = {
  NACH: 10*60*1000, zuletzt: 0, laeuft: false,
  bereit(){
    return Auth.eingeloggt() && Store.backend.id === "supabase" && !this.laeuft &&
      Date.now() - this.zuletzt >= this.NACH &&
      !document.getElementById("overlay") && !Sync.laeuft && !Sync.fehler && Sync.offen() === 0;
  },
  async pruefen(){
    if(!this.bereit()) return false;
    this.laeuft = true;
    const vorher = Store.saveZaehler;
    try{
      const d = await sbHolen();
      if(Store.saveZaehler !== vorher || document.getElementById("overlay") || Sync.laeuft) return false;
      Store.data.firmen       = d.firmen;
      Store.data.objekte      = d.objekte;
      Store.data.vorgaenge    = d.vorgaenge;
      Store.data.aktivitaeten = d.aktivitaeten;
      if(!d.anhFehler) Store.data.anhaenge = d.anhaenge;
      anhWarnung(d.anhFehler);
      Sync.grundstellung();
      Spiegel.planen("daten", Store.data);
      this.zuletzt = Date.now();
      render();
      toast("Stand aus der Cloud aktualisiert", true);
      return true;
    }catch(e){ console.warn("Nachladen:", e); return false; }
    finally{ this.laeuft = false; }
  }
};
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") Nachladen.pruefen();
});
window.addEventListener("focus", () => Nachladen.pruefen());

  firma:  id => Store.data.firmen.find(f=>f.id===id),
  objekt: id => Store.data.objekte.find(o=>o.id===id),
  vorgang:id => Store.data.vorgaenge.find(v=>v.id===id),

  vorgaengeVon: fid => Store.data.vorgaenge.filter(v=>v.firmaId===fid),
  aktivitaetenVon: vid => Store.data.aktivitaeten.filter(a=>a.vorgangId===vid)
      .sort((a,b)=> (b.datum||"").localeCompare(a.datum||"") || (b.angelegt||"").localeCompare(a.angelegt||"")),

  anhang: id => (Store.data.anhaenge||[]).find(a=>a.id===id),

/* Wiedervorlagen: mehrere pro Vorgang möglich (z.B. 90-Tage-Check
   und Empfehlung nach Gewinn). Die nächste offene bestimmt die Farbe. */
function wvSetzen(v, datum, anlass){
  v.wiedervorlagen.push({ id:uid(), datum, anlass, erledigt:false });
}
function wvNaechste(v){
  const offen = (v.wiedervorlagen||[]).filter(w=>!w.erledigt && w.datum);
  if(!offen.length) return null;
  return offen.sort((a,b)=>a.datum.localeCompare(b.datum))[0];
}
/* B17: Abgeschlossene Vorgaenge haben eigene Termine (90-Tage-Check,
   Empfehlung, Reaktivierung). Sie erscheinen in den Fällig-Listen erst
   ab 3 Tagen vor dem Termin. */
const ABSCHLUSS_ANLAESSE = ["90-Tage-Check nach Vertragsstart", "Empfehlung erfragen", "Nach Absage wieder ansprechen"];
function inFaelligListe(v){
  const w = wvNaechste(v); if(!w) return false;
  if(!v.ergebnis) return true;
  const t = tageBis(w.datum);
  return t !== null && t <= 3;
}
/* Beim Abschluss: alles Offene abhaken (Nachfassen etc. ist erledigt) */
function abschlussWvAbhaken(v){
  for (const x of (v.wiedervorlagen||[])) if(!x.erledigt) x.erledigt = true;
}
/* Beim Wieder-Öffnen: nur die Abschluss-Termine abhaken */
function abschlussTermineAbhaken(v){
  for (const x of (v.wiedervorlagen||[]))
    if(!x.erledigt && ABSCHLUSS_ANLAESSE.indexOf(x.anlass) >= 0) x.erledigt = true;
}
/* Einmalig pro Browser: bei bereits abgeschlossenen Vorgaengen alte,
   überfällige Nachfass-Termine abhaken, damit sie nicht in „Fällig“ landen */
function abschlussAltlasten(){
  try{ if(localStorage.getItem("aqt.b17wv")) return 0; }catch(_){ return 0; }
  let n = 0;
  for (const v of Store.data.vorgaenge){
    if(!v.ergebnis) continue;
    for (const x of (v.wiedervorlagen||[])){
      if(x.erledigt || ABSCHLUSS_ANLAESSE.indexOf(x.anlass) >= 0) continue;
      const t = tageBis(x.datum);
      if(t !== null && t < 0){ x.erledigt = true; n++; }
    }
  }
  if(n) Store.save();
  try{ localStorage.setItem("aqt.b17wv", "1"); }catch(_){}
  return n;
}
/* B37 einmalig: offene Angebote mit Angebotsdatum, an denen noch
   „Anfrage bearbeiten“ haengt – das ist mit dem Angebot erledigt */
function anfrageWvAltlasten(){
  try{ if(localStorage.getItem("aqt.b37anfrwv")) return 0; }catch(_){ return 0; }
  let n = 0;
  for (const v of Store.data.vorgaenge){
    if(v.ergebnis || !v.angebotAm) continue;
    for (const x of (v.wiedervorlagen||[]))
      if(!x.erledigt && (x.anlass||"").indexOf("Anfrage bearbeiten") === 0){ x.erledigt = true; n++; }
  }
  if(n) Store.save();
  try{ localStorage.setItem("aqt.b37anfrwv", "1"); }catch(_){}
  return n;
}
function dringlichkeit(v){
  if(v.ergebnis){
    const wa = wvNaechste(v), ta = wa ? tageBis(wa.datum) : null;
    if(ta !== null && ta < 0) return "crit";
    if(ta !== null && ta <= 3) return "warn";
    return v.ergebnis==="gewonnen" ? "ok" : "";
  }
  const w = wvNaechste(v); if(!w) return "";
  const t = tageBis(w.datum);
  if(t===null) return "";
  if(t < 0) return "crit";
  if(t <= 3) return "warn";
  return "";
}
function faelligeVorgaenge(){
  return Store.data.vorgaenge
    .map(v => ({ v, w:wvNaechste(v) }))
    .filter(x => x.w && tageBis(x.w.datum) <= 3)
    .sort((a,b)=> a.w.datum.localeCompare(b.w.datum));
}

/* Die Datenbankzeile eines Anhangs verschwindet über den Abgleich von
   selbst. Die Datei im Speicher muss eigens weggeräumt werden – wenn das
   schiefgeht, bleibt sie liegen, aber es geht nichts kaputt. */
function anhangDateienWeg(anhaenge){
  if(!anhaenge || !anhaenge.length || !Auth.eingeloggt()) return;
  for (const a of anhaenge){
    if(!a.pfad) continue;
    try{ SB.dateiWeg(a.pfad).catch(e => console.warn("Datei blieb liegen:", a.pfad, e.message||e)); }
    catch(e){ console.warn(e); }
  }
}

/* Vorgang löschen räumt seine Aktivitäten und Anhänge mit weg.
   B37: alles geht vorher in den Papierkorb (Rueckgabe = Eintrag), die
   Anhang-Dateien bleiben bis zum endgueltigen Leeren in der Ablage. */
function vorgangLoeschen(id){
  const v = DB.vorgang(id); let pk = null;
  if(v) pk = Papierkorb.ablegen("vorgang", "Vorgang „"+(v.titel||"Ohne Titel")+"“ – "+DB.firmaName(v.firmaId), {
    vorgaenge:[v], aktivitaeten:Store.data.aktivitaeten.filter(a=>a.vorgangId===id),
    anhaenge:(Store.data.anhaenge||[]).filter(a=>a.vorgangId===id) });
  Store.data.vorgaenge = Store.data.vorgaenge.filter(v=>v.id!==id);
  Store.data.aktivitaeten = Store.data.aktivitaeten.filter(a=>a.vorgangId!==id);
  Store.data.anhaenge = (Store.data.anhaenge||[]).filter(a=>a.vorgangId!==id);
  return pk;
}
/* Kompletten Datenstand als Datei ablegen. Laeuft auch automatisch, bevor
   im Stapel geloescht wird - dann liegt immer ein Stand von vorher bereit. */
function sicherungHerunterladen(zusatz){
  const blob = new Blob([JSON.stringify(Store.data,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "aqt-sicherung-"+ISO(new Date())+(zusatz?"-"+zusatz:"")+".json";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- Branchen-Abgleich (B20) ------------------------------
   Die Liste kommt aus der Branchenpruefung (Excel) und traegt die AQT-ID,
   also die Firmen-ID im Tool. Es wird deshalb NICHTS importiert und nichts
   angelegt: jede Zeile sucht ihre Firma per ID und setzt nur Haupt-/
   Unterkategorie sowie daraus abgeleitet Branche und Gruppe. Status,
   Quelle, Notizen, Vorgaenge bleiben unberuehrt. So kann keine Dublette
   entstehen. */
const HAUPT_KATEGORIEN = [
  "Medizin & Gesundheit","Kanzleien & Beratung","Sonstige eindeutig erkennbare Dienstleistungen",
  "Industrie & Logistik","Einzelhandel","Handwerk & Bau","Immobilien & Hausverwaltung",
  "\u00d6ffentliche & Gemeinn\u00fctzige Einrichtungen","Bildung & Betreuung","Gastronomie & Hotellerie","Ungekl\u00e4rt"
];
const HAUPT_ZU_BRANCHE = {
  "Medizin & Gesundheit":"Medizin",
  "Bildung & Betreuung":"Schule-Kita",
  "Handwerk & Bau":"Bau",
  "\u00d6ffentliche & Gemeinn\u00fctzige Einrichtungen":"\u00d6ffentliche Hand",
  "Einzelhandel":"Einzelhandel",
  "Gastronomie & Hotellerie":"Einzelhandel",
  "Industrie & Logistik":"Industrie",
  "Kanzleien & Beratung":"B\u00fcro",
  "Immobilien & Hausverwaltung":"B\u00fcro",
  "Sonstige eindeutig erkennbare Dienstleistungen":"B\u00fcro"
};
/* Hauptkategorie -> Ansprache-Gruppe. Fuer Handwerk & Bau gibt es keinen
   eigenen Topf, dort geht der allgemeine Gebaeudereiniger-Brief raus. */
function hauptZuGruppe(f, haupt, unter){
  const u = String(unter||"").toLowerCase();
  switch(haupt){
    case "Medizin & Gesundheit":
      if(f.segment==="Gro\u00dfpraxis") return "Medizin \u2013 Gro\u00dfpraxen & Zentren";
      return /zahn|dental/.test(u) ? "Zahnarztpraxen einzeln" : "Arztpraxen einzeln";
    case "Kanzleien & Beratung": return "Kanzleien & Beratung";
    case "Sonstige eindeutig erkennbare Dienstleistungen":
      return /bank|finanz|versicher/.test(u) ? "Banken, Finanzen & Versicherung" : "Allgemeine Dienstleistung / B\u00fcro";
    case "Industrie & Logistik": return "Industrie, Handel & Logistik";
    case "Einzelhandel": return /auto|fahrzeug|kfz/.test(u) ? "Autoh\u00e4user & Kfz" : "Einzelhandel & Gesch\u00e4fte";
    case "\u00d6ffentliche & Gemeinn\u00fctzige Einrichtungen": return "\u00d6ffentliche Hand & Verb\u00e4nde";
    case "Gastronomie & Hotellerie": return "Hotels & Gastgewerbe";
    case "Bildung & Betreuung": return "Bildung & Schulen";
    case "Immobilien & Hausverwaltung": return "Immobilien";
    default: return "Allgemeine Dienstleistung / B\u00fcro";
  }
}

const Abgleich = { plan:null };

function abgleichBerechnen(zeilen){
  const kopf = zeilen[0].map(s=>String(s==null?"":s).trim().toUpperCase());
  const ix = n => kopf.indexOf(n.toUpperCase());
  const iId=ix("AQT-ID"), iH=ix("Hauptkategorie"), iU=ix("Unterkategorie"), iS=ix("Zuordnungssicherheit");
  if(iId<0 || iH<0) return { fehler:"In der Datei fehlen die Spalten AQT-ID und Hauptkategorie." };
  const zell = (z,i) => i<0 ? "" : String(z[i]==null?"":z[i]).trim();

  const p = { aenderungen:[], gefunden:0, unveraendert:0, nichtGefunden:0, unbekannt:0,
              brancheNeu:0, gruppeNeu:0, kunden:0, ungeklaert:0, nachHaupt:{}, doppelt:0 };
  const gesehen = new Set();
  for (const z of zeilen.slice(1)){
    const id = zell(z,iId); if(!id) continue;
    if(gesehen.has(id)){ p.doppelt++; continue; }
    gesehen.add(id);
    const f = DB.firma(id);
    if(!f){ p.nichtGefunden++; continue; }
    const haupt = zell(z,iH);
    if(!HAUPT_KATEGORIEN.includes(haupt)){ p.unbekannt++; continue; }
    p.gefunden++;
    p.nachHaupt[haupt] = (p.nachHaupt[haupt]||0)+1;

    const unter = haupt==="Ungekl\u00e4rt" ? "" : zell(z,iU);
    const sicher = zell(z,iS).toLowerCase();
    const geschuetzt = f.segment==="Konsulat" || f.segment==="Gro\u00dfpraxis" || f.gruppe==="Konsulate & Botschaften";
    let branche = f.branche||"", gruppe = f.gruppe||"";
    if(haupt==="Ungekl\u00e4rt"){
      if(!gruppe) gruppe = "Allgemeine Dienstleistung / B\u00fcro";
    } else if(!geschuetzt){
      const sicherGenug = sicher==="hoch" || sicher==="mittel";
      if(sicherGenug || !branche) branche = HAUPT_ZU_BRANCHE[haupt];
      if(sicherGenug || !gruppe)  gruppe  = hauptZuGruppe(f, haupt, unter);
    }
    const neu = { hauptkategorie:haupt, unterkategorie:unter, branche, gruppe };
    const alt = { hauptkategorie:f.hauptkategorie||"", unterkategorie:f.unterkategorie||"",
                  branche:f.branche||"", gruppe:f.gruppe||"" };
    if(neu.hauptkategorie===alt.hauptkategorie && neu.unterkategorie===alt.unterkategorie &&
       neu.branche===alt.branche && neu.gruppe===alt.gruppe){ p.unveraendert++; continue; }
    if(neu.branche!==alt.branche) p.brancheNeu++;
    if(neu.gruppe!==alt.gruppe) p.gruppeNeu++;
    if(f.status==="Kunde" || f.status==="Ehemaliger Kunde") p.kunden++;
    if(haupt==="Ungekl\u00e4rt") p.ungeklaert++;
    p.aenderungen.push({ f, neu });
  }
  p.imToolNichtInDatei = Store.data.firmen.filter(f=>!f.entwurf && !gesehen.has(f.id)).length;
  return p;
}
