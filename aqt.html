function vorgangFelderLesen(v){
  const altStufe = v.stufe, altFrist = v.frist, altAngebot = v.angebotAm;
  const g = s => { const el=$(s); return el?el.value:undefined; };
  const set = (k,s) => { const x=g(s); if(x!==undefined) v[k]=x; };
  set("titel","#vTitel"); set("stufe","#vStufe"); set("firmaId","#vFirma");
  set("objektId","#vObjekt"); set("kontaktweg","#vWeg"); set("herkunft","#vHerkunft");
  set("vertragsendeWettbewerb","#vVertragsende"); set("notiz","#vNotiz");
  set("anfrageAm","#vAnfrageAm"); set("frist","#vFrist"); set("angebotAm","#vAngebotAm");
  const nt = g("#vNachfassTage");
  if(nt!==undefined) v.nachfassTage = Math.min(90, Math.max(1, Number(nt)||10));
  /* B17: Automatik hier statt nur beim Speichern – egal, welcher Knopf
     die Felder zuerst uebernimmt, die Erinnerungen werden angelegt. */
  const m = [stufenAutomatik(v, altStufe), terminAutomatik(v, altFrist, altAngebot)].filter(Boolean).join(" · ");
  if(m){
    AutoMeldung = AutoMeldung ? AutoMeldung+" · "+m : m;
    setTimeout(() => { if(AutoMeldung) toast(""); }, 60);
  }
  return m;
}

/* ---------- 7d. Termine und Nachfass-Automatik -----------------
   Ein Abgabetermin ohne Erinnerung ist wertlos. Deshalb setzt das Tool
   die Wiedervorlagen selbst: 3 Tage vor der Frist ans Angebot denken,
   nach der Abgabe im eingestellten Abstand ans Nachfassen.
------------------------------------------------------------------- */
function nachfassFaellig(v){
  if(!v.angebotAm) return "";
  const tage = nachfassFrist(v);
  const stufe = Number(v.nachfassStufe)||0;
  if(stufe >= 3) return "";
  const ab = stufe ? (v.nachfassLetzte || v.angebotAm) : v.angebotAm;
  return plusTage(tage, ab);
}

function terminAutomatik(v, altFrist, altAngebot){
  const meldungen = [];
  if(v.frist && v.frist !== altFrist && !v.ergebnis && !v.angebotAm){
    const anlass = "Angebot vor Frist "+fmtDatum(v.frist)+" abgeben";
    const schon = (v.wiedervorlagen||[]).some(x => !x.erledigt && x.anlass === anlass);
    if(!schon){
      let tag = plusTage(-3, v.frist);
      if(tageBis(tag) < 0) tag = ISO(new Date());
      wvSetzen(v, tag, anlass);
      meldungen.push("Wiedervorlage 3 Tage vor der Frist");
    }
  }
  if(v.angebotAm && v.angebotAm !== altAngebot && !v.ergebnis){
    const i    = STUFEN.findIndex(s => s.id === v.stufe);
    const ziel = STUFEN.findIndex(s => s.id === "angebot_versendet");
    if(i > -1 && i < ziel) v.stufe = "angebot_versendet";
    /* offene Frist-Erinnerungen abhaken, das Angebot ist ja raus */
    for (const x of (v.wiedervorlagen||[]))
      if(!x.erledigt && (x.anlass||"").indexOf("Angebot vor Frist") === 0) x.erledigt = true;
    const tage = nachfassFrist(v);
    const offen = (v.wiedervorlagen||[]).some(x => !x.erledigt && (x.anlass||"").indexOf("Nachfassen") === 0);
    if(!offen){
      wvSetzen(v, plusTage(tage, v.angebotAm), "Nachfassen zum Angebot (Stufe 1)");
      meldungen.push("Nachfassen in "+tage+" Tagen vorgemerkt");
    }
  }
  return meldungen.join(" · ");
}

/* Fristen bei alten Vorgängen aus der Notiz nachtragen, damit die
   Anzeige auch bei allem greift, was vor diesem Umbau angelegt wurde. */
function fristenNachtragen(){
  let n = 0;
  for (const v of Store.data.vorgaenge){
    if(!v.frist){
      const m = (v.notiz||"").match(/Angebotsfrist:\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
      if(m){
        const jahr = m[3].length===2 ? "20"+m[3] : m[3];
        v.frist = jahr+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
        n++;
      }
    }
    if(!v.anfrageAm && v.herkunft === "Eingehende Anfrage"){
      const mails = DB.aktivitaetenVon(v.id).filter(a => a.typ === "E-Mail");
      const erste = mails.length ? mails[mails.length-1] : null;
      const tag = (erste && erste.datum) || (v.angelegt ? ISO(v.angelegt) : "");
      if(tag){ v.anfrageAm = tag; n++; }
    }
    if(!v.nachfassTage) v.nachfassTage = 7;
    /* Die frühere Spalte "Angebot erstellt" gibt es nicht mehr */
    if(v.stufe === "angebot_erstellt"){ v.stufe = "angebot_versendet"; n++; }
  }
  if(n) Store.save();
  return n;
}

/* ---------- 7e. Nachfass-Mails in drei Stufen -------------------
   Der Text steht fertig da, wird aber nie automatisch verschickt –
   Romano liest gegen und schickt aus Outlook raus.
------------------------------------------------------------------- */
/* Im Feld Ansprechpartner steht nicht immer ein Mensch. Aus
   E-Mail-Anfragen landet dort auch "BV Frankfurt, Hain - Preisanfrage
   Bauendreinigung". So etwas darf nie in eine Anrede rutschen. */
const KEIN_NAME = /\d|@|https?:|\bbv\b|bauvorhaben|bauleitung|bauherr|gmbh|\bmbh|\bkg\b|\bag\b|\bohg\b|\be\.?\s?v\.?\b|anfrage|angebot|ausschreibung|vergabe|einreichung|reinigung|objekt|projekt|liegenschaft|str\.|stra(ss|\u00df)e|\bweg\b|\bplatz\b|leitung|einkauf|verwaltung|gesch\u00e4ftsf\u00fchr|sekretariat|hausmeister|facility|zentrale|empfang|abteilung|technik|personal|buchhalt|\binfo\b|\bteam\b|anlage|allee|chaussee|gerichtsstand|erf\u00fcllungsort|referent|informationen|disclaimer|copyright|impressum|\u00f6ffnungszeit|gesetzlich|rechtlich|prokurist|gesellschafter|\bz\.?\s?h(d|dn)?\.?/i;

/* Sieht der Eintrag nach einem Personennamen aus? Lieber einmal zu
   streng: eine neutrale Anrede ist besser als eine peinliche. */
function istPersonenname(s){
  const t = String(s||"").trim();
  if(!t || t.length > 40) return false;
  if(KEIN_NAME.test(t)) return false;
  const w = t.split(/\s+/);
  if(w.length < 2 || w.length > 4) return false;
  return w.every(x => /^[A-Z\u00c4\u00d6\u00dc][A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df.\-']*$/.test(x));
}

/* "Frau Dr. Weber, Einkauf" -> "Frau Dr. Weber". Nichts Brauchbares -> "" */
function personKurz(ap){
  const s = String(ap||"").split(",")[0].trim().replace(/\s+/g," ");
  const m = s.match(/\b(Frau|Herrn?)\s+(.+)$/i);
  if(m && !KEIN_NAME.test(m[2])) return (/^f/i.test(m[1]) ? "Frau " : "Herr ")+m[2].trim();
  return istPersonenname(s) ? s : "";
}

function nachfassAnrede(ansprechpartner){
  const s = String(ansprechpartner||"").split(",")[0].trim();
  const m = s.match(/\b(Frau|Herrn?)\s+(.+)$/i);
  if(m && !KEIN_NAME.test(m[2]))
    return (/^f/i.test(m[1]) ? "Sehr geehrte Frau " : "Sehr geehrter Herr ")+m[2].trim()+",";
  if(istPersonenname(s)) return "Guten Tag, "+s+",";
  return "Sehr geehrte Damen und Herren,";
}

/* Objektnamen aus dem Mail-Import schleppen die ganze Betreffzeile mit:
   "Frankfurt, Hain - Preisanfrage Bauendreinigung". In einem Satz liest
   sich das furchtbar, also den Vorgangsteil abschneiden. */
const VORGANGSWORT = /anfrage|angebot|ausschreibung|vergabe|einreichung|preis|reinigung|frist|\blos\s?\d|leistungsverzeichnis|\blv\b/i;

function bezeichnungKuerzen(s){
  let t = String(s||"").trim().replace(/\s+/g," ");
  if(!t) return "";
  const teile = t.split(/\s+[-\u2013\u2014]\s+|_/);
  if(teile.length > 1){
    const kern = teile[0].trim();
    const rest = teile.slice(1).join(" ");
    if(kern.length >= 3 && VORGANGSWORT.test(rest)) t = kern;
  }
  return t.replace(/[,;.\s\-\u2013]+$/, "").trim();
}

/* Wie das Objekt in Betreff und Text genannt wird */
function objektText(v){
  const o = v.objektId ? DB.objekt(v.objektId) : null;
  if(o){
    const name = bezeichnungKuerzen(o.name);
    const adr  = [o.strasse, o.ort].filter(Boolean).join(", ");
    if(name) return name;
    if(adr)  return adr;
  }
  return bezeichnungKuerzen(v.titel) || "Ihr Objekt";
}

function nachfassGruss(){
  return "Mit freundlichen Grüßen\n"+sprecherName()+"\n\n"+
    "A.C.S. All Clean Services KG\nGebäudereinigung Rhein-Main";
}

/* ---------- 7f. E-Mail-Vorlagen --------------------------------
   Die Texte stehen als normaler Text mit Platzhaltern in geschweiften
   Klammern da. Geändert wird das unter Einstellungen, nicht im Code.
   Gespeichert wird in Supabase, damit die Texte auf jedem Gerät und bei
   allen drei Nutzern gleich sind; zusätzlich im Browser, falls die
   Tabelle noch nicht angelegt ist oder gerade keine Verbindung besteht.
------------------------------------------------------------------- */
const VORLAGE_PLATZHALTER = [
  ["{anrede}",         "Sehr geehrte Frau Weber, / Guten Tag, Herr Klein,"],
  ["{firma}",          "Name der Firma"],
  ["{ansprechpartner}","Ansprechpartner der Firma"],
  ["{objekt}",         "Objekt, sonst der Titel des Vorgangs"],

const VORLAGEN_SCHLUESSEL = "nachfass_vorlagen";

/* Fingerabdruck der Vorlagen: greift die Felder in fester Reihenfolge ab.
   Nötig, weil Supabase den jsonb-Wert normalisiert und die Feldnamen dabei
   umsortiert – ein direkter Textvergleich der beiden JSON-Fassungen meldet
   sonst einen Unterschied, obwohl inhaltlich alles gleich ist. */
function vorlagenSignatur(d){
  d = d || {};
  const s = Array.isArray(d.stufen) ? d.stufen : [];
  const teile = [ String(d.ich||"").trim(), String(Number(d.nachfassTage)||10) ];
  for(let i=0;i<3;i++){
    const x = s[i] || {};
    teile.push(String(x.kurz||""), String(x.name||""), String(x.betreff||""), String(x.text||""));
  }
  return teile.join("\u0001");
}

const Vorlagen = {
  daten: null,

  /* Tiefe Kopie des Standards, damit Bearbeiten nichts kaputt macht */
  standard(){ return JSON.parse(JSON.stringify(VORLAGEN_STANDARD)); },

  aktuell(){
    if(!this.daten) this.daten = this.ausBrowser() || this.standard();
    return this.daten;
  },

  stufe(i){
    const d = this.aktuell();
    return (d.stufen && d.stufen[i]) || this.standard().stufen[i];
  },

  ausBrowser(){
    try{
      const roh = localStorage.getItem("aqt_vorlagen");
      if(!roh) return null;
      const d = JSON.parse(roh);
      return (d && Array.isArray(d.stufen) && d.stufen.length===3) ? d : null;
    }catch(e){ return null; }
  },

  inBrowser(){
    try{ localStorage.setItem("aqt_vorlagen", JSON.stringify(this.aktuell())); }catch(e){}
  },

  /* Beim Start aus Supabase holen. Fehlt die Tabelle, bleibt der
     Browser-Stand bzw. der Standard stehen – die App läuft weiter. */
  async laden(){
    this.daten = this.ausBrowser() || this.standard();
    if(!Auth.eingeloggt()) return;
    try{
      const alle = await SB.einstellungenLaden();
      const d = alle[VORLAGEN_SCHLUESSEL];
      if(d && Array.isArray(d.stufen) && d.stufen.length===3){
        this.daten = d;
        this.inBrowser();
      }
    }catch(e){ console.warn("Vorlagen nicht geladen:", e.message||e); }
  },

  /* Speichern und danach zurücklesen. Erst wenn das Gegenlesen passt,
     gilt es als gespeichert – sonst stand hier vorher nur ein Toast,
     der weg war, bevor man ihn lesen konnte. */
  async sichern(){
    this.inBrowser();
    const browserOk = this.ausBrowser() !== null;
    const jetzt = new Date().toISOString();

    if(!Auth.eingeloggt()){
      this.status = { ort: browserOk ? "nur in diesem Browser" : "nur im Arbeitsspeicher",
                      zeit: jetzt, fehler: "nicht bei Supabase angemeldet" };
      return this.status.fehler;
    }
    try{
      await SB.einstellungSetzen(VORLAGEN_SCHLUESSEL, this.aktuell());
      const alle = await SB.einstellungenLaden();
      const zurueck = alle[VORLAGEN_SCHLUESSEL];
      const gleich = !!zurueck && Array.isArray(zurueck.stufen) &&
        vorlagenSignatur(zurueck) === vorlagenSignatur(this.aktuell());
      this.status = {
        ort: "Supabase", zeit: jetzt,
        fehler: gleich ? "" : "geschrieben, aber beim Gegenlesen kam ein anderer Stand zurück"+
          (zurueck ? " (abweichend: "+vorlagenUnterschied(zurueck, this.aktuell())+")" : " (nichts zurückgekommen)")
      };
      return this.status.fehler;
    }catch(e){
      console.error(e);
      this.status = { ort: browserOk ? "nur in diesem Browser" : "nur im Arbeitsspeicher",
                      zeit: jetzt, fehler: (e.message||String(e)) };
      return this.status.fehler;
    }
  },

  /* Selbsttest: sagt im Klartext, welcher der drei Wege klemmt */
  async pruefen(){
    const zeilen = [];
    zeilen.push(["Anmeldung bei Supabase",
      Auth.eingeloggt() ? "ok – "+(((Auth.user||{}).email)||"angemeldet")
                        : "FEHLT – ohne Anmeldung wird nur im Browser gespeichert"]);
    let ls;
    try{ localStorage.setItem("aqt_probe","1"); localStorage.removeItem("aqt_probe"); ls = "ok"; }
    catch(e){ ls = "blockiert ("+(e.name||"Fehler")+") – Texte überleben kein Neuladen"; }
    zeilen.push(["Speicher dieses Browsers", ls]);

    if(Auth.eingeloggt()){
      try{ await SB.einstellungenLaden(); zeilen.push(["Tabelle aqt_einstellungen lesen","ok"]); }
      catch(e){ zeilen.push(["Tabelle aqt_einstellungen lesen","FEHLER: "+(e.message||e)]); }
      try{
        await SB.einstellungSetzen("selbsttest", { zeit:new Date().toISOString() });
        zeilen.push(["Tabelle aqt_einstellungen schreiben","ok"]);
      }catch(e){ zeilen.push(["Tabelle aqt_einstellungen schreiben","FEHLER: "+(e.message||e)]); }
    }
    return zeilen;
  }
};

/* Nur für die Fehlermeldung: welche Felder weichen ab? */
function vorlagenUnterschied(a, b){
  const namen = [];
  if(String((a||{}).ich||"").trim() !== String((b||{}).ich||"").trim()) namen.push("eigener Name");
  if((Number((a||{}).nachfassTage)||10) !== (Number((b||{}).nachfassTage)||10)) namen.push("Standardtage");
  const sa = Array.isArray((a||{}).stufen) ? a.stufen : [];
  const sb = Array.isArray((b||{}).stufen) ? b.stufen : [];
  for(let i=0;i<3;i++){
    for (const feld of ["kurz","name","betreff","text"])
      if(String((sa[i]||{})[feld]||"") !== String((sb[i]||{})[feld]||""))
        namen.push("Stufe "+(i+1)+" "+feld);
  }
  return namen.length ? namen.join(", ") : "kein Feld – nur die Speicherform";
}

/* Platzhalter ersetzen. Unbekannte Klammern bleiben stehen, damit ein
   Tippfehler in der Vorlage sofort auffällt und nicht still verschwindet. */
function vorlageFuellen(text, k){
  return String(text||"").replace(/\{(\w+)\}/g, (ganz, name) =>
    Object.prototype.hasOwnProperty.call(k, name) ? k[name] : ganz);
}

/* ---------- 7c. Anhänge am Vorgang -----------------------------
   Die Datei geht sofort in die Supabase-Ablage, erst danach entsteht der
   Eintrag in der Tabelle – so gibt es keine Zeile ohne Datei dahinter.
   Der Dateiname wird für den Ablagepfad entschärft (keine Umlaute, keine
   Leerzeichen); angezeigt wird weiter der Originalname.
------------------------------------------------------------------- */
const ANH_MAX = 25 * 1024 * 1024;

function groesseText(n){
  n = Number(n)||0;
  if(n < 1024) return n+" B";
  if(n < 1024*1024) return (n/1024).toFixed(0)+" KB";
  return (n/1024/1024).toFixed(1).replace(".",",")+" MB";
}

function sicherName(name){
  const s = String(name||"datei")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .replace(/[^A-Za-z0-9._-]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
  return (s.length > 80 ? s.slice(-80) : s) || "datei";
}

async function anhaengeHochladen(vorgangId, dateien, danach){
  const liste = Array.prototype.slice.call(dateien||[]);
  if(!liste.length) return 0;
  if(!Auth.eingeloggt()){
    toast("Dateien brauchen die Supabase-Anmeldung – bitte anmelden");
    return 0;
  }
  let ok = 0; const fehler = [];
  for (const datei of liste){
    if(datei.size > ANH_MAX){
      fehler.push(datei.name+" ist zu gross ("+groesseText(datei.size)+", erlaubt sind 25 MB)");
      continue;
    }
    const id = uid();
    const pfad = vorgangId+"/"+id+"_"+sicherName(datei.name);
    ladeToast("Datei wird hochgeladen: "+datei.name+" …");
    try{
      await SB.dateiHoch(pfad, datei);
      neuerAnhang({ id, vorgangId, dateiname:datei.name, pfad,
        groesse:datei.size, typ:datei.type||"",
        hochgeladenVon:(Auth.user && Auth.user.email) || "" });
      ok++;
    }catch(e){
      console.error(e);
      fehler.push(datei.name+": "+(e.message||e));
    }
  }
  ladeToastWeg();
  if(ok) Store.save();
  if(fehler.length) toast("Nicht hochgeladen – "+fehler.join(" · "));
  else if(ok) toast(ok===1 ? "Datei angehängt" : ok+" Dateien angehängt");
  if(danach) danach(ok);
  return ok;
}

/* ---------- 7a4. Die eingegangene E-Mail im Original ------------
   Beim Übernehmen aus Outlook wird der komplette Text am Vorgang
   abgelegt, nicht in der Notiz. Hier steht er unverändert und lässt
   sich bei Altvorgängen auch von Hand einfügen. Oben die Eckdaten,
   darunter nach der Trennlinie die Mail, wie sie ankam.
------------------------------------------------------------------- */
const MAIL_TRENNER = "\u2500".repeat(30);

function mailAnsichtOeffnen(){
  const v = DB.vorgang(LayerCtx.vorgangId); if(!v) return;
  vorgangFelderLesen(v);            /* der Vorgangsdialog wird gleich ersetzt */
  Store.save();                     /* B17: Eingaben im Vorgang nicht nur im Speicher halten */
  const txt = String(v.mailText||"");
  const i = txt.indexOf(MAIL_TRENNER);
  const eck  = i >= 0 ? txt.slice(0, i).trim() : "";
  const rest = i >= 0 ? txt.slice(i + MAIL_TRENNER.length).replace(/^\n/, "") : txt;

  layerZeigen(
    '<div class="modal wide">'+
      '<div class="drawer-head"><div style="min-width:0;flex:1">'+
        '<div class="eyebrow">'+esc(DB.firmaName(v.firmaId))+"</div>"+

        '<button class="btn ghost" data-act="mail-ansicht-zurueck">Zurück zum Vorgang</button>'+
      "</div>"+
      '<div class="drawer-body">'+
        (eck ? '<div class="mail-eck">'+esc(eck)+"</div>" : "")+
        (txt.trim() ? "" : '<div class="hint" style="margin-bottom:12px">Für diesen Vorgang ist noch kein '+
          "Mailtext hinterlegt. Die Mail in Outlook markieren, mit Strg+A und Strg+C kopieren und hier einfügen.</div>")+
        '<div class="field"><label>Originaltext der Mail</label>'+
          '<textarea id="mtText" style="min-height:420px;font-family:var(--mono);font-size:12.5px" '+
          'placeholder="Mailtext hier einfügen">'+esc(rest)+"</textarea></div>"+
      "</div>"+
      '<div class="drawer-foot">'+
        '<button class="btn primary" data-act="mail-ansicht-speichern">Speichern und zurück</button>'+
        '<button class="btn" data-act="mail-ansicht-kopieren">Text kopieren</button>'+
        '<div style="flex:1"></div>'+
        '<button class="btn ghost" data-act="mail-ansicht-zurueck">Abbrechen</button>'+
      "</div>"+
    "</div>", { vorgangId:v.id, mailEck:eck }, true);
}

function mailAnsichtSpeichern(){
  const v = DB.vorgang(LayerCtx.vorgangId); if(!v) return;
  const rest = ($("#mtText")||{}).value || "";
  const eck  = LayerCtx.mailEck || "";
  const neu  = rest.trim() ? (eck ? eck+"\n"+MAIL_TRENNER+"\n"+rest : rest) : "";

<script>
"use strict";

/* ---------- 8. Firmen: Tabelle, Filter, Mehrfachauswahl ------- */
/* Rhein-Main ist das eigene Einsatzgebiet: Postleitzahlen 60000-65999.
   Alles ausserhalb ist entweder ein Fehltreffer der Adressanreicherung
   (Konzernzentrale statt Niederlassung) oder schlicht zu weit weg. */
const RHEINMAIN_VON = 60000, RHEINMAIN_BIS = 65999;

/* PLZ-Filter versteht: "60318" (Anfang), "60-65" bzw. "60000-65999"
   (Bereich) und ein vorangestelltes "!" fuer alles ausserhalb. */
function plzPasst(plz, muster){
  muster = String(muster||"").trim();
  if(!muster) return true;
  let negiert = false;
  if(muster.charAt(0)==="!"){ negiert = true; muster = muster.slice(1).trim(); }
  if(!muster) return true;
  const p = String(plz==null?"":plz).replace(/\D/g,"");
  let treffer;
  const bereich = muster.match(/^(\d{1,5})\s*-\s*(\d{1,5})$/);
  if(bereich){
    if(!p){ treffer = false; }
    else {
      const stellen = Math.max(bereich[1].length, bereich[2].length);
      const zahl = Number(p.slice(0, stellen));
      const von  = Number(bereich[1]), bis = Number(bereich[2]);
      treffer = !isNaN(zahl) && zahl >= Math.min(von,bis) && zahl <= Math.max(von,bis);
    }
  } else {
    treffer = p.indexOf(muster.replace(/\D/g,"")) === 0;
  }
  return negiert ? !treffer : treffer;
}

/* Zerlegt die Eingabe im Suchfeld. Mehrere Woerter muessen alle passen.
   Ein Wort mit vorangestelltem Minus oder Ausrufezeichen schliesst aus.
   Beispiel: „zentrum -reha -rehabilitation" findet alle Zentren ausser
   den Reha-Einrichtungen. Anfuehrungszeichen fassen mehrere Woerter
   zusammen: -"ambulante rehabilitation".
   Ein Minus mitten im Wort bleibt normaler Text, damit Namen wie
   „Rhein-Main" weiter gefunden werden. */
function suchWorte(txt){
  const muss = [], darfNicht = [];
  const roh = String(txt||"").match(/-?"[^"]*"|\S+/g) || [];
  for (let t of roh){
    let raus = false;
    if(t[0]==="-" || t[0]==="!"){ raus = true; t = t.slice(1); }
    t = t.replace(/^"|"$/g, "").trim().toLowerCase();
    if(!t) continue;
    (raus ? darfNicht : muss).push(t);
  }
  return { muss, darfNicht };
}

function suchePasst(x, txt){
  const { muss, darfNicht } = suchWorte(txt);
  if(!muss.length && !darfNicht.length) return true;
  const heu = ((x.name||"")+" "+(x.ansprechpartner||"")).toLowerCase();
  for (const t of darfNicht) if(heu.includes(t)) return false;
  for (const t of muss)      if(!heu.includes(t)) return false;
  return true;
}

function firmenGefiltert(){
  const f = App.firmenFilter;
  const n = f.name.trim().toLowerCase(), o = f.ort.trim().toLowerCase();
  return Store.data.firmen.filter(x =>
    suchePasst(x, f.name) &&
    (!o || (x.ort||"").toLowerCase().includes(o)) &&
    plzPasst(x.plz, f.plz) &&
    (!f.branche    || x.branche===f.branche) &&
    (!f.gruppe     || x.gruppe===f.gruppe) &&
    (!f.segment    || x.segment===f.segment) &&
    (!f.kontaktweg || x.kontaktweg===f.kontaktweg) &&
    (!f.status     || x.status===f.status) &&
    (!f.quelle     || x.quelle===f.quelle)
  ).sort((a,b)=>{
    const s = App.firmenSort || { feld:"name", richtung:1 };
    const wert = x => s.feld==="vorgaenge" ? DB.vorgaengeVon(x.id).length : String(x[s.feld]==null?"":x[s.feld]).toLowerCase();
    const va = wert(a), vb = wert(b);
    if(typeof va==="number") return (va-vb)*s.richtung;
    return va.localeCompare(vb,"de")*s.richtung;
  });
}

/* Gibt dem Tabellenbereich die Resthoehe bis zum unteren Fensterrand und
   setzt die Filterzeile genau unter die Ueberschriftenzeile. Beides muss
   gemessen werden: die Topbar bricht je nach Fensterbreite um, und die
   Kopfzeilenhoehe haengt von der Schrift ab. */
function tabelleFixieren(){
  const wrap = document.querySelector(".tablewrap.fixhead");
  if(!wrap) return;
  const kopf = wrap.querySelector("thead tr:first-child");
  const filt = wrap.querySelector("thead tr.filterrow");
  if(kopf && filt){
    const h = kopf.getBoundingClientRect().height || kopf.offsetHeight || 33;
    filt.querySelectorAll("th").forEach(th => { th.style.top = h+"px"; });
  }
  const oben = wrap.getBoundingClientRect().top;
  const rest = window.innerHeight - oben - 24;
  wrap.style.maxHeight = Math.max(300, rest)+"px";
}
window.addEventListener("resize", () => { try{ tabelleFixieren(); }catch(_){} });

/* E-Mail, Website und Telefon als echte Links: mailto oeffnet Outlook,
   die Website geht in einem neuen Tab auf. */
function webUrl(w){
  w = String(w||"").trim();
  if(!w) return "";
  return /^https?:\/\//i.test(w) ? w : "https://"+w.replace(/^\/+/,"");
}
function telUrl(t){ return String(t||"").replace(/[^+0-9]/g,""); }
/* Google Maps mit Name und Adresse. Von dort ist Street View ein Klick
   weiter – dafür braucht es keine gespeicherten Koordinaten. */
function kartenUrl(x){
  const q = [x.name, x.strasse, [x.plz, x.ort].filter(Boolean).join(" ")]
    .filter(s => String(s||"").trim()).join(", ");
  if(!q) return "";
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

function kontaktLinks(x){
  if(!x) return '<span class="tiny muted">—</span>';
  const t = [];
  if(x.email)   t.push('<a href="mailto:'+esc(x.email)+'" title="'+esc(x.email)+'">✉ Mail</a>');
  if(x.telefon) t.push('<a href="tel:'+esc(telUrl(x.telefon))+'" title="'+esc(x.telefon)+'">☎ Anruf</a>');
  if(x.website) t.push('<a href="'+esc(webUrl(x.website))+'" target="_blank" rel="noopener" title="'+esc(x.website)+'">↗ Web</a>');
  const karte = kartenUrl(x);
  if(karte) t.push('<a href="'+esc(karte)+'" target="_blank" rel="noopener" title="In Google Maps ansehen – von dort ein Klick zu Street View">⌖ Karte</a>');
  return t.length ? '<span class="konlinks">'+t.join("")+"</span>" : '<span class="tiny muted">—</span>';
}
function minilink(art, wert){
  if(!wert) return "";
  if(art==="mail") return ' <a class="minilink" href="mailto:'+esc(wert)+'">öffnen</a>';
  if(art==="tel")  return ' <a class="minilink" href="tel:'+esc(telUrl(wert))+'">anrufen</a>';
  return ' <a class="minilink" href="'+esc(webUrl(wert))+'" target="_blank" rel="noopener">öffnen</a>';
}

function statusChip(s){
  const cls = s==="Kunde" ? "ok" : s==="Verloren" ? "crit" : s==="Kein Interesse" ? "" : "";
  return '<span class="chip '+cls+'">'+esc(s||"—")+"</span>";

function trennzeichenRaten(text){
  const z = text.split(/\r?\n/)[0] || "";
  const kandidaten = [["\t",(z.match(/\t/g)||[]).length],[";",(z.match(/;/g)||[]).length],[",",(z.match(/,/g)||[]).length]];
  kandidaten.sort((a,b)=>b[1]-a[1]);
  return kandidaten[0][1] ? kandidaten[0][0] : ";";
}

function tabelleParsen(text, sep){
  const zeilen=[]; let feld="", zeile=[], inQ=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ feld+='"'; i++; } else inQ=false; }
      else feld+=c;
    } else if(c==='"'){ inQ=true; }
    else if(c===sep){ zeile.push(feld); feld=""; }
    else if(c==="\n"){ zeile.push(feld); zeilen.push(zeile); zeile=[]; feld=""; }
    else if(c!=="\r"){ feld+=c; }
  }
  if(feld!=="" || zeile.length){ zeile.push(feld); zeilen.push(zeile); }
  return zeilen.filter(z => z.some(c => String(c).trim()!==""));
}

const Import = { zeilen:null, kopf:[], zuordnung:{}, blaetter:null };

/* ---------- XLSX lesen, ohne Fremdbibliothek -------------------
   Eine xlsx-Datei ist ein ZIP-Archiv voller XML-Dateien. Entpackt
   wird mit DecompressionStream, das jeder aktuelle Browser mitbringt –
   deshalb kommt die App ohne 900 KB Zusatzbibliothek aus.          */

function zipOeffnen(buffer){
  const u8 = new Uint8Array(buffer), dv = new DataView(buffer);
  let eocd = -1;
  for (let i=u8.length-22; i>=0 && i>u8.length-65558; i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("Das ist keine lesbare xlsx-Datei");
  const anzahl = dv.getUint16(eocd+10,true);
  let off = dv.getUint32(eocd+16,true);
  const eintraege = {}, dec = new TextDecoder();
  for (let n=0; n<anzahl; n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const nameLen = dv.getUint16(off+28,true);
    eintraege[dec.decode(u8.subarray(off+46, off+46+nameLen))] = {
      methode: dv.getUint16(off+10,true),
      groesse: dv.getUint32(off+20,true),
      lokal:   dv.getUint32(off+42,true)
    };
    off += 46 + nameLen + dv.getUint16(off+30,true) + dv.getUint16(off+32,true);
  }
  return { u8, dv, eintraege };
}

async function zipDatei(zip, name){
  const e = zip.eintraege[name];
  if(!e) return null;
  const start = e.lokal + 30 + zip.dv.getUint16(e.lokal+26,true) + zip.dv.getUint16(e.lokal+28,true);
  const roh = zip.u8.subarray(start, start + e.groesse);
  if(e.methode===0) return new TextDecoder().decode(roh);
  if(typeof DecompressionStream === "undefined")
    throw new Error("Dieser Browser kann xlsx nicht entpacken – bitte in Excel als CSV speichern");
  const strom = new Blob([roh]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new TextDecoder().decode(await new Response(strom).arrayBuffer());
}

function xmlLesen(text){ return new DOMParser().parseFromString(text, "application/xml"); }

/* A -> 0, B -> 1, AA -> 26 */
function spalteZuIndex(ref){
  let s = 0;
  for (const c of String(ref)){
    const k = c.charCodeAt(0);
    if(k<65||k>90) break;
    s = s*26 + (k-64);
  }
  return s-1;
}

async function xlsxLesen(buffer){
  const zip = zipOeffnen(buffer);

  let texte = [];
  const ss = await zipDatei(zip, "xl/sharedStrings.xml");
  if(ss) texte = Array.from(xmlLesen(ss).getElementsByTagName("si")).map(si =>
    Array.from(si.getElementsByTagName("t")).map(t=>t.textContent).join(""));

  const wb = await zipDatei(zip, "xl/workbook.xml");
  const namen = wb ? Array.from(xmlLesen(wb).getElementsByTagName("sheet")).map(s=>s.getAttribute("name")) : [];

  const pfade = Object.keys(zip.eintraege)
    .filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a,b)=>Number(a.match(/(\d+)/)[1]) - Number(b.match(/(\d+)/)[1]));

  const blaetter = [];
  for (let i=0; i<pfade.length; i++){
    const doc = xmlLesen(await zipDatei(zip, pfade[i]));
    const zeilen = [];
    for (const row of Array.from(doc.getElementsByTagName("row"))){
      const z = [];
      for (const c of Array.from(row.getElementsByTagName("c"))){
        const idx = spalteZuIndex(c.getAttribute("r")||"");
        const typ = c.getAttribute("t");
        let wert = "";
        if(typ==="inlineStr"){
          wert = Array.from(c.getElementsByTagName("t")).map(t=>t.textContent).join("");
        } else {
          const v = c.getElementsByTagName("v")[0];
          wert = v ? v.textContent : "";
          if(typ==="s") wert = texte[Number(wert)] || "";
        }
        z[idx>=0 ? idx : z.length] = wert;
      }
      for (let k=0; k<z.length; k++) if(z[k]===undefined) z[k] = "";
      zeilen.push(z);
    }
    blaetter.push({
      name: namen[i] || ("Tabelle "+(i+1)),
      zeilen: zeilen.filter(z=>z.some(c=>String(c).trim()!==""))
    });
  }
  return blaetter.filter(b=>b.zeilen.length>1);
}

function autoZuordnen(kopf){
  const regeln = {
    name:/firm|arbeitgeber|unternehmen|betrieb|einrichtung|träger|praxis|kunde|^name|name$/i,
    branche:/branche|sparte|wirtschaftszweig/i,
    kontaktweg:/kontaktweg|track/i, status:/status/i,
    quelle:/quelle|herkunft|liste|charge/i,
    ansprechpartner:/ansprech|kontakt.?person|inhaber|geschäftsführ/i,
    telefon:/telefon|^tel\b|phone|mobil|fon/i,
    email:/mail/i, website:/web|url|homepage|internet/i,
    strasse:/stra(ss|ß)e|^str\.|adresse|address/i,
    hausnummer:/^nr\.?$|hausnummer|haus.?nr/i,
    plz:/plz|postleit|zip/i,
    ort:/^ort$|^stadt$|^gemeinde$|^city$|ortsteil/i,
    kategorie:/places|kategorie|type$|typ$/i, notiz:/notiz|bemerk|kommentar/i
  };
  const z = {};
  kopf.forEach((sp,i)=>{
    for (const feld in regeln){
      if(z[feld]!==undefined) continue;
      if(regeln[feld].test(sp)){ z[feld]=i; break; }
    }
  });
  return z;
}

function importAusfuehren(){
  const z = {};
  document.querySelectorAll("[data-map]").forEach(s=>{ if(s.value!=="") z[s.getAttribute("data-map")]=Number(s.value); });
  if(z.name===undefined){ toast("Firmenname muss zugeordnet sein"); return; }

  const setBranche = $("#impBranche").value;
  const setStatus  = $("#impStatus").value;
  const setWeg     = $("#impWeg").value;
  const setQuelle  = $("#impQuelle").value;
  const dubPruefen = $("#impDub").checked;
  const restInNotiz= $("#impRest").checked;
  const ausSkip    = $("#impAus") ? $("#impAus").checked : false;
  const belegt     = new Set(Object.values(z));

  /* Kopf-Index-Map: erlaubt den Zugriff auf die Flag- und Anrede-Spalten
     der Kaltakquise-Liste ueber ihren Namen, ganz ohne manuelle Zuordnung. */
  const H = {};
  Import.kopf.forEach((k,i)=> H[String(k==null?"":k).trim().toUpperCase()] = i);

  const vorhanden = new Set(Store.data.firmen.map(f=>(f.name||"").toLowerCase().trim()+"|"+(f.ort||"").toLowerCase().trim()));
  let neu=0, uebersprungen=0, ausgelassen=0, gesperrtN=0;

  for (const zeile of Import.zeilen){
    const w = k => z[k]!==undefined ? String(zeile[z[k]]||"").trim() : "";
    const name = w("name");
    if(!name){ uebersprungen++; continue; }
    const ort = w("ort");
    const schluessel = name.toLowerCase()+"|"+ort.toLowerCase();
    if(dubPruefen && vorhanden.has(schluessel)){ uebersprungen++; continue; }
    vorhanden.add(schluessel);

    /* Zugriff auf Listen-Spalten ueber den Kopfnamen, unabhaengig von
       der manuellen Zuordnung. */
    const zell = nm => { const i=H[nm]; return i!==undefined ? String(zeile[i]==null?"":zeile[i]).trim() : ""; };

    /* Zeilen, die in der Liste ausgeschlossen sind (tot, erloschen,
       Wettbewerber, ausser Reichweite), gar nicht erst uebernehmen. */
    if(ausSkip && zell("AUSSCHLUSS")){ ausgelassen++; uebersprungen++; continue; }

    const kat = w("kategorie") || w("branche") || name;

    /* Fremde Branchenbezeichnung übersetzen statt verwerfen */
    let branche = setBranche;
    if(!branche){
      const roh = w("branche");
      branche = BRANCHEN.includes(roh) ? roh : brancheVorschlag(roh);
    }

    /* Zwei neue Achsen: GRUPPE (Brief-Winkel) aus der Rohbranche plus
       Grosspraxis-Flag, SEGMENT (Prioritaet/Kanal) aus den Flag-Spalten. */
    const grosspraxis = /ja/i.test(zell("GROSSPRAXIS"));
    const gruppe  = gruppeVorschlag(w("branche") || kat, grosspraxis);
    const segment = segmentAusFlags(zeile, H);

    /* Der Kontaktweg haengt am Segment, nicht mehr an der Branche. Steht in
       der Liste ausdruecklich etwas, gilt das. */
    let weg = setWeg || w("kontaktweg");
    if(!WEGE.includes(weg)) weg = wegVorschlag(segment);

    /* Anrede kommt fertig aus der Liste und ist dort schon nach
       Namensqualitaet gefiltert. Sicherheitshalber: nur bei BRIEFFAEHIG
       eine persoenliche Anrede und einen Ansprechpartner uebernehmen. */
    const nq = zell("NAME_QUALITAET").toUpperCase();
    let briefanrede   = zell("BRIEFANREDE");
    let ansprechpartner = w("ansprechpartner");
    if(nq && nq !== "BRIEFFAEHIG"){
      if(briefanrede && briefanrede.indexOf("Damen und Herren")<0) briefanrede = "Sehr geehrte Damen und Herren";
      ansprechpartner = "";
    }
    /* Auch als brieffaehig gemeldete Namen koennen einen Strassennamen
       oder eine Rolle enthalten. Steckt im Anrede-Namensteil so ein
       Stoerwort, lieber neutral anschreiben. */
    if(briefanrede && briefanrede.indexOf("Damen und Herren")<0){
      const namensteil = briefanrede.replace(/^Sehr geehrte[rs]?\s+(Herrn?|Frau)\s+/i, "");
      if(KEIN_NAME.test(namensteil)){ briefanrede = "Sehr geehrte Damen und Herren"; ansprechpartner = ""; }
    }
    if(ansprechpartner && KEIN_NAME.test(ansprechpartner)) ansprechpartner = "";

    /* Status/Quelle aus der Sperrliste ableiten. Kunden bleiben wertvoll
       (Fruehjahrs-Anschreiben), echte Sperrer werden vom Versand
       ausgenommen, aber nachvollziehbar mitgefuehrt. */
    let status = STATUS.includes(w("status")) ? w("status") : setStatus;
    if(!status) status = "Interessent";
    let quelle = setQuelle || w("quelle");
    let gesperrt = false;
    let sperrHinweis = "";
    const sg = zell("SPERRGRUND").toLowerCase();
    if(zell("SPERRE")){
      if(sg.indexOf("aktiver kunde")>=0){ status="Kunde"; if(!setQuelle) quelle="Bestandskunde"; }
      else if(sg.indexOf("ehemaliger kunde")>=0){ status="Ehemaliger Kunde"; if(!setQuelle) quelle="Ehemaliger Kunde"; }
      else if(sg.indexOf("interessent")>=0){ weg="Aktiv"; }
      else { gesperrt = true; gesperrtN++; }
      sperrHinweis = zell("SPERRGRUND");
    }

    /* Was nicht zugeordnet wurde, geht als Klartext in die Notiz –
       sonst wären Angaben wie Beschäftigtenzahl oder Quelle verloren. */
    let notiz = w("notiz");
    if(restInNotiz){
      const rest = [];
      Import.kopf.forEach((k,i)=>{
        if(belegt.has(i)) return;
        const wert = String(zeile[i]==null?"":zeile[i]).trim();
        if(wert) rest.push(k+": "+wert);
      });
      if(rest.length) notiz = [notiz, rest.join(" · ")].filter(Boolean).join("\n");
    }
    /* Die Originalbezeichnung der Branche bleibt erhalten, auch wenn sie
       auf eine der eigenen Kategorien übersetzt wurde. */
    const rohBranche = w("branche");
    if(rohBranche && rohBranche !== branche)
      notiz = [notiz, "Branche laut Datei: "+rohBranche].filter(Boolean).join("\n");
    if(sperrHinweis)
      notiz = [notiz, "Aus Liste vermerkt: "+sperrHinweis].filter(Boolean).join("\n");

    neueFirma({
      name, branche, gruppe, segment, kontaktweg:weg, status,
      quelle, ansprechpartner, briefanrede,
      telefon:w("telefon"), email:w("email"), website:w("website"),
      strasse:[w("strasse"), w("hausnummer")].filter(Boolean).join(" "),
      plz:w("plz"), ort, notiz, gesperrt
    });
    neu++;
  }
  Store.data.meta.importMapping = { kopf:Import.kopf, zuordnung:z };
  Store.save();
  layerSchliessen();
  render();
  toast(neu+" Firmen importiert"+(uebersprungen?", "+uebersprungen+" übersprungen":"")+(ausgelassen?" ("+ausgelassen+" ausgeschlossen)":"")+(gesperrtN?" · "+gesperrtN+" gesperrt":""));
}
</script>
<script>
"use strict";

/* ---------- 10b. Serienbrief-Export Track Passiv ---------------
   Der Massenversand legt bewusst keinen Vorgang an (Konzept 9b), sondern
   nur einen Vermerk an der Firma. Hier fällt die Adressdatei für die
   Seriendruck-Funktion von Word an, dazu die fertige Anrede. */

function anredeZeile(f){
  /* Aus der Kaltakquise-Liste kommt die Anrede fertig und schon nach
     Namensqualitaet gefiltert. Wenn vorhanden, hat sie Vorrang. */
  const fertig = (f.briefanrede||"").trim();
  if(fertig) return fertig;
  const ap = (f.ansprechpartner||"").trim();
  if(!ap) return "Sehr geehrte Damen und Herren";
  if(/^frau\b/i.test(ap))  return "Sehr geehrte "+ap;
  if(/^herrn?\b/i.test(ap)) return "Sehr geehrter "+ap.replace(/^herr\b/i,"Herrn");
  return "Sehr geehrte Damen und Herren";   // Name ohne Anrede: nicht raten
}

function serienbriefExport(ids){
  if(ids && ids.length){
    const sicht = new Set(firmenGefiltert().map(x=>x.id));
    const drueber = ids.filter(id=>!sicht.has(id)).length;
    if(drueber){
      bestaetigen("Auswahl größer als der Filter",
        ids.length+" Firmen sind markiert, davon "+drueber+" außerhalb des aktuellen Filters. "+
        "Alle "+ids.length+" kommen in die Datei. Weiter?",
        "Ja, alle "+ids.length,
        ()=>{ serienbriefExport2(ids); });
      return;
    }
  }
  return serienbriefExport2(ids);
}

function serienbriefExport2(ids){
  let liste = ids.length
    ? Store.data.firmen.filter(f=>ids.includes(f.id))
    : firmenGefiltert();
  const gesperrtRaus = liste.filter(f=>f.gesperrt).length;
  liste = liste.filter(f=>!f.gesperrt);
  if(!liste.length){ toast("Keine anschreibbaren Firmen (alle gesperrt?)"); return; }
  if(gesperrtRaus) toast(gesperrtRaus+" gesperrte Firma"+(gesperrtRaus>1?"n":"")+" ausgelassen");

  const ohneAdresse = liste.filter(f=>!(f.strasse||"").trim() || !(f.ort||"").trim()).length;

  const spalten = ["Firmenname","Anrede","Ansprechpartner","Strasse","PLZ","Ort",
                   "Branche","Kontaktweg","Status","Telefon","E-Mail","AQT-ID"];
  const feld = w => {
    const s = String(w==null?"":w);
    return /[";\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const zeilen = liste.map(f=>[
    f.name, anredeZeile(f), f.ansprechpartner, f.strasse, f.plz, f.ort,
    f.branche, f.kontaktweg, f.status, f.telefon, f.email, f.id
  ].map(feld).join(";"));

  /* BOM voran, sonst zeigt Word/Excel die Umlaute falsch an */
  const csv = "\ufeff" + [spalten.join(";")].concat(zeilen).join("\r\n") + "\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = "AQT-Serienbrief-"+ISO(new Date())+".csv";
  a.click(); URL.revokeObjectURL(a.href);

  const idsRaus = liste.map(f=>f.id);
  bestaetigen("Datei erzeugt – Vermerk setzen?",
    liste.length+" Adressen exportiert"+(ohneAdresse?" ("+ohneAdresse+" davon ohne vollständige Adresse)":"")+
    ". Soll bei diesen Firmen jetzt „Brief verschickt am "+fmtDatum(ISO(new Date()))+"“ vermerkt werden?",
    "Ja, vermerken", ()=>{ briefVermerkSetzen(idsRaus); });
}

function briefVermerkSetzen(ids, anlass){
  const heuteISO = ISO(new Date());
  let n = 0;
  for (const id of ids){
    const f = DB.firma(id); if(!f) continue;
    f.briefe = f.briefe || [];
    f.briefe.push({ id:uid(), datum:heuteISO, anlass:anlass||"Serienbrief" });
    n++;
  }
  Store.save(); render();
  toast(n+" Brief-Vermerke gesetzt – keine Vorgänge angelegt");
}

/* ---------- 11b. Digitalpost-Export (Deutsche Post) -------------
   Aus v5.4 übernommen. Die Post erwartet beim Hochladen genau fünf
   Spalten: NAME · STRASSE · NUMMER · PLZ · STADT.

   Eine .xlsx-Datei ist innendrin nur ein ZIP mit ein paar XML-Dateien.
   Das schreiben wir selbst, ohne Fremdbibliothek – so läuft der Export
   auch ohne Internetverbindung. Das ZIP wird unkomprimiert abgelegt
   (Methode 0), das spart die Deflate-Routine; bei ein paar hundert
   Adressen ist die Dateigröße ohne Belang.
------------------------------------------------------------------- */

const _CRC_TAB = (()=>{
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n] = c>>>0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = _CRC_TAB[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}

function zipBauen(dateien){
  const enc = new TextEncoder();
  const teile = [], zentral = [];
  let versatz = 0;

  const u16 = n => [n&0xFF, (n>>>8)&0xFF];
  const u32 = n => [n&0xFF, (n>>>8)&0xFF, (n>>>16)&0xFF, (n>>>24)&0xFF];

  for(const d of dateien){
    const name = enc.encode(d.name);
    const inhalt = enc.encode(d.inhalt);
    const crc = crc32(inhalt);

    const kopf = [].concat(
      [0x50,0x4B,0x03,0x04], u16(20), u16(0), u16(0),
      u16(0), u16(0),
      u32(crc), u32(inhalt.length), u32(inhalt.length),
      u16(name.length), u16(0));
    teile.push(new Uint8Array(kopf), name, inhalt);

    zentral.push(new Uint8Array([].concat(
      [0x50,0x4B,0x01,0x02], u16(20), u16(20), u16(0), u16(0),
      u16(0), u16(0),
      u32(crc), u32(inhalt.length), u32(inhalt.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(versatz))), name);

    versatz += kopf.length + name.length + inhalt.length;
  }

  let zLaenge = 0;
  for(const z of zentral) zLaenge += z.length;

  const ende = new Uint8Array([].concat(
    [0x50,0x4B,0x05,0x06], u16(0), u16(0),
    u16(dateien.length), u16(dateien.length),
    u32(zLaenge), u32(versatz), u16(0)));

  const out = new Uint8Array(versatz + zLaenge + ende.length);
  let p = 0;
  for(const t of teile){ out.set(t,p); p += t.length; }
  for(const z of zentral){ out.set(z,p); p += z.length; }
  out.set(ende,p);
  return out;
}

function xmlEsc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&apos;")
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");   /* Excel verweigert Steuerzeichen */
}

function xlsxSpalte(i){
  let s = "", n = i + 1;
  while(n>0){ const r=(n-1)%26; s = String.fromCharCode(65+r)+s; n = Math.floor((n-1)/26); }
  return s;
}

/* Alle Werte gehen als Text raus – sonst frisst Excel die führende Null
   bei PLZ wie 01067. */
function xlsxBauen(spalten, zeilen, blattName){
  const alle = [spalten].concat(zeilen);
  let blatt = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  alle.forEach((zeile,ri)=>{
    blatt += '<row r="'+(ri+1)+'">';
    zeile.forEach((wert,ci)=>{
      const txt = String(wert==null?"":wert);
      if(!txt) return;
      blatt += '<c r="'+xlsxSpalte(ci)+(ri+1)+'" t="inlineStr"><is><t xml:space="preserve">'+
        xmlEsc(txt)+"</t></is></c>";
    });
    blatt += "</row>";
  });
  blatt += "</sheetData></worksheet>";

  const bn = String(blattName||"Tabelle1").replace(/[\\\/\?\*\[\]:]/g,"").slice(0,31) || "Tabelle1";

  return zipBauen([
    { name:"[Content_Types].xml", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      "</Types>" },
    { name:"_rels/.rels", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      "</Relationships>" },
    { name:"xl/workbook.xml", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets><sheet name="'+xmlEsc(bn)+'" sheetId="1" r:id="rId1"/></sheets></workbook>' },
    { name:"xl/_rels/workbook.xml.rels", inhalt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
      "</Relationships>" },
    { name:"xl/worksheets/sheet1.xml", inhalt: blatt }
  ]);
}

/* ---------- Vorgaben der Deutschen Post ------------------------
   Aus "Aufbereitungshinweise für die Adressliste" (PMP). Spaltennamen
   und Reihenfolge müssen genau der Vorlage entsprechen, sonst ordnet
   die Post die Spalten falsch zu. Die Feldlängen sind harte Grenzen:
   ist ein Feld länger, wird der ganze Adresssatz beim Einlesen
   verworfen und als fehlerhaft protokolliert.
------------------------------------------------------------------- */
const POST_SPALTEN = ["Firma","Firma 2","Firma 3","Anrede","Titel","Vorname",
  "Nachname","Adresszusatz","Straße","Hausnummer","Postfach","PLZ","Ort"];

const POST_LAENGE = { "Firma":120, "Firma 2":40, "Firma 3":40, "Anrede":30,
  "Titel":30, "Vorname":30, "Nachname":40, "Adresszusatz":40, "Straße":35,
  "Hausnummer":10, "Postfach":7, "PLZ":5, "Ort":35 };

/* Straße und Hausnummer stehen im Tool in einem Feld, die Post will sie
   getrennt. Der Zahlenblock am Ende wird abgeschnitten:
   "Hanauer Landstraße 187a" -> "Hanauer Landstraße" + "187a" */
function adresseTrennen(strasse){
  const s = String(strasse||"").trim().replace(/\s+/g," ").replace(/[,\s]+$/,"");
  if(!s) return { strasse:"", nummer:"" };
  const m = s.match(/^(.*?)[\s,]+(\d+\s*[a-zA-Z]?(?:\s*[-\/]\s*\d+\s*[a-zA-Z]?)?)\.?$/);
  if(m && m[1].trim()) return { strasse:m[1].trim().replace(/,$/,""), nummer:m[2].replace(/\s+/g,"") };
  return { strasse:s, nummer:"" };
}

/* Bis 120 Zeichen bleibt der Firmenname in einem Feld – die Post bricht
   selbst auf "Firma 2" und "Firma 3" um. Nur wenn er länger ist, teilen
   wir selbst auf, sonst wird der Satz abgewiesen. */
function firmaTeilen(name){
  const n = String(name||"").trim().replace(/\s+/g," ");
  if(n.length <= POST_LAENGE["Firma"]) return { teile:[n,"",""], rest:"" };
  const worte = n.split(" ");
  const bloecke = ["","",""];
  let i = 0, rest = [];
  for (const w of worte){
    let gesetzt = false;
    while(i < 3){
      const kand = bloecke[i] ? bloecke[i]+" "+w : w;
      if(kand.length <= 40){ bloecke[i] = kand; gesetzt = true; break; }
      i++;
    }
    if(!gesetzt) rest.push(w);
  }
  return { teile:bloecke, rest:rest.join(" ") };
}

/* Wörter, die keine Person bezeichnen. Steht so etwas im Feld
   Ansprechpartner, geht es in den Adresszusatz – sonst druckt die Post
   "Herr Einkauf" auf den Umschlag. */
const POST_KEIN_NAME = /leitung|einkauf|verwaltung|geschäftsführ|geschaeftsführ|sekretariat|hausmeister|facility|objektbetreu|zentrale|empfang|abteilung|z\.?\s?h(d|dn)?\.?|technik|personal|buchhalt/i;

/* "Herr Dr. Max Muster" -> Anrede/Titel/Vorname/Nachname */
function personTeilen(ansprechpartner){
  const aus = { anrede:"", titel:"", vorname:"", nachname:"", zusatz:"" };
  let s = String(ansprechpartner||"").split(",")[0].trim().replace(/\s+/g," ");
  if(!s) return aus;

  const mA = s.match(/^(Herrn|Herr|Hr\.?|Frau|Fr\.?)\s+/i);
  if(mA){
    aus.anrede = /^f/i.test(mA[1]) ? "Frau" : "Herr";
    s = s.slice(mA[0].length).trim();
  }

  const tt = [];
  while(true){
    const mT = s.match(/^(Prof\.?|Dr\.?(?:\s?(?:med|rer\.?\s?nat|jur|phil|h\.?\s?c)\.?)?|Dipl\.-?[A-Za-zÄÖÜäöü]+\.?|Mag\.?|Ing\.?)\s+/i);
    if(!mT) break;
    tt.push(mT[1].trim());
    s = s.slice(mT[0].length).trim();
  }
  aus.titel = tt.join(" ");

  /* Keine Anrede und ein Funktionsbegriff statt eines Namens */
  if(!aus.anrede && POST_KEIN_NAME.test(s)){
    aus.titel = "";
    aus.zusatz = s;
    return aus;
  }

  const teile = s.split(" ").filter(Boolean);
  if(teile.length === 1) aus.nachname = teile[0];
  else if(teile.length > 1){
    aus.nachname = teile[teile.length-1];
    aus.vorname  = teile.slice(0,-1).join(" ");
  }
  return aus;
}

function dateiSpeichern(bytes, dateiname, typ){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes],{type:typ}));
  a.download = dateiname;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* Baut einen Adresssatz nach den Postvorgaben und meldet zurück, was
   fehlt (Satz wird nicht exportiert) und was gekürzt wurde. */
function postSatzBauen(f){
  const adr = adresseTrennen(f.strasse);
  const fa  = firmaTeilen(f.name);
  const p   = personTeilen(f.ansprechpartner);

  const satz = {
    "Firma":fa.teile[0], "Firma 2":fa.teile[1], "Firma 3":fa.teile[2],
    "Anrede":p.anrede, "Titel":p.titel, "Vorname":p.vorname,
    "Nachname":p.nachname, "Adresszusatz":p.zusatz,
    "Straße":adr.strasse, "Hausnummer":adr.nummer, "Postfach":"",
    "PLZ":String(f.plz||"").trim(), "Ort":String(f.ort||"").trim()
  };

  /* Pflichtangaben laut Vorgabe */
  const fehlt = [];
  if(!satz["Firma"] && !satz["Vorname"] && !satz["Nachname"]) fehlt.push("kein Name");
  if(!satz["Straße"] && !satz["Postfach"]) fehlt.push("keine Straße");
  if(!satz["PLZ"]) fehlt.push("keine PLZ");
  else if(!/^\d{5}$/.test(satz["PLZ"])) fehlt.push("PLZ „"+satz["PLZ"]+"“ ist nicht 5-stellig");
  if(!satz["Ort"]) fehlt.push("kein Ort");

  /* Feldlängen einhalten – zu lange Sätze weist die Post komplett ab */
  const gekuerzt = [];
  for (const sp of POST_SPALTEN){
    const max = POST_LAENGE[sp];
    if(satz[sp].length > max){
      gekuerzt.push(sp+" ("+satz[sp].length+" statt "+max+")");
      satz[sp] = satz[sp].slice(0, max).trim();
    }
  }
  if(fa.rest) gekuerzt.push("Firmenname zu lang, abgeschnitten: „"+fa.rest+"“");

  /* Sind alle drei Firma-Felder gefüllt, wird der Adresszusatz nicht
     gedruckt (max. 6 Adresszeilen) – dann lassen wir ihn gleich weg. */
  if(satz["Firma"] && satz["Firma 2"] && satz["Firma 3"]) satz["Adresszusatz"] = "";

  return { zeile: POST_SPALTEN.map(sp=>satz[sp]), fehlt, gekuerzt };
}

function digitalpostExport(ids){
  let liste = (ids && ids.length)
    ? Store.data.firmen.filter(f=>ids.includes(f.id))
    : firmenGefiltert();
  /* Sicherheitsnetz: wenn die Auswahl ueber den aktuellen Filter hinausgeht,
     erst fragen. Ein Postversand laesst sich nicht zurueckholen. */
  if(ids && ids.length){
    const sicht = new Set(firmenGefiltert().map(x=>x.id));
    const drueber = ids.filter(id=>!sicht.has(id)).length;
    if(drueber){
      bestaetigen("Auswahl größer als der Filter",
        ids.length+" Firmen sind markiert, davon "+drueber+" außerhalb des aktuellen Filters. "+
        "Alle "+ids.length+" kommen in die Datei. Weiter?",
        "Ja, alle "+ids.length,
        ()=>{ digitalpostExport2(ids); });
      return;
    }
  }
  return digitalpostExport2(ids);
}

function digitalpostExport2(ids){
  let liste = (ids && ids.length)
    ? Store.data.firmen.filter(f=>ids.includes(f.id))
    : firmenGefiltert();
  const gesperrtRaus = liste.filter(f=>f.gesperrt).length;
  liste = liste.filter(f=>!f.gesperrt);
  if(!liste.length){ toast("Keine anschreibbaren Firmen (alle gesperrt?)"); return; }
  if(gesperrtRaus) toast(gesperrtRaus+" gesperrte Firma"+(gesperrtRaus>1?"n":"")+" ausgelassen");

  const zeilen = [], gut = [], raus = [], hinweise = [];
  for (const f of liste){
    const r = postSatzBauen(f);
    const wer = f.name || "Ohne Namen";
    if(r.fehlt.length){ raus.push(wer+" – "+r.fehlt.join(", ")); continue; }
    if(r.gekuerzt.length) hinweise.push(wer+" – gekürzt: "+r.gekuerzt.join("; "));
    zeilen.push(r.zeile);
    gut.push(f.id);
  }

  const anz = n => n+(n===1 ? " Adresse" : " Adressen");

  if(!zeilen.length){
    toast(anz(raus.length)+" unvollständig – keine exportierbar");
    return;
  }

  const losgehts = () => {
    const bytes = xlsxBauen(POST_SPALTEN, zeilen, "Tabelle1");
    dateiSpeichern(bytes, "Digitalpost_"+ISO(new Date())+".xlsx",
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    bestaetigen("Datei erzeugt – Vermerk setzen?",
      anz(zeilen.length)+" exportiert. Soll bei diesen Firmen jetzt "+
      "„Brief verschickt am "+fmtDatum(ISO(new Date()))+"“ vermerkt werden?",
      "Ja, vermerken", ()=>{ briefVermerkSetzen(gut, "Digitalpost "+ISO(new Date()).slice(0,7)); });
  };

  /* Vorher zeigen, was übersprungen und was gekürzt wird */
  if(raus.length || hinweise.length){
    const kurz = arr => arr.slice(0,10).join("\n") +
      (arr.length>10 ? "\n… und "+(arr.length-10)+" weitere" : "");
    let txt = "";
    if(raus.length)
      txt += "Übersprungen, weil die Post sie beim Einlesen abweist ("+
             anz(raus.length)+"):\n"+kurz(raus)+"\n\n";
    if(hinweise.length)
      txt += "Auf die zulässige Feldlänge gekürzt ("+
             anz(hinweise.length)+"):\n"+kurz(hinweise)+"\n\n";
    txt += zeilen.length+" von "+liste.length+" Adressen kommen in die Datei.";
    bestaetigen("Prüfung der Adressliste", txt,
      zeilen.length+" exportieren", losgehts);
    return;
  }
  losgehts();
}

function renderZahlen(){

  const verloren = V.filter(v=>v.ergebnis==="verloren");
  const ueberfaellig = offen.filter(v=>{ const w=wvNaechste(v); return w && tageBis(w.datum)<0; });
  const quote = (gewonnen.length+verloren.length) ? Math.round(gewonnen.length/(gewonnen.length+verloren.length)*100) : null;

  const kpi = (v,l,cls) => '<div class="kpi '+(cls||"")+'"><div class="v">'+v+'</div><div class="l">'+esc(l)+"</div></div>";

  let h = '<div class="kpis">'+
    kpi(F.length,"Firmen")+
    kpi(offen.length,"Offene Vorgänge")+
    kpi(ueberfaellig.length,"Überfällig", ueberfaellig.length?"crit":"")+
    kpi(gewonnen.length,"Aufträge","ok")+
    kpi(verloren.length,"Absagen")+
    kpi(quote===null?"–":quote+"%","Trefferquote")+

  /* Verteilung über die Stufen */

      '<div class="tiny" style="flex:0 0 130px;color:var(--ink-2)">'+esc(s.name)+"</div>"+

  /* Absagegründe – nach dem Konzept ab ca. 20 Einträgen auswertbar */

  verloren.forEach(v=>{ if(v.absagegrund) gruende[v.absagegrund]=(gruende[v.absagegrund]||0)+1; });
  const gListe = Object.entries(gruende).sort((a,b)=>b[1]-a[1]);
  h += '<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Absagegründe</h3>'+
    '<span class="tiny muted" style="margin-left:auto">aussagekräftig ab ca. 20 Einträgen</span></div><div class="panel-body">'+
    (gListe.length ? gListe.map(([g,n])=>
      '<div style="display:flex;padding:5px 0;border-bottom:1px solid var(--line)"><div style="flex:1;font-size:13.5px">'+esc(g)+
      '</div><div class="mono">'+n+"</div></div>").join("")
      : '<div class="tiny muted">Noch keine Absage erfasst. Der Grund wird beim Buchen einer Absage abgefragt.</div>')+
    "</div></div>";

  /* Kontaktweg-Verteilung der Firmen */
  h += '<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Firmen nach Track</h3></div><div class="panel-body">'+
    '<div style="display:flex;gap:20px;flex-wrap:wrap">'+

        return '<div><div class="mono" style="font-size:22px;font-weight:700">'+n+'</div><div class="eyebrow">'+w+"</div></div>";
      }).join("")+
    "</div>"+
    '<div class="hint" style="margin-top:12px">Track Aktiv wird angerufen (Kapazität 40–60 Anrufe/Woche zu dritt). '+
    "Track Passiv bekommt Briefe ohne Nachfassanruf, ca. 300–400 pro Monatswelle.</div>"+
  "</div></div>";

  $("#content").innerHTML = h;
}

/* B18: Größe der Daten, Stand der lokalen Kopie, Belegung im Browser */
function spiegelInfoZeigen(){
  const el = $("#spiegelInfo"); if(!el) return;
  const mb = n => (n/1048576).toLocaleString("de-DE", { maximumFractionDigits:1, minimumFractionDigits:1 })+" MB";
  let groesse = 0;
  try{ groesse = JSON.stringify(Store.data).length; }catch(_){}
  const teile = ["Datenmenge ca. "+mb(groesse)];
  const S = Spiegel;
  if(S.fehler) teile.push("lokale Kopie: FEHLER – "+S.fehler);
  else if(S.zuletzt) teile.push("lokale Kopie: aktuell ("+(S.modus==="idb" ? "IndexedDB" : "localStorage, Ersatzweg")+", "+
    S.zuletzt.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" })+" Uhr)");
  else teile.push("lokale Kopie: in dieser Sitzung noch nicht geschrieben");
  const fertig = extra => { const e2 = $("#spiegelInfo"); if(e2) e2.textContent = teile.concat(extra||[]).join(" · "); };
  fertig();
  try{
    if(navigator.storage && navigator.storage.estimate)
      navigator.storage.estimate().then(s => {
        if(s && s.quota) fertig(["Browser-Speicher: "+mb(s.usage||0)+" von "+mb(s.quota)+" belegt"]);
      }).catch(()=>{});
  }catch(_){}
}

function vorlagenDateiLaden(datei){
  const leser = new FileReader();
  leser.onload = () => {
    try{
      const d = JSON.parse(String(leser.result));
      if(!d || !Array.isArray(d.stufen) || d.stufen.length !== 3)
        throw new Error("Das ist keine AQT-Vorlagendatei");
      Vorlagen.daten = d;
      Vorlagen.sichern().then(() => { render(); toast("Vorlagen aus der Datei übernommen"); });
    }catch(e){ toast("Datei nicht lesbar: "+(e.message||e)); }
  };
  leser.onerror = () => toast("Datei konnte nicht gelesen werden");
  leser.readAsText(datei);
}

/* ---------- 14. Dialog-Schicht -------------------------------- */
let LayerCtx = {};
/* Wird gesetzt, sobald im offenen Dialog irgendein Feld angefasst wurde.
   Nur dann fragt das Schliessen nach. Jedes Oeffnen und jedes Speichern
   setzt die Markierung zurueck. */
let LayerBeruehrt = false;
function layerZeigen(html, ctx, zentriert){
  LayerCtx = ctx || {};
  LayerBeruehrt = false;
  $("#layer").innerHTML = '<div class="overlay'+(zentriert?" modal-center":"")+'" id="overlay">'+html+"</div>";
  document.body.style.overflow="hidden";
}
function layerSchliessen(){
  entwuerfeVerwerfen();
  LayerBeruehrt = false;
  $("#layer").innerHTML = ""; LayerCtx = {};
  document.body.style.overflow="";
}
/* Abbrechen-Weg: Escape und alle Abbrechen-/Zurueck-Knoepfe. Speichern
   ruft weiterhin direkt layerSchliessen() auf und fragt nichts. */
/* B17: Zurueck aus einem Unterfenster (E-Mail, Nachfass-Mail, Leitfaden,
   Objekt) – fragt nach, wenn dort etwas getippt wurde. */
function layerZurueck(weiter){
  if(LayerBeruehrt &&
     !window.confirm("In diesem Fenster sind ungespeicherte Eingaben.\n\nTrotzdem zurück und verwerfen?"))
    return;
  weiter();
}
function layerAbbrechen(){
  if(LayerBeruehrt &&
     !window.confirm("Dieser Dialog hat ungespeicherte \u00c4nderungen.\n\nWirklich schliessen und verwerfen?"))
    return;
  layerSchliessen();
}
/* Eingaben im Dialog merken. Ein Klick auf einen Knopf zaehlt nicht,
   nur echtes Tippen oder Auswaehlen. */
document.addEventListener("input", e => {
  if(!LayerBeruehrt && $("#overlay") && $("#overlay").contains(e.target)) LayerBeruehrt = true;
}, true);
document.addEventListener("change", e => {
  if(!LayerBeruehrt && $("#overlay") && $("#overlay").contains(e.target)) LayerBeruehrt = true;
}, true);

/* Ein neuer Vorgang bzw. eine neue Firma ist zunächst nur ein Entwurf.
   Wer den Dialog abbricht, soll keine leere Karteileiche hinterlassen. */
function entwuerfeVerwerfen(){
  const vE = Store.data.vorgaenge.filter(v=>v.entwurf).map(v=>v.id);
  if(vE.length){
    Store.data.vorgaenge = Store.data.vorgaenge.filter(v=>!v.entwurf);
    Store.data.aktivitaeten = Store.data.aktivitaeten.filter(a=>!vE.includes(a.vorgangId));
  }
  const fE = Store.data.firmen.filter(f=>f.entwurf).map(f=>f.id);
  if(fE.length){
    Store.data.firmen = Store.data.firmen.filter(f=>!f.entwurf);
    Store.data.objekte = Store.data.objekte.filter(o=>!fE.includes(o.firmaId));
  }
  if(vE.length||fE.length) Store.save();
}

/* Einmalige Bereinigung alter leerer Datensätze aus früheren Versionen */
function altlastenAufraeumen(){
  const vor = Store.data.vorgaenge.length + Store.data.firmen.length;
  Store.data.vorgaenge = Store.data.vorgaenge.filter(v =>
    v.firmaId || (v.titel||"").trim() || DB.aktivitaetenVon(v.id).length);
  Store.data.firmen = Store.data.firmen.filter(f =>
    (f.name||"").trim() && f.name !== "(ohne Namen)");
  if(vor !== Store.data.vorgaenge.length + Store.data.firmen.length) Store.save();
}
