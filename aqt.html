        '<div class="section"><div class="section-t">Dateien anhängen</div>'+
          '<input type="file" id="mailDateien" multiple>'+
          '<div class="tiny muted" id="mailDateienListe" style="margin-top:8px;line-height:1.8">'+
            ((Mail.dateien && Mail.dateien.length)
              ? Mail.dateien.map(f => "· "+esc(f.name)+" ("+groesseText(f.size)+")").join("<br>")
              : "Leistungsverzeichnis und Anlagen in Outlook erst auf dem Rechner speichern, dann hier auswählen. "+
                "Sie hängen anschliessend am neuen Vorgang.")+
          "</div>"+
          (Mail.anhaenge ? '<div class="tiny muted" style="margin-top:8px">In der Mail genannt: '+esc(Mail.anhaenge)+"</div>" : "")+
        "</div>"+

        '<div class="section"><div class="section-t">Was angelegt wird</div>'+
          '<div class="tiny muted" style="line-height:1.9">'+
            "· Firma "+(Mail.firmaWahl==="neu"?"(neu)":"(bestehende, fehlende Felder werden ergänzt)")+"<br>"+
            "· Objekt mit der Adresse aus der Mail<br>"+
            "· Vorgang in Stufe „Neu“, Herkunft „Eingehende Anfrage“, Kontaktweg Aktiv<br>"+
            "· Chronik-Eintrag „E-Mail“ mit dem Originaltext<br>"+
            "· Wiedervorlage: 3 Tage vor der Angebotsfrist, sonst in 2 Tagen"+
          "</div>"+
        "</div>"+

        '<div class="section"><div class="section-t">Originaltext</div>'+
          '<div class="mono" style="background:var(--surface-2);border:1px solid var(--line);border-radius:6px;'+
          'padding:9px 11px;font-size:11px;line-height:1.6;max-height:170px;overflow-y:auto;white-space:pre-wrap">'+
          esc(d.raw.slice(0,4000))+"</div>"+
        "</div>"+
      "</div>"+

    "</div>";

  $("#mailFoot").innerHTML =
    '<label class="switch"><input type="checkbox" id="mGeprueft"'+(Mail.geprueft?" checked":"")+"> "+
      "Angaben geprüft</label>"+
    '<div style="flex:1"></div>'+
    '<button class="btn" data-mail="zurueck">Text ändern</button>'+
    '<button class="btn primary" data-mail="anlegen">Vorgang anlegen</button>';
}

function mailAnlegen(){
  if(!Mail.d) return;
  if(!($("#mGeprueft")||{}).checked){ toast("Bitte bestätigen, dass die Angaben geprüft sind"); return; }
  const w = s => (($(s)||{}).value||"").trim();
  const name = w("#mFirma");
  if(!name){ toast("Bitte einen Firmennamen eintragen"); return; }

  const d = Mail.d;
  const strasse = [w("#mStr"), w("#mNr")].filter(Boolean).join(" ");
  let f;

  if(Mail.firmaWahl==="neu"){
    f = neueFirma({
      name, branche:brancheVorschlag(name+" "+d.description), kontaktweg:"Aktiv",
      status:"Interessent", quelle:"Eingehende Anfrage",
      ansprechpartner:[w("#mAP"), w("#mFunk")].filter(Boolean).join(", "),
      telefon:w("#mTel"), email:w("#mMail"), website:w("#mWeb"),
      strasse, plz:w("#mPlz"), ort:w("#mOrt"),
      notiz:"Aus eingehender E-Mail-Anfrage vom "+fmtDatum(ISO(new Date()))
    });
  } else {
    f = DB.firma(Mail.firmaWahl);
    if(!f){ toast("Firma nicht gefunden"); return; }
    /* Nur leere Felder ergänzen, nichts überschreiben */
    const erg = { ansprechpartner:[w("#mAP"), w("#mFunk")].filter(Boolean).join(", "),
      telefon:w("#mTel"), email:w("#mMail"), website:w("#mWeb"),
      strasse, plz:w("#mPlz"), ort:w("#mOrt") };
    for(const k in erg) if(!String(f[k]||"").trim() && erg[k]) f[k] = erg[k];
    if(f.status==="Kein Interesse" || f.status==="Verloren") f.status = "Interessent";
  }

  const titel = w("#mTitel") || "Anfrage";
  let objektId = "";
  if(($("#mObjekt")||{}).value !== "nein"){
    objektId = neuesObjekt({ firmaId:f.id, name:titel, strasse, plz:w("#mPlz"), ort:w("#mOrt") }).id;
  }

  const leistung = ($("#mLeistung")||{}).value || "Noch festzulegen";
  const fristTag = ($("#mFrist")||{}).value || "";
  const startTag = ($("#mStart")||{}).value || "";

  /* Die Notiz bleibt für eigene Gedanken frei. Alles, was aus der Mail
     kommt, steht vollständig im Fenster „Eingegangene E-Mail“ – Eckdaten
     oben, darunter der unveränderte Originaltext. */
  const notiz = String(w("#mNotiz")||"").trim();

  const eck = [
    "Übernommen am: "+fmtDatum(ISO(new Date())),
    d.outlook.from ? "Von: "+d.outlook.from : "",
    d.outlook.sent ? "Gesendet: "+d.outlook.sent : "",
    d.outlook.subject ? "Betreff: "+d.outlook.subject : "",
    "Leistung: "+leistung,
    Mail.anhaenge ? "Anhänge in der Mail: "+Mail.anhaenge : "",
    fristTag ? "Angebotsfrist: "+fmtDatum(fristTag) : "",
    startTag ? "Ausführung ab: "+fmtDatum(startTag) : "",
    d.award ? "Vergabesitzung: "+fmtDatum(d.award.slice(0,10)) : "",
    d.binding ? "Bindefrist: "+fmtDatum(d.binding.slice(0,10)) : ""
  ].filter(Boolean).join("\n");
  const mailText = eck+"\n"+MAIL_TRENNER+"\n"+String(d.raw||"").trim();

  const v = neuerVorgang({
    firmaId:f.id, objektId, titel, stufe:"neu",
    kontaktweg:"Aktiv", herkunft:"Eingehende Anfrage", notiz, mailText,
    anfrageAm: ISO(new Date()), frist: fristTag || ""
  });

  /* Wiedervorlage: 3 Tage vor der Frist, mindestens morgen */
  if(fristTag){
    let wvTag = plusTage(-3, fristTag);
    if(tageBis(wvTag) < 1) wvTag = plusTage(1);
    wvSetzen(v, wvTag, "Angebot vor Frist "+fmtDatum(fristTag)+" abgeben");
  } else {
    wvSetzen(v, plusTage(2), "Anfrage bearbeiten");
  }

  neueAktivitaet({
    vorgangId:v.id, typ:"E-Mail", datum:ISO(new Date()),
    text:"Eingehende Anfrage übernommen"+(d.outlook.sent?" (gesendet "+d.outlook.sent+")":"")+
      (d.outlook.from?"\nVon: "+d.outlook.from:"")+
      "\n\nDer vollständige Mailtext steht oben unter „Eingegangene E-Mail“."
  });

  Store.save();
  if(Mail.eingangId && typeof Eingang!=="undefined") Eingang.abhaken(Mail.eingangId);

  /* Gewählte Dateien hängen am frisch angelegten Vorgang. Läuft im
     Hintergrund weiter, das Fenster darf sich schon schliessen. */
  const dateien = (Mail.dateien||[]).slice();
  Mail.dateien = [];
  if(dateien.length) anhaengeHochladen(v.id, dateien);

  layerSchliessen();
  App.seite = "pipeline";
  render();
  toast("Vorgang angelegt"+(fristTag?" · Wiedervorlage 3 Tage vor der Frist":"")+
        (dateien.length?" · "+dateien.length+" Datei"+(dateien.length>1?"en":"")+" wird hochgeladen":""));
}

/* ---------- Ereignisse ----------------------------------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-mail],[data-mail-firma],[data-act='mail-neu']");
  if(!t) return;
  if(t.getAttribute("data-act")==="mail-neu"){ mailDialogOeffnen(); return; }
  const fid = t.getAttribute("data-mail-firma");
  if(fid){ Mail.firmaWahl = fid; return; }
  const a = t.getAttribute("data-mail");
  if(a==="analysieren") mailAnalysieren();
  else if(a==="zurueck"){
    const roh = Mail.d ? Mail.d.raw : "", eid = Mail.eingangId, anh = Mail.anhaenge;
    mailDialogOeffnen();
    Mail.eingangId = eid; Mail.anhaenge = anh;   // Herkunft aus dem Posteingang behalten
    const el = $("#mailRoh"); if(el) el.value = roh;
  }
  else if(a==="anlegen") mailAnlegen();
});
document.addEventListener("change", e => {
  if(e.target.id==="mGeprueft") Mail.geprueft = e.target.checked;
  if(e.target.id==="mailDateien"){
    Mail.dateien = Array.prototype.slice.call(e.target.files||[]);
    const el = $("#mailDateienListe");
    if(el) el.innerHTML = Mail.dateien.length
      ? Mail.dateien.map(f => "· "+esc(f.name)+" ("+groesseText(f.size)+")").join("<br>")
      : "Keine Datei gewählt.";
  }
});

</script>
<script>
"use strict";

/* ============================================================
   Posteingang – Mails, die das Abruf-Skript am Postfach
   vorgang@allcleanservice.de in die Tabelle aqt_eingang legt.
   Die Tabelle gehört nicht zum Sync der vier Kerntabellen:
   sie wird von aussen befüllt und hier nur gelesen, abgehakt
   oder verworfen.
   ============================================================ */

const Eingang = {
  liste:[], geladen:0, laeuft:false, fehler:null,
  /* Solange die Tabelle aqt_eingang nicht existiert (automatischer Abruf
     noch nicht eingerichtet), wird nicht bei jedem Seitenwechsel erneut
     angefragt. Ein Klick auf "nachsehen" schaltet wieder frei. */
  aus:false,

  async laden(sichtbar){
    if(!Auth.eingeloggt() || this.laeuft) return;
    if(this.aus && !sichtbar) return;
    this.laeuft = true; if(sichtbar) eingangRendern();
    try{
      this.liste = await SB.req("GET",
        "/rest/v1/aqt_eingang?select=*&erledigt=is.false&order=eingang.desc&limit=100") || [];
      this.fehler = null;
    }catch(e){
      /* Tabelle noch nicht angelegt: still bleiben statt meckern */
      const fehltNoch = /relation|404|does not exist|schema cache/i.test(e.message);
      this.aus = fehltNoch;
      this.fehler = fehltNoch ? null : e.message;
      this.liste = [];
    }
    this.geladen = Date.now();
    this.laeuft = false;
    eingangRendern();
  },

  async abhaken(id){
    try{ await SB.req("PATCH","/rest/v1/aqt_eingang?id=eq."+encodeURIComponent(id), {erledigt:true}); }
    catch(e){ toast("Konnte nicht abgehakt werden: "+e.message); }
    this.liste = this.liste.filter(x=>x.id!==id);
    eingangRendern();
  }
};

function eingangRendern(){
  const box = $("#eingangBox"); if(!box) return;
  if(!Auth.eingeloggt()){ box.innerHTML=""; return; }

  const n = Eingang.liste.length;
  if(!n && !Eingang.laeuft && !Eingang.fehler){
    box.innerHTML = '<div class="tiny muted" style="margin-bottom:12px">Posteingang leer · '+
      '<button class="linkish" data-eing="neu-laden">nachsehen</button></div>';
    return;
  }

  box.innerHTML =
    '<div class="panel" style="margin-bottom:16px"><div class="panel-head">'+
      "<h3>Posteingang"+(n?' <span class="chip crit">'+n+"</span>":"")+"</h3>"+
      '<div style="margin-left:auto;display:flex;gap:9px;align-items:center">'+
        (Eingang.laeuft?'<span class="tiny muted">lädt…</span>':"")+
        '<button class="btn sm" data-eing="neu-laden">Aktualisieren</button></div></div>'+
    (Eingang.fehler
      ? '<div class="panel-body"><div class="hint" style="border-left-color:var(--crit)">'+esc(Eingang.fehler)+"</div></div>"
      : "")+
    (n ? '<div class="tablewrap"><table class="data"><tbody>'+
      Eingang.liste.map(m =>
        "<tr><td style='width:60%'>"+
          '<div class="cellname">'+esc(m.betreff||"(ohne Betreff)")+"</div>"+
          '<div class="tiny muted">'+esc(m.absender_name||m.absender||"")+
            (m.absender_name&&m.absender?" · "+esc(m.absender):"")+
            (m.gesendet?" · "+esc(m.gesendet):"")+"</div>"+
          (m.anhaenge?'<div class="tiny"><span class="chip">Anhänge: '+esc(m.anhaenge)+"</span></div>":"")+
        "</td><td style='text-align:right;white-space:nowrap'>"+
          '<button class="btn primary sm" data-eing="uebernehmen" data-id="'+esc(m.id)+'">Übernehmen</button> '+
          '<button class="btn sm ghost" data-eing="verwerfen" data-id="'+esc(m.id)+'">Verwerfen</button>'+
        "</td></tr>").join("")+
      "</tbody></table></div>" : "")+
    "</div>";
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-eing]"); if(!t) return;
  const a = t.getAttribute("data-eing"), id = t.getAttribute("data-id");

  if(a==="neu-laden"){ Eingang.aus = false; Eingang.laden(true); return; }
  if(a==="uebernehmen"){
    const m = Eingang.liste.find(x=>x.id===id); if(!m) return;
    mailDialogOeffnen({ id:m.id, text:m.text||"", betreff:m.betreff||"", anhaenge:m.anhaenge||"" });
    return;
  }
  if(a==="verwerfen"){
    const m = Eingang.liste.find(x=>x.id===id); if(!m) return;
    bestaetigen("Mail verwerfen?", "„"+(m.betreff||"ohne Betreff")+"“ verschwindet aus dem Posteingang. "+
      "Die Mail selbst bleibt im Postfach.", "Verwerfen", ()=>Eingang.abhaken(id));
    return;
  }
});

/* Beim Öffnen der Pipeline nachsehen, höchstens einmal pro Minute */
function eingangPruefen(){
  if(App.seite!=="pipeline" || !Auth.eingeloggt()) return;
  if(Date.now() - Eingang.geladen > 60000) Eingang.laden(false);
  else eingangRendern();
}

</script>
