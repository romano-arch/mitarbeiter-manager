/* ---------- 15. Ereignisse ------------------------------------ */
document.addEventListener("click", e => {
  if(e.target.closest("a[href]")) return;   /* echte Links normal durchlassen */
  const t = e.target.closest("[data-go],[data-act],[data-vorgang],[data-firma],[data-close],[data-ansicht],[data-wv-done],[data-wv-del],[data-akt-del],[data-akt-auf],[data-objekt],[data-objekt-del],[data-sort],[data-dub-del],[data-weg-um],[data-mehr],[data-weniger]");
  if(!t) return;

  /* Kontaktweg direkt in der Liste umschalten, ohne die Firma zu oeffnen. */
  const wegUm = t.getAttribute("data-weg-um");
  if(wegUm){
    const f = DB.firma(wegUm);
    if(f){
      f.kontaktweg = f.kontaktweg === "Aktiv" ? "Passiv" : "Aktiv";
      Store.save(); render();
      toast(f.name+": "+f.kontaktweg);
    }
    return;
  }

  /* Kanban-Spalte auf-/zuklappen */
  const mehr = t.getAttribute("data-mehr");
  if(mehr){ App.boardOffen.add(mehr); render(); return; }
  const weniger = t.getAttribute("data-weniger");
  if(weniger){ App.boardOffen.delete(weniger); render(); return; }

  const so = t.getAttribute("data-sort");
  if(so){ if(App.firmenSort && App.firmenSort.feld===so) App.firmenSort.richtung*=-1; else App.firmenSort={feld:so,richtung:1}; render(); return; }

  const dubDel = t.getAttribute("data-dub-del");
  if(dubDel){ firmenLoeschen([dubDel]); Store.save(); render(); dublettenZeigen(); toast("Firma gelöscht"); return; }

  const go_ = t.getAttribute("data-go");
  if(go_){ go(go_); return; }

  if(t.hasAttribute("data-close")){ layerAbbrechen(); return; }

  const ans = t.getAttribute("data-ansicht");
  if(ans){ App.pipelineAnsicht=ans; render(); return; }

  const vId = t.getAttribute("data-vorgang");
  if(vId){ layerSchliessen(); vorgangOeffnen(vId); return; }

  const fId = t.getAttribute("data-firma");
  if(fId){ firmaOeffnen(fId); return; }

  /* Objektzeile angeklickt: Firmeneingaben vorher sichern, sonst sind sie
     nach dem Wechsel ins Objektfenster weg */
  const oId = t.getAttribute("data-objekt");
  if(oId){
    const o = DB.objekt(oId); if(!o) return;
    const fx = DB.firma(LayerCtx.firmaId);
    if(fx){ firmaFelderLesen(fx); Store.save(); }
    objektOeffnen(o.firmaId, oId); return;
  }

  const wvDone = t.getAttribute("data-wv-done");
  if(wvDone){
    const v = DB.vorgang(LayerCtx.vorgangId);
    const w = v.wiedervorlagen.find(x=>x.id===wvDone);
    if(w){ w.erledigt=true; vorgangFelderLesen(v); Store.save(); vorgangOeffnen(v.id); render(); }
    return;
  }
  const wvDel = t.getAttribute("data-wv-del");
  if(wvDel){
    const v = DB.vorgang(LayerCtx.vorgangId);
    vorgangFelderLesen(v);
    v.wiedervorlagen = v.wiedervorlagen.filter(x=>x.id!==wvDel);
    Store.save(); vorgangOeffnen(v.id); render(); return;
  }
  /* Langen Eintrag auf- und zuklappen – der Text bleibt erhalten */
  const aAuf = t.getAttribute("data-akt-auf");
  if(aAuf){
    if(App.aktOffen.has(aAuf)) App.aktOffen.delete(aAuf); else App.aktOffen.add(aAuf);
    const v = DB.vorgang(LayerCtx.vorgangId);
    if(v){ vorgangFelderLesen(v); vorgangOeffnen(v.id); }
    return;
  }
  /* Löschen nur mit Rückfrage – hier stehen oft die einzigen Angaben
     aus der Original-Mail drin */
  const aDel = t.getAttribute("data-akt-del");
  if(aDel){
    const a = Store.data.aktivitaeten.find(x=>x.id===aDel); if(!a) return;
    const v = DB.vorgang(LayerCtx.vorgangId);
    if(v) vorgangFelderLesen(v);
    const vid = v ? v.id : "";
    bestaetigen("Eintrag löschen?",
      "Der Chronik-Eintrag („"+(a.typ||"Notiz")+"“ vom "+fmtDatum(a.datum)+") wird endgültig entfernt. "+
      "Wenn du ihn nur zuklappen willst: „weniger“ statt „Löschen“.",
      "Endgültig löschen", () => {
        Store.data.aktivitaeten = Store.data.aktivitaeten.filter(x=>x.id!==aDel);
        Store.save(); if(vid) vorgangOeffnen(vid); toast("Eintrag gelöscht");
      });
    return;
  }
  const oDel = t.getAttribute("data-objekt-del");
  if(oDel){
    const x = DB.firma(LayerCtx.firmaId); firmaFelderLesen(x);
    Store.data.objekte = Store.data.objekte.filter(o=>o.id!==oDel);
    Store.data.vorgaenge.forEach(v=>{ if(v.objektId===oDel) v.objektId=""; });
    Store.save(); firmaOeffnen(x.id); return;
  }

  const act = t.getAttribute("data-act");
  if(act) aktion(act, t);
});

function aktion(act, el){
  const V = () => DB.vorgang(LayerCtx.vorgangId);
  const F = () => DB.firma(LayerCtx.firmaId);

  switch(act){
    /* --- Vorgang --- */
    case "vorgang-neu": {
      if(!Store.data.firmen.length){
        toast("Erst eine Firma anlegen – ein Vorgang hängt immer an einer Firma");
        go("firmen"); return;
      }
      const v = neuerVorgang({ firmaId:"", titel:"", entwurf:true });
      vorgangOeffnen(v.id); return;
    }
    case "vorgang-fuer-firma": {
      const x = F(); firmaFelderLesen(x);
      Store.save(); layerSchliessen(); render();
      const v = neuerVorgang({ firmaId:x.id, kontaktweg:x.kontaktweg||"Aktiv", titel:"", entwurf:true });
      vorgangOeffnen(v.id); return;
    }
    case "vorgang-speichern": {
      const v = V();
      vorgangFelderLesen(v);            /* Automatik laeuft dort mit */
      if(!v.firmaId){ toast("Bitte erst die Firma wählen"); return; }
      if(!v.titel.trim()) v.titel = "Ohne Titel";
      /* B17: noch nicht eingetragene Notiz nicht verlieren */
      const aT = $("#aText"), nText = aT ? aT.value.trim() : "";
      if(nText){
        const aTyp = $("#aTyp"), aDat = $("#aDatum");
        neueAktivitaet({ vorgangId:v.id, typ:aTyp?aTyp.value:"Notiz",
          datum:(aDat&&aDat.value)||ISO(new Date()), text:nText });
      }
      delete v.entwurf;
      Store.save(); layerSchliessen(); render();
      toast(nText ? "Gespeichert · Notiz eingetragen" : "Gespeichert"); return;
    }
    case "vorgang-loeschen": {
      const v = V();
      bestaetigen("Vorgang löschen?", "„"+(v.titel||"Ohne Titel")+"“ wird mit allen Aktivitäten entfernt. Die Firma bleibt bestehen.",
        "Löschen", ()=>{ vorgangLoeschen(v.id); Store.save(); render(); toast("Vorgang gelöscht"); });
      return;
    }
    case "gewonnen": { const v=V(); vorgangFelderLesen(v); abschlussDialog(v,"gewonnen"); return; }
    case "verloren": { const v=V(); vorgangFelderLesen(v); abschlussDialog(v,"verloren"); return; }
    case "abschluss-zuruck": {
      const v=V(); vorgangFelderLesen(v);
      abschlussTermineAbhaken(v);
      v.ergebnis=""; v.absagegrund=""; v.stufe="nachfass";
      Store.save(); vorgangOeffnen(v.id); render(); return;
    }
    case "wv-neu": {
      const v=V(); vorgangFelderLesen(v);
      wvSetzen(v, plusTage(7), "Nachfassen");
      Store.save(); vorgangOeffnen(v.id); render(); return;
    }
    /* --- Termine --- */
    case "angebot-heute": {
      const v = V();
      const inp = $("#vAngebotAm"); if(inp) inp.value = ISO(new Date());
      const altAngebot = v.angebotAm;
      vorgangFelderLesen(v);            /* Automatik laeuft dort mit */
      if(!inp){
        v.angebotAm = ISO(new Date());
        const m = terminAutomatik(v, v.frist, altAngebot);
        if(m) AutoMeldung = m;
      }
      delete v.entwurf;
      Store.save(); vorgangOeffnen(v.id); render();
      toast("Abgabedatum auf heute gesetzt"); return;
    }
    case "wv-frist": {
      const v = V(); vorgangFelderLesen(v);
      if(!v.frist){ toast("Erst ein Abgabedatum eintragen"); return; }
      let tag = plusTage(-3, v.frist);
      if(tageBis(tag) < 0) tag = ISO(new Date());
      wvSetzen(v, tag, "Angebot vor Frist "+fmtDatum(v.frist)+" abgeben");
      Store.save(); vorgangOeffnen(v.id); render();
      toast("Wiedervorlage am "+fmtDatum(tag)); return;
    }

    /* --- E-Mail-Vorlagen --- */
    case "vl-speichern": {
      vorlagenFelderLesen();
      ladeToast("Vorlagen werden gespeichert…");
      Vorlagen.sichern().then(fehler => {
        ladeToastWeg();
        render();
        window.scrollTo(0,0);
        toast(fehler ? "Nicht in Supabase gespeichert – siehe Meldung oben"
                     : "Vorlagen gespeichert und gegengelesen");
      });
      return;
    }
    case "vl-standard": {
      const i = (Number(el.getAttribute("data-stufe"))||1)-1;
      vorlagenFelderLesen();
      Vorlagen.aktuell().stufen[i] = Vorlagen.standard().stufen[i];
      Vorlagen.sichern().then(()=>{ render(); toast("Stufe "+(i+1)+" zurückgesetzt"); });
      return;
    }
    case "vl-alle-standard": {
      bestaetigen("Alle Vorlagen zurücksetzen?",
        "Deine geänderten Texte werden durch die Auslieferungstexte ersetzt.",
        "Zurücksetzen", () => {
          Vorlagen.daten = Vorlagen.standard();
          Vorlagen.sichern().then(()=>{ render(); toast("Vorlagen zurückgesetzt"); });
        });
      return;
    }
    case "vl-pruefen":       { vorlagenFelderLesen(); vorlagenPruefenZeigen(); return; }
    case "vl-datei-sichern": { vorlagenDateiSichern(); return; }
    case "vl-datei-laden":   { const i=$("#vlDatei"); if(i) i.click(); return; }
    case "vl-vorschau": {
      vorlagenFelderLesen();
      vorlagenVorschau(Number(el.getAttribute("data-stufe"))||1);
      return;
    }

    /* --- Nachfassen --- */
    case "nachfass":            { nachfassOeffnen(Number(el.getAttribute("data-stufe"))||1); return; }
    case "nachfass-los":        { const s=$("#nfStufe"); nachfassOeffnen(s?Number(s.value)||1:1); return; }
    case "nachfass-zurueck":    { const id=LayerCtx.vorgangId; layerZurueck(()=>vorgangOeffnen(id)); return; }
    case "nachfass-outlook":    { nachfassOutlook(); return; }
    case "nachfass-kopieren":   { nachfassKopieren(); return; }
    case "nachfass-eingetragen":{ nachfassEingetragen(); return; }

    case "wv-vertragsende": {
      const v=V(); vorgangFelderLesen(v);
      if(!v.vertragsendeWettbewerb){ toast("Erst ein Datum für das Vertragsende eintragen"); return; }
      const gross = /klinik|krankenhaus|mvz/i.test(DB.firmaName(v.firmaId)+" "+v.titel);
      const monate = gross ? 9 : 4;
      const d = new Date(v.vertragsendeWettbewerb); d.setMonth(d.getMonth()-monate);
      wvSetzen(v, ISO(d), "Vor Vertragsende Wettbewerb ansprechen");
      Store.save(); vorgangOeffnen(v.id); render();
      toast(monate+" Monate vor Vertragsende vorgemerkt");
      return;
    }
    /* --- Gesprächsleitfaden (Abschnitt 7) --- */
    case "leitfaden": {
      const v=V(); vorgangFelderLesen(v);
      if(!v.firmaId){ toast("Bitte erst die Firma wählen"); return; }
      if(!v.titel.trim()) v.titel = "Ohne Titel";
      delete v.entwurf;
      Store.save(); leitfadenOeffnen(v.id); return;
    }
    /* --- Eingegangene E-Mail --- */
    case "mail-ansehen":          { mailAnsichtOeffnen(); return; }
    case "mail-ansicht-speichern":{ mailAnsichtSpeichern(); return; }
    case "mail-ansicht-kopieren": { mailAnsichtKopieren(); return; }
    case "mail-ansicht-zurueck":  { const id=LayerCtx.vorgangId; layerZurueck(()=>vorgangOeffnen(id)); return; }

    case "leit-zurueck":  { const id=LayerCtx.vorgangId; layerZurueck(()=>vorgangOeffnen(id)); return; }
    case "leit-kopieren": { leitKopieren(); return; }
    case "leit-erreicht": { leitErgebnis("erreicht"); return; }
    case "leit-nicht":    { leitErgebnis("nicht");    return; }
    case "leit-termin":   { leitErgebnis("termin");   return; }
    case "leit-kein":     { leitErgebnis("kein");     return; }

    /* --- Anhänge --- */
    case "anh-waehlen": {
      const v = V();
      if(v && v.entwurf){ toast("Bitte den Vorgang erst speichern"); return; }
      const inp = $("#anhInput"); if(inp) inp.click(); return;
    }
    case "anh-oeffnen":  { anhOeffnen(el.getAttribute("data-anh")); return; }
    case "anh-loeschen": { anhLoeschenFragen(el.getAttribute("data-anh")); return; }

    case "akt-neu": { $("#aktForm").classList.remove("hidden"); $("#aText").focus(); return; }
    case "akt-abbrechen": { $("#aktForm").classList.add("hidden"); return; }
    case "akt-speichern": {
      const v=V(); vorgangFelderLesen(v);
      const text = $("#aText").value.trim();
      if(!text){ toast("Bitte kurz eintragen, was passiert ist"); return; }
      /* B17: Ein Entwurf wuerde beim Schliessen samt Notiz verworfen.
         Mit gewaehlter Firma gilt der Vorgang deshalb ab hier als gespeichert. */
      let neu = false;
      if(v.entwurf){
        if(!v.firmaId){ toast("Bitte erst die Firma wählen, sonst kann die Notiz nicht gespeichert werden"); return; }
        if(!(v.titel||"").trim()) v.titel = "Ohne Titel";
        delete v.entwurf; neu = true;
      }
      neueAktivitaet({ vorgangId:v.id, typ:$("#aTyp").value, datum:$("#aDatum").value||ISO(new Date()), text });
      Store.save(); vorgangOeffnen(v.id); render();
      toast(neu ? "Eingetragen · Vorgang gespeichert" : "Eingetragen"); return;
    }

    /* --- Firma --- */
    case "firma-neu": { const x = neueFirma({ entwurf:true }); firmaOeffnen(x.id); return; }
    case "firma-speichern": {
      const x = F(); firmaFelderLesen(x);
      if(!x.name.trim()){ toast("Bitte einen Firmennamen eintragen"); return; }
      delete x.entwurf;
      Store.save(); layerSchliessen(); render(); toast("Gespeichert"); return;
    }
    case "firma-loeschen": {
      const x = F();
      const n = DB.vorgaengeVon(x.id).length, o = DB.objekteVon(x.id).length;
      bestaetigen("Firma löschen?", x.name+" wird entfernt"+(n||o?", dazu "+o+" Objekte und "+n+" Vorgänge":"")+".",
        "Löschen", ()=>{ firmenLoeschen([x.id]); Store.save(); layerSchliessen(); render(); toast("Firma gelöscht"); });
      return;
    }
    case "objekt-neu": {
      const x = F(); firmaFelderLesen(x);
      const o = neuesObjekt({ firmaId:x.id, name:"", strasse:x.strasse, plz:x.plz, ort:x.ort });
      Store.save();
      objektOeffnen(x.id, o.id);
      const feld = $("#oName"); if(feld) feld.focus();
      return;
    }
    case "objekt-speichern": {
      const o = DB.objekt(LayerCtx.objektId); if(!o) return;
      objektFelderLesenModal(o);
      Store.save(); firmaOeffnen(LayerCtx.firmaId); return;
    }
    case "objekt-zurueck": { const id=LayerCtx.firmaId; layerZurueck(()=>firmaOeffnen(id)); return; }
    case "objekt-loeschen": {
      const oid = LayerCtx.objektId, fid = LayerCtx.firmaId;
      Store.data.objekte = Store.data.objekte.filter(o=>o.id!==oid);
      Store.data.vorgaenge.forEach(v=>{ if(v.objektId===oid) v.objektId=""; });
      Store.save(); firmaOeffnen(fid); toast("Objekt gelöscht"); return;
    }
    case "brief-vermerk": {
      const x = F(); firmaFelderLesen(x);
      x.briefe = x.briefe || [];
      x.briefe.push({ id:uid(), datum:ISO(new Date()), anlass:"Anschreiben" });
      Store.save(); firmaOeffnen(x.id); toast("Vermerk gesetzt – kein Vorgang angelegt"); return;
    }

    /* --- Auswahl in der Tabelle --- */
    case "ausserhalb": {
      /* Zeigt genau die Firmen, deren PLZ nicht im eigenen Gebiet liegt.
         Firmen ohne PLZ bleiben aussen vor, die muessen von Hand geprueft
         werden und sollen nicht versehentlich mitgeloescht werden. */
      const war = App.firmenFilter.plz === "!"+RHEINMAIN_VON+"-"+RHEINMAIN_BIS;
      App.firmenFilter.plz = war ? "" : "!"+RHEINMAIN_VON+"-"+RHEINMAIN_BIS;
      App.auswahl.clear();
      render();
      if(!war){
        const n = firmenGefiltert().length;
        toast(n ? n+" Firma"+(n>1?"n":"")+" außerhalb Rhein-Main – prüfen und ggf. löschen"
                : "Keine Firma außerhalb Rhein-Main");
      }
      return;
    }
    case "weg-aktiv": case "weg-passiv": {
      /* Kontaktweg fuer die ganze Auswahl setzen, ohne jede Firma zu oeffnen. */
      const ziel = act === "weg-aktiv" ? "Aktiv" : "Passiv";
      let geaendert = 0;
      for (const f of Store.data.firmen){
        if(App.auswahl.has(f.id) && f.kontaktweg !== ziel){ f.kontaktweg = ziel; geaendert++; }
      }
      if(geaendert){ Store.save(); render(); toast(geaendert+" auf "+ziel+" gesetzt"); }
      else toast("Alle stehen schon auf "+ziel);
      return;
    }
    case "auswahl-alle": { firmenGefiltert().forEach(x=>App.auswahl.add(x.id)); render(); return; }
    case "auswahl-leeren": { App.auswahl.clear(); render(); return; }
    case "filter-zuruecksetzen": {
      for (const k of Object.keys(App.firmenFilter)) App.firmenFilter[k] = "";
      render(); return;
    }
    case "auswahl-sichtbar": {
      /* Alles verwerfen, was der aktuelle Filter nicht zeigt. */
      const sicht = new Set(firmenGefiltert().map(x=>x.id));
      let weg = 0;
      for (const id of [...App.auswahl]) if(!sicht.has(id)){ App.auswahl.delete(id); weg++; }
      render();
      toast(weg+" versteckte Markierung"+(weg===1?"":"en")+" entfernt");
      return;
    }
    case "dub-pruefen": { dublettenZeigen(); return; }
    case "auswahl-loeschen": {
      const ids = [...App.auswahl];
      const geschuetzt = ids.filter(firmaHatVorgaenge);
      const loeschbar  = ids.filter(id => !firmaHatVorgaenge(id));

      if(!loeschbar.length){
        toast(geschuetzt.length===1
          ? "Diese Firma hat einen Vorgang und bleibt stehen"
          : "Alle "+geschuetzt.length+" haben Vorgänge und bleiben stehen");
        return;
      }

      let text = loeschbar.length+" Firmen werden entfernt, samt ihrer Objekte.";
      if(geschuetzt.length){
        const namen = geschuetzt.slice(0,5)
          .map(id => { const f=DB.firma(id); return f?f.name:""; })
          .filter(Boolean).join(", ");
        text += " "+geschuetzt.length+(geschuetzt.length===1?" Firma bleibt":" Firmen bleiben")+
          " stehen, weil dort Vorgänge hängen"+(namen?": "+namen:"")+
          (geschuetzt.length>5?" und weitere":"")+
          ". Die lassen sich nur einzeln löschen.";
      }
      text += " Vorher wird eine Sicherung heruntergeladen.";

      bestaetigen(loeschbar.length+" Firmen löschen?", text, "Endgültig löschen",
        ()=>{
          sicherungHerunterladen("vor-loeschen");
          firmenLoeschen(loeschbar);
          App.auswahl.clear(); Store.save(); render();
          toast(loeschbar.length+" Firmen gelöscht"+
            (geschuetzt.length?", "+geschuetzt.length+" mit Vorgängen behalten":""));
        });
      return;
    }
    case "filter-reset": { App.firmenFilter={name:"",branche:"",gruppe:"",segment:"",kontaktweg:"",status:"",quelle:"",ort:"",plz:""}; render(); return; }

    /* --- Serienbrief Track Passiv (Abschnitt 9b) --- */
    case "serienbrief": { serienbriefExport([...App.auswahl]); return; }
    case "digitalpost": { digitalpostExport([...App.auswahl]); return; }
    case "brief-sammelvermerk": {
      const ids = [...App.auswahl];
      bestaetigen("Brief vermerken?",
        "Bei "+ids.length+" Firmen wird „Brief verschickt am "+fmtDatum(ISO(new Date()))+"“ eingetragen. "+
        "Es entsteht kein Vorgang – nur der Vermerk an der Firma.",
        "Vermerk setzen", ()=>{ briefVermerkSetzen(ids); });
      return;
    }

    /* --- Import --- */
    case "import-oeffnen": { importOeffnen(); return; }
    case "imp-lesen": {
      const datei = $("#impDatei").files[0];
      const ausText = text => {
        const zeilen = tabelleParsen(text, trennzeichenRaten(text));
        if(zeilen.length < 2){ toast("Zu wenig Daten – Überschriften plus mindestens eine Zeile"); return; }
        zeilenUebernehmen(zeilen);
      };
      if(datei && /\.(xlsx|xlsm)$/i.test(datei.name)){
        datei.arrayBuffer()
          .then(xlsxLesen)
          .then(blaetter => {
            if(!blaetter.length){ toast("Keine Daten gefunden – enthält die Datei Überschriften plus Zeilen?"); return; }
            Import.blaetter = blaetter;
            if(blaetter.length===1) zeilenUebernehmen(blaetter[0].zeilen);
            else blattAuswahlZeigen();
          })
          .catch(e => toast(e.message || "Datei nicht lesbar"));
        return;
      }
      if(datei){ const r=new FileReader(); r.onload=()=>ausText(String(r.result)); r.readAsText(datei,"utf-8"); return; }
      const t = $("#impText").value.trim();
      if(!t){ toast("Datei wählen oder Text einfügen"); return; }
      ausText(t);
      return;
    }
    case "blatt-waehlen": {
      zeilenUebernehmen(Import.blaetter[Number(el.getAttribute("data-blatt"))].zeilen);
      return;
    }
    case "imp-zurueck": { importOeffnen(); return; }
    case "imp-start": { importAusfuehren(); return; }

    case "vorlage": {
      const spalten = ["Firmenname","Branche","Kontaktweg","Status","Quelle","Ansprechpartner","Telefon",
                       "E-Mail","Website","Strasse","Hausnummer","PLZ","Ort","Notiz"];
      const beispiel = ["BEISPIEL – diese Zeile löschen","Medizin","Aktiv","Interessent","Bestandskunde","Frau Weber",
                        "069/123456","weber@beispiel.de","https://beispiel.de","Hauptstrasse","12","60311","Frankfurt",""];
      /* BOM voran, sonst zeigt Excel die Umlaute falsch an */
      const csv = "\ufeff" + [spalten, beispiel].map(z=>z.join(";")).join("\r\n") + "\r\n";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      a.download = "AQT-Vorlage-Firmenliste.csv";
      a.click(); URL.revokeObjectURL(a.href);
      toast("Vorlage heruntergeladen – Beispielzeile vor dem Import löschen");
      return;
    }

    /* --- Einstellungen --- */
    case "sb-erneut": {
      if(!Auth.eingeloggt()){ toast("Nicht angemeldet"); return; }
      Sync.fehler = null; Sync.anstossen();
      setTimeout(()=>render(), 1200);
      toast("Übertragung angestossen");
      return;
    }
    case "sb-neuladen": {
      if(!Auth.eingeloggt()){ toast("Nicht angemeldet"); return; }
      bestaetigen("Aus Supabase neu laden?",
        "Nicht übertragene Änderungen gehen dabei verloren.",
        "Neu laden",
        ()=>{ sbLaden().then(()=>{ Sync.grundstellung(); render(); toast("Stand aus Supabase geladen"); })
                       .catch(e=>toast("Fehler: "+e.message)); });
      return;
    }
    case "export": { sicherungHerunterladen(); toast("Sicherung heruntergeladen"); return; }
    case "import-json": {
      const inp = document.createElement("input");
      inp.type="file"; inp.accept=".json";
      inp.onchange = () => {
        const f = inp.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = () => {
          try{
            const d = JSON.parse(String(r.result));
            if(!d.firmen) throw new Error("kein AQT-Format");
            /* Zusammenfuehren statt ersetzen: nur Datensaetze ergaenzen, die
               (per id) noch fehlen. So kann eine Sicherung gefahrlos
               eingespielt werden, ohne vorhandene Daten zu loeschen. */
            let ergaenzt = 0;
            for(const schluessel of ["firmen","objekte","vorgaenge","aktivitaeten","anhaenge"]){
              if(!Array.isArray(Store.data[schluessel])) Store.data[schluessel] = [];
              const da = new Set(Store.data[schluessel].map(x=>x.id));
              for(const rec of (d[schluessel]||[])){
                if(rec && rec.id && !da.has(rec.id)){ Store.data[schluessel].push(rec); da.add(rec.id); ergaenzt++; }
              }
            }
            Store.save(); render();
            toast(ergaenzt+" Einträge aus der Sicherung ergänzt");
          }catch(err){ toast("Datei nicht lesbar: "+err.message); }
        };
        r.readAsText(f);
      };
      inp.click(); return;
    }
    case "reset": {
      bestaetigen("Alles löschen?","Sämtliche Firmen, Objekte, Vorgänge und Aktivitäten werden entfernt. Vorher exportieren?",
        "Alles löschen", ()=>{ Store.replaceAll(Store.empty()); render(); toast("Zurückgesetzt"); });
      return;
    }
  }
}

  if(e.target.id==="chkAll"){
    const ids = firmenGefiltert().map(x=>x.id);

/* ---------- Places-Aufrufe (aus v5.4) -------------------------- */
const FIELDMASK = "nextPageToken,places.id,places.displayName,places.formattedAddress,"+
  "places.nationalPhoneNumber,places.websiteUri,places.types,places.addressComponents,"+
  "places.primaryTypeDisplayName,places.rating,places.userRatingCount";

function apiKeyClean(){ return Suche.key.replace(/[^A-Za-z0-9_-]/g,""); }

function placesTextSearch(query, opts){
  opts = opts||{};
  const body = { textQuery:query, languageCode:"de", regionCode:"DE", pageSize:20 };
  if(opts.pageToken) body.pageToken = opts.pageToken;
  if(opts.rect) body.locationRestriction = { rectangle:opts.rect };
  if(opts.typ){ body.includedType = opts.typ; body.strictTypeFiltering = true; }
  return fetch("https://places.googleapis.com/v1/places:searchText",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Goog-Api-Key":apiKeyClean(),"X-Goog-FieldMask":FIELDMASK},
    body:JSON.stringify(body)
  }).then(res => res.text().then(txt => {
    if(!res.ok) throw new Error("HTTP "+res.status+": "+txt.slice(0,200));
    entHoch(); return JSON.parse(txt);
  }));
}

function placesNearby(lat,lng,radiusM){
  const body = { maxResultCount:20, rankPreference:"DISTANCE", languageCode:"de", regionCode:"DE",
    locationRestriction:{ circle:{ center:{latitude:lat,longitude:lng}, radius:radiusM } } };
  return fetch("https://places.googleapis.com/v1/places:searchNearby",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Goog-Api-Key":apiKeyClean(),
      "X-Goog-FieldMask":FIELDMASK.replace("nextPageToken,","")},
    body:JSON.stringify(body)
  }).then(res => res.text().then(txt => {
    if(!res.ok) throw new Error("HTTP "+res.status+": "+txt.slice(0,200));
    entHoch(); return JSON.parse(txt);
  }));
}

async function geocode(q){
  const res = await fetch("https://places.googleapis.com/v1/places:searchText",{
    method:"POST",
    headers:{"Content-Type":"application/json","X-Goog-Api-Key":apiKeyClean(),
      "X-Goog-FieldMask":"places.location,places.formattedAddress"},
    body:JSON.stringify({textQuery:q, languageCode:"de", regionCode:"DE", pageSize:1})});
  const txt = await res.text();
  if(!res.ok) throw new Error("Geokodierung fehlgeschlagen (HTTP "+res.status+"): "+txt.slice(0,150));
  const p = (JSON.parse(txt).places||[])[0];
  if(!p || !p.location) throw new Error("Ort „"+q+"“ nicht gefunden.");
  return { lat:p.location.latitude, lng:p.location.longitude, label:p.formattedAddress||q };
}

function rectAround(lat,lng,km){
  const dLat = km/111.0, dLng = km/(111.0*Math.cos(lat*Math.PI/180));
  return { low:{latitude:lat-dLat,longitude:lng-dLng}, high:{latitude:lat+dLat,longitude:lng+dLng} };
}
function splitRect(r){
  const mLat=(r.low.latitude+r.high.latitude)/2, mLng=(r.low.longitude+r.high.longitude)/2;
  return [
    {low:{latitude:r.low.latitude,longitude:r.low.longitude},high:{latitude:mLat,longitude:mLng}},
    {low:{latitude:r.low.latitude,longitude:mLng},high:{latitude:mLat,longitude:r.high.longitude}},
    {low:{latitude:mLat,longitude:r.low.longitude},high:{latitude:r.high.latitude,longitude:mLng}},
    {low:{latitude:mLat,longitude:mLng},high:{latitude:r.high.latitude,longitude:r.high.longitude}}
  ];
}
function rectBreiteKm(r){ return (r.high.latitude-r.low.latitude)*111; }
function normStr(s){
  return (s||"").toLowerCase().replace(/\s|-/g,"").replace(/str\.?$/,"straße").replace(/strasse/g,"straße");
}

/* ---------- Treffer aufnehmen (aus v5.4) ----------------------- */
function parseAddress(comps){
  const out = { strasse:"", nummer:"", plz:"", stadt:"" };
  if(!comps) return out;
  comps.forEach(c => {
    const t = c.types||[], v = c.longText||c.shortText||"";
    if(t.indexOf("route")>-1) out.strasse = v;
    else if(t.indexOf("street_number")>-1) out.nummer = v;
    else if(t.indexOf("postal_code")>-1) out.plz = v;
    else if(t.indexOf("locality")>-1) out.stadt = v;
    else if(t.indexOf("postal_town")>-1 && !out.stadt) out.stadt = v;
  });
  return out;
}
function istMitbewerber(name, types){
  const hay = ((name||"")+" "+(types||[]).join(" ")).toLowerCase();
  return Suche.comp.some(w => { w = String(w).trim().toLowerCase(); return w && hay.indexOf(w)>-1; });
}
function aufnehmen(p, branche, seen, strNorm){
  const c = Suche.zaehler;
  const name = (p.displayName && p.displayName.text) || "";
  const a = parseAddress(p.addressComponents);
  if(strNorm && normStr(a.strasse)!==strNorm) return;      // Nachbarstraße – ignorieren
  if(istMitbewerber(name, p.types)){ c.comp++; return; }
  if(seen[p.id]){ c.dup++; return; }
  seen[p.id] = true; c.hit++;
  Suche.found.push({
    place_id:p.id, firma:name,
    branche: branche || (p.primaryTypeDisplayName && p.primaryTypeDisplayName.text) || "",
    strasse:a.strasse, nummer:a.nummer, plz:a.plz, stadt:a.stadt,
    telefon:p.nationalPhoneNumber||"", website:p.websiteUri||"",
    bewertungen:p.userRatingCount||0, sterne:p.rating||0,
    adresse:p.formattedAddress||""
  });
}

/* ---------- Enterprise-Kontingent (1.000 gratis/Monat) --------- */
function entMonat(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function entLesen(){
  let q; try{ q = JSON.parse(localStorage.getItem("acs_ent_quota")||"{}"); }catch(e){ q={}; }
  if(!q || q.monat!==entMonat()) q = { monat:entMonat(), n:0 };
  return q;
}
function entHoch(){
  Suche.entRun++;
  const q = entLesen(); q.n++;
  try{ localStorage.setItem("acs_ent_quota", JSON.stringify(q)); }catch(_){}
  zaehlerAnzeigen();
}

function fortschritt(p){ const b=$("#suchBar"); if(b) b.style.width = Math.round(p*100)+"%"; }

/* ---------- Modus 1: Branchen-Suche mit Kachel-Verfeinerung ---- */
async function sucheBranchen(seen){
  const c = Suche.zaehler;
  if(!Suche.branchen.length){ toast("Bitte mindestens eine Branche wählen"); return; }
  const ortQ = Suche.e.ort.trim();
  if(!ortQ){ toast("Bitte einen Mittelpunkt eingeben"); return; }
  const radius = Math.min(60, Math.max(1, parseFloat(Suche.e.radius)||10));
  const maxReq = Math.max(10, parseInt(Suche.e.maxReq,10)||300);

  suchLog("Ermittle Koordinaten für „"+ortQ+"“ …");
  const geo = await geocode(ortQ); c.req++; zaehlerAnzeigen();
  suchLog("✓ Mittelpunkt: "+geo.label, "ok");
  if(!confirm("Branchen-Suche starten?\n\n"+Suche.branchen.length+" Branchen im Umkreis von "+radius+
     " km um:\n"+geo.label+"\n\nMindestens "+Suche.branchen.length+
     " Anfragen, bei vollen Gebieten automatisch mehr.\nAnfragen-Limit: "+maxReq)){
    suchLog("Vom Benutzer abgebrochen."); return;
  }

  const startRect = rectAround(geo.lat, geo.lng, radius);
  for(let bi=0; bi<Suche.branchen.length && !Suche.stop && c.req<maxReq; bi++){
    const bName = Suche.branchen[bi], info = brancheInfo(bName);
    let typ = info.typ;
    const queue = [startRect], hitsVor = c.hit;
    while(queue.length && !Suche.stop && c.req<maxReq){
      const rect = queue.shift();
      let token = null, pages = 0, geliefert = 0;
      do{
        let data;
        try{
          data = await placesTextSearch(info.suche, { rect, typ, pageToken:token });
        }catch(e){
          if(typ && e.message.indexOf("HTTP 400")===0){
            suchLog("Typ-Filter „"+typ+"“ abgelehnt – "+bName+" läuft ohne Typ-Filter weiter.","err");
            typ = null;
            data = await placesTextSearch(info.suche, { rect, pageToken:token });
          } else { throw e; }
        }
        c.req++;
        const places = data.places||[];
        geliefert += places.length;
        places.forEach(p => aufnehmen(p, bName, seen, null));
        zaehlerAnzeigen();
        token = data.nextPageToken||null; pages++;
        if(token && pages<3 && !Suche.stop && c.req<maxReq) await warte(1600);
      } while(token && pages<3 && !Suche.stop && c.req<maxReq);

      if(geliefert>=60 && rectBreiteKm(rect)>1.2 && c.req<maxReq && !Suche.stop){
        splitRect(rect).forEach(q => queue.push(q));
        c.tile++; zaehlerAnzeigen();
        suchLog("↻ "+bName+": Gebiet voll (60 geliefert) – in 4 Kacheln verfeinert ("+queue.length+" offen).");
      }
    }
    suchLog("✓ "+bName+": "+(c.hit-hitsVor)+" neue Treffer.","ok");
    fortschritt((bi+1)/Suche.branchen.length);
    foundTabelleFuellen();
  }
  if(c.req>=maxReq) suchLog("⚠ Anfragen-Limit ("+maxReq+") erreicht – Suche beendet.","err");
}

/* ---------- Modus 2: Straßen-Scan (alle Firmen) ---------------- */
async function sucheStrasse(seen){
  const c = Suche.zaehler;
  const str = Suche.e.strasse.trim(), ort = Suche.e.scanOrt.trim();
  if(!str || !ort){ toast("Bitte Strasse und Ort eingeben"); return; }
  const radius = Math.min(2000, Math.max(50, parseInt(Suche.e.scanRadius,10)||300));
  const strNorm = Suche.e.nurStrasse ? normStr(str) : null;

  suchLog("Ermittle Koordinaten für „"+str+", "+ort+"“ …");
  const geo = await geocode(str+", "+ort); c.req++; zaehlerAnzeigen();
  suchLog("✓ Start: "+geo.label,"ok");

  const queue = [{lat:geo.lat, lng:geo.lng, r:radius}], visited = {};
  let doneN = 0;
  while(queue.length && !Suche.stop){
    const k = queue.shift();
    const vkey = k.lat.toFixed(4)+"/"+k.lng.toFixed(4)+"/"+Math.round(k.r);
    if(visited[vkey]) continue; visited[vkey] = true;
    let data;
    try{ data = await placesNearby(k.lat, k.lng, k.r); }
    catch(e){ suchLog("✗ Umkreis-Anfrage: "+e.message,"err"); break; }
    c.req++;
    const places = data.places||[];
    places.forEach(p => aufnehmen(p, null, seen, strNorm));
    zaehlerAnzeigen(); doneN++;

    if(places.length>=20 && k.r>60){
      const r2 = Math.round(k.r/2);
      const dLat = (k.r*0.5)/111000, dLng = (k.r*0.5)/(111000*Math.cos(k.lat*Math.PI/180));
      queue.push({lat:k.lat,        lng:k.lng,        r:r2});
      queue.push({lat:k.lat+dLat,   lng:k.lng,        r:r2});
      queue.push({lat:k.lat-dLat,   lng:k.lng,        r:r2});
      queue.push({lat:k.lat,        lng:k.lng+dLng,   r:r2});
      queue.push({lat:k.lat,        lng:k.lng-dLng,   r:r2});
      c.tile++; zaehlerAnzeigen();
      suchLog("↻ Kreis voll (20 geliefert) – verfeinert auf "+r2+" m Umkreis.");
    } else {
      suchLog("✓ Kreis "+doneN+": "+places.length+" geliefert.","ok");
    }
    fortschritt(doneN/(doneN+queue.length));
    foundTabelleFuellen();
    if(queue.length) await warte(250);
  }
}

/* ---------- Start / Stopp -------------------------------------- */
async function sucheStarten(){
  if(!Suche.key.trim()){ toast("Bitte erst den API-Key eintragen"); return; }
  Suche.sichern();
  Suche.zaehler = { req:0, hit:0, comp:0, dup:0, tile:0 };
  Suche.entRun = 0; Suche.stop = false; Suche.laeuft = true;
  Suche.logZeilen = [];
  const l = $("#suchLog"); if(l) l.innerHTML = "";
  fortschritt(0); zaehlerAnzeigen(); knoepfeAnzeigen();

  /* Was schon in der Firmenliste steht, gilt als gesehen */
  const seen = {};
  Suche.found.forEach(f => seen[f.place_id] = true);

  if(/[^A-Za-z0-9_-]/.test(Suche.key))
    suchLog("Hinweis: API-Key enthält ungültige Zeichen (Leerzeichen/Umbruch?) – sie werden ignoriert.","err");

  try{
    if(Suche.modus==="B") await sucheBranchen(seen);
    else await sucheStrasse(seen);
    const c = Suche.zaehler;
    suchLog((Suche.stop?"Abgebrochen":"Fertig")+": "+c.hit+" neue Treffer, "+c.req+" Anfragen.",
      Suche.stop?"err":"ok");
  }catch(e){
    suchLog("✗ "+e.message, "err");
  }
  Suche.laeuft = false;
  knoepfeAnzeigen(); foundTabelleFuellen();
}

function knoepfeAnzeigen(){
  const s = $("#suchBtn"), st = $("#stopBtn");
  if(s){ s.disabled = Suche.laeuft; s.textContent = Suche.laeuft ? "Suche läuft …" : "Suchen"; }
  if(st) st.style.display = Suche.laeuft ? "" : "none";
}

function foundGefiltert(){
  const min = parseInt(Suche.e.minBew,10)||0;
  return Suche.found.filter(f => (f.bewertungen||0) >= min)
                    .sort((a,b) => (b.bewertungen||0)-(a.bewertungen||0));
}
function schonErfasst(){
  const m = new Set();
  Store.data.firmen.forEach(f =>
    m.add((f.name||"").toLowerCase().trim()+"|"+(f.ort||"").toLowerCase().trim()));
  return m;
}
function foundTabelleFuellen(){

  const kopf = $("#foundKopf");
  if(kopf) kopf.textContent = liste.length + (liste.length!==Suche.found.length ? " von "+Suche.found.length : "");

  if(!liste.length){
    tb.innerHTML = '<tr><td colspan="7" style="padding:24px;text-align:center;color:var(--ink-2)">'+
      (Suche.found.length ? "Kein Treffer über dem Bewertungsfilter." : "Noch nichts gefunden.")+"</td></tr>";

  }
  tb.innerHTML = liste.map(f => {
    const alt = bekannt.has((f.firma||"").toLowerCase().trim()+"|"+(f.stadt||"").toLowerCase().trim());

      '<td class="cellname">'+esc(f.firma)+(alt?' <span class="chip">schon erfasst</span>':"")+"</td>"+
      "<td>"+esc(f.branche||"")+'<div class="tiny muted">'+esc(brancheVorschlag(f.branche||f.firma))+" · "+
        esc(wegVorschlag((f.branche||"")+" "+f.firma))+"</div></td>"+
      '<td class="mono" style="text-align:right;white-space:nowrap">'+
        (f.bewertungen? "<b>"+f.bewertungen+"</b>"+(f.sterne?' <span class="muted">('+f.sterne.toFixed(1)+"★)</span>":"")
                      : '<span class="muted">–</span>')+"</td>"+
      "<td>"+esc(adr)+'<div class="tiny muted">'+esc([f.plz,f.stadt].filter(Boolean).join(" "))+"</div></td>"+
      "<td>"+esc(f.telefon||"")+"</td>"+
      "<td>"+(f.website?'<a href="'+esc(f.website)+'" target="_blank" rel="noopener">Link</a>':'<span class="muted">–</span>')+"</td>"+
    "</tr>";
  }).join("");
}

function adressenUebernehmen(){
  const liste = foundGefiltert().filter(f => Suche.auswahl.has(f.place_id));
  if(!liste.length){ toast("Keine Adressen ausgewählt"); return; }
  const bekannt = schonErfasst();
  let neu = 0, weg = 0;
  const datum = fmtDatum(ISO(new Date()));

  for (const f of liste){
    const schluessel = (f.firma||"").toLowerCase().trim()+"|"+(f.stadt||"").toLowerCase().trim();
    if(!f.firma || bekannt.has(schluessel)){ weg++; continue; }
    bekannt.add(schluessel);
    const kat = (f.branche||"")+" "+f.firma;
    const notiz = ["Aus Adresssuche übernommen am "+datum,
      f.branche ? "Google-Kategorie: "+f.branche : "",
      f.bewertungen ? f.bewertungen+" Google-Bewertungen"+(f.sterne?" ("+f.sterne.toFixed(1)+"★)":"") : ""
    ].filter(Boolean).join("\n");

    neueFirma({
      name:f.firma,
      branche: brancheVorschlag(f.branche||f.firma),
      kontaktweg: wegVorschlag(kat),
      status:"Interessent", quelle:"Google-Suche",
      telefon:f.telefon||"", website:f.website||"",
      strasse:[f.strasse,f.nummer].filter(Boolean).join(" "),
      plz:f.plz||"", ort:f.stadt||"", notiz
    });
    neu++;
  }
  /* Übernommene aus der Trefferliste entfernen, damit nichts doppelt geht */
  const rein = new Set(liste.map(f=>f.place_id));
  Suche.found = Suche.found.filter(f => !rein.has(f.place_id));
  Suche.auswahl.clear();
  Store.save();
  foundTabelleFuellen();
  toast(neu+" Firmen übernommen"+(weg?", "+weg+" übersprungen (schon erfasst)":""));
}

    '<span class="mono" id="foundKopf">0</span></h3>'+
    '<div style="margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap">'+
      '<label class="switch">ab <input type="text" data-such-feld="minBew" value="'+esc(Suche.e.minBew)+
        '" style="width:56px;padding:4px 6px"> Bewertungen</label>'+
      '<button class="btn sm" data-such-act="alle-waehlen">Alle wählen</button>'+
      '<button class="btn sm ghost" data-such-act="liste-leeren">Liste leeren</button>'+

    "</div></div>"+
    '<div class="tablewrap"><table class="data"><thead><tr>'+
      '<th style="width:34px"></th><th>Firma</th><th>Google-Kategorie → AQT</th>'+
      '<th style="text-align:right">Bew.</th><th>Adresse</th><th>Telefon</th><th>Web</th>'+
    "</tr></thead><tbody id=\"foundBody\"></tbody></table></div>"+
  "</div>";

  /* Log und Zähler aus dem letzten Lauf wiederherstellen */
  const l = $("#suchLog");

      d.textContent = z.msg; l.appendChild(d);
    });
    l.scrollTop = l.scrollHeight;
  }
  zaehlerAnzeigen(); knoepfeAnzeigen(); foundTabelleFuellen();
}

function branchChipsHTML(){
  if(!Suche.branchen.length) return '<span class="tiny muted">Keine Branche gewählt.</span>';
  return Suche.branchen.map((b,i) =>
    '<span class="chip accent">'+esc(b)+
    ' <button data-such-act="branche-weg" data-i="'+i+'" style="background:none;border:0;padding:0 0 0 2px;color:inherit;font-weight:700">✕</button></span>'
  ).join("");
}

/* ---------- Branchen-Katalog ----------------------------------- */
const KatSel = { gewaehlt:new Set(), offen:new Set(), filter:"" };

function katalogOeffnen(){
  KatSel.gewaehlt = new Set(Suche.branchen);
  KatSel.filter = "";
  layerZeigen('<div class="modal"><div class="drawer-head"><h2>Branchen-Katalog</h2>'+
    '<div style="flex:1"></div><button class="btn ghost" data-close="1">Schliessen</button></div>'+
    '<div class="drawer-body" id="katBody"></div>'+
    '<div class="drawer-foot"><button class="btn primary" data-such-act="kat-uebernehmen">Übernehmen</button>'+
    '<button class="btn ghost" data-close="1">Abbrechen</button>'+
    '<div style="flex:1"></div><span class="tiny muted" id="katAnzahl"></span></div></div>', {}, true);
  katalogFuellen();
}

function katalogFuellen(){
  const f = KatSel.filter.toLowerCase();
  let h = '<div class="field" style="margin-bottom:14px"><label>Suchen</label>'+
    '<input type="text" id="katSuche" value="'+esc(KatSel.filter)+'" placeholder="z.B. klinik"></div>';

  const gruppen = KATALOG.map(gr => ({
    g: gr.g,
    items: gr.items.filter(it => !f || it[0].toLowerCase().indexOf(f)>-1)
  })).filter(gr => gr.items.length);

  if(Suche.eigene.length){
    const eig = Suche.eigene.filter(n => !f || n.toLowerCase().indexOf(f)>-1);
    if(eig.length) gruppen.unshift({ g:"Eigene Branchen", items:eig.map(n=>[n,n,null]) });
  }

  h += gruppen.map(gr => {
    const auf = !!f || KatSel.offen.has(gr.g);
    const n = gr.items.filter(it => KatSel.gewaehlt.has(it[0])).length;
    return '<div style="border:1px solid var(--line);border-radius:6px;margin-bottom:8px">'+
      '<button data-such-act="kat-gruppe" data-g="'+esc(gr.g)+'" style="width:100%;display:flex;gap:8px;'+
        'align-items:center;background:var(--surface-2);border:0;padding:9px 12px;text-align:left;font-weight:650;font-size:13.5px">'+
        "<span>"+(auf?"▾":"▸")+"</span><span style='flex:1'>"+esc(gr.g)+"</span>"+
        (n?'<span class="chip accent">'+n+" gewählt</span>":"")+
        '<span class="tiny muted">'+gr.items.length+"</span></button>"+
      (auf ? '<div style="padding:8px 12px">'+gr.items.map(it =>
          '<label class="switch" style="display:flex;padding:3px 0">'+
          '<input type="checkbox" data-kat="'+esc(it[0])+'"'+(KatSel.gewaehlt.has(it[0])?" checked":"")+"> "+
          esc(it[0])+(it[2]?' <span class="chip ok">Typ-Filter</span>':"")+"</label>").join("")+"</div>" : "")+
    "</div>";
  }).join("");

  $("#katBody").innerHTML = h;
  const z = $("#katAnzahl"); if(z) z.textContent = KatSel.gewaehlt.size+" gewählt";
}

/* ---------- Ereignisse (eigene, damit aktion() unberührt bleibt) */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-such-act]");
  if(!t) return;
  const a = t.getAttribute("data-such-act");

  if(a==="katalog"){ katalogOeffnen(); return; }
  if(a==="kat-gruppe"){
    const g = t.getAttribute("data-g");
    KatSel.offen.has(g) ? KatSel.offen.delete(g) : KatSel.offen.add(g);
    katalogFuellen(); return;
  }
  if(a==="kat-uebernehmen"){
    Suche.branchen = [...KatSel.gewaehlt];
    Suche.sichern(); layerSchliessen(); render(); return;
  }
  if(a==="branche-add"){
    const el = $("#branchInput"), v = el ? el.value.trim() : "";
    if(!v) return;
    if(!Suche.branchen.includes(v)) Suche.branchen.push(v);
    if(!Suche.eigene.includes(v) && !KAT_MAP[v]){ Suche.eigene.push(v); buildKatMap(); }
    Suche.sichern(); render(); return;
  }
  if(a==="branche-weg"){
    Suche.branchen.splice(Number(t.getAttribute("data-i")),1);
    Suche.sichern(); render(); return;
  }
  if(a==="branchen-leeren"){ Suche.branchen = []; Suche.sichern(); render(); return; }
  if(a==="modus-B"){ Suche.modus="B"; render(); return; }
  if(a==="modus-S"){ Suche.modus="S"; render(); return; }
  if(a==="key-zeigen"){
    const el = $("#apiKey"); if(!el) return;
    el.type = el.type==="password" ? "text" : "password";
    t.textContent = el.type==="password" ? "Anzeigen" : "Verbergen"; return;
  }
  if(a==="start"){ if(!Suche.laeuft) sucheStarten(); return; }
  if(a==="stop"){ Suche.stop = true; suchLog("Stopp angefordert …","err"); return; }
  if(a==="alle-waehlen"){
    const l = foundGefiltert(), bek = schonErfasst();
    const offen = l.filter(f => !bek.has((f.firma||"").toLowerCase().trim()+"|"+(f.stadt||"").toLowerCase().trim()));
    const allesDrin = offen.length && offen.every(f => Suche.auswahl.has(f.place_id));
    offen.forEach(f => allesDrin ? Suche.auswahl.delete(f.place_id) : Suche.auswahl.add(f.place_id));
    foundTabelleFuellen(); return;
  }
  if(a==="liste-leeren"){
    bestaetigen("Trefferliste leeren?","Die gefundenen Adressen werden verworfen. Bereits übernommene Firmen bleiben.",
      "Leeren", ()=>{ Suche.found=[]; Suche.auswahl.clear(); render(); });
    return;
  }
  if(a==="uebernehmen"){ adressenUebernehmen(); return; }
});

document.addEventListener("input", e => {
  const feld = e.target.getAttribute && e.target.getAttribute("data-such-feld");
  if(feld){
    if(feld==="key"){ Suche.key = e.target.value.trim(); }
    else if(feld==="minBew"){ Suche.e.minBew = e.target.value; foundTabelleFuellen(); }
    else Suche.e[feld] = e.target.value;
    Suche.sichern();
    return;
  }
  if(e.target.id==="katSuche"){
    KatSel.filter = e.target.value;
    katalogFuellen();
    const n = $("#katSuche"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  }
});

document.addEventListener("change", e => {
  const feld = e.target.getAttribute && e.target.getAttribute("data-such-feld");
  if(feld==="merken"){ Suche.merken = e.target.checked; Suche.sichern(); return; }
  if(feld==="nurStrasse"){ Suche.e.nurStrasse = e.target.checked; Suche.sichern(); return; }

  const kat = e.target.getAttribute && e.target.getAttribute("data-kat");
  if(kat){
    e.target.checked ? KatSel.gewaehlt.add(kat) : KatSel.gewaehlt.delete(kat);
    const z = $("#katAnzahl"); if(z) z.textContent = KatSel.gewaehlt.size+" gewählt";
    return;
  }
  const pick = e.target.getAttribute && e.target.getAttribute("data-such-pick");
  if(pick){
    e.target.checked ? Suche.auswahl.add(pick) : Suche.auswahl.delete(pick);
    foundTabelleFuellen(); return;
  }

  if(e.target.id==="objQuelle"){
    const o = DB.objekt(e.target.value);
    if(o){ Suche.e.strasse = o.strasse||""; Suche.e.scanOrt = o.ort||""; Suche.sichern(); render(); }
  }
});

</script>
<script>
"use strict";

/* ============================================================
   Anfrage aus E-Mail – Parser übernommen aus AQT v5.4 (v5.3-Teil)
   Outlook-Kopfzeilen, Signatur, Anschrift, Telefonnummern,
   Leistungsart, Fristen. Neu: Zuordnung gegen Store.data.firmen
   und Anlage von Firma -> Objekt -> Vorgang -> Aktivität.
   ============================================================ */

const LEISTUNGEN = ["Noch festzulegen","Unterhaltsreinigung","Baureinigung","Bauzwischenreinigung",
  "Bauendreinigung","Glasreinigung","Grundreinigung","Sonderreinigung","Fassadenreinigung"];

const MONATE_DE = {januar:1,februar:2,"märz":3,maerz:3,april:4,mai:5,juni:6,juli:7,
  august:8,september:9,oktober:10,november:11,dezember:12};

/* ---------- Eigene Adressen ------------------------------------
   Anfragen kommen fast immer als Weiterleitung aus dem eigenen
   Postfach. Ohne diese Filter würde der Parser A.C.S. selbst als
   anfragende Firma erkennen. */
const EIGENE_DOMAINS = ["allcleanservice.de","all-clean-service.de"];
const EIGENE_NAMEN   = /all\s*-?\s*clean|a\.?\s?c\.?\s?s\.?\s+(?:all|gebäude)|acs\s+all/i;

function istEigeneAdresse(mail){
  const m = String(mail||"").toLowerCase();
  return EIGENE_DOMAINS.some(d => m.endsWith("@"+d));
}

/* Schneidet alles weg, was vor der weitergeleiteten Originalmail steht:
   Begleittext und eigene Signatur. Genommen wird der erste Kopfzeilen-
   block – bei einer Antwortkette ist das die neueste Nachricht. */
function weiterleitungZuschneiden(text){
  const lines = text.split("\n");
  const marker = /^\s*(?:[-_=*]{2,}\s*)?(?:Weitergeleitete Nachricht|Ursprüngliche Nachricht|Original(?:e)? (?:Message|Nachricht)|Forwarded message|Anfang der weitergeleiteten Nachricht)/i;
  for(let i=0;i<lines.length;i++)
    if(marker.test(lines[i])) return lines.slice(i+1).join("\n").trim();

  for(let i=0;i<lines.length;i++){
    if(!/^\s*(?:Von|From)\s*:\s*\S/i.test(lines[i])) continue;
    /* Kopfzeilenblock mit eigener Absenderadresse überspringen – das ist
       die Weiterleitung selbst, nicht die Anfrage. */
    if(EIGENE_DOMAINS.some(d => lines[i].toLowerCase().indexOf("@"+d) > -1)) continue;
    const naechste = lines.slice(i+1, i+5).join("\n");
    if(/^\s*(?:Gesendet|Sent|An|To|Betreff|Subject)\s*:/im.test(naechste))
      return lines.slice(i).join("\n").trim();
  }
  return text;
}

/* ---------- Textwerkzeuge (v5.4) ------------------------------- */
function cleanMailText(s){ return (s||"").replace(/\r/g,"").replace(/[\t ]+/g," ").replace(/ *\n */g,"\n").trim(); }
function mnorm(s){ return (s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,""); }
function phoneNorm(s){ return (s||"").replace(/\D/g,"").replace(/^00/,""); }
function titleWords(s){ return (s||"").split(/[.\-_ ]+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" "); }
function escapeRe(s){ return (s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function nonEmptyLines(text){ return (text||"").split("\n").map(x=>x.trim()).filter(Boolean); }

function parseGermanDate(value,time){
  if(!value) return "";
  const m = value.match(/(\d{1,2})\.\s*([A-Za-zÄÖÜäöüß]+)\s*(\d{4})/);
  if(!m) return "";
  const mon = MONATE_DE[m[2].toLowerCase().replace(/\./g,"")]; if(!mon) return "";
  let iso = m[3]+"-"+(mon<10?"0":"")+mon+"-"+(Number(m[1])<10?"0":"")+Number(m[1]);
  if(time){ const tm=time.match(/(\d{1,2}):(\d{2})/); if(tm) iso += "T"+(Number(tm[1])<10?"0":"")+Number(tm[1])+":"+tm[2]; }
  return iso;
}
/* Zwischen Beschriftung und Datum darf Text stehen – in Portalmails steht
   unter "Abgabefrist" oft erst ein Satz und dann das Datum. */
const DATUM_LUECKE = "[\\s\\S]{0,80}?";
function extractLabeledDate(text,label,withTime){
  const re = new RegExp(label+"\\s*:?"+DATUM_LUECKE+"(\\d{1,2}\\.\\s*[A-Za-zÄÖÜäöüß]+\\s*\\d{4})(?:\\s*,?\\s*(\\d{1,2}:\\d{2}))?","i");
  const m = (text||"").match(re); return m ? parseGermanDate(m[1], withTime?m[2]:"") : "";
}
function extractNumericDate(text,label){
  const m = (text||"").match(new RegExp(label+"\\s*:?"+DATUM_LUECKE+"(\\d{1,2})\\.\\s*(\\d{1,2})\\.\\s*(\\d{4})","i"));
  if(!m) return "";
  return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
}
/* Letzter Rueckfall: "... Angebot ... bis zum 28.07.2026" */
function fristFrei(text){
  const m = (text||"").match(/(?:angebot|rückmeldung|ruckmeldung|antwort|abgabe)[\s\S]{0,140}?\bbis(?:\s+zum|\s+spätestens|\s+spaetestens)?\s*:?\s*(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})/i);
  if(!m) return "";
  return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
}
function frist(text,label,mitZeit){
  return extractLabeledDate(text,label,mitZeit) || extractNumericDate(text,label);
}

function isSignatureMarker(line){
  return /^--+\s*$/.test(line)||/^(?:mit\s+)?freundliche[nr]?\s+gr[üu]ße[,.!]?$/i.test(line)||
    /^viele\s+gr[üu]ße[,.!]?$/i.test(line)||/^herzliche\s+gr[üu]ße[,.!]?$/i.test(line)||
    /^best regards[,.!]?$/i.test(line)||/^kind regards[,.!]?$/i.test(line);
}
function signatureLines(text){
  const lines = (text||"").split("\n").map(x=>x.trim());
  let start = -1;
  for(let i=0;i<lines.length;i++){ if(isSignatureMarker(lines[i])){ start=i+1; break; } }
  if(start<0) start = Math.max(0, lines.length-24);
  return lines.slice(start).filter(Boolean);
}
function isLegalLine(line){
  return /^(?:geschäftsführ(?:er|ung)|vertretungsberechtigt|handelsregister|registergericht|amtsgericht|ust\.?-?id|umsatzsteuer|steuernummer|steuer-?nr|sitz\s+der\s+gesellschaft|iban|bic|hrb|hra)\s*:/i.test((line||"").trim());
}
function parseMailbox(line){
  line = (line||"").trim();
  const em = (line.match(/[A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}/i)||[])[0]||"";
  let name = line.replace(/<[^>]+>/g,"").replace(em,"").replace(/^['"]|['"]$/g,"").trim();
  const comma = name.match(/^([^,]{2,60}),\s*([^,]{2,60})$/); if(comma) name = (comma[2]+" "+comma[1]).trim();
  return { name, email:em };
}
/* Portal- und Automatikadressen sind nie der Ansprechpartner */
function istUnpersoenlich(mail){
  const lokal = String(mail||"").split("@")[0];
  return /^(?:no-?reply|noreply|do-?not-?reply|messages?|mailer|mailing|notification|benachrichtigung|postmaster|bounce|automat|system|robot|daemon)/i.test(lokal);
}
function extractOutlookHeaders(text){
  const headers = { from:"", sent:"", to:"", subject:"" };
  (text||"").split("\n").forEach(line => {
    const m = line.match(/^\s*(Von|From|Gesendet|Sent|An|To|Betreff|Subject)\s*:\s*(.+?)\s*$/i); if(!m) return;
    const key = m[1].toLowerCase(), v = m[2].trim();
    /* Erster Block gewinnt: bei einer Antwortkette ist das die neueste
       Nachricht, nicht die älteste ganz unten. */
    if((key==="von"||key==="from") && !headers.from) headers.from = v;
    else if((key==="gesendet"||key==="sent") && !headers.sent) headers.sent = v;
    else if((key==="an"||key==="to") && !headers.to) headers.to = v;
    else if((key==="betreff"||key==="subject") && !headers.subject) headers.subject = v;
  });
  headers.sender = parseMailbox(headers.from);
  return headers;
}
/* Rollenkuerzel vor dem Namen wegnehmen: "i.A. Sebastian Gembara" */
function personZeileSaeubern(line){
  return (line||"").replace(/[<>].*$/,"")
    .replace(/^\s*(?:i\s*\.?\s*[AVav]\s*\.?|ppa\.?|i\.\s*A\.|Herrn?|Frau)\s+/,"")
    .replace(/[,;]+$/,"").trim();
}
function looksLikePerson(line){
  line = personZeileSaeubern(line);
  if(!line || isLegalLine(line) ||
    /\d|@|www\.|https?:|tel\.?|telefon|fax|mobil|handy|teamleader|manager|management|abteilung|department|service|facility|travel|leitung|leiter|assistenz|einkauf|vertrieb|verwaltung|planung/i.test(line)) return false;
  if(/\b(?:GmbH|KG|AG|UG|OHG|GbR|SE|e\.?\s*V\.?|Gemeinde|Stadt|Landkreis)\b/i.test(line)) return false;
  const words = line.split(/\s+/).filter(Boolean);
  if(words.length<2 || words.length>6) return false;
  return words.every(w => /^(?:Dr\.?|Prof\.?|Dipl\.?|Ing\.?|[A-ZÄÖÜ][A-Za-zÄÖÜäöüß'’\-]+)$/.test(w));
}
/* "Maja Koch, Kaufmännische Mitarbeiterin" – Name und Funktion in einer Zeile */
function personUndFunktion(zeile){
  const roh = personZeileSaeubern(zeile);
  if(!roh) return null;
  if(looksLikePerson(roh)) return { name:roh, funktion:"" };
  const k = roh.indexOf(",");
  if(k > 0){
    const n = personZeileSaeubern(roh.slice(0,k));
    const f = roh.slice(k+1).trim();
    if(looksLikePerson(n) && f && f.length<=90 && !/@|www\.|https?:/i.test(f))
      return { name:n, funktion:f };
  }
  return null;
}
function extractSignatureName(text,headers,email){
  if(headers.sender && headers.sender.name && looksLikePerson(headers.sender.name)
     && !istEigeneAdresse(headers.sender.email)) return headers.sender.name;
  if(email){
    const m = new RegExp("([A-ZÄÖÜ][A-Za-zÄÖÜäöüß'’\\-]+(?:\\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöüß'’\\-]+){1,4})\\s*<\\s*"+escapeRe(email)+"\\s*>","i").exec(text);
    if(m && looksLikePerson(m[1])) return m[1].trim();
  }
  const lines = signatureLines(text);
  for(const l of lines){
    const p = personUndFunktion(l);
    if(p) return p.name;
  }
  return "";
  /* Hinweis: die eigene Signatur ist durch weiterleitungZuschneiden
     bereits abgeschnitten, bevor der Parser überhaupt hier ankommt. */
}
function looksLikeFunctionLine(line){
  line = (line||"").trim();
  if(!line || isLegalLine(line) || looksLikePerson(line)) return false;
  if(/@|www\.|https?:|tel\.?|telefon|fax|mobil|handy|\d{5}|\b(?:GmbH|KG|AG|UG|OHG|GbR|SE|e\.?\s*V\.?)\b/i.test(line)) return false;
  if(line.length>120) return false;
  return /teamleader|manager|management|facility|travel|leiter|leitung|abteilung|department|einkauf|procurement|assistenz|assistant|verwaltung|planung|vertrieb|sales|geschäftsbereich|bereich|service/i.test(line)
    || line.split(/\s+/).length<=8;
}
function extractFunction(text,contact){
  if(!contact) return "";
  const lines = signatureLines(text), target = mnorm(contact);
  let idx = -1;
  for(let i=0;i<lines.length;i++){
    const pf = personUndFunktion(lines[i]);
    if(pf && mnorm(pf.name)===target){ if(pf.funktion) return pf.funktion; idx=i; break; }
    const clean = personZeileSaeubern(lines[i]);
    if(mnorm(clean)===target){ idx=i; break; }
  }
  if(idx<0) return "";
  for(const p of [idx+1, idx+2, idx-1])
    if(p>=0 && p<lines.length && looksLikeFunctionLine(lines[p])) return lines[p].trim();
  return "";
}
function inferCompany(domain,city,text){
  const base = (domain||"").split(".")[0];
  if(city && /(rathaus|gemeinde|vergabesitzung|bürgermeister|amtshaus)/i.test(text)) return "Gemeinde "+city;
  if(base && !/^(gmail|gmx|web|outlook|hotmail|t-online|icloud)$/i.test(base)) return titleWords(base);
  return city ? "Organisation "+city : "";
}
/* "Ihre Antwort an C + P ... GmbH & Co. KG" -> Vorspann weg */
function firmenVorspannWeg(name){
  return String(name||"")
    .replace(/^(?:ihre\s+antwort\s+an|antwort\s+an|absender|auftraggeber|bauherr|firma|von|an|betreff)\s*:?\s+/i,"")
    .replace(/^[\-–—•·|>\s]+/,"")
    .trim();
}
function extractCompanyName(text,domain,city){
  const legal = /\b(?:gGmbH|GmbH(?:\s*&\s*Co\.?\s*KG(?:aA)?)?|mbH(?:\s*&\s*Co\.?\s*KG)?|UG(?:\s*\(haftungsbeschränkt\))?|KGaA|KG|OHG|GbR|AG|SE|e\.?\s*V\.?|e\.?\s*K\.?|eG|PartG(?:\s*mbB)?|Ltd\.?)\b/i;
  const pools = [signatureLines(text), nonEmptyLines(text)];
  for(const pool of pools) for(const line of pool){
    if(isLegalLine(line) || EIGENE_NAMEN.test(line)) continue;
    const m = line.match(new RegExp("^(.{2,120}?"+legal.source+")(?=\\s*[,;•·|(]|\\s*$)","i"));
    if(m){
      const name = firmenVorspannWeg(m[1].trim());
      if(name) return name;
    }
  }
  for(const l of signatureLines(text)){
    if(EIGENE_NAMEN.test(l)) continue;
    const org = l.match(/^(Gemeinde|Stadt|Landkreis|Markt|Verbandsgemeinde|Universität|Klinikum|Krankenhaus)\s+(.{2,80})$/i);
    if(org) return (org[1]+" "+org[2]).trim();
  }
  return inferCompany(domain,city,text);
}
function extractAddress(text){
  const lines = (text||"").split("\n");
  const nr = "(\\d+\\s*[a-zA-Z]?(?:\\s*[-\\/]\\s*\\d+\\s*[a-zA-Z]?)?)";
  const re = new RegExp("(?:^|[,;•·|]\\s*)([^,;•·|]{2,80}?)\\s+"+nr+
    "\\s*[,;•·|]\\s*(?:D\\s*-\\s*)?(\\d{5})\\s+([^,;•·|\\n]{2,60})","i");
  const nrNorm = s => (s||"").replace(/\s+/g,"");
  for(let i=lines.length-1;i>=0;i--){
    const m = lines[i].trim().match(re); if(!m) continue;
    const street = m[1].trim(), city = m[4].trim().replace(/\s+(?:www\.|https?:).*$/i,"").trim();
    if(/^(?:Tel\.?|Telefon|Fax|Mobil|Handy)\b/i.test(street) || isLegalLine(street)) continue;
    return { street, number:nrNorm(m[2]), zip:m[3], city };
  }

  /* Zweizeilige Anschrift wie in fast jeder Signatur:
       Badergasse 14 b
       63739 Aschaffenburg                                   */
  const strRe = new RegExp("^([A-ZÄÖÜ][^,;•·|\\d]{2,60}?)\\s+"+nr+"[.,]?$");
  const plzRe = /^(?:D\s*[-–]\s*)?(\d{5})\s+([A-ZÄÖÜ][^,;•·|]{1,58})$/;
  for(let i=lines.length-1;i>0;i--){
    const unten = lines[i].trim(); if(!unten) continue;
    const p = unten.match(plzRe); if(!p) continue;
    for(let j=i-1;j>=0 && j>=i-3;j--){
      const oben = lines[j].trim(); if(!oben) continue;
      const s = oben.match(strRe);
      if(s && !isLegalLine(oben) && !/^(?:Tel\.?|Telefon|Fax|Mobil|Handy|T|F|M)\b/i.test(oben))
        return { street:s[1].trim(), number:nrNorm(s[2]), zip:p[1], city:p[2].trim() };
      break;
    }
  }

  const m2 = (text||"").replace(/\n+/g," • ").match(re);
  if(m2) return { street:m2[1].trim(), number:nrNorm(m2[2]), zip:m2[3], city:m2[4].trim() };
  return { street:"", number:"", zip:"", city:"" };
}
function cleanPhoneValue(v){
  return (v||"").replace(/[–—−]/g,"-").replace(/\s+/g," ")
    .replace(/^[\s\-.]+/,"").replace(/[.\-\s]+$/g,"").trim();
}
function phoneZiffern(s){ return (s||"").replace(/\D/g,""); }
function istTelefonWert(v){
  const z = phoneZiffern(v);
  return z.length>=7 && z.length<=20;
}
/* Signaturen schreiben Nummern sehr unterschiedlich:
     "Telefon: 069 123456"   "Tel. +49 69 ..."   "T  +49 (0) 6021 / 58005-24"
     "Fon 069/1234"          oder ganz ohne Beschriftung.
   Erst alles Beschriftete einsammeln, danach als Rueckfall freie Nummern. */
function extractPhones(text){
  const out = { phone:"", mobile:"", fax:"" };
  const LAB = "Telefon|Telefax|Fernkopie|Facsimile|Durchwahl|Zentrale|Mobile|Mobil|Handy|Phone|Fax|Fon|Tel|DW|T|F|M";
  const re = new RegExp("(?:^|[\\s•·|,;(\\[])("+LAB+")\\.?\\s*[:.]?\\s*"+
    "((?:\\+|00|\\()?[0-9][0-9\\s().\\/\\-–—−]{5,32}[0-9])","ig");
  const setzen = (lab, wert) => {
    const val = cleanPhoneValue(wert);
    if(!istTelefonWert(val)) return;
    const l = lab.toLowerCase();
    if(l==="f" || /fax|fernkopie|facsimile/.test(l)){ if(!out.fax) out.fax = val; }
    else if(l==="m" || /mobil|handy/.test(l)){ if(!out.mobile) out.mobile = val; }
    else if(!out.phone) out.phone = val;
  };
  const zeilen = (text||"").replace(/\u00a0/g," ").split("\n");
  for(const zeile of zeilen){
    /* reine Mailzeilen ueberspringen ("M name@firma.de") */
    if(/@/.test(zeile) && !/[+(]|\d{2,}[\s\/\-.]\d/.test(zeile)) continue;
    let m; re.lastIndex = 0;
    while((m = re.exec(zeile))) setzen(m[1], m[2]);
  }
  if(!out.phone){
    const frei = /(?:\+\d{1,3}[\s\/.\-]*)?(?:\(\s*0[\d\s]{0,6}\)|0)[\d\s().\/\-–—−]{5,25}\d/;
    for(const zeile of zeilen){
      if(/@|www\.|https?:/i.test(zeile)) continue;
      if(/\b\d{5}\s+[A-ZÄÖÜ]/.test(zeile)) continue;              /* PLZ und Ort */
      if(/\b\d{1,2}\.\d{1,2}\.\d{2,4}\b/.test(zeile)) continue;   /* Datum */
      const m = zeile.match(frei);
      if(!m) continue;
      const val = cleanPhoneValue(m[0]);
      if(istTelefonWert(val) && val!==out.fax && val!==out.mobile){ out.phone = val; break; }
    }
  }
  if(!out.phone && out.mobile){ out.phone = out.mobile; }
  return out;
}
function extractProject(text){
  const saeubern = s => String(s||"").replace(/["„“]/g,"").replace(/\s+/g," ").trim();
  let m = (text||"").match(/»([\s\S]{4,350}?)«/); if(m) return saeubern(m[1]);

  /* Zeilenweise: "Projekt: X" oder "Projekt" mit dem Wert in der naechsten Zeile.
     Wichtig ist das Wortende – "Projektort" und "Projektnummer" sind etwas anderes. */
  const lines = (text||"").split("\n");
  const kopf = /^(?:das\s+)?(?:Projekt|Bauvorhaben|BV|Objekt|Baustelle|Maßnahme|Massnahme)\b\s*[:\-]?\s*(.*)$/i;
  for(let i=0;i<lines.length;i++){
    const mm = lines[i].trim().match(kopf); if(!mm) continue;
    let wert = mm[1].trim();
    if(!wert) for(let j=i+1;j<lines.length && j<=i+3;j++){ const n=lines[j].trim(); if(n){ wert=n; break; } }
    wert = saeubern(wert);
    if(wert.length<5 || wert.length>200) continue;
    if(/^(?:sehr geehrte|guten tag|hallo|liebe|mit freundlichen)/i.test(wert)) continue;
    if(/^\d{4,5}\b/.test(wert)) continue;              /* Projektort/-nummer */
    if(/^(?:nummer|ort|nr\.?|leiter|leitung)\b/i.test(wert)) continue;
    return wert;
  }
  return "";
}
function extractSubject(text,subject,headers){
  if((subject||"").trim()) return subject.trim();
  if(headers && headers.subject) return headers.subject;
  const m = (text||"").match(/(?:^|\n)\s*(?:Betreff|Subject)\s*:\s*([^\n]+)/i);
  return m ? m[1].trim() : "";
}
function relevantDescription(text){
  const lines = (text||"").split("\n"), kept = [];
  for(const l of lines){
    if(isSignatureMarker(l.trim())) break;
    if(/^\s*(?:Von|From|Gesendet|Sent|An|To|Betreff|Subject)\s*:/i.test(l)) continue;
    kept.push(l);
  }
  /* Portalmails stellen Kopfdaten (Datum, Projektort, Gewerk) vor die Anrede.
     Wenn es eine Anrede gibt, faengt der eigentliche Text danach an. */
  let start = 0;
  for(let i=0;i<kept.length;i++)
    if(/^\s*(?:sehr geehrte|sehr geehrter|guten tag|hallo|liebe)/i.test(kept[i])){ start = i+1; break; }
  return kept.slice(start).join("\n").split(/\n\s*\n/).map(x=>x.replace(/\s+/g," ").trim())
    .filter(x => x && !/^(?:sehr geehrte|sehr geehrter|guten tag|hallo|liebe)\b/i.test(x))
    .slice(0,3).join("\n\n").slice(0,1200);
}

/* ---------- Hauptparser (v5.4) --------------------------------- */
function parseMail(text,subject){
  text = weiterleitungZuschneiden(cleanMailText(text));
  const headers = extractOutlookHeaders(text);
  subject = extractSubject(text,subject,headers);

  const alle = text.match(/[A-Z0-9._%+\-]+@[A-Z0-9.\-]+\.[A-Z]{2,}/ig)||[], mails = [];
  alle.forEach(e => { e = e.replace(/[>,.;]+$/g,""); if(!mails.some(x=>x.toLowerCase()===e.toLowerCase())) mails.push(e); });

  const fremd = mails.filter(e => !istEigeneAdresse(e));
  let contactEmail = headers.sender.email || "";
  if(!contactEmail || istEigeneAdresse(contactEmail) || istUnpersoenlich(contactEmail))
    contactEmail = fremd.filter(e=>!istUnpersoenlich(e))[0] || fremd[0] || "";
  const generic = fremd.filter(e => /^(info|kontakt|office|service|mail|anfrage|ausschreibung)@/i.test(e))[0] || "";
  const wm = text.match(/(?:https?:\/\/)?(?:www\.)[A-Z0-9.\-]+\.[A-Z]{2,}(?:\/[^\s,;]*)?/i);
  const website = wm ? wm[0].replace(/[.,;]+$/g,"") : "";
  const domain = contactEmail ? contactEmail.split("@")[1].toLowerCase()
    : (website ? website.replace(/^https?:\/\//i,"").replace(/^www\./i,"").split("/")[0].toLowerCase() : "");

  const address = extractAddress(text);
  const company = extractCompanyName(text,domain,address.city);
  const contact = extractSignatureName(text,headers,contactEmail);
  const funct   = extractFunction(text,contact);
  const phones  = extractPhones(text);
  const project = extractProject(text);

  const service = [];
  [[/bauendreinig|endreinig|endzureinig/i,"Bauendreinigung"],
   [/bauzwischenreinig/i,"Bauzwischenreinigung"],
   [/baureinig/i,"Baureinigung"],
   [/glasreinig|fensterreinig/i,"Glasreinigung"],
   [/fassadenreinig/i,"Fassadenreinigung"],
   [/unterhaltsreinig/i,"Unterhaltsreinigung"],
   [/grundreinig/i,"Grundreinigung"],
   [/sonderreinig/i,"Sonderreinigung"]
  ].forEach(x => { if(x[0].test(text) && service.indexOf(x[1])<0) service.push(x[1]); });

  const allgemein = !service.length &&
    /gebäude\s*reinig|reinigungsdienst|reinigungsleistung|dienstleistungen\s+im\s+bereich\s+gebäudereinigung/i.test(text);
  const primary = service.indexOf("Bauendreinigung")>-1 ? "Bauendreinigung"
    : service.indexOf("Baureinigung")>-1 ? "Baureinigung"
    : service.indexOf("Unterhaltsreinigung")>-1 ? "Unterhaltsreinigung"
    : service.indexOf("Glasreinigung")>-1 ? "Glasreinigung"
    : service.length ? service[0] : "Noch festzulegen";

  const deadline = frist(text,"Angebotseröffnung",true) || frist(text,"Angebotsfrist",true) ||
                   frist(text,"Abgabefrist",true) || frist(text,"Abgabetermin",true) ||
                   frist(text,"Angebotsabgabe",true) || frist(text,"Submission",true) ||
                   frist(text,"Rückmeldung bis",false) || fristFrei(text);
  const award    = frist(text,"Vergabesitzung",false);
  const start    = frist(text,"Reinigungsbeginn",false) || frist(text,"Ausführungsbeginn",false) || frist(text,"Baubeginn",false);
  const binding  = frist(text,"Bindefrist",false);

  const cleanedSubject = (subject||"").replace(/^(re:|aw:|fw:|wg:)\s*/i,"").trim();
  const shortProject = project || cleanedSubject || (company ? "Reinigungsanfrage – "+company : "Neue Reinigungsanfrage");

  const warnings = [];
  if(EIGENE_NAMEN.test(company) || istEigeneAdresse(contactEmail))
    warnings.push("Es wurde die eigene Firma erkannt – vermutlich wurde die Weiterleitung nicht sauber erkannt. Bitte Firma und Ansprechpartner von Hand prüfen.");
  if(!contactEmail) warnings.push("Keine E-Mail-Adresse im Text gefunden – vermutlich als Anhang weitergeleitet statt im Text.");
  if(!company)      warnings.push("Firmenname nicht eindeutig erkannt.");
  if(!address.street) warnings.push("Anschrift nicht eindeutig erkannt.");
  if(!contact)      warnings.push("Ansprechpartner nicht eindeutig erkannt.");
  if(!project && !cleanedSubject) warnings.push("Projekt oder Objekt nicht eindeutig genannt.");
  if(primary==="Noch festzulegen") warnings.push("Leistungsart nicht eindeutig – Leistungsverzeichnis prüfen.");
  if(allgemein) warnings.push("Allgemein von Gebäudereinigung die Rede – genaue Leistungsart prüfen.");
  if(!deadline) warnings.push("Keine Angebotsfrist erkannt – bitte selbst eintragen.");
  if(!phones.phone && !phones.mobile) warnings.push("Keine Telefonnummer erkannt – bitte eintragen.");
  if(/leistungsverzeichnis|quadratmeter.{0,30}(?:auflistung|liste)|unterlagen.{0,20}(?:bei|anbei|angehängt)|anbei|im anhang/i.test(text))
    warnings.push("In der Mail werden Anlagen erwähnt – die Dateien unten unter „Dateien anhängen“ mit auswählen.");

  return {
    firma:company, domain, website, email:generic, contactEmail, contact, funct,
    phone:phones.phone, mobile:phones.mobile, fax:phones.fax,
    street:address.street, number:address.number, zip:address.zip, city:address.city,
    object:shortProject, service:primary, services:service.join(", "),
    description: relevantDescription(text) || project,
    deadline, award, start, binding,
    subject: subject || ("Anfrage – "+shortProject),
    raw:text, warnings, outlook:headers
  };
}

/* ---------- Firmen-Zuordnung: E-Mail > Domain > Name > Tel > Adresse */
function domainVonFirma(f){
  const em = (f.email||"").toLowerCase();
  if(em.indexOf("@")>-1) return em.split("@")[1];
  return (f.website||"").toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").split("/")[0];
}
function firmenTreffer(d){
  const out = [];
  const mail = (d.contactEmail||d.email||"").toLowerCase();
  const tel  = [d.phone,d.mobile].map(phoneNorm).filter(x=>x.length>6);
  for (const f of Store.data.firmen){
    let rang = 99, grund = "";
    const fMail = (f.email||"").toLowerCase(), fDom = domainVonFirma(f);
    const adresseGleich = d.zip && d.street && f.plz===d.zip && mnorm(f.strasse).indexOf(mnorm(d.street))===0;
    if(mail && fMail===mail){ rang=1; grund="gleiche E-Mail-Adresse"; }
    else if(d.domain && fDom && fDom===d.domain){ rang=2; grund="gleiche Domain"; }
    else if(d.firma && f.name && mnorm(d.firma)===mnorm(f.name)){ rang=3; grund="gleicher Firmenname"; }
    else if(tel.some(p => phoneNorm(f.telefon)===p)){ rang=4; grund="gleiche Telefonnummer"; }
    else if(adresseGleich){ rang=5; grund="gleiche Anschrift"; }
    if(rang<99) out.push({ f, rang, grund });
  }
  return out.sort((a,b)=> a.rang-b.rang || (a.f.name||"").localeCompare(b.f.name||"","de"));
}
