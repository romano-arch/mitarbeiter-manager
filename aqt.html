}

function leitKopieren(){
  const el = $("#leitEinstieg"); if(!el) return;
  const fertig = () => toast("Einstieg kopiert");
  const altWeg = () => { el.focus(); el.select(); try{ document.execCommand("copy"); }catch(e){} fertig(); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).then(fertig, altWeg);
  } else altWeg();
}

/* Ein Klick = Chronik-Eintrag + Stufe + Wiedervorlage */
function leitErgebnis(art){
  const v = DB.vorgang(LayerCtx.vorgangId); if(!v) return;
  if($("#vFrist")) vorgangFelderLesen(v);   /* B25: aus dem Vorgangsfenster */
  leitSprecherSichern();
  const nEl = $("#leitNotiz") || $("#aText"), dEl = $("#leitDatum");
  const notiz = nEl ? nEl.value.trim() : "";
  const datum = dEl ? dEl.value : "";
  const eintrag = kopf => neueAktivitaet({
    vorgangId:v.id, typ:"Anruf", datum:ISO(new Date()),
    text: notiz ? kopf+" – "+notiz : kopf
  });
  delete v.entwurf;

  if(art==="erreicht"){
    eintrag("Telefonat geführt");
    if(v.stufe==="neu") v.stufe="kontaktiert";
    wvSetzen(v, datum || plusTage(14), "Nachfassen nach Telefonat");
    Store.save(); vorgangOeffnen(v.id); render(); toast("Eingetragen · Wiedervorlage gesetzt"); return;
  }
  if(art==="nicht"){
    eintrag("Nicht erreicht");
    wvSetzen(v, datum || plusTage(3), "Erneut anrufen");
    Store.save(); vorgangOeffnen(v.id); render(); toast("Eingetragen · neuer Versuch vorgemerkt"); return;
  }
  if(art==="termin"){
    eintrag("Termin vereinbart");
    const warAkq = !istDeal(v);
    v.stufe="besichtigung";
    wvSetzen(v, datum || plusTage(7), "Besichtigungstermin");
    Store.save(); vorgangOeffnen(v.id); render();
    toast(warAkq ? "Termin eingetragen · steht jetzt in der Pipeline (Angebot zu erstellen)" : "Termin eingetragen"); return;
  }

  const f = DB.firma(v.firmaId);
  bestaetigen("Kein Interesse buchen?",
    "Der Vorgang wird als Absage gebucht und in 9 Monaten zur Reaktivierung vorgemerkt."+
    (f ? " Die Firma "+f.name+" bekommt den Status „Kein Interesse“." : ""),
    "Buchen",
    () => {
      eintrag("Kein Interesse");
      if(f) f.status = "Kein Interesse";
      v.ergebnis="verloren"; v.stufe="abschluss"; v.absagegrund="kein Interesse";
      abschlussWvAbhaken(v);
      wvSetzen(v, datum || plusMonate(9), "Nach Absage wieder ansprechen");
      Store.save(); render(); toast("Als kein Interesse gebucht");
    });
}

/* Automatik: Angebot versendet -> Wiedervorlage, nur Aktiv (Abschnitt 6).
   Die Frist kommt aus dem Vorgang bzw. der Vorlage. Frueher stand hier
   eine feste 7 – dadurch wich die Wiedervorlage von dem Datum ab, das
   der Vorgang selbst anzeigte. */
function stufenAutomatik(v, alteStufe){
  if(v.stufe==="angebot_versendet" && alteStufe!=="angebot_versendet" && !v.ergebnis){
    if(v.kontaktweg==="Aktiv" && !wvNaechste(v)){
      const tage = nachfassFrist(v);
      wvSetzen(v, plusTage(tage, v.angebotAm), "Nachfassen zum Angebot");
      return "Wiedervorlage in "+tage+" Tagen gesetzt";
    }
  }
  return "";
}

<script>
"use strict";

/* ---------- 8. Firmen: Tabelle, Filter, Mehrfachauswahl ------- */
/* Rhein-Main ist das eigene Einsatzgebiet: Postleitzahlen 60000-65999.
   Alles ausserhalb ist entweder ein Fehltreffer der Adressanreicherung
   (Konzernzentrale statt Niederlassung) oder schlicht zu weit weg. */
const RHEINMAIN_VON = 60000, RHEINMAIN_BIS = 65999;

/* PLZ-Filter versteht: "60318" (Anfang), "60-65" bzw. "60000-65999"
   (Bereich) und ein vorangestelltes "!" fuer alles ausserhalb. */
function plzPasst(plz, muster){
  muster = String(muster||"").trim();
  if(!muster) return true;
  let negiert = false;
  if(muster.charAt(0)==="!"){ negiert = true; muster = muster.slice(1).trim(); }
  if(!muster) return true;
  const p = String(plz==null?"":plz).replace(/\D/g,"");
  let treffer;
  const bereich = muster.match(/^(\d{1,5})\s*-\s*(\d{1,5})$/);
  if(bereich){
    if(!p){ treffer = false; }
    else {
      const stellen = Math.max(bereich[1].length, bereich[2].length);
      const zahl = Number(p.slice(0, stellen));
      const von  = Number(bereich[1]), bis = Number(bereich[2]);
      treffer = !isNaN(zahl) && zahl >= Math.min(von,bis) && zahl <= Math.max(von,bis);
    }
  } else {
    treffer = p.indexOf(muster.replace(/\D/g,"")) === 0;
  }
  return negiert ? !treffer : treffer;
}

/* Zerlegt die Eingabe im Suchfeld. Mehrere Woerter muessen alle passen.
   Ein Wort mit vorangestelltem Minus oder Ausrufezeichen schliesst aus.
   Beispiel: „zentrum -reha -rehabilitation" findet alle Zentren ausser
   den Reha-Einrichtungen. Anfuehrungszeichen fassen mehrere Woerter
   zusammen: -"ambulante rehabilitation".
   Ein Minus mitten im Wort bleibt normaler Text, damit Namen wie
   „Rhein-Main" weiter gefunden werden. */
function suchWorte(txt){
  const muss = [], darfNicht = [];
  const roh = String(txt||"").match(/-?"[^"]*"|\S+/g) || [];
  for (let t of roh){
    let raus = false;
    if(t[0]==="-" || t[0]==="!"){ raus = true; t = t.slice(1); }
    t = t.replace(/^"|"$/g, "").trim().toLowerCase();
    if(!t) continue;
    (raus ? darfNicht : muss).push(t);
  }
  return { muss, darfNicht };
}

function suchePasst(x, txt, worte){
  const { muss, darfNicht } = worte || suchWorte(txt);
  if(!muss.length && !darfNicht.length) return true;
  const heu = ((x.name||"")+" "+(x.ansprechpartner||"")).toLowerCase();
  for (const t of darfNicht) if(heu.includes(t)) return false;
  for (const t of muss)      if(!heu.includes(t)) return false;
  return true;
}

/* Anzahl Vorgaenge je Firma in einem Durchlauf. Frueher wurde fuer jede
   Zeile (und beim Sortieren fuer jeden Vergleich) die ganze Vorgangsliste
   durchsucht – bei 8.700 Firmen der Hauptgrund fuer die langsame Tabelle. */
function vorgangsZahlen(){
  const m = new Map();
  for (const v of Store.data.vorgaenge) m.set(v.firmaId, (m.get(v.firmaId)||0)+1);
  return m;
}
const SORT_DE = new Intl.Collator("de");

function firmenGefiltert(zahlen){
  const f = App.firmenFilter;
  const n = f.name.trim().toLowerCase(), o = f.ort.trim().toLowerCase();
  const worte = suchWorte(f.name);
  const s = App.firmenSort || { feld:"name", richtung:1 };
  if(s.feld==="vorgaenge" && !zahlen) zahlen = vorgangsZahlen();
  /* Sortierschluessel einmal je Firma bilden statt bei jedem Vergleich */
  return Store.data.firmen.filter(x =>
    suchePasst(x, f.name, worte) &&
    (!o || (x.ort||"").toLowerCase().includes(o)) &&
    plzPasst(x.plz, f.plz) &&
    (!f.branche    || x.branche===f.branche) &&
    (!f.gruppe     || x.gruppe===f.gruppe) &&
    (!f.segment    || x.segment===f.segment) &&
    (!f.kontaktweg || x.kontaktweg===f.kontaktweg) &&
    (!f.status     || x.status===f.status) &&
    (!f.quelle     || x.quelle===f.quelle) &&
    (!f.zielgruppe || zielgruppe(x)===f.zielgruppe) &&
    /* B22: Ablage ist standardmaessig ausgeblendet; "*" = nur Ablage */
    ((f.ablage||"")==="" ? !x.ablage : (f.ablage==="*" ? !!x.ablage : x.ablage===f.ablage))
  ).map(x => ({ x, k: sortSchluessel(x, s.feld, zahlen), n: String(x.name||""), p: String(x.plz||"") }))
   .sort((a,b) => {
     /* B28: Leere Werte immer ans Ende, egal in welche Richtung.
        Bei Gleichstand nach Firmenname, dann PLZ – vorher blieb dort die
        Ladereihenfolge stehen, und die ist zufaellig (Sortierung nach ID). */
     const la = a.k === "" , lb = b.k === "";
     if(la !== lb) return la ? 1 : -1;
     let d = 0;
     if(!la) d = (typeof a.k === "number" ? a.k - b.k : SORT_NAME.compare(a.k, b.k)) * s.richtung;
     return d || SORT_NAME.compare(a.n, b.n) || a.p.localeCompare(b.p);
   })
   .map(e => e.x);
}
/* Status in sinnvoller Reihenfolge statt alphabetisch */
const STATUS_RANG = { "Kunde":1, "Ehemaliger Kunde":2, "Interessent":3, "Kein Interesse":4, "Verloren":5 };
function sortSchluessel(x, feld, zahlen){
  if(feld === "vorgaenge") return zahlen.get(x.id) || 0;
  if(feld === "status") return x.status ? (STATUS_RANG[x.status] || 9) : "";
  const w = String(x[feld]==null ? "" : x[feld]).trim();
  return w;
}

/* Die Tabelle zeigt zuerst nur einen Teil der Zeilen; beim Herunterscrollen
   kommen weitere dazu. 8.700 Zeilen auf einmal brauchten 3–4 Sekunden. */
const FIRMEN_STUECK = 200;
let _firmenRest = null;   /* { liste, zahlen, ab } fuer das Nachladen */

function firmaZeile(x, zahlen){
  const n = zahlen.get(x.id) || 0;
  const sel = App.auswahl.has(x.id);
  return "<tr"+(sel?' class="sel"':"")+">"+
    '<td><input type="checkbox" data-pick="'+x.id+'"'+(sel?" checked":"")+"></td>"+
    '<td class="cellname"><button class="linkish" data-firma="'+x.id+'">'+esc(x.name||"(ohne Namen)")+"</button>"+
      (x.ablage?'<span class="chip" style="margin-left:6px">'+esc(x.ablage)+"</span>":"")+
      (x.ansprechpartner?'<div class="tiny muted">'+esc(x.ansprechpartner)+"</div>":"")+"</td>"+
    "<td>"+feldAuswahl("branche",BRANCHEN,x)+"</td>"+
    "<td>"+feldAuswahl("gruppe",GRUPPEN,x)+"</td>"+
    "<td>"+feldAuswahl("segment",SEGMENTE,x)+"</td>"+
    '<td><button class="chip wegchip'+(x.kontaktweg==="Aktiv"?" accent":"")+
      '" data-weg-um="'+x.id+'" title="Umschalten auf '+
      (x.kontaktweg==="Aktiv"?"Passiv (Brief)":"Aktiv (Telefon)")+'">'+
      esc(x.kontaktweg)+"</button></td>"+
    "<td>"+statusChip(x.status)+"</td>"+
    "<td>"+(x.quelle?'<span class="tiny">'+esc(x.quelle)+"</span>":'<span class="tiny muted">—</span>')+"</td>"+
    '<td class="mono tiny">'+esc(x.plz||"")+"</td>"+
    "<td>"+esc(x.ort||"")+"</td>"+
    "<td>"+kontaktLinks(x)+"</td>"+
    '<td class="mono" style="text-align:right">'+(n||'<span class="muted">·</span>')+"</td>"+
  "</tr>";
}

function firmenRestZeile(){
  const r = _firmenRest;
  if(!r || r.ab >= r.liste.length) return "";
  return '<tr class="mehrzeilen"><td colspan="12" style="padding:14px;text-align:center;color:var(--ink-2)">'+
    (r.liste.length-r.ab)+" weitere – beim Scrollen werden sie geladen "+
    '<button class="linkish" data-act="firmen-alle">Alle anzeigen</button></td></tr>';
}

/* Haengt die naechsten Zeilen an, ohne die Tabelle neu aufzubauen –
   so bleiben Scrollposition und Eingaben erhalten. */
function firmenNachladen(alle){
  const r = _firmenRest;
  const tb = document.querySelector(".tablewrap.fixhead tbody");
  if(!r || !tb || r.ab >= r.liste.length) return;
  const bis = alle ? r.liste.length : Math.min(r.liste.length, r.ab + FIRMEN_STUECK*2);
  let h = "";
  for (let i=r.ab; i<bis; i++) h += firmaZeile(r.liste[i], r.zahlen);
  r.ab = bis;
  App.firmenAnzahl = bis;
  const alt = tb.querySelector("tr.mehrzeilen"); if(alt) alt.remove();
  tb.insertAdjacentHTML("beforeend", h + firmenRestZeile());
}

/* Auswahl in der Tabelle: Branche, Gruppe, Segment direkt aendern. Ein Wert,
   der nicht in der Liste steht, bleibt erhalten und erscheint oben. */
function feldAuswahl(feld, liste, x){
  const wert = x[feld] || "";
  const stil = 'cursor:pointer;border-bottom:1px dotted #8aa0ae';
  return '<span class="feldedit" data-fedit="'+feld+'" data-id="'+x.id+'" title="Klicken zum Ändern" style="'+stil+'">'+
    (wert ? esc(wert) : '<span class="muted">—</span>')+' ▾</span>';
}
/* Erst beim Klick entsteht ein Auswahlfeld, und nur fuer diese eine Zelle.
   Alle Auswahlfelder der Tabelle zugleich haetten die Seite lahmgelegt. */
function feldAuswahlOeffnen(el, feld, id){
  const f = DB.firma(id); if(!f) return;
  const liste = feld==="branche" ? BRANCHEN : feld==="gruppe" ? GRUPPEN : SEGMENTE;
  const wert = f[feld] || "";
  const opts = liste.slice();
  if(wert && opts.indexOf(wert)<0) opts.unshift(wert);
  const sel = document.createElement("select");
  sel.className = "cellsel";
  sel.style.cssText = "max-width:170px;font-size:12px";
  sel.innerHTML = optionen(opts, wert, "—");
  sel.setAttribute("data-fsel", feld);
  sel.setAttribute("data-id", id);
  el.replaceWith(sel);
  sel.focus();
}
function renderFirmen(){
  $("#pageActions").innerHTML =
    (function(){
      const nA = Store.data.firmen.filter(x=>x.ablage).length;
      return (App.firmenFilter.ablage||"")!==""
        ? '<button class="btn primary" data-act="ablage-toggle">← Zurück zur Firmenliste</button>'
        : '<button class="btn" data-act="ablage-toggle">Ablage ('+nA+')</button>';
    })()+
    '<button class="btn" data-act="ausserhalb">Außerhalb Rhein-Main</button>'+
    '<button class="btn" data-act="dub-pruefen">Dubletten prüfen</button>'+
    '<button class="btn" data-act="import-oeffnen">Liste importieren</button>'+
    '<button class="btn" data-act="abgl-oeffnen">Kundenlisten abgleichen</button>'+
    '<button class="btn primary" data-act="firma-neu">+ Firma</button>';

  const alle = Store.data.firmen;

  /* B28: Kaltakquise – oben umschalten zwischen allen Firmen und der
     Anrufliste (offene Akquise-Kontakte mit Wiedervorlage) */
  const akq = Store.data.vorgaenge.filter(v => !istDeal(v) && !v.ergebnis);
  const akqUeber = akq.filter(v => { const w = wvNaechste(v); return w && tageBis(w.datum) < 0; }).length;
  const fseg = (id, name, n, warn) => '<button data-fansicht="'+id+'" class="'+((App.firmenAnsicht||"liste")===id?"on":"")+'">'+
    name+' <span class="chip'+(warn?" crit":"")+'">'+n+"</span></button>";
  const fkopf = '<div class="toolbar"><div class="seg">'+
      fseg("liste","Alle Firmen",alle.filter(x=>!x.ablage).length)+
      fseg("anruf","Anrufliste",akq.length,akqUeber)+
    "</div>"+
    '<span class="tiny muted">Kunden sind für Kaltakquise gesperrt · Ehemalige werden zur Rückgewinnung angesprochen</span></div>';
  if(App.firmenAnsicht === "anruf"){
    $("#content").innerHTML = fkopf + akquiseHTML(akq);
    return;
  }

  if(!alle.length){
    $("#content").innerHTML = '<div class="empty"><h3>Noch keine Firma erfasst</h3>'+
      "<p>Firmen sind die Grundlage: jeder Vorgang hängt an einer. Leg eine einzeln an "+
      "oder lade eine ganze Liste hoch – zum Beispiel die Medizin-Liste aus der Adresspipeline.</p>"+
      '<button class="btn primary" data-act="import-oeffnen">Liste importieren</button> '+
      '<button class="btn" data-act="firma-neu">Einzeln anlegen</button></div>';
    return;
  }

  const zahlen = vorgangsZahlen();
  const liste = firmenGefiltert(zahlen);
  const f = App.firmenFilter;
  /* Neuer Filter oder neue Sortierung: wieder mit dem ersten Stueck beginnen.
     Ein Haken oder eine Feldaenderung behaelt die bisher geladenen Zeilen. */
  const sig = JSON.stringify([f, App.firmenSort||null]);
  if(sig !== App.firmenSig){ App.firmenSig = sig; App.firmenAnzahl = FIRMEN_STUECK; }
  const zeigen = Math.min(liste.length, Math.max(FIRMEN_STUECK, App.firmenAnzahl||0));
  const altWrap = document.querySelector(".tablewrap.fixhead");
  const altScroll = altWrap ? altWrap.scrollTop : 0;
  const sichtbarIds = liste.map(x=>x.id);
  const gewaehlt = sichtbarIds.filter(id=>App.auswahl.has(id));
  const alleGewaehlt = sichtbarIds.length>0 && gewaehlt.length===sichtbarIds.length;

        optionen(ZIELGRUPPEN, f.zielgruppe||"", "Alle Zielgruppen")+"</select>"+

          : "";

      (liste.length < alle.length
        ? '<span class="muted">· '+(alle.length-liste.length)+" durch Filter ausgeblendet</span>"+

          '<button class="btn sm ghost" data-act="filter-zuruecksetzen">Filter zurücksetzen</button>'

    '<div class="tablewrap fixhead"><table class="data">'+

      (function(){
        const pf = fd => App.firmenSort && App.firmenSort.feld===fd ? (App.firmenSort.richtung>0?" \u25b2":" \u25bc") : "";
        const th = (fd,lb) => '<th data-sort="'+fd+'" style="cursor:pointer;user-select:none">'+lb+pf(fd)+"</th>";
        return th("name","Firma")+th("branche","Branche")+th("gruppe","Gruppe")+th("segment","Segment")+
               th("kontaktweg","Kontaktweg")+th("status","Status")+th("quelle","Quelle")+th("plz","PLZ")+th("ort","Ort")+

               '<th data-sort="vorgaenge" style="cursor:pointer;user-select:none;text-align:right">Vorgänge'+pf("vorgaenge")+"</th>";

        'Beispiel: zentrum -reha -rehabilitation"></th>'+
      '<th><select data-filter="branche">'+optionen(BRANCHEN,f.branche,"Alle")+"</select></th>"+
      '<th><select data-filter="gruppe">'+optionen(GRUPPEN,f.gruppe,"Alle")+"</select></th>"+
      '<th><select data-filter="segment">'+optionen(SEGMENTE,f.segment,"Alle")+"</select></th>"+
      '<th><select data-filter="kontaktweg">'+optionen(WEGE,f.kontaktweg,"Alle")+"</select></th>"+
      '<th><select data-filter="status">'+optionen(STATUS,f.status,"Alle")+"</select></th>"+
      '<th><select data-filter="quelle">'+optionen(QUELLEN,f.quelle,"Alle")+"</select></th>"+
      '<th><input type="text" data-filter="plz" value="'+esc(f.plz)+'" placeholder="z.B. 60-65" title="60318 = Anfang · 60-65 = Bereich · !60-65 = alles außerhalb"></th>'+
      '<th><input type="text" data-filter="ort" value="'+esc(f.ort)+'" placeholder="Ort"></th>'+
      "<th></th><th></th>"+
    "</tr></thead><tbody>";

  if(!liste.length){
    h += '<tr><td colspan="12" style="padding:26px;text-align:center;color:var(--ink-2)">'+
      "Kein Treffer. Filter zurücksetzen? "+

  } else {
    for (let i=0; i<zeigen; i++) h += firmaZeile(liste[i], zahlen);
    /* Rest der alten Zeilenschleife, ohne Wirkung – Zeile steht jetzt in firmaZeile()
          '<button class="linkish" data-firma-del="'+x.id+'" title="Firma endg\u00fcltig l\u00f6schen" style="margin-left:10px;color:#B42318;font-size:12px">L\u00f6schen</button>'+
    */
  }
  _firmenRest = { liste, zahlen, ab: zeigen };
  h += firmenRestZeile();
  h += "</tbody></table></div></div>";
  $("#content").innerHTML = h;
  tabelleFixieren();
  const wrap = document.querySelector(".tablewrap.fixhead");
  if(wrap){
    if(altScroll) wrap.scrollTop = altScroll;
    wrap.addEventListener("scroll", () => {
      if(wrap.scrollTop + wrap.clientHeight > wrap.scrollHeight - 600) firmenNachladen();
    }, { passive:true });

}

/* Gibt dem Tabellenbereich die Resthoehe bis zum unteren Fensterrand und
   setzt die Filterzeile genau unter die Ueberschriftenzeile. Beides muss
   gemessen werden: die Topbar bricht je nach Fensterbreite um, und die
   Kopfzeilenhoehe haengt von der Schrift ab. */
function tabelleFixieren(){
  const wrap = document.querySelector(".tablewrap.fixhead");
  if(!wrap) return;
  const kopf = wrap.querySelector("thead tr:first-child");
  const filt = wrap.querySelector("thead tr.filterrow");
  if(kopf && filt){
    const h = kopf.getBoundingClientRect().height || kopf.offsetHeight || 33;
    filt.querySelectorAll("th").forEach(th => { th.style.top = h+"px"; });
  }
  const oben = wrap.getBoundingClientRect().top;
  const rest = window.innerHeight - oben - 24;
  wrap.style.maxHeight = Math.max(300, rest)+"px";
}
window.addEventListener("resize", () => { try{ tabelleFixieren(); }catch(_){} });

/* E-Mail, Website und Telefon als echte Links: mailto oeffnet Outlook,
   die Website geht in einem neuen Tab auf. */
function webUrl(w){
  w = String(w||"").trim();
  if(!w) return "";
  return /^https?:\/\//i.test(w) ? w : "https://"+w.replace(/^\/+/,"");
}
function telUrl(t){ return String(t||"").replace(/[^+0-9]/g,""); }
/* Google Maps mit Name und Adresse. Von dort ist Street View ein Klick
   weiter – dafür braucht es keine gespeicherten Koordinaten. */
function kartenUrl(x){
  const q = [x.name, x.strasse, [x.plz, x.ort].filter(Boolean).join(" ")]
    .filter(s => String(s||"").trim()).join(", ");
  if(!q) return "";
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

function kontaktLinks(x){
  if(!x) return '<span class="tiny muted">—</span>';
  const t = [];
  if(x.email)   t.push('<a href="mailto:'+esc(x.email)+'" title="'+esc(x.email)+'">✉ Mail</a>');
  if(x.telefon) t.push('<a href="tel:'+esc(telUrl(x.telefon))+'" title="'+esc(x.telefon)+'">☎ Anruf</a>');
  if(x.website) t.push('<a href="'+esc(webUrl(x.website))+'" target="_blank" rel="noopener" title="'+esc(x.website)+'">↗ Web</a>');
  const karte = kartenUrl(x);
  if(karte) t.push('<a href="'+esc(karte)+'" target="_blank" rel="noopener" title="In Google Maps ansehen – von dort ein Klick zu Street View">⌖ Karte</a>');
  return t.length ? '<span class="konlinks">'+t.join("")+"</span>" : '<span class="tiny muted">—</span>';
}
function minilink(art, wert){
  if(!wert) return "";
  if(art==="mail") return ' <a class="minilink" href="mailto:'+esc(wert)+'">öffnen</a>';
  if(art==="tel")  return ' <a class="minilink" href="tel:'+esc(telUrl(wert))+'">anrufen</a>';
  return ' <a class="minilink" href="'+esc(webUrl(wert))+'" target="_blank" rel="noopener">öffnen</a>';
}

function statusChip(s){
  const cls = s==="Kunde" ? "ok" : s==="Verloren" ? "crit" : s==="Kein Interesse" ? "" : "";
  return '<span class="chip '+cls+'">'+esc(s||"—")+"</span>";
}

/* ---------- 9. Firma öffnen (B25) -----------------------------
   Gleicher Aufbau wie der Vorgang: links Kontakt und Einordnung, rechts
   „Jetzt dran“, Vorgaenge/Objekte, Notiz und Verlauf ueber alle Vorgaenge.
   Was beim Import in der Notiz gelandet ist (ZEILE, BRIEFANREDE …), steht
   eingeklappt unter „Import-Daten“ und geht beim Speichern nicht verloren.
------------------------------------------------------------------- */
const IMPORT_ZEILE = /^(?:ZEILE:|Branche laut Datei:|Aus Liste vermerkt:|Aus Adresssuche übernommen|Google-Kategorie:|\d+ Google-Bewertungen|[A-ZÄÖÜ][A-ZÄÖÜ0-9_]{2,}:\s)/;
function notizTeilen(n){
  const eigen = [], imp = [];
  String(n||"").split("\n").forEach(z => (IMPORT_ZEILE.test(z.trim()) ? imp : eigen).push(z));
  return { eigen:eigen.join("\n").trim(), imp:imp.join("\n").trim() };
}

function fJetzt(x, vorgaenge){
  const offen = vorgaenge.filter(v => !v.ergebnis);
  const briefe = (x.briefe||[]).slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
  const brief = briefe.length ? briefe[briefe.length-1] : null;
  let ton = "", was = "", warum = "", tasten = "";
  const zg = zielgruppe(x);
  if(!offen.length && zg === "Kunde"){
    ton = "ok"; was = "Aktueller Kunde";
    warum = "Keine Kaltakquise. Briefe nur mit eigenem Anlass (z.B. Saisonstart). Für einen weiteren Auftrag ein Angebot anlegen.";
    tasten = '<button class="btn primary" data-act="angebot-fuer-firma">+ Angebot</button>';
  } else if(!offen.length && zg === "Ehemaliger Kunde"){
    ton = "warn"; was = "Ehemaliger Kunde – zurückgewinnen";
    warum = "Nicht wie Kaltakquise ansprechen: an die frühere Zusammenarbeit anknüpfen. Kontaktweg: "+
      (x.kontaktweg==="Aktiv" ? "Anrufen" : "Brief")+" (oben links unter Einordnung umstellbar).";
    tasten = '<button class="btn primary" data-act="vorgang-fuer-firma">Rückgewinnung starten</button>'+
      '<button class="btn" data-act="brief-vermerk">Brief verschickt</button>';
  } else if(offen.length){
    const naechste = offen.map(v => ({ v, w:wvNaechste(v) })).filter(e => e.w)
      .sort((a,b)=>a.w.datum.localeCompare(b.w.datum))[0];
    const ziel = naechste ? naechste.v : offen[0];
    ton = naechste ? dringlichkeit(naechste.v) : "warn";
    was = offen.length === 1 ? "1 offener Vorgang" : offen.length+" offene Vorgänge";
    warum = naechste ? (naechste.w.anlass||"Wiedervorlage")+" · "+fmtDatum(naechste.w.datum)+" · "+relativ(naechste.w.datum)
                     : "Kein Termin gesetzt – im Vorgang einen nächsten Schritt planen.";
    tasten = '<button class="btn primary" data-vorgang="'+ziel.id+'">Vorgang öffnen</button>';
  } else if(x.gesperrt){
    was = "Für Briefe gesperrt"; warum = "Wird bei Serienbrief und Digitalpost ausgelassen.";
  } else if(x.kontaktweg === "Aktiv"){
    ton = "info"; was = "Erstkontakt per Telefon";
    warum = x.telefon ? "Anrufen und das Ergebnis als Vorgang festhalten." : "Keine Telefonnummer hinterlegt.";
    tasten = '<button class="btn primary" data-act="vorgang-fuer-firma">Akquise-Kontakt anlegen</button>'+
      (x.telefon ? '<a class="btn" href="tel:'+esc(telUrl(x.telefon))+'" style="text-decoration:none">Anrufen</a>' : "");
  } else if(brief){
    ton = "ok"; was = "Auf Reaktion warten";
    warum = "Letzter Brief am "+fmtDatum(brief.datum)+(brief.anlass?" ("+brief.anlass+")":"")+". Meldet sich jemand, wird daraus ein Vorgang.";
    tasten = '<button class="btn primary" data-act="angebot-fuer-firma">Reaktion: Angebot anlegen</button>'+
      '<button class="btn" data-act="brief-vermerk">Weiteren Brief vermerken</button>';
  } else {
    ton = "info"; was = "Bereit für die nächste Briefwelle";
    warum = "Kontaktweg Passiv · noch kein Brief verschickt";
    tasten = '<button class="btn primary" data-act="brief-vermerk">Brief verschickt</button>';
  }
  return '<div class="jetzt '+ton+'"><div class="kopf">Jetzt dran</div>'+
    '<div class="was">'+esc(was)+"</div>"+'<div class="warum">'+esc(warum)+"</div>"+
    (tasten ? '<div class="tasten">'+tasten+"</div>" : "")+"</div>";
}

/* Verlauf ueber alle Vorgaenge der Firma plus Briefvermerke */
function fVerlauf(x, vorgaenge){
  const posten = [];
  for (const b of (x.briefe||[]))
    posten.push({ zeit:b.datum||"", typ:"Brief", datum:b.datum, text:"Brief verschickt"+(b.anlass?" · "+b.anlass:""), vid:"" });
  for (const v of vorgaenge)
    for (const a of DB.aktivitaetenVon(v.id))
      posten.push({ zeit:(a.datum||"")+" "+(a.angelegt||""), typ:a.typ, datum:a.datum,
        text:String(a.text||"").split("\n")[0].slice(0,160), vid:v.id, titel:v.titel });
  posten.sort((a,b)=>b.zeit.localeCompare(a.zeit));
  const zeig = posten.slice(0, 20);
  return '<section class="fx-card"><div class="fx-card-kopf"><div class="fx-lbl">Verlauf'+
      (posten.length ? ' <span class="chip">'+posten.length+"</span>" : "")+"</div></div>"+
    (zeig.length ? zeig.map(p =>
      '<div class="akt"><div class="k">'+esc(p.typ)+'<span class="d">'+esc(fmtDatum(p.datum))+"</span></div>"+
      '<div class="b">'+esc(p.text||"—")+
        (p.vid ? '<div><button class="linkbtn" data-vorgang="'+p.vid+'">'+esc(p.titel||"Vorgang")+"</button></div>" : "")+
      "</div></div>").join("")
      : '<div class="tiny muted">Noch nichts passiert.</div>')+
    (posten.length > zeig.length ? '<div class="tiny muted" style="margin-top:6px">… und '+(posten.length-zeig.length)+" ältere Einträge in den Vorgängen</div>" : "")+
  "</section>";
}

  const chips = [

function trennzeichenRaten(text){
  const z = text.split(/\r?\n/)[0] || "";
  const kandidaten = [["\t",(z.match(/\t/g)||[]).length],[";",(z.match(/;/g)||[]).length],[",",(z.match(/,/g)||[]).length]];
  kandidaten.sort((a,b)=>b[1]-a[1]);
  return kandidaten[0][1] ? kandidaten[0][0] : ";";
}

function tabelleParsen(text, sep){
  const zeilen=[]; let feld="", zeile=[], inQ=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ feld+='"'; i++; } else inQ=false; }
      else feld+=c;
    } else if(c==='"'){ inQ=true; }
    else if(c===sep){ zeile.push(feld); feld=""; }
    else if(c==="\n"){ zeile.push(feld); zeilen.push(zeile); zeile=[]; feld=""; }
    else if(c!=="\r"){ feld+=c; }
  }
  if(feld!=="" || zeile.length){ zeile.push(feld); zeilen.push(zeile); }
  return zeilen.filter(z => z.some(c => String(c).trim()!==""));
}

/* ---------- XLSX lesen, ohne Fremdbibliothek -------------------
   Eine xlsx-Datei ist ein ZIP-Archiv voller XML-Dateien. Entpackt
   wird mit DecompressionStream, das jeder aktuelle Browser mitbringt –
   deshalb kommt die App ohne 900 KB Zusatzbibliothek aus.          */

function zipOeffnen(buffer){
  const u8 = new Uint8Array(buffer), dv = new DataView(buffer);
  let eocd = -1;
  for (let i=u8.length-22; i>=0 && i>u8.length-65558; i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  }
  if(eocd<0) throw new Error("Das ist keine lesbare xlsx-Datei");
  const anzahl = dv.getUint16(eocd+10,true);
  let off = dv.getUint32(eocd+16,true);
  const eintraege = {}, dec = new TextDecoder();
  for (let n=0; n<anzahl; n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const nameLen = dv.getUint16(off+28,true);
    eintraege[dec.decode(u8.subarray(off+46, off+46+nameLen))] = {
      methode: dv.getUint16(off+10,true),
      groesse: dv.getUint32(off+20,true),
      lokal:   dv.getUint32(off+42,true)
    };
    off += 46 + nameLen + dv.getUint16(off+30,true) + dv.getUint16(off+32,true);
  }
  return { u8, dv, eintraege };
}

async function zipDatei(zip, name){
  const e = zip.eintraege[name];
  if(!e) return null;
  const start = e.lokal + 30 + zip.dv.getUint16(e.lokal+26,true) + zip.dv.getUint16(e.lokal+28,true);
  const roh = zip.u8.subarray(start, start + e.groesse);
  if(e.methode===0) return new TextDecoder().decode(roh);
  if(typeof DecompressionStream === "undefined")
    throw new Error("Dieser Browser kann xlsx nicht entpacken – bitte in Excel als CSV speichern");
  const strom = new Blob([roh]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new TextDecoder().decode(await new Response(strom).arrayBuffer());
}

function xmlLesen(text){ return new DOMParser().parseFromString(text, "application/xml"); }

/* A -> 0, B -> 1, AA -> 26 */
function spalteZuIndex(ref){
  let s = 0;
  for (const c of String(ref)){
    const k = c.charCodeAt(0);
    if(k<65||k>90) break;
    s = s*26 + (k-64);
  }
  return s-1;
}

async function xlsxLesen(buffer){
  const zip = zipOeffnen(buffer);

  let texte = [];
  const ss = await zipDatei(zip, "xl/sharedStrings.xml");
  if(ss) texte = Array.from(xmlLesen(ss).getElementsByTagName("si")).map(si =>
    Array.from(si.getElementsByTagName("t")).map(t=>t.textContent).join(""));

  const wb = await zipDatei(zip, "xl/workbook.xml");
  const namen = wb ? Array.from(xmlLesen(wb).getElementsByTagName("sheet")).map(s=>s.getAttribute("name")) : [];

  const pfade = Object.keys(zip.eintraege)
    .filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a,b)=>Number(a.match(/(\d+)/)[1]) - Number(b.match(/(\d+)/)[1]));

  const blaetter = [];
  for (let i=0; i<pfade.length; i++){
    const doc = xmlLesen(await zipDatei(zip, pfade[i]));
    const zeilen = [];
    for (const row of Array.from(doc.getElementsByTagName("row"))){
      const z = [];
      for (const c of Array.from(row.getElementsByTagName("c"))){
        const idx = spalteZuIndex(c.getAttribute("r")||"");
        const typ = c.getAttribute("t");
        let wert = "";
        if(typ==="inlineStr"){
          wert = Array.from(c.getElementsByTagName("t")).map(t=>t.textContent).join("");
        } else {
          const v = c.getElementsByTagName("v")[0];
          wert = v ? v.textContent : "";
          if(typ==="s") wert = texte[Number(wert)] || "";
        }
        z[idx>=0 ? idx : z.length] = wert;
      }
      for (let k=0; k<z.length; k++) if(z[k]===undefined) z[k] = "";
      zeilen.push(z);
    }
    blaetter.push({
      name: namen[i] || ("Tabelle "+(i+1)),
      zeilen: zeilen.filter(z=>z.some(c=>String(c).trim()!==""))
    });
  }
  return blaetter.filter(b=>b.zeilen.length>1);
}

function autoZuordnen(kopf){
  const regeln = {
    name:/firm|arbeitgeber|unternehmen|betrieb|einrichtung|träger|praxis|kunde|^name|name$/i,
    branche:/branche|sparte|wirtschaftszweig/i,
    kontaktweg:/kontaktweg|track/i, status:/status/i,
    quelle:/quelle|herkunft|liste|charge/i,
    ansprechpartner:/ansprech|kontakt.?person|inhaber|geschäftsführ/i,
    telefon:/telefon|^tel\b|phone|mobil|fon/i,
    email:/mail/i, website:/web|url|homepage|internet/i,
    strasse:/stra(ss|ß)e|^str\.|adresse|address/i,
    hausnummer:/^nr\.?$|hausnummer|haus.?nr/i,
    plz:/plz|postleit|zip/i,
    ort:/^ort$|^stadt$|^gemeinde$|^city$|ortsteil/i,
    kategorie:/places|kategorie|type$|typ$/i, notiz:/notiz|bemerk|kommentar/i
  };
  const z = {};
  kopf.forEach((sp,i)=>{
    for (const feld in regeln){
      if(z[feld]!==undefined) continue;
      if(regeln[feld].test(sp)){ z[feld]=i; break; }
    }
  });
  return z;
}

/* ---------- Kundenlisten abgleichen --------------------------------
   Liest die Exporte aus dem Kundenprogramm (Spalte „Kundenstatus":

const ABGL_STATUS = {

  "ehemaliger kunde": { status:"Ehemaliger Kunde", quelle:"Ehemaliger Kunde" },
  "interessent":      { status:"Interessent",      quelle:"Altangebot" }

async function abgleichLesen(){
  const dateien = [...(($("#abglDateien")||{}).files||[])];
  if(!dateien.length){ toast("Bitte Dateien wählen"); return; }
  const eintraege = [];
  for(const d of dateien){
    let text = await d.text();
    text = text.replace(/^﻿/,"");
    const z = tabelleParsen(text, trennzeichenRaten(text));
    if(z.length<2) continue;
    const kopf = z[0].map(s=>String(s).trim().toLowerCase());
    const sp = n => kopf.indexOf(n.toLowerCase());
    const iSt = sp("Kundenstatus");
    if(iSt<0){ toast(d.name+": Spalte „Kundenstatus“ fehlt"); continue; }
    const g = (r,n) => { const i=sp(n); return i<0 ? "" : String(r[i]==null?"":r[i]).trim(); };
    for(const r of z.slice(1)){
      const st = ABGL_STATUS[g(r,"Kundenstatus").toLowerCase()];
      const name = g(r,"Name") || g(r,"Kurzname");
      if(!st || !name) continue;
      let email = g(r,"E-Mail"), web = g(r,"Homepage");
      if(web.indexOf("@")>=0){ if(!email) email = web; web = ""; }
      eintraege.push({ datei:d.name, st, name, strasse:g(r,"Straße"), plz:g(r,"PLZ"), ort:g(r,"Ort"),
        telefon:g(r,"Telefon"), email, website:web, kurzinfo:g(r,"Kurzinfo"), kundennr:g(r,"Kundennummer") });
    }
  }
  if(!eintraege.length){ toast("Keine verwertbaren Zeilen gefunden"); return; }

  /* Suchindex ueber alle Firmen */
  const nachTel = new Map(), nachName = new Map(), nachAdr = new Map();
  const add = (m,k,f) => { if(!k) return; if(!m.has(k)) m.set(k,[]); m.get(k).push(f); };
  const erstesWort = s => (dubWorte(dubNorm(s)).find(w=>w.length>=3 && !DUB_STOP.has(w)) || "");
  for(const f of Store.data.firmen){
    add(nachTel, dubTel(f.telefon), f);
    add(nachName, dubNorm(f.name)+"|"+String(f.plz||"").trim(), f);
    const a = dubAdresse(f);
    if(a.strasse && a.nr && a.plz) add(nachAdr, a.key+"|"+erstesWort(f.name), f);
  }
  for(const e of eintraege){
    const a = dubAdresse(e);
    const kand = []
      .concat(nachName.get(dubNorm(e.name)+"|"+e.plz) || [])
      .concat(dubTel(e.telefon) ? (nachTel.get(dubTel(e.telefon)) || []) : [])
      .concat(a.strasse && a.nr && a.plz ? (nachAdr.get(a.key+"|"+erstesWort(e.name)) || []) : []);
    const eindeutig = [...new Set(kand)];
    e.treffer = eindeutig;
    e.firmaId = eindeutig.length ? eindeutig[0].id : "";
    e.anlegen = !eindeutig.length;
  }
  Abgl = { eintraege, kalt: true };
  abgleichZeigen();
}

  const n = e.target.getAttribute("data-abgl-neu");
  if(n!=null){ Abgl.eintraege[+n].anlegen = e.target.checked; return; }
  if(e.target.id==="abglKalt") Abgl.kalt = e.target.checked;
});

function abgleichAusfuehren(){
  sicherungHerunterladen("vor-kundenabgleich");
  const rang = { "Kunde":3, "Ehemaliger Kunde":2, "Interessent":1 };
  let geaendert = 0, angelegt = 0, kalt = 0;
  const beruehrt = new Set();
  /* Steht eine Firma in mehreren Listen, gewinnt der hoehere Status */
  const ziel = new Map();
  for(const e of Abgl.eintraege){
    if(!e.firmaId) continue;
    const alt = ziel.get(e.firmaId);
    if(!alt || rang[e.st.status] > rang[alt.status]) ziel.set(e.firmaId, e.st);
  }
  for(const [id, st] of ziel){
    const f = DB.firma(id); if(!f) continue;
    if(f.status!==st.status || f.quelle!==st.quelle){ f.status = st.status; f.quelle = st.quelle; geaendert++; }
    beruehrt.add(id);
  }
  for(const e of Abgl.eintraege){
    if(e.firmaId || !e.anlegen) continue;
    neueFirma({ name:e.name, strasse:e.strasse, plz:e.plz, ort:e.ort, telefon:e.telefon, email:e.email,
      website:e.website, status:e.st.status, quelle:e.st.quelle,
      notiz:[e.kundennr?"Kundennr. "+e.kundennr:"", e.kurzinfo].filter(Boolean).join("\n") });
    angelegt++;
  }
  if(Abgl.kalt){
    for(const f of Store.data.firmen) if(!f.quelle && !beruehrt.has(f.id) && f.status!=="Kunde" && f.status!=="Ehemaliger Kunde"){ f.quelle = "Kaltakquise"; kalt++; }
  }
  Abgl = null;
  layerSchliessen();
  Store.save(); render();
  toast(geaendert+" Firmen aktualisiert · "+angelegt+" neu angelegt"+(kalt?" · "+kalt+" als Kaltakquise markiert":""));
}

/* ---------- B30: Anfragen importieren ---------------------------
   Claude durchsucht Outlook nach Anfragen ohne Angebot und legt sie als
   JSON in K:\KI Programme\AQT\Anfragen ab. Hier wird die Datei gelesen,
   jede Anfrage einer vorhandenen Firma zugeordnet (oder neu angelegt)
   und als Vorgang „Angebot zu erstellen“ in die Pipeline gestellt.
   Schon uebernommene Anfragen erkennt AQT am Schluessel in der
   Aktivitaet und bietet sie nicht noch einmal an. */
let Anfr = null;

function anfrImportOeffnen(){
  AnfrIgnoriert.laden();   /* B34: bis die Datei gewaehlt ist, ist die Liste da */
  layerZeigen('<div class="modal"><div class="drawer-head"><h2>Anfragen importieren</h2></div>'+
    '<div class="drawer-body">'+
      '<div class="hint" style="margin-bottom:12px">Die Anfragen-Datei (.json) aus dem Ordner '+
      '<span class="mono">K:\\KI Programme\\AQT\\Anfragen</span> wählen. Vor dem Übernehmen gibt es eine Vorschau.</div>'+
      '<input type="file" id="anfrDatei" accept=".json" multiple>'+
    "</div>"+
    '<div class="drawer-foot"><button class="btn primary" data-act="anfr-lesen">Weiter</button>'+
    '<button class="btn ghost" data-close="1">Abbrechen</button></div></div>', {}, true);
}

async function anfrLesen(){
  const dateien = [...((($("#anfrDatei")||{}).files)||[])];
  if(!dateien.length){ toast("Bitte die Datei wählen"); return; }
  const liste = [];
  for(const d of dateien){
    try{ liste.push(...anfrAusJson(await d.text())); }
    catch(e){ toast(d.name+": kein gültiges JSON – "+e.message); return; }
  }
  if(!liste.length){ toast("Keine Anfragen in der Datei"); return; }
  anfrVorbereiten(liste, dateien.length===1 ? dateien[0].name : dateien.length+" Dateien");
  anfrZeigen();
}

function anfrAusJson(text){
  const daten = JSON.parse(String(text).replace(/^\uFEFF/,""));
  return Array.isArray(daten) ? daten : (daten.anfragen||[]);
}

/* ---------- B34: Anfragen dauerhaft ausblenden --------------------
   „ausblenden" in der Import-Vorschau merkt sich den Schluessel in
   aqt_einstellungen unter "anfr_ignoriert" (zusaetzlich im Browser).
   Die Anfrage taucht dann weder im Anfragen-Ordner-Hinweis noch beim
   manuellen Import wieder auf. Firma/Titel/Datum werden mitgespeichert,
   damit man spaeter nachsehen kann, was ausgeblendet wurde. */
const AnfrIgnoriert = {
  liste: null, set: new Set(),
  async laden(){
    if(this.liste) return;
    let l = [];
    try{ l = JSON.parse(localStorage.getItem("aqt.anfrignoriert") || "[]"); }catch(_){}
    if(Store.backend.id==="supabase" && Auth.eingeloggt()){
      try{
        const alle = await SB.einstellungenLaden();
        if(Array.isArray(alle.anfr_ignoriert)) l = alle.anfr_ignoriert;
      }catch(e){ console.warn("anfr_ignoriert nicht geladen:", e.message||e); }
    }
    this.liste = l; this.set = new Set(l.map(x => x.schluessel));
  },
  ist(schluessel){ return !!schluessel && this.set.has(schluessel); },
  async merken(e){
    if(!this.liste) this.liste = [];
    if(!e.schluessel || this.set.has(e.schluessel)) return;
    this.liste.push({ schluessel:e.schluessel, firma:e.firma||"", titel:e.titel||"", am:ISO(new Date()) });
    this.set.add(e.schluessel);
    try{ localStorage.setItem("aqt.anfrignoriert", JSON.stringify(this.liste)); }catch(_){}
    if(Store.backend.id==="supabase" && Auth.eingeloggt()){
      try{ await SB.einstellungSetzen("anfr_ignoriert", this.liste); }
      catch(err){ toast("Ausblenden nur im Browser gemerkt – Supabase: "+(err.message||err)); }
    }
  }
};

/* Schon uebernommene Anfragen am Schluessel in den Aktivitaeten erkennen */
function anfrSchonDa(){
  const schonDa = new Set();
  for(const a of Store.data.aktivitaeten){
    const m = /\[Anfrage-Import ([^\]]+)\]/.exec(a.text||""); if(m) schonDa.add(m[1]);
  }
  return schonDa;
}

/* B34: Hat die zugeordnete Firma schon einen offenen Vorgang, ist die
   Anfrage meist schon von Hand angelegt – dann vorab abwaehlen. */
function anfrOffenPruefen(e){
  const v = e.firmaId ? Store.data.vorgaenge.find(x => x.firmaId===e.firmaId && !x.ergebnis && !x.entwurf && istDeal(x)) : null;
  e.offen = v ? (v.titel || "ohne Titel") : "";
}

function anfrVorbereiten(liste, name){
  /* B31: dieselbe Anfrage kann in mehreren Tagesdateien stehen – nur einmal */
  const gesehen = new Set();
  liste = liste.filter(x => !x.schluessel || (gesehen.has(x.schluessel) ? false : (gesehen.add(x.schluessel), true)));

  /* Suchindex ueber alle Firmen */
  const nachTel = new Map(), nachNamePlz = new Map(), nachName = new Map(), nachMail = new Map();
  const add = (m,k,f) => { if(!k) return; if(!m.has(k)) m.set(k,[]); m.get(k).push(f); };
  for(const f of Store.data.firmen){
    if(f.entwurf) continue;
    add(nachTel, dubTel(f.telefon), f);
    add(nachNamePlz, dubNorm(f.name)+"|"+String(f.plz||"").trim(), f);
    add(nachName, dubNorm(f.name), f);
    add(nachMail, String(f.email||"").trim().toLowerCase(), f);
  }
  const schonDa = anfrSchonDa();

  const eintraege = liste.map(x => {
    const e = Object.assign({ firma:"", ansprechpartner:"", email:"", telefon:"", strasse:"", plz:"", ort:"",
      titel:"", anfrageAm:"", frist:"", notiz:"", mailText:"", schluessel:"" }, x);
    const nameKand = nachName.get(dubNorm(e.firma)) || [];
    const kand = []
      .concat(nachNamePlz.get(dubNorm(e.firma)+"|"+String(e.plz||"").trim()) || [])
      .concat(dubTel(e.telefon) ? (nachTel.get(dubTel(e.telefon)) || []) : [])
      .concat(e.email ? (nachMail.get(String(e.email).trim().toLowerCase()) || []) : [])
      .concat(nameKand.length <= 3 ? nameKand : []);
    e.treffer = [...new Set(kand)];
    e.firmaId = e.treffer.length ? e.treffer[0].id : "";
    e.doppelt = !!(e.schluessel && schonDa.has(e.schluessel));
    e.ignoriert = AnfrIgnoriert.ist(e.schluessel);
    anfrOffenPruefen(e);
    e.an = !e.doppelt && !e.ignoriert && !e.offen;
    return e;
  }).filter(e => !e.ignoriert);
  Anfr = { eintraege, datei:name };
}

/* ---------- B31: Anfragen-Ordner merken --------------------------
   Eine geplante Aufgabe legt jeden Werktag frueh neue Anfragen als JSON
   in K:\KI Programme\AQT\Anfragen ab. AQT merkt sich den Ordner (File
   System Access API, Handle in IndexedDB) und meldet in der Pipeline,
   wie viele Anfragen dort liegen, die noch nicht uebernommen sind. Der
   Browser fragt nach einem Neustart einmal nach der Leseerlaubnis –
   das ist ein Klick auf „Ordner freigeben". */
const AnfrOrdner = {
  handle:null, geholt:false, zeit:0, laeuft:false, zustand:"", neu:[], dateien:0, fehler:"",
  db(){
    return new Promise((ok, err) => {
      const r = indexedDB.open("aqt-anfragen", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("h");
      r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error);
    });
  },
  async holen(){
    if(this.geholt) return this.handle;
    this.geholt = true;
    try{
      const d = await this.db();
      this.handle = await new Promise(ok => {
        const q = d.transaction("h").objectStore("h").get("ordner");
        q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null);
      });
    }catch(_){ this.handle = null; }
    return this.handle;
  },
  async merken(h){
    this.handle = h; this.geholt = true;
    try{
      const d = await this.db();
      await new Promise(ok => { const t = d.transaction("h","readwrite"); t.objectStore("h").put(h,"ordner"); t.oncomplete = ok; t.onerror = ok; });
    }catch(_){}
  },
  /* Alle JSON-Dateien lesen und die noch nicht uebernommenen Anfragen sammeln */
  async lesen(){
    const liste = []; let n = 0;
    for await (const eintrag of this.handle.values()){
      if(eintrag.kind !== "file" || !/\.json$/i.test(eintrag.name)) continue;
      try{ liste.push(...anfrAusJson(await (await eintrag.getFile()).text())); n++; }
      catch(e){ console.warn("Anfragen-Datei unlesbar:", eintrag.name, e); }
    }
    await AnfrIgnoriert.laden();   /* B34 */
    const schonDa = anfrSchonDa(), gesehen = new Set();
    this.neu = liste.filter(x => x.schluessel && !schonDa.has(x.schluessel) && !AnfrIgnoriert.ist(x.schluessel) && !gesehen.has(x.schluessel) && (gesehen.add(x.schluessel), true));
    this.dateien = n;
  },
  async pruefen(erzwingen){
    if(this.laeuft) return;
    if(!erzwingen && Date.now() - this.zeit < 60000){ anfrOrdnerRendern(); return; }
    this.laeuft = true;
    try{
      if(!window.showDirectoryPicker){ this.zustand = "geht-nicht"; return; }
      const h = await this.holen();
      if(!h){ this.zustand = "kein-ordner"; return; }
      const p = await h.queryPermission({ mode:"read" });
      if(p !== "granted"){ this.zustand = "erlauben"; return; }
      await this.lesen();
      this.zustand = "ok"; this.fehler = "";
      this.zeit = Date.now();
    }catch(e){
      this.zustand = "fehler"; this.fehler = e.message || String(e);
    }finally{
      this.laeuft = false;
      anfrOrdnerRendern();
    }
  }
};

function anfrOrdnerRendern(){
  const box = $("#anfrBox"); if(!box) return;
  const z = AnfrOrdner.zustand, n = AnfrOrdner.neu.length;
  if(z === "geht-nicht" || z === ""){ box.innerHTML = ""; return; }
  if(z === "kein-ordner"){
    box.innerHTML = '<div class="tiny muted" style="margin-bottom:12px">Anfragen aus Outlook automatisch anzeigen: '+
      '<button class="linkish" data-act="anfr-ordner-waehlen">Ordner „Anfragen“ verbinden</button></div>';
    return;
  }
  if(z === "erlauben"){
    box.innerHTML = '<div class="tiny muted" style="margin-bottom:12px">Anfragen aus Outlook: '+
      '<button class="linkish" data-act="anfr-erlauben">Ordner freigeben</button> (einmal pro Browser-Start)</div>';
    return;
  }
  if(z === "fehler"){
    box.innerHTML = '<div class="tiny" style="margin-bottom:12px;color:var(--crit)">Anfragen-Ordner nicht lesbar: '+esc(AnfrOrdner.fehler)+
      ' · <button class="linkish" data-act="anfr-ordner-waehlen">neu verbinden</button></div>';
    return;
  }
  if(!n){
    box.innerHTML = '<div class="tiny muted" style="margin-bottom:12px">Anfragen aus Outlook: nichts Neues · '+
      '<button class="linkish" data-act="anfr-ordner-neu">nachsehen</button></div>';
    return;
  }
  box.innerHTML =
    '<div class="panel" style="margin-bottom:16px"><div class="panel-head">'+
      '<h3>Neue Anfragen aus Outlook <span class="chip crit">'+n+"</span></h3>"+
      '<div style="margin-left:auto;display:flex;gap:9px;align-items:center">'+
        '<button class="btn primary sm" data-act="anfr-ordner-vorschau">Ansehen &amp; übernehmen</button>'+
        '<button class="btn sm ghost" data-act="anfr-ordner-neu">Aktualisieren</button></div></div>'+
      '<div class="panel-body tiny muted">'+
        AnfrOrdner.neu.slice(0,6).map(x => esc(x.firma||"")+(x.titel?" – "+esc(x.titel):"")).join("<br>")+
        (n>6 ? "<br>… und "+(n-6)+" weitere" : "")+
      "</div></div>";
}

/* ---------- B32: Offene Angebote fuer Claude ablegen --------------
   Gegenrichtung zum Anfragen-Ordner: AQT schreibt beim Oeffnen der
   Pipeline (hoechstens 1×/Minute, nur wenn sich etwas geaendert hat)
   alle abgegebenen, noch offenen Angebote nach
   K:\KI Programme\AQT\Nachfassen\aqt-angebote.json. Claude (Outlook-
   Assistent) gleicht die Datei mit Outlook ab und legt Nachfass-
   Entwuerfe im jeweiligen Mailverlauf an. Braucht Schreibrecht auf den
   Ordner – nach einem Browser-Neustart ein Klick auf „Ordner freigeben". */
const NfExport = {
  handle:null, geholt:false, zeit:0, laeuft:false, zustand:"", fehler:"", letzter:"", anzahl:0, faellig:0, geschrieben:"",
  async holen(){
    if(this.geholt) return this.handle;
    this.geholt = true;
    try{
      const d = await AnfrOrdner.db();
      this.handle = await new Promise(ok => {
        const q = d.transaction("h").objectStore("h").get("nachfassen");
        q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null);
      });
    }catch(_){ this.handle = null; }
    return this.handle;
  },
  async merken(h){
    this.handle = h; this.geholt = true; this.letzter = "";
    try{
      const d = await AnfrOrdner.db();
      await new Promise(ok => { const t = d.transaction("h","readwrite"); t.objectStore("h").put(h,"nachfassen"); t.oncomplete = ok; t.onerror = ok; });
    }catch(_){}
  },
  daten(){
    const deals = Store.data.vorgaenge.filter(v => istDeal(v));
    const firma = v => DB.firma(v.firmaId) || {};
    const angebote = deals.filter(v => !v.ergebnis && v.angebotAm).map(v => {
      const f = firma(v), nf = nachfassFaellig(v), w = wvNaechste(v);
      return {
        vorgangId:v.id, firma:f.name||"", ansprechpartner:f.ansprechpartner||"",
        email:f.email||"", telefon:f.telefon||"", plz:f.plz||"", ort:f.ort||"",
        titel:v.titel||"", objekt:objektText(v)||"", stufe:v.stufe||"",
        angebotAm:v.angebotAm, nachfassStufe:Number(v.nachfassStufe)||0,
        nachfassLetzte:v.nachfassLetzte||"", nachfassAm:nf,
        faellig: !!nf && tageBis(nf) <= 0,
        wiedervorlage: w ? { datum:w.datum||"", anlass:w.anlass||"" } : null,
        keineRueckmeldung: Number(v.nachfassStufe) >= 3
      };
    }).sort((a,b) => (a.nachfassAm||"9").localeCompare(b.nachfassAm||"9"));
    /* Abgeschlossene mit E-Mail: damit Claude in Outlook gefundene
       Angebote nicht anmahnt, die in AQT schon entschieden sind */
    const abgeschlossen = deals.filter(v => v.ergebnis).map(v => {
      const f = firma(v);
      return { vorgangId:v.id, firma:f.name||"", email:f.email||"", titel:v.titel||"",
               angebotAm:v.angebotAm||"", ergebnis:v.ergebnis, absagegrund:v.absagegrund||"" };
    }).filter(x => x.email);
    return { quelle:"AQT", angebote, abgeschlossen };
  },
  /* B36: Gesamtstand fuer Claude (aqt-stand.json im selben Ordner) – alle
     Vorgaenge mit Firma, Stufe, naechster Wiedervorlage und Faellig-Kennung
     wie in der Pipeline. So sieht Claude AQT jederzeit, ohne Bildschirm. */
  stand(){
    const firmen = {};
    const vorgaenge = Store.data.vorgaenge.map(v => {
      const f = DB.firma(v.firmaId) || {}, w = wvNaechste(v);
      if(v.firmaId && !firmen[v.firmaId]) firmen[v.firmaId] = { name:f.name||"", email:f.email||"", telefon:f.telefon||"",
        plz:f.plz||"", ort:f.ort||"", status:f.status||"", ansprechpartner:f.ansprechpartner||"" };
      return {
        id:v.id, firmaId:v.firmaId||"", firma:f.name||"", titel:v.titel||"", stufe:v.stufe||"",
        ergebnis:v.ergebnis||"", absagegrund:v.absagegrund||"", herkunft:v.herkunft||"",
        anfrageAm:v.anfrageAm||"", frist:v.frist||"", angebotAm:v.angebotAm||"",
        nachfassStufe:Number(v.nachfassStufe)||0, nachfassLetzte:v.nachfassLetzte||"",
        deal:istDeal(v), faellig:istDeal(v) && inFaelligListe(v),
        wiedervorlage: w ? { datum:w.datum||"", anlass:w.anlass||"" } : null,
        aktivitaeten: Store.data.aktivitaeten.filter(a => a.vorgangId===v.id).length,
        angelegt:v.angelegt||""
      };
    });
    /* B37: Chronik der letzten 120 Tage (Text gekuerzt), Einstellungen,
       Papierkorb und offene Claude-Vorschlaege */
    const ab = plusTage(-120);
    const aktivitaeten = Store.data.aktivitaeten.filter(a => (a.datum||"") >= ab).map(a => ({
      id:a.id, vorgangId:a.vorgangId, typ:a.typ||"", datum:a.datum||"", text:String(a.text||"").slice(0,400) }));
    const vl = (typeof Vorlagen!=="undefined") ? Vorlagen.aktuell() : {};
    return { quelle:"AQT", stand:"B38", seite:App.seite, anzahlFirmen:Store.data.firmen.length,
      vorgaenge, firmen, aktivitaeten,
      einstellungen:{ nachfassTage:Number(vl.nachfassTage)||14, ich:vl.ich||"",
        vorlagen:(vl.stufen||[]).map(s => ({ kurz:s.kurz||"", betreff:s.betreff||"" })) },
      papierkorb:Papierkorb.laden().map(e => ({ id:e.id, art:e.art, text:e.text, am:e.am })),
      claudeOffen:ClaudeKanal.offen.map(a => a.id) };
  },
  /* B37: alle Firmen kompakt – fuer Kaltakquise, Adressen, Briefe, Auswertungen */
  firmenStand(){
    const nv = new Map(), offen = new Map();
    for(const v of Store.data.vorgaenge){
      nv.set(v.firmaId, (nv.get(v.firmaId)||0)+1);
      if(!v.ergebnis) offen.set(v.firmaId, v.id);
    }
    return { quelle:"AQT", stand:"B38",
      felder:["id","name","branche","gruppe","segment","hauptkategorie","unterkategorie","ablage","kontaktweg","status","quelle",
        "ansprechpartner","briefanrede","telefon","email","website","strasse","plz","ort","gesperrt","notiz","angelegt",
        "vorgaenge","offenerVorgang","briefe","letzterBrief"],
      firmen: Store.data.firmen.filter(f => !f.entwurf).map(f => {
        const b = f.briefe||[], lb = b.length ? b.reduce((x,y) => (y.datum||"") > (x.datum||"") ? y : x) : null;
        return [f.id, f.name||"", f.branche||"", f.gruppe||"", f.segment||"", f.hauptkategorie||"", f.unterkategorie||"", f.ablage||"",
          f.kontaktweg||"", f.status||"", f.quelle||"", f.ansprechpartner||"", f.briefanrede||"", f.telefon||"", f.email||"",
          f.website||"", f.strasse||"", f.plz||"", f.ort||"", !!f.gesperrt, String(f.notiz||"").slice(0,200),
          String(f.angelegt||"").slice(0,10), nv.get(f.id)||0, offen.get(f.id)||"", b.length,
          lb ? (lb.datum||"")+" "+(lb.anlass||"") : ""];
      }) };
  },
  /* Nach jedem Speichern (gebremst) neu ablegen, wenn der Ordner freigegeben ist */
  nachSpeichern(){
    clearTimeout(this._t);
    this._t = setTimeout(() => { this.zeit = 0; this.schreiben(false).catch(()=>{}); }, 4000);
  },
  async schreiben(erzwingen){
    if(this.laeuft) return;
    if(!erzwingen && Date.now() - this.zeit < 60000){ nfExportRendern(); return; }
    this.laeuft = true;
    try{
      if(!Store.data || !Store.data.vorgaenge || !Store.data.vorgaenge.length){ this.zustand = ""; return; }
      if(!window.showDirectoryPicker){   /* Firefox: nur Herunterladen moeglich */
        const d = this.daten();
        this.anzahl = d.angebote.length; this.faellig = d.angebote.filter(a => a.faellig).length;
        this.zustand = "download"; return;
      }
      const h = await this.holen();
      if(!h){ this.zustand = "kein-ordner"; return; }
      const p = await h.queryPermission({ mode:"readwrite" });
      if(p !== "granted"){ this.zustand = "erlauben"; return; }
      await this.rueckmeldung(h);
      await ClaudeKanal.lesen(h);   /* B37 */
      const d = this.daten();
      const inhalt = JSON.stringify(d);
      this.anzahl = d.angebote.length; this.faellig = d.angebote.filter(a => a.faellig).length;
      if(erzwingen || inhalt !== this.letzter){
        d.erstellt = new Date().toISOString();
        const datei = await h.getFileHandle("aqt-angebote.json", { create:true });
        const w = await datei.createWritable();
        await w.write(JSON.stringify(d, null, 1)); await w.close();
        this.letzter = inhalt;
        this.geschrieben = new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
      }
      /* B36: Gesamtstand nur schreiben, wenn sich etwas geaendert hat */
      const s = this.stand(), sInhalt = JSON.stringify(s);
      if(erzwingen || sInhalt !== this.letzterStand){
        s.erstellt = new Date().toISOString();
        const sd = await h.getFileHandle("aqt-stand.json", { create:true });
        const sw = await sd.createWritable();
        await sw.write(JSON.stringify(s)); await sw.close();
        this.letzterStand = sInhalt;
      }
      /* B37: alle Firmen (Kaltakquise, Adressen, Briefe) in eigener Datei */
      const fInhalt = JSON.stringify(this.firmenStand());
      if(erzwingen || fInhalt !== this.letzteFirmen){
        const fd = await h.getFileHandle("aqt-firmen.json", { create:true });
        const fw = await fd.createWritable();
        await fw.write(fInhalt); await fw.close();
        this.letzteFirmen = fInhalt;
      }
      this.zustand = "ok"; this.fehler = "";
      this.zeit = Date.now();
    }catch(e){
      this.zustand = "fehler"; this.fehler = e.message || String(e);
    }finally{
      this.laeuft = false;
      nfExportRendern();
      if(this.neu || ClaudeKanal.neuAuto){
        const t = [];
        if(this.neu) t.push(this.neu+(this.neu===1?" Nachfass-Mail":" Nachfass-Mails")+" aus Outlook eingetragen");
        if(ClaudeKanal.neuAuto) t.push(ClaudeKanal.neuAuto+" Einträge von Claude gebucht");
        toast(t.join(" · "));
        this.neu = 0; ClaudeKanal.neuAuto = 0; setTimeout(() => render(), 0);
      } else ClaudeKanal.rendern();
    }
  },
  /* B35: Rueckmeldung vom Outlook-Assistenten. Claude legt im selben Ordner
     outlook-versendet.json ab: { meldungen:[{ schluessel, vorgangId, stufe, datum, an, betreff, text }] }
     – Nachfass-Mails, die Romano aus Outlook versendet hat. Eingetragen wird wie
     bei „Versendet – eintragen“; der Schluessel steht in der Aktivitaet, so wird
     nichts doppelt gebucht. Abgeschlossene oder unbekannte Vorgaenge werden uebergangen. */
  neu:0,
  async rueckmeldung(h){
    let d;
    try{
      const fh = await h.getFileHandle("outlook-versendet.json");
      d = JSON.parse(await (await fh.getFile()).text());
    }catch(_){ return; }
    const schonDa = new Set();
    for(const a of Store.data.aktivitaeten){
      const m = /\[Outlook-Nachfass ([^\]]+)\]/.exec(a.text||""); if(m) schonDa.add(m[1]);
    }
    let n = 0;
    for(const e of (d.meldungen||[])){
      if(!e || !e.schluessel || schonDa.has(e.schluessel)) continue;
      const v = DB.vorgang(e.vorgangId); if(!v || v.ergebnis) continue;
      const stufe = Math.min(3, Math.max(1, Number(e.stufe) || (Number(v.nachfassStufe)||0)+1));
      nachfassVermerken(v, stufe, e.datum || ISO(new Date()),
        "aus Outlook · an "+(e.an||"")+"\nBetreff: "+(e.betreff||"")+"\n\n"+(e.text||"")+
        "\n[Outlook-Nachfass "+e.schluessel+"]");
      schonDa.add(e.schluessel); n++;
    }
    if(n){ Store.save(); this.neu = n; }
  },
  /* Firefox kennt showDirectoryPicker nicht: Datei in den Download-Ordner
     legen, Claude sucht dort ebenfalls nach aqt-angebote*.json */
  herunterladen(){
    const d = this.daten(); d.erstellt = new Date().toISOString();
    const url = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "aqt-angebote.json"; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    this.geschrieben = new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
    nfExportRendern();
    toast("Liste gespeichert (Downloads) – Claude findet sie dort");
  }
};

/* ---------- B37: Papierkorb -------------------------------------
   Geloeschte Vorgaenge und Firmen liegen 30 Tage im Papierkorb (samt
   Objekten, Aktivitaeten und Anhang-Eintraegen) und lassen sich
   zurueckholen. Gespeichert in aqt_einstellungen unter „papierkorb“,
   zusaetzlich im Browser. Anhang-Dateien werden erst beim endgueltigen
   Leeren aus der Ablage entfernt. */
const Papierkorb = {
  TAGE:30, MAX_FIRMEN:5000, liste:null, entfernt:new Set(), _t:null,
  laden(){
    if(this.liste) return this.liste;
    try{ this.liste = JSON.parse(localStorage.getItem("aqt.papierkorb") || "[]"); }catch(_){ this.liste = []; }
    if(Store.backend.id==="supabase" && Auth.eingeloggt()){
      SB.einstellungenLaden().then(alle => {
        if(Array.isArray(alle.papierkorb)) this.zusammen(alle.papierkorb);
      }).catch(e => console.warn("Papierkorb nicht geladen:", e.message||e));
    }
    return this.liste;
  },
  zusammen(fremd){
    const da = new Set(this.liste.map(x => x.id));
    for(const x of fremd) if(!da.has(x.id) && !this.entfernt.has(x.id)) this.liste.push(x);
    this.liste.sort((a,b) => (b.am||"").localeCompare(a.am||""));
  },
  /* daten = { firmen, objekte, vorgaenge, aktivitaeten, anhaenge } – Kopien der Datensaetze */
  ablegen(art, text, daten){
    this.laden();
    const e = { id:uid(), art, text, am:new Date().toISOString(),
      daten: JSON.parse(JSON.stringify(daten)) };
    this.liste.unshift(e);
    this.aufraeumen(false);
    this.speichern();
    return e;
  },
  aufraeumen(speichern){
    const grenze = plusTage(-this.TAGE);
    let firmen = 0, weg = [];
    this.liste = this.liste.filter(e => {
      firmen += (e.daten.firmen||[]).length;
      const alt = (e.am||"").slice(0,10) < grenze || firmen > this.MAX_FIRMEN;
      if(alt) weg.push(e);
      return !alt;
    });
    for(const e of weg){ this.entfernt.add(e.id); anhangDateienWeg(e.daten.anhaenge||[]); }
    if(weg.length && speichern !== false) this.speichern();
    return weg.length;
  },
  speichern(){
    try{ localStorage.setItem("aqt.papierkorb", JSON.stringify(this.liste)); }
    catch(_){ /* Browser voll – die Cloud-Kopie zaehlt */ }
    if(Store.backend.id!=="supabase" || !Auth.eingeloggt()) return;
    clearTimeout(this._t);
    this._t = setTimeout(async () => {
      try{
        const alle = await SB.einstellungenLaden();
        if(Array.isArray(alle.papierkorb)) this.zusammen(alle.papierkorb);
        await SB.einstellungSetzen("papierkorb", this.liste);
      }catch(e){ toast("Papierkorb nur im Browser gemerkt – Supabase: "+(e.message||e), true); }
    }, 1500);
  },
  wiederherstellen(id){
    this.laden();
    const e = this.liste.find(x => x.id === id); if(!e) return "";
    const d = e.daten;
    const rein = (k, arr) => {
      if(!Array.isArray(Store.data[k])) Store.data[k] = [];
      const da = new Set(Store.data[k].map(x => x.id));
      for(const r of (arr||[])) if(!da.has(r.id)) Store.data[k].push(r);
    };
    rein("firmen", d.firmen); rein("objekte", d.objekte); rein("vorgaenge", d.vorgaenge);
    rein("aktivitaeten", d.aktivitaeten); rein("anhaenge", d.anhaenge);
    this.liste = this.liste.filter(x => x.id !== id);
    this.entfernt.add(id);
    Store.save(); this.speichern();
    return e.text;
  },
  endgueltig(id){
    this.laden();
    const e = this.liste.find(x => x.id === id); if(!e) return;
    anhangDateienWeg(e.daten.anhaenge||[]);
    this.liste = this.liste.filter(x => x.id !== id);
    this.entfernt.add(id);
    this.speichern();
  },
  panelHTML(){
    const l = this.laden();
    return '<div class="panel" style="margin-top:18px"><div class="panel-head"><h3>Papierkorb</h3>'+
      '<span class="chip" style="margin-left:auto">'+l.length+"</span></div><div class=\"panel-body\">"+
      '<div class="hint" style="margin-bottom:12px">Gelöschte Vorgänge und Firmen bleiben '+this.TAGE+
      " Tage hier und lassen sich mit allen Aktivitäten zurückholen. Danach werden sie endgültig entfernt.</div>"+
      (l.length
        ? '<table class="data" style="width:100%"><thead><tr><th>Gelöscht am</th><th>Was</th><th></th></tr></thead><tbody>'+
          l.slice(0,100).map(e =>
            "<tr><td class=\"tiny\">"+esc(fmtDatum(e.am))+" "+esc((e.am||"").slice(11,16))+"</td>"+
            "<td>"+esc(e.text)+"</td>"+
            '<td style="white-space:nowrap"><button class="btn sm" data-act="pk-zurueck" data-id="'+esc(e.id)+'">Wiederherstellen</button> '+
            '<button class="btn sm ghost" data-act="pk-weg" data-id="'+esc(e.id)+'">Endgültig löschen</button></td></tr>'
          ).join("")+"</tbody></table>"+
          (l.length>100 ? '<div class="tiny muted" style="margin-top:6px">… und '+(l.length-100)+" ältere</div>" : "")
        : '<div class="tiny muted">Leer.</div>')+
      "</div></div>";
  }
};

/* Meldung mit Knopf (z.B. „Rückgängig“), bleibt 8 Sekunden stehen */
function toastAktion(text, knopf, fn){
  const host = $("#toastHost"); if(!host) return;
  host.innerHTML = '<div class="toast">'+esc(text)+' <button class="linkish" id="toastKnopf" style="color:inherit;font-weight:700;margin-left:8px">'+esc(knopf)+"</button></div>";
  const b = $("#toastKnopf");
  if(b) b.onclick = () => { host.innerHTML = ""; fn(); };
  clearTimeout(toast._t);
  toast._t = setTimeout(() => host.innerHTML = "", 8000);
}
function papierkorbToast(text, eintrag){
  if(!eintrag){ toast(text); return; }
  toastAktion(text+" · im Papierkorb", "Rückgängig", () => {
    Papierkorb.wiederherstellen(eintrag.id); render(); toast("Wiederhergestellt");
  });
}

/* ---------- B37: Auftraege von Claude ----------------------------
   Claude (Outlook-Assistent) legt claude-auftraege.json in den verbundenen
   Ordner: { auftraege:[{ id, art, text, grund, auto, vorgangId, firmaId, daten }] }.
   AQT zeigt sie auf jeder Seite oben als Vorschlaege; Romano uebernimmt oder
   lehnt ab. Nur Eintraege mit auto:true UND einer harmlosen Art (Chronik,
   Angebot abgegeben) bucht AQT sofort. Ergebnis jeder Entscheidung steht in
   claude-erledigt.json, gemerkt in aqt_einstellungen „claude_erledigt“.
   B38: „firma-anlegen“ (z. B. aus der Vermietungssuche) legt Firma +
   Akquise-Kontakt an; gibt es die Firma schon, wird nur ergaenzt. */
const CLAUDE_AUTO = ["aktivitaet", "angebot", "firma-anlegen"];
const CLAUDE_VORGANG_FELDER = ["titel","notiz","frist","anfrageAm","kontaktweg","nachfassTage","objektId"];
const CLAUDE_FIRMA_FELDER = ["name","branche","gruppe","segment","hauptkategorie","unterkategorie","ablage","kontaktweg","status",
  "quelle","ansprechpartner","briefanrede","telefon","email","website","strasse","plz","ort","notiz","gesperrt"];
const ClaudeKanal = {
  offen:[], erledigt:null, alle:false, zuletzt:"", neuAuto:0,
  async erledigtLaden(){
    if(this.erledigt) return;
    let l = [];
    try{ l = JSON.parse(localStorage.getItem("aqt.claudeErledigt") || "[]"); }catch(_){}
    if(Store.backend.id==="supabase" && Auth.eingeloggt()){
      try{
        const alle = await SB.einstellungenLaden();
        if(Array.isArray(alle.claude_erledigt)){
          const da = new Set(l.map(x => x.id));
          for(const x of alle.claude_erledigt) if(!da.has(x.id)) l.push(x);
        }
      }catch(e){ console.warn("claude_erledigt nicht geladen:", e.message||e); }
    }
    this.erledigt = new Map(l.map(x => [x.id, x]));
  },
  async lesen(h){
    let d;
    try{
      const fh = await h.getFileHandle("claude-auftraege.json");
      d = JSON.parse(await (await fh.getFile()).text());
    }catch(_){ this.offen = []; return; }
    await this.erledigtLaden();
    const neu = (d.auftraege||[]).filter(a => a && a.id && a.art && !this.erledigt.has(a.id));
    this.offen = [];
    let n = 0;
    for(const a of neu){
      if(a.auto && CLAUDE_AUTO.indexOf(a.art) >= 0){
        try{ const t = this.anwenden(a); this.merken(a, "auto", t); n++; }
        catch(e){ this.merken(a, "fehler", e.message||String(e)); }
      } else this.offen.push(a);
    }
    if(n){ Store.save(); this.neuAuto += n; }
    this.zuletzt = new Date().toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });
    await this.quittungSchreiben(h);
  },
  merken(a, status, info){
    this.erledigt.set(a.id, { id:a.id, art:a.art, status, info:info||"", text:a.text||"", am:new Date().toISOString() });
  },
  async quittungSchreiben(h){
    const l = [...this.erledigt.values()].sort((a,b) => (b.am||"").localeCompare(a.am||"")).slice(0, 1000);
    try{ localStorage.setItem("aqt.claudeErledigt", JSON.stringify(l)); }catch(_){}
    if(Store.backend.id==="supabase" && Auth.eingeloggt()){
      try{ await SB.einstellungSetzen("claude_erledigt", l); }catch(e){ console.warn("claude_erledigt:", e.message||e); }
    }
    h = h || NfExport.handle;
    if(!h) return;
    try{
      if(await h.queryPermission({ mode:"readwrite" }) !== "granted") return;
      const fh = await h.getFileHandle("claude-erledigt.json", { create:true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify({ quelle:"AQT", erstellt:new Date().toISOString(), erledigt:l }, null, 1)); await w.close();
    }catch(e){ console.warn("claude-erledigt.json:", e.message||e); }
  },
  /* Fuehrt einen Auftrag aus und gibt eine kurze Rueckmeldung zurueck.
     Wirft einen Fehler, wenn etwas nicht passt – dann bleibt alles, wie es war. */
  anwenden(a){
    const d = a.daten || {};
    const V = () => { const v = DB.vorgang(a.vorgangId || d.vorgangId); if(!v) throw new Error("Vorgang nicht gefunden"); return v; };
    const F = () => { const f = DB.firma(a.firmaId || d.firmaId); if(!f) throw new Error("Firma nicht gefunden"); return f; };
    const notiz = (v, txt) => neueAktivitaet({ vorgangId:v.id, typ:d.typ||"Notiz", datum:d.datum||ISO(new Date()), text:txt+"\n[Claude "+a.id+"]" });
    switch(a.art){
      case "aktivitaet": { const v = V(); notiz(v, d.text||a.text||""); return "Chronik eingetragen"; }
      case "angebot": {
        const v = V(); if(v.ergebnis) throw new Error("Vorgang ist abgeschlossen");
        const alt = v.angebotAm; v.angebotAm = d.datum || ISO(new Date()); delete v.entwurf;
        /* „Anfrage bearbeiten“ ist mit dem Angebot erledigt */
        for(const x of (v.wiedervorlagen||[])) if(!x.erledigt && (x.anlass||"").indexOf("Anfrage bearbeiten") === 0) x.erledigt = true;
        neueAktivitaet({ vorgangId:v.id, typ:"E-Mail", datum:v.angebotAm,
          text:"Angebot per E-Mail versendet"+(d.text ? "\n\n"+d.text : "")+"\n[Claude "+a.id+"]" });
        return terminAutomatik(v, v.frist, alt) || "Angebot eingetragen";
      }
      case "wiedervorlage": {
        const v = V(); if(!d.datum) throw new Error("Datum fehlt");
        if(d.offeneErledigen) for(const x of (v.wiedervorlagen||[])) if(!x.erledigt) x.erledigt = true;
        wvSetzen(v, d.datum, d.anlass || "Wiedervorlage");
        return "Wiedervorlage "+fmtDatum(d.datum);
      }
      case "stufe": {
        const v = V(); if(!STUFEN.some(s => s.id === d.stufe) || d.stufe === "abschluss") throw new Error("Stufe unbekannt");
        const alt = v.stufe; v.stufe = d.stufe;
        if(v.ergebnis){ abschlussTermineAbhaken(v); v.ergebnis = ""; v.absagegrund = ""; }
        stufenAutomatik(v, alt);
        return "Stufe: "+stufenName(d.stufe);
      }
      case "absage": {
        const v = V(); const g = ABSAGEGRUENDE.indexOf(d.grund) >= 0 ? d.grund : "anderes";
        delete v.entwurf;
        notiz(v, "Absage: "+g+(d.text ? " – "+d.text : ""));
        v.ergebnis = "verloren"; v.stufe = "abschluss"; v.absagegrund = g;
        abschlussWvAbhaken(v); wvSetzen(v, plusMonate(9), "Nach Absage wieder ansprechen");
        return "Absage gebucht ("+g+")";
      }
      case "auftrag": {
        const v = V(); delete v.entwurf;
        if(d.text) notiz(v, d.text);
        v.ergebnis = "gewonnen"; v.stufe = "abschluss";
        abschlussWvAbhaken(v);
        wvSetzen(v, plusTage(90), "90-Tage-Check nach Vertragsstart");
        wvSetzen(v, plusMonate(3), "Empfehlung erfragen");
        const f = DB.firma(v.firmaId); if(f && f.status !== "Kunde") f.status = "Kunde";
        return "Auftrag gebucht";
      }
      case "vorgang-aendern": {
        const v = V(), fe = d.felder || {}, altFrist = v.frist; let n = 0;
        for(const k of CLAUDE_VORGANG_FELDER) if(k in fe){ v[k] = fe[k]; n++; }
        if(!n) throw new Error("Keine erlaubten Felder");
        terminAutomatik(v, altFrist, v.angebotAm);
        return n+" Feld(er) geändert";
      }
      case "firma-aendern": {
        const f = F(), fe = d.felder || {}; let n = 0;
        for(const k of CLAUDE_FIRMA_FELDER) if(k in fe){ f[k] = fe[k]; n++; }
        if(!n) throw new Error("Keine erlaubten Felder");
        return n+" Feld(er) geändert";
      }
      case "vorgang-papierkorb": { const v = V(); vorgangLoeschen(v.id); return "in den Papierkorb gelegt"; }
      case "firma-papierkorb": { const f = F(); firmenLoeschen([f.id]); return "in den Papierkorb gelegt"; }
      case "firmen-zusammenlegen": {
        const ids = d.ids || [], keep = d.behalten;
        if(!keep || ids.indexOf(keep) < 0 || ids.some(i => !DB.firma(i))) throw new Error("Firmen nicht gefunden");
        const n = dubMergeKern(ids, keep); if(!n) throw new Error("Nichts zusammengelegt");
        return n+" Firma(en) zusammengelegt";
      }
      case "firma-anlegen": return this.firmaAnlegen(a);
      case "hinweis": return "gelesen";
    }
    throw new Error("Unbekannte Art: "+a.art);
  },
  /* B38: daten = { felder:{name, plz, ort, …}, akquise:{ titel, text, wiedervorlage, anlass } }.
     Gleiche Firma = gleicher Name (dubNorm) und gleiche PLZ oder gleicher Ort.
     Kunden bekommen nur eine Notiz, keinen Akquise-Kontakt. */
  firmaAnlegen(a){
    const d = a.daten || {}, fe = d.felder || {}, ak = d.akquise || {};
    const name = String(fe.name||"").trim(); if(!name) throw new Error("Firmenname fehlt");
    const n = dubNorm(name), plz = String(fe.plz||"").trim(), ort = dubNorm(fe.ort);
    let f = a.firmaId ? DB.firma(a.firmaId) : null;
    if(!f) f = Store.data.firmen.find(x => dubNorm(x.name) === n &&
      ((plz && String(x.plz||"").trim() === plz) || (ort && dubNorm(x.ort) === ort) || (!plz && !ort)));
    const marke = "[Claude "+a.id+"]";
    const text = (ak.text || a.text || "").trim();
    let neu = false;
    if(!f){
      const p = { kontaktweg:"Aktiv", status:"Interessent", quelle:"Vermietungsmeldung" };
      for(const k of CLAUDE_FIRMA_FELDER) if(k in fe && fe[k] !== "" && fe[k] != null) p[k] = fe[k];
      p.name = name;
      f = neueFirma(p); neu = true;
    }
    if(zielgruppe(f) === "Kunde"){
      f.notiz = [f.notiz, ISO(new Date())+": "+text+" "+marke].filter(Boolean).join("\n");
      return "„"+f.name+"“ ist Kunde – nur Notiz ergänzt";
    }
    let v = Store.data.vorgaenge.find(x => x.firmaId === f.id && !istDeal(x) && !x.ergebnis);
    const vNeu = !v;
    if(!v) v = neuerVorgang({ firmaId:f.id, kontaktweg:f.kontaktweg||"Aktiv", titel:ak.titel||"Akquise", herkunft:"Kaltakquise" });
    neueAktivitaet({ vorgangId:v.id, typ:"Notiz", datum:ISO(new Date()), text:text+"\n"+marke });
    if(vNeu || !wvNaechste(v)) wvSetzen(v, ak.wiedervorlage || plusTage(2), ak.anlass || "Ansprechen (Akquise-Anlass)");
    return (neu ? "Firma „"+f.name+"“ angelegt" : "„"+f.name+"“ gab es schon")+
      (vNeu ? " · Akquise-Kontakt angelegt" : " · Notiz am Akquise-Kontakt");
  },
  async entscheiden(id, ja){
    const a = this.offen.find(x => x.id === id); if(!a) return;
    await this.erledigtLaden();
    if(ja){
      try{ const t = this.anwenden(a); this.merken(a, "ok", t); Store.save(); toast(t); }
      catch(e){ this.merken(a, "fehler", e.message||String(e)); toast("Nicht möglich: "+(e.message||e)); }
    } else { this.merken(a, "abgelehnt", ""); toast("Vorschlag abgelehnt"); }
    this.offen = this.offen.filter(x => x.id !== id);
    render();
    await this.quittungSchreiben();
  },
  async alleUebernehmen(){
    await this.erledigtLaden();
    let ok = 0, fehl = 0;
    for(const a of this.offen){
      if(a.art === "hinweis") continue;
      try{ this.merken(a, "ok", this.anwenden(a)); ok++; }
      catch(e){ this.merken(a, "fehler", e.message||String(e)); fehl++; }
    }
    this.offen = this.offen.filter(a => a.art === "hinweis");
    if(ok) Store.save();
    render();
    toast(ok+" Vorschläge übernommen"+(fehl ? " · "+fehl+" nicht möglich" : ""));
    await this.quittungSchreiben();
  },
  rendern(){
    const box = $("#claudeBox"); if(!box) return;
    const l = this.offen;
    if(!l.length){ box.innerHTML = ""; return; }
    const zeigen = this.alle ? l : l.slice(0, 6);
    const ziel = a => {
      const v = DB.vorgang(a.vorgangId || (a.daten||{}).vorgangId), f = DB.firma(a.firmaId || (a.daten||{}).firmaId);
      if(v) return ' <button class="linkish" data-vorgang="'+esc(v.id)+'">'+esc(DB.firmaName(v.firmaId))+"</button>";
      if(f) return ' <button class="linkish" data-firma="'+esc(f.id)+'">'+esc(f.name)+"</button>";
      return "";
    };
    box.innerHTML = '<div class="panel" style="margin-bottom:14px;border-left:3px solid var(--accent,#2b6cb0)">'+
      '<div class="panel-head"><h3>Vorschläge von Claude <span class="chip">'+l.length+"</span></h3>"+
        '<span style="margin-left:auto;display:flex;gap:8px">'+
        (l.some(a => a.art !== "hinweis") ? '<button class="btn sm primary" data-act="ck-alle">Alle übernehmen</button>' : "")+
        "</span></div>"+
      '<div class="panel-body" style="padding-top:4px">'+
      zeigen.map(a =>
        '<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)">'+
          '<div style="flex:1;font-size:13.5px">'+esc(a.text||a.art)+ziel(a)+
            (a.grund ? '<div class="tiny muted">'+esc(a.grund)+"</div>" : "")+"</div>"+
          (a.art === "hinweis"
            ? '<button class="btn sm" data-act="ck-ja" data-id="'+esc(a.id)+'">Gelesen</button>'
            : '<button class="btn sm primary" data-act="ck-ja" data-id="'+esc(a.id)+'">Übernehmen</button>'+
              '<button class="btn sm ghost" data-act="ck-nein" data-id="'+esc(a.id)+'">Ablehnen</button>')+
        "</div>").join("")+
      (l.length > zeigen.length ? '<button class="linkish" data-act="ck-mehr">alle '+l.length+" anzeigen</button>" : "")+
      "</div></div>";
  }
};

function anfrAusfuehren(){
  const E = Anfr.eintraege.filter(e=>e.an);
  if(!E.length){ toast("Keine Anfrage angehakt"); return; }
  sicherungHerunterladen("vor-anfragen-import");
  let neuF = 0;
  for(const e of E){
    let f = e.firmaId ? DB.firma(e.firmaId) : null;
    if(!f){
      f = neueFirma({ name:e.firma, strasse:e.strasse, plz:e.plz, ort:e.ort, telefon:e.telefon,
        email:e.email, ansprechpartner:e.ansprechpartner, kontaktweg:"Aktiv",
        status:"Interessent", quelle:"Eingehende Anfrage" });
      neuF++;
    }
    const v = neuerVorgang({ firmaId:f.id, titel:e.titel||("Angebot "+f.name), stufe:"neu",
      kontaktweg:"Aktiv", herkunft: zielgruppe(f)==="Kunde" ? "Bestandskunde" : "Eingehende Anfrage",
      anfrageAm:e.anfrageAm||ISO(new Date()), frist:e.frist||"", notiz:e.notiz||"", mailText:e.mailText||"" });
    if(e.frist){
      let wvTag = plusTage(-3, e.frist);
      if(tageBis(wvTag) < 1) wvTag = plusTage(1);
      wvSetzen(v, wvTag, "Angebot vor Frist "+fmtDatum(e.frist)+" abgeben");
    } else {
      wvSetzen(v, plusTage(2), "Anfrage bearbeiten");
    }
    neueAktivitaet({ vorgangId:v.id, typ:"E-Mail", datum:e.anfrageAm||ISO(new Date()),
      text:"Anfrage aus Outlook übernommen"+(e.ansprechpartner?"\nAnsprechpartner: "+e.ansprechpartner:"")+
        (e.email?"\nE-Mail: "+e.email:"")+(e.telefon?"\nTelefon: "+e.telefon:"")+
        (e.schluessel?"\n[Anfrage-Import "+e.schluessel+"]":"") });
  }
  Anfr = null;
  AnfrOrdner.zeit = 0;      /* Hinweis in der Pipeline neu zaehlen */
  layerSchliessen();
  Store.save(); render();
  toast(E.length+" Anfragen in die Pipeline übernommen"+(neuF?" · "+neuF+" Firmen neu angelegt":""));
}

        optionen(QUELLEN,"","Quelle: aus Datei / leer")+"</select>"+

      '<label class="switch"><input type="checkbox" id="impAus" checked> Ausgeschlossene Zeilen überspringen (Spalte AUSSCHLUSS)</label>'+
    "</div>"+
    '<div class="hint" style="margin-top:10px">Gruppe, Segment und die Briefanrede werden aus der Liste '+

    "Aktive und ehemalige Kunden aus der Sperrliste bekommen die passende Quelle, echte Sperrer (Rückläufer, "+
    "keine Werbung) werden mitimportiert, aber dauerhaft vom Versand ausgenommen.</div>"+
    '<div style="margin-top:16px;display:flex;gap:9px">'+
      '<button class="btn primary" data-act="imp-start">'+Import.zeilen.length+" Zeilen importieren</button>"+
