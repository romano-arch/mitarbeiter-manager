function abgleichAnwenden(){
  const p = Abgleich.plan;
  if(!p || !p.aenderungen.length) return;
  sicherungHerunterladen("vor-branchenabgleich");
  for (const a of p.aenderungen) Object.assign(a.f, a.neu);
  const n = p.aenderungen.length;
  Abgleich.plan = null;
  Store.save();
  layerSchliessen();
  render();
  toast(n.toLocaleString("de-DE")+" Firmen aktualisiert \u2013 keine neu angelegt");
}

/* Firmen, an denen ein Vorgang haengt, sind vor dem Loeschen im Stapel
   geschuetzt. Loeschen reisst alles Angehaengte mit - Objekte, Vorgaenge,
   Aktivitaeten, Anhaenge - und genau so ist schon einmal die halbe Pipeline
   verschwunden. Einzeln loeschen bleibt moeglich, im Stapel nicht. */
function firmaHatVorgaenge(id){
  return Store.data.vorgaenge.some(v => v.firmaId === id);
}

function firmenLoeschen(ids){
  const set = new Set(ids);
  const vIds = new Set(Store.data.vorgaenge.filter(v=>set.has(v.firmaId)).map(v=>v.id));
  /* B37: vorher in den Papierkorb, Anhang-Dateien bleiben vorerst liegen */
  const fs = Store.data.firmen.filter(f=>set.has(f.id));
  let pk = null;
  if(fs.length) pk = Papierkorb.ablegen("firma",
    fs.length===1 ? "Firma „"+(fs[0].name||"(ohne Namen)")+"“"+(vIds.size ? " mit "+vIds.size+(vIds.size===1?" Vorgang":" Vorgängen") : "")
                  : fs.length+" Firmen ("+fs.slice(0,3).map(f=>f.name).join(", ")+(fs.length>3?" …":"")+")", {
    firmen:fs, objekte:Store.data.objekte.filter(o=>set.has(o.firmaId)),
    vorgaenge:Store.data.vorgaenge.filter(v=>vIds.has(v.id)),
    aktivitaeten:Store.data.aktivitaeten.filter(a=>vIds.has(a.vorgangId)),
    anhaenge:(Store.data.anhaenge||[]).filter(a=>vIds.has(a.vorgangId)) });
  Store.data.firmen     = Store.data.firmen.filter(f=>!set.has(f.id));
  Store.data.objekte    = Store.data.objekte.filter(o=>!set.has(o.firmaId));
  Store.data.vorgaenge  = Store.data.vorgaenge.filter(v=>!set.has(v.firmaId));
  Store.data.aktivitaeten = Store.data.aktivitaeten.filter(a=>!vIds.has(a.vorgangId));
  Store.data.anhaenge   = (Store.data.anhaenge||[]).filter(a=>!vIds.has(a.vorgangId));
  return pk;
}

/* ---------- Dubletten-Pruefung -------------------------------------
   Google liefert dieselbe Adresse manchmal doppelt, nur anders
   geschrieben ("a. Main" vs "am Main", mit/ohne GmbH). Der Import
   faengt nur exakte Doppel ab. Hier wird schreibweise-unabhaengig
   verglichen, angezeigt und einzeln zum Loeschen angeboten. */
function dubNorm(s){
  s = String(s==null?"":s).toLowerCase().trim();
  s = s.replace(/\ba\.\s*m\.?\b/g, "am main");
  s = s.replace(/\ba\.\s*main\b/g, "am main");
  s = s.replace(/\bst\.\b/g, "sankt");
  s = s.replace(/&/g, "und");
  s = s.replace(/[.,;/()\-]/g, " ");
  s = s.replace(/\b(gmbh|kg|ag|ohg|mbh|co|e\s*v|ug|gbr)\b/g, " ");
  s = s.replace(/\s+/g, " ").trim();
  return s;
}
function dubSchluessel(f){ return dubNorm(f.name)+"|"+dubNorm(f.ort); }
/* B21: zusaetzlich gleicher Name + PLZ + Strasse. Faengt Faelle, bei denen
   nur der Ort anders geschrieben ist (Rodgau / Rodgau-Nieder-Roden). */
function dubStrasse(s){
  return String(s==null?"":s).toLowerCase().replace(/str\./g,"strasse").replace(/stra\u00dfe/g,"strasse").replace(/[^a-z0-9]/g,"");
}
/* Gleiche Adresse (Strasse + Hausnummer + PLZ) UND (gleiche Telefonnummer
   ODER gleicher Name). Der Name wird ueber ein "Kennwort" verglichen: das
   erste seltene Namenswort ohne Rechtsform, Gattungswort und Ortsname.
   Hochhaeuser mit vielen verschiedenen Firmen bleiben unberuehrt, weil dort
   Name und Telefon nicht uebereinstimmen. */
const DUB_STOP = new Set(["dr","med","praxis","zahnarztpraxis","zahnarzt","zahnärzte","arztpraxis","die","der","das","und","gmbh","prof","kanzlei","rechtsanwälte","rechtsanwalt","dent","dipl","frau","herr","gemeinschaftspraxis","hausarztpraxis","zentrum","mvz","ag","kg","co","von","in","am","für","fur","st","sankt"]);
const DUB_GEN = new Set(["generalkonsulat","konsulat","königreich","republik","botschaft","staates","honorarkonsulat","europe","germany","deutschland","branch","international","services","service","group","holding","gesellschaft","niederlassung","filiale","standort","zweigniederlassung","partner","partners","privatpraxis","kardiologische","consulting","management","immobilien","beratung","steuerberater","physiotherapie","logopädie","ergotherapie","bank","capital","invest","investment","law","firm","llp","mbb","partnerschaftsgesellschaft","geschäftsstelle","kundencenter","deutscher","deutsche","freie","evangelisches","evangelische","katholische","hessischer","hessische","zahnärztin","ärztin","arzt","fachärztin","facharzt","allgemeinmedizin","orthopädie","gynäkologie"]);
function dubWorte(s){ return String(s==null?"":s).toLowerCase().replace(/ß/g,"ss").match(/[a-zäöü0-9]+/g) || []; }
function dubTel(t){
  let s = String(t||"").replace(/[^\d+]/g,"");
  if(s.startsWith("+49")) s = "0"+s.slice(3);
  if(s.startsWith("0049")) s = "0"+s.slice(4);
  return s.length>=6 ? s : "";
}
function dubAdresse(f){
  let s = String(f.strasse||"").split(/[\/,(]/)[0].replace(/\s+-\s*[A-Za-zäöüÄÖÜ].*$/,"").replace(/[.\s]+$/,"").trim();
  const m = s.match(/^(.*?)(\d+\s*[a-zA-Z]?)(\s*[-–\/]\s*\d+\s*[a-zA-Z]?)?\s*$/);
  const st = m ? m[1] : s;
  const nr = m ? m[2].replace(/\s/g,"").toLowerCase() : "";
  const plz = String(f.plz||"").trim();
  const strasse = st.toLowerCase().replace(/ß/g,"ss").replace(/str\./g,"strasse").replace(/[^a-z0-9äöü]/g,"");
  return { strasse, nr, plz, key: strasse+"|"+nr+"|"+plz };
}
function dubKennwort(name, wc, orte){
  for(const w of dubWorte(name)){
    if(w.length>=3 && !DUB_STOP.has(w) && !DUB_GEN.has(w) && !orte.has(w) && (wc.get(w)||0)<=25) return w;
  }
  return "";
}
function dublettenGruppenVon(alle, kandidaten){
  const wc = new Map(), orte = new Set();
  for(const f of alle){
    for(const w of new Set(dubWorte(f.name))) if(w.length>=3 && !DUB_STOP.has(w)) wc.set(w,(wc.get(w)||0)+1);
    for(const w of dubWorte(f.ort)) if(w.length>=3 && !DUB_STOP.has(w)) orte.add(w);
  }
  const topf = new Map();
  for(const f of kandidaten){
    const a = dubAdresse(f);
    if(!a.strasse || !a.nr || !a.plz) continue;
    if(!topf.has(a.key)) topf.set(a.key, []);
    topf.get(a.key).push({ f, tel: dubTel(f.telefon), kw: dubKennwort(f.name, wc, orte) });
  }
  const gruppen = [];
  for(const liste of topf.values()){
    if(liste.length<2) continue;
    const eltern = liste.map((_,i)=>i);
    const wurzel = i => { while(eltern[i]!==i){ eltern[i]=eltern[eltern[i]]; i=eltern[i]; } return i; };
    for(let i=0;i<liste.length;i++) for(let j=i+1;j<liste.length;j++){
      const a=liste[i], b=liste[j];
      if((a.tel && a.tel===b.tel) || (a.kw && a.kw===b.kw)) eltern[wurzel(i)] = wurzel(j);
    }
    const cluster = new Map();
    liste.forEach((x,i)=>{ const r=wurzel(i); if(!cluster.has(r)) cluster.set(r,[]); cluster.get(r).push(x); });
    for(const c of cluster.values()){
      if(c.length<2) continue;
      let tel=false, name=false;
      for(let i=0;i<c.length;i++) for(let j=i+1;j<c.length;j++){
        if(c[i].tel && c[i].tel===c[j].tel) tel=true;
        if(c[i].kw && c[i].kw===c[j].kw) name=true;
      }
      const g = c.map(x=>x.f);
      g.grund = [tel?"gleiche Telefonnummer":"", name?"gleicher Name":""].filter(Boolean).join(" und ");
      /* Fuer die Einteilung eindeutig/pruefen: stimmen ALLE ueberein? */
      g.alleTel = !!c[0].tel && c.every(x=>x.tel===c[0].tel);
      g.alleKw  = !!c[0].kw  && c.every(x=>x.kw===c[0].kw);
      gruppen.push(g);
    }
  }
  return gruppen.sort((a,b)=>b.length-a.length || (a[0].name||"").localeCompare(b[0].name||"","de"));
}
function dublettenGruppen(){
  const alle = Store.data.firmen;
  return dublettenGruppenVon(alle, alle.filter(f=>!f.entwurf));
}

/* ---------- Zusammenlegen (B21) -----------------------------------
   Eine Firma bleibt stehen. Leere Felder werden aus den anderen ergaenzt,
   Objekte, Vorgaenge (samt Aktivitaeten/Anhaengen) und Briefvermerke
   werden umgehaengt, erst danach verschwindet der Doppelgaenger. */
const DUB_FELDER = [["name","Firma"],["strasse","Stra\u00dfe"],["plz","PLZ"],["ort","Ort"],["telefon","Telefon"],["email","E-Mail"],
  ["website","Website"],["ansprechpartner","Ansprechpartner"],["status","Status"],["quelle","Quelle"],
  ["hauptkategorie","Hauptkategorie"],["branche","Branche"],["gruppe","Gruppe"],["notiz","Notiz"]];
const DUB_STATUS_RANG = ["Kunde","Ehemaliger Kunde","Kein Interesse","Verloren","Interessent"];
function dubPunkte(f, nv, no){
  let p = 0;
  for(const [k] of DUB_FELDER) if(f[k]) p++;
  /* Ansprechpartner und E-Mail sind fuer die Akquise am wertvollsten */
  if(f.ansprechpartner) p += 2;
  if(f.email) p += 2;
  const v = nv ? (nv.get(f.id)||0) : DB.vorgaengeVon(f.id).length;
  const o = no ? (no.get(f.id)||0) : Store.data.objekte.filter(x=>x.firmaId===f.id).length;
  p += v*5 + o*3 + (f.briefe||[]).length;
  if(f.status==="Kunde"||f.status==="Ehemaliger Kunde") p += 20;
  return p;
}
/* Bester Eintrag: meiste Punkte, bei Gleichstand der aeltere (er hat
   meist die laengere Geschichte). */
function dubBeste(g, nv, no){
  return g.slice().sort((a,b)=>
    dubPunkte(b,nv,no)-dubPunkte(a,nv,no) ||
    String(a.angelegt||"9").localeCompare(String(b.angelegt||"9"))
  )[0].id;
}
function objektZahlen(){
  const m = new Map();
  for (const o of Store.data.objekte) m.set(o.firmaId, (m.get(o.firmaId)||0)+1);
  return m;
}

/* ---------- „Keine Dublette" (dauerhaft) ---------------------------
   Gespeichert in aqt_einstellungen unter "dub_keine" als Liste von
   ID-Gruppen, zusaetzlich im Browser. Verglichen wird paarweise: kommt
   spaeter eine weitere Firma an dieselbe Adresse, erscheint die Gruppe
   wieder, weil das neue Paar noch nicht geprueft ist. */
const DubKeine = {
  liste: null, paare: new Set(),
  _bauen(){
    this.paare = new Set();
    for(const ids of this.liste)
      for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++)
        this.paare.add([ids[i],ids[j]].sort().join("|"));
  },
  async laden(){
    if(this.liste) return;
    let l = [];
    try{ l = JSON.parse(localStorage.getItem("aqt.dubkeine") || "[]"); }catch(_){}
    if(Store.backend.id==="supabase" && Auth.eingeloggt()){
      try{
        const alle = await SB.einstellungenLaden();
        if(Array.isArray(alle.dub_keine)) l = alle.dub_keine;
      }catch(e){ console.warn("dub_keine nicht geladen:", e.message||e); }
    }
    this.liste = l; this._bauen();
  },
  ist(g){
    const ids = g.map(f=>f.id);
    for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++)
      if(!this.paare.has([ids[i],ids[j]].sort().join("|"))) return false;
    return true;
  },
  async merken(gruppenIds){
    if(!this.liste) this.liste = [];
    for(const ids of gruppenIds) this.liste.push(ids.slice().sort());
    this._bauen();
    try{ localStorage.setItem("aqt.dubkeine", JSON.stringify(this.liste)); }catch(_){}
    if(Store.backend.id==="supabase" && Auth.eingeloggt()){
      try{ await SB.einstellungSetzen("dub_keine", this.liste); }
      catch(e){ toast("„Keine Dublette“ nur im Browser gemerkt – Supabase: "+(e.message||e)); }
    }
  }
};

/* Teilt die Gruppen in „eindeutig" (kann gesammelt zusammengelegt werden)
   und „pruefen" (Entscheidung von Hand). Eindeutig heisst: gleiche Adresse,
   Name bzw. Telefon+Name passen bei ALLEN, hoechstens ein Eintrag hat
   Vorgaenge/Objekte/Kundenstatus und die Status widersprechen sich nicht. */
function dubEinteilen(){
  const nv = vorgangsZahlen(), no = objektZahlen();
  const out = [];
  for(const g of dublettenGruppen()){
    if(DubKeine.ist(g)) continue;
    const gruende = [];
    const namenGleich = new Set(g.map(f=>dubNorm(f.name))).size===1;
    if(!namenGleich && !(g.alleTel && g.alleKw))
      gruende.push(g.alleTel ? "Name weicht ab" : g.alleKw ? "Telefon weicht ab" : "nur teilweise gleich");
    const wichtig = g.filter(f=>(nv.get(f.id)||0) || (no.get(f.id)||0) || f.status==="Kunde" || f.status==="Ehemaliger Kunde").length;
    if(wichtig>1) gruende.push(wichtig+" Einträge mit Vorgängen/Objekten/Kundenstatus");
    const stati = new Set(g.map(f=>f.status).filter(s=>s && s!=="Interessent"));
    if(stati.size>1) gruende.push("Status widersprüchlich ("+[...stati].join(" / ")+")");
    out.push({ key:dubKey(g), g, beste:dubBeste(g,nv,no), eindeutig:!gruende.length, gruende, nv, no });
  }
  return out;
}

/* Haken und „behalten" in der Sammelansicht – zaehlt nicht als
   ungespeicherte Eingabe, damit Schliessen nicht nachfragt. */
document.addEventListener("change", e => {
  if(!App.dubS || !e.target.getAttribute) return;
  const hk = e.target.getAttribute("data-dubs-haken");
  if(hk){ e.target.checked ? App.dubS.haken.add(hk) : App.dubS.haken.delete(hk); LayerBeruehrt = false; dubSammelZeigen(); return; }
  const kp = e.target.getAttribute("data-dubs-keep");
  if(kp){ App.dubS.behalten.set(kp, e.target.value); App.dubS.haken.add(kp); LayerBeruehrt = false; dubSammelZeigen(); }
});
function dubSammelZusammenlegen(){
  const S = App.dubS;
  const auswahl = S.liste.filter(x=>S.haken.has(x.key));
  if(!auswahl.length) return;
  const weg = auswahl.reduce((s,x)=>s+x.g.length-1,0);
  const pruef = auswahl.filter(x=>!x.eindeutig).length;
  bestaetigen(auswahl.length+" Gruppen zusammenlegen?",
    weg+" Doppelgänger werden entfernt, ihre Daten, Vorgänge, Objekte und Briefe gehen an den Eintrag, der bleibt."+
    (pruef?" Darunter "+pruef+" Gruppen aus „Prüfen“.":"")+
    " Vorher wird eine Sicherung heruntergeladen. Das lässt sich nicht rückgängig machen.",
    "Zusammenlegen", () => {
      sicherungHerunterladen("vor-dubletten");
      let n = 0;
      for(const x of auswahl) n += dubMergeKern(x.g.map(f=>f.id), S.behalten.get(x.key));
      Store.save(); render();
      toast(auswahl.length+" Gruppen zusammengelegt – "+n+" Doppelgänger entfernt");

async function dubSammelKeine(){
  const S = App.dubS;
  const topf = S.liste.filter(x => (S.topf==="eindeutig") === x.eindeutig && S.haken.has(x.key));
  if(!topf.length) return;
  await DubKeine.merken(topf.map(x=>x.g.map(f=>f.id)));
  const raus = new Set(topf.map(x=>x.key));
  S.liste = S.liste.filter(x=>!raus.has(x.key));
  for(const k of raus) S.haken.delete(k);
  toast(topf.length+" Gruppen als „keine Dublette“ gemerkt");
  dubSammelZeigen();
}
/* Dubletten-Vorschau: eine Gruppe nach der anderen. Zusammenlegen fuehrt
   die Gruppe zusammen und zeigt die naechste. Ueberspringen merkt sich die
   Gruppe fuer diese Sitzung. Keine Sicherung vorher: Zusammenlegen ist nicht
   rueckgaengig zu machen, die Vorschau ist der Schutz. */
function dubKey(g){ return g.map(f=>f.id).sort().join(","); }
function dubSpalte(f, beste){
  const nv = DB.vorgaengeVon(f.id).length, no = Store.data.objekte.filter(o=>o.firmaId===f.id).length;
  let h = '<div style="flex:1;min-width:0;padding:0 8px"><label style="display:flex;gap:6px;align-items:center;font-weight:700;margin-bottom:8px">'+
    '<input type="radio" name="dubKeep" value="'+esc(f.id)+'"'+(f.id===beste?" checked":"")+"> Diese behalten</label>";
  for(const [k,l] of DUB_FELDER){
    h += '<div class="tiny" style="margin-bottom:3px"><span class="muted">'+l+":</span> "+(f[k]?esc(String(f[k]).slice(0,120)):'<span class="muted">—</span>')+"</div>";
  }
  h += '<div class="tiny" style="margin-top:6px"><strong>'+nv+"</strong> Vorgänge · <strong>"+no+"</strong> Objekte · <strong>"+(f.briefe||[]).length+"</strong> Briefvermerke</div></div>";
  return h;
}
/* Uebersprungene Gruppen bleiben im Browser gemerkt. So kann man die
   Pruefung jederzeit abbrechen und spaeter dort weitermachen –
   zusammengelegte Gruppen sind ohnehin sofort gespeichert. */
function dubSkipSichern(){

}
function dublettenZeigen(zu){

  }

  if(!alle.length){

      '<button class="btn primary" data-dub-do="'+esc(g.map(f=>f.id).join(","))+'">Zusammenlegen ▶</button></div></div></div>', {}, true);
}
function dubMergeAusfuehren(ids, keeperId){
  const n = dubMergeKern(ids, keeperId);
  if(!n){ toast("Nichts zu tun"); return; }
  Store.save(); render();
  toast("Zusammengelegt – "+n+" Doppelgänger entfernt");
  if(App.dubDetail){ App.dubDetail = false; dubSammelOeffnen(); return; }
  dublettenZeigen();
}
/* Legt eine Gruppe zusammen, ohne zu speichern oder neu zu zeichnen –
   so kann die Sammelansicht viele Gruppen am Stueck abarbeiten. */
function dubMergeKern(ids, keeperId){
  const keeper = DB.firma(keeperId);
  const andere = ids.filter(i=>i!==keeperId).map(i=>DB.firma(i)).filter(Boolean);
  if(!keeper || !andere.length) return 0;
  for(const o of andere){
    for(const [k] of DUB_FELDER){
      if(k==="name"||k==="notiz"||k==="status") continue;
      if(!keeper[k] && o[k]) keeper[k] = o[k];
    }
    if(o.segment && !keeper.segment) keeper.segment = o.segment;
    if(o.unterkategorie && !keeper.unterkategorie) keeper.unterkategorie = o.unterkategorie;
    if(o.briefanrede && !keeper.briefanrede) keeper.briefanrede = o.briefanrede;
    if(o.notiz && (keeper.notiz||"").indexOf(o.notiz)<0) keeper.notiz = keeper.notiz ? keeper.notiz+"\n"+o.notiz : o.notiz;
    if(DUB_STATUS_RANG.indexOf(o.status) >= 0 && DUB_STATUS_RANG.indexOf(o.status) < DUB_STATUS_RANG.indexOf(keeper.status)) keeper.status = o.status;
    if(o.gesperrt) keeper.gesperrt = true;
    if(o.angelegt && (!keeper.angelegt || o.angelegt < keeper.angelegt)) keeper.angelegt = o.angelegt;
    keeper.briefe = keeper.briefe || [];
    for(const b of (o.briefe||[])) if(!keeper.briefe.some(x=>x.datum===b.datum && x.anlass===b.anlass)) keeper.briefe.push(b);
    for(const ob of Store.data.objekte)   if(ob.firmaId===o.id) ob.firmaId = keeper.id;
    for(const v of Store.data.vorgaenge)  if(v.firmaId===o.id)  v.firmaId  = keeper.id;
  }
  firmenLoeschen(andere.map(o=>o.id));
  for(const o of andere) App.auswahl.delete(o.id);
  return andere.length;
}
function briefeEntfernen(){
  const n = Store.data.firmen.reduce((s,f)=>s+(f.briefe||[]).length,0);
  if(!n){ toast("Keine Versand-Markierungen vorhanden"); return; }

    for(const f of Store.data.firmen) f.briefe = [];
    Store.save(); render(); toast(n+" Brief-Einträge entfernt");
  });
}

      const gespiegelt = await Spiegel.lesen("daten");
      const zeitIdb = Number(await Spiegel.lesen("daten_zeit")) || 0;
      let zeitLokal = 0;
      try{ zeitLokal = Number(localStorage.getItem("aqt.v1.zeit")) || 0; }catch(_){}
      let lsFallback = null;
      try{ const r = localStorage.getItem("aqt.v1"); lsFallback = r ? JSON.parse(r) : null; }catch(_){ lsFallback = null; }
      if(lsFallback && Array.isArray(lsFallback.firmen) && zeitLokal > zeitIdb){
        lokal = lsFallback;
      } else if(gespiegelt && Array.isArray(gespiegelt.firmen)){

      }
      let offen = await Spiegel.lesen("offen");
      if(!offen){ try{ offen = JSON.parse(localStorage.getItem("aqt.offen") || "null"); }catch(_){ offen = null; } }
      await SB.login(mail, pw);
      Store.backend = Backends.supabase;
      await sbLaden();
      /* Cloud ist jetzt der Ausgangsstand. */
      Sync.grundstellung();
      /* Alles, was lokal lag und in der Cloud noch fehlt (per ID), wird
         uebernommen und anschliessend hochgeladen – nie mehr verworfen.
         Frueher gingen lokale Vorgaenge verloren, sobald in der Cloud
         schon Firmen lagen. */
      let uebernommen = 0;
      /* B17: Was beim letzten Mal nicht mehr in die Cloud kam, ist lokal
         neuer als der Cloud-Stand. Diese Eintraege ersetzen die Cloud-
         Version, lokal geloeschte werden entfernt. */
      if(offen && typeof offen === "object"){
        for (const t of SYNC_TABELLEN){
          const s = t.schluessel, o = offen[s]; if(!o) continue;
          if(!Array.isArray(Store.data[s])) Store.data[s] = [];
          const w = new Set(o.w||[]), g = new Set(o.g||[]);
          if(w.size){
            const vor = Store.data[s].length;
            Store.data[s] = Store.data[s].filter(r => !w.has(r.id));
            uebernommen += vor - Store.data[s].length;
          }
          for (const r of (lokal[s]||[])){
            if(!g.has(r.id) || r.entwurf) continue;
            const i = Store.data[s].findIndex(x => x.id === r.id);
            if(i >= 0) Store.data[s][i] = r; else Store.data[s].push(r);
            uebernommen++;
          }
        }
      }
      /* B24: Kein blindes einspielen() mehr. Was wirklich lokal offen war,
         steht schon oben ueber die "offen" (g/w)-Liste drin – ein
         zusaetzliches "fehlt in der Cloud, also wieder anlegen" traf auch
         Eintraege, die auf einem anderen Rechner absichtlich geloescht
         wurden, und liess sie wieder auftauchen. */
      if(uebernommen){
        Store.save();
        Sync.anstossen();
        toast(uebernommen+" lokale Einträge in die Cloud übernommen");

      appStarten();
    }catch(e){
      loginZeigen(e.message.includes("Invalid")||e.message.includes("invalid")
        ? "E-Mail oder Passwort falsch" : e.message);
    }
  };

  $("#loginBtn").onclick = doLogin;
  document.addEventListener("keydown", function einmal(e){
    if(e.key==="Enter"){ doLogin(); document.removeEventListener("keydown",einmal); }
  });
}

/* Ein Vorgang ist ein „Deal", wenn er NICHT aus der Kaltakquise stammt
   ODER wenn aus der Kaltakquise etwas Konkretes geworden ist.
   Frueher reichte dafuer jede Stufe ausser „Neu" – damit verschwand ein
   Kontakt schon nach dem ersten Telefonat aus der Anrufliste, obwohl noch
   gar kein Angebot im Spiel war. Konkret heisst jetzt: es gibt eine Anfrage
   oder ein Angebot, oder die Stufe ist Besichtigung/Angebot/Nachfass, oder
   es wurde ein Auftrag gebucht. Eine Absage im Erstkontakt bleibt
   Kaltakquise-Historie und wandert nicht ins Deal-Board. */
function istDeal(v){
  if(v.herkunft && v.herkunft !== "Kaltakquise") return true;
  if(v.anfrageAm || v.angebotAm) return true;
  if(["besichtigung","angebot_versendet","nachfass"].indexOf(v.stufe) >= 0) return true;
  if(v.stufe === "abschluss" && v.ergebnis === "gewonnen") return true;
  return false;
}

/* Sortier-Gewicht: überfällig zuerst, dann bald fällig, dann Rest.
   Innerhalb gleicher Dringlichkeit nach Wiedervorlage-Datum aufsteigend. */
function kartenSortiert(arr){
  const gew = v => {
    const dr = dringlichkeit(v);
    if(dr==="crit") return 0;
    if(dr==="warn") return 1;
    const w = wvNaechste(v);
    return w ? 2 : 3;           /* ohne WV ganz unten */
  };
  /* B28: bei Gleichstand nach Firmenname, sonst stand es zufaellig */
  return arr.slice().sort((a,b) => {
    const d = gew(a) - gew(b);
    if(d !== 0) return d;
    const wa = wvNaechste(a), wb = wvNaechste(b);
    if(wa && wb && wa.datum !== wb.datum) return wa.datum.localeCompare(wb.datum);
    return SORT_NAME.compare(DB.firmaName(a.firmaId), DB.firmaName(b.firmaId));
  });
}
const SORT_NAME = new Intl.Collator("de", { numeric:true, sensitivity:"base" });

const BOARD_LIMIT = 6;                  /* sichtbare Karten pro Spalte */
if(!App.boardOffen) App.boardOffen = new Set();  /* aufgeklappte Spalten */

/* B25: Auf dem Board stehen nur offene Deals – wie bei Pipedrive. Wer
   abgeschlossen hat, steht unter „Abgeschlossen“. Zum Abschliessen eine
   Karte nach unten auf Auftrag oder Absage ziehen. */
function boardHTML(liste){
  let h = '<div class="board" id="board">';
  const offeneStufen = STUFEN.filter(s => s.id !== "abschluss");
  offeneStufen.forEach((st, nr) => {
    const karten = kartenSortiert(liste.filter(v =>
      v.stufe === st.id ||
      (st.id === "neu" && (v.stufe === "kontaktiert" || v.stufe === "besichtigung")) ||
      (st.id === "angebot_versendet" && v.stufe === "angebot_erstellt") ||
      (st.id === "nachfass" && v.stufe === "abschluss")));
    const offen = App.boardOffen.has(st.id);
    const sichtbar = offen ? karten : karten.slice(0, BOARD_LIMIT);
    const rest = karten.length - sichtbar.length;
    const ue = karten.filter(v => dringlichkeit(v) === "crit").length;
    h += '<section class="col" data-stufe="'+st.id+'">'+
      '<div class="col-head"><span class="n mono">'+(nr+1)+'</span>'+
      '<span class="t">'+esc(st.name)+'</span>'+
      (ue ? '<span class="ue" title="'+ue+' überfällig">'+ue+'</span>' : "")+
      '<span class="c">'+karten.length+"</span></div>";
    h += sichtbar.length ? sichtbar.map(vcardHTML).join("")
       : '<div class="col-empty">leer</div>';
    if(rest > 0)
      h += '<button class="btn ghost board-mehr" data-mehr="'+st.id+
        '" style="width:100%;margin-top:6px;font-size:12px">'+rest+' weitere anzeigen ▾</button>';
    if(offen && karten.length > BOARD_LIMIT)
      h += '<button class="btn ghost board-mehr" data-weniger="'+st.id+
        '" style="width:100%;margin-top:4px;font-size:12px">Weniger ▴</button>';
    h += "</section>";
  });
  return h + "</div>";
}

/* Abgeschlossene Deals: Auftraege zuerst, dann Absagen */
function abgeschlossenHTML(liste){
  if(!liste.length) return '<div class="empty"><h3>Noch nichts abgeschlossen</h3>'+
    "<p>Auftrag oder Absage oben im Vorgang buchen – oder die Karte auf dem Board nach unten ziehen.</p></div>";
  const z = liste.slice().sort((a,b) =>
    (a.ergebnis===b.ergebnis ? 0 : (a.ergebnis==="gewonnen" ? -1 : 1)) ||
    DB.firmaName(a.firmaId).localeCompare(DB.firmaName(b.firmaId), "de"));
  return '<div class="panel"><div class="tablewrap"><table class="data"><thead><tr>'+
    "<th>Firma</th><th>Vorgang</th><th>Ergebnis</th><th>Grund</th><th>Nächster Termin</th></tr></thead><tbody>"+
    z.map(v => {
      const w = wvNaechste(v);
      return '<tr data-vorgang="'+v.id+'" style="cursor:pointer">'+
        '<td class="cellname">'+esc(DB.firmaName(v.firmaId))+"</td>"+
        "<td>"+esc(v.titel||"Ohne Titel")+"</td>"+
        "<td>"+(v.ergebnis==="gewonnen" ? '<span class="chip ok">Auftrag</span>' : '<span class="chip">Absage</span>')+"</td>"+
        '<td class="tiny">'+esc(v.absagegrund||"")+"</td>"+
        '<td class="tiny">'+(w ? esc(fmtDatum(w.datum))+" · "+esc(w.anlass||"") : '<span class="muted">—</span>')+"</td>"+
      "</tr>";
    }).join("")+
    "</tbody></table></div></div>";
}

/* ---------- Akquise-Ansicht: Anrufliste + Statistik ----------- */
function akquiseHTML(liste){
  const enriched = liste.map(v => {
    const f = DB.firma(v.firmaId) || {};
    const w = wvNaechste(v);
    const dr = dringlichkeit(v);
    const akt = DB.aktivitaetenVon(v.id);
    const letzteAkt = akt.length ? akt.sort((a,b)=>b.datum.localeCompare(a.datum))[0] : null;
    return { v, f, w, dr, letzteAkt };
  });

  /* Sortierung: überfällige zuerst, dann fällige, dann Rest */
  enriched.sort((a,b) => {
    const ga = a.dr==="crit"?0:a.dr==="warn"?1:a.w?2:3;
    const gb = b.dr==="crit"?0:b.dr==="warn"?1:b.w?2:3;
    if(ga!==gb) return ga-gb;
    if(a.w && b.w && a.w.datum !== b.w.datum) return a.w.datum.localeCompare(b.w.datum);
    return SORT_NAME.compare(a.f.name||"", b.f.name||"");
  });

  const mitWV = enriched.filter(x=>x.w).length;
  const ueberfaellig = enriched.filter(x=>x.dr==="crit").length;
  const aktiv = enriched.filter(x=>x.v.kontaktweg==="Aktiv").length;
  const passiv = enriched.filter(x=>x.v.kontaktweg!=="Aktiv").length;

  let h = '<div style="display:flex;gap:20px;margin:12px 0 16px;flex-wrap:wrap">'+
    '<div class="tiny"><strong>'+enriched.length+'</strong> offene Akquise-Kontakte</div>'+
    '<div class="tiny">Telefon (Aktiv): <strong>'+aktiv+'</strong></div>'+
    '<div class="tiny">Brief (Passiv): <strong>'+passiv+'</strong></div>'+
    (ueberfaellig ? '<div class="tiny" style="color:var(--crit)"><strong>'+ueberfaellig+'</strong> überfällig</div>' : '')+
  '</div>';

  if(!enriched.length){
    return h + '<div class="empty"><h3>Keine offenen Akquise-Kontakte</h3>'+
      "<p>Einen Kontakt legst du in der Firma über „+ Akquise-Kontakt“ an. Will er ein Angebot, wandert er in die Pipeline.</p></div>";
  }

  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th style="width:24px"></th>'+
    '<th>Firma</th>'+
    '<th>Weg</th>'+
    '<th>AP / Telefon</th>'+
    '<th>Wiedervorlage</th>'+
    '<th>Letzter Kontakt</th>'+
    '</tr></thead><tbody>';

  for(const x of enriched){
    const telNr = (x.f.telefon||"").trim();
    const ap = (x.f.ansprechpartner||"").trim();
    const cls = x.dr==="crit" ? ' style="background:var(--crit-soft)"'
              : x.dr==="warn" ? ' style="background:var(--warn-soft)"' : '';

    h += '<tr'+cls+' data-vorgang="'+x.v.id+'" style="cursor:pointer">'+
      '<td>'+(x.dr==="crit"?'<span style="color:var(--crit)">●</span>':x.dr==="warn"?'<span style="color:var(--warn)">●</span>':'<span style="color:var(--ink-3)">○</span>')+'</td>'+
      '<td><strong>'+esc(x.f.name||"—")+'</strong>'+
        (function(){ const zg = x.f.id ? zielgruppe(x.f) : "";
          return zg==="Kunde" ? ' <span class="chip crit">Kunde – keine Kaltakquise</span>'
               : zg==="Ehemaliger Kunde" ? ' <span class="chip warn">Ehemaliger Kunde</span>'
               : zg==="Interessent (Angebot erhalten)" ? ' <span class="chip">Altangebot</span>' : ""; })()+
        (x.f.ort ? '<div class="tiny muted">'+esc(x.f.ort)+'</div>' : '')+'</td>'+
      '<td><span class="chip'+(x.v.kontaktweg==="Aktiv"?" accent":"")+'">'+esc(x.v.kontaktweg||"—")+'</span></td>'+
      '<td>'+(ap ? esc(ap) : '<span class="muted tiny">kein AP</span>')+
        (telNr ? '<div><a href="tel:'+esc(telUrl(telNr))+'" class="tiny" onclick="event.stopPropagation()">☎ '+esc(telNr)+'</a></div>' : '')+'</td>'+
      '<td>'+(x.w ? '<span class="chip '+(x.dr==="crit"?"crit":x.dr==="warn"?"warn":"")+'">'+esc(relativ(x.w.datum))+'</span>'+
        '<div class="tiny muted">'+esc(x.w.anlass||"")+'</div>' : '<span class="muted tiny">—</span>')+'</td>'+
      '<td>'+(x.letzteAkt ? '<div class="tiny">'+esc(x.letzteAkt.typ)+' · '+esc(fmtDatum(x.letzteAkt.datum))+'</div>' : '<span class="muted tiny">—</span>')+'</td>'+
    '</tr>';
  }
  h += '</tbody></table></div>';
  return h;
}

/* B25: Karte wie bei Pipedrive. Oben Firma, darunter der Betreff in einer
   Zeile, unten genau ein Hinweis (der dringendste) und rechts der Punkt
   fuer die naechste Aktivitaet: rot = ueberfaellig, gruen = heute,
   Kreis = geplant, gelbes ! = nichts geplant. */
function aktPunkt(v){
  const w = wvNaechste(v);
  if(!w) return '<span class="akt-punkt ohne" title="Kein Termin geplant">!</span>';
  const t = tageBis(w.datum);
  const tip = esc((w.anlass||"Wiedervorlage")+" · "+fmtDatum(w.datum)+" · "+relativ(w.datum));
  if(t !== null && t < 0) return '<span class="akt-punkt crit" title="'+tip+'">!</span>';
  if(t === 0) return '<span class="akt-punkt heute" title="'+tip+'"></span>';
  return '<span class="akt-punkt plan" title="'+tip+'"></span>';
}
function kartenChip(v){
  if(v.ergebnis==="gewonnen") return '<span class="chip ok">Auftrag</span>';
  if(v.ergebnis==="verloren") return '<span class="chip">Absage</span>';
  const fi = fristInfo(v);
  if(fi && !v.angebotAm) return '<span class="chip '+fi.cls+'">'+esc(fi.kurz)+"</span>";
  const w = wvNaechste(v);
  if(w){
    const t = tageBis(w.datum);
    if(t !== null && t <= 3)
      return '<span class="chip '+(t<0?"crit":t<=0?"ok":"warn")+'">'+esc(relativ(w.datum))+"</span>";
  }
  if(v.stufe === "besichtigung") return '<span class="chip">Besichtigung</span>';
  return "";
}
function vcardHTML(v){
  const passiv = v.kontaktweg==="Passiv";
  const f = DB.firma(v.firmaId) || {};
  const rest = personKurz(f.ansprechpartner) || f.ort || "";
  return '<button class="vcard'+(passiv?" passiv":"")+'" draggable="true" data-vorgang="'+v.id+'"'+
    ' title="'+esc(DB.firmaName(v.firmaId)+" · "+(v.titel||"Ohne Titel"))+'">'+
    '<span class="v-firma">'+esc(DB.firmaName(v.firmaId))+"</span>"+
    '<span class="v-titel">'+esc(v.titel||"Ohne Titel")+"</span>"+
    '<span class="v-fuss">'+kartenChip(v)+'<span class="rest">'+esc(rest)+"</span>"+aktPunkt(v)+"</span>"+
  "</button>";
}

function faelligHTML(){
  const liste = Store.data.vorgaenge
    .filter(v=>istDeal(v) && inFaelligListe(v))
    .filter(v=> App.passiveZeigen || v.kontaktweg!=="Passiv")
    .sort((a,b)=> wvNaechste(a).datum.localeCompare(wvNaechste(b).datum) ||
      SORT_NAME.compare(DB.firmaName(a.firmaId), DB.firmaName(b.firmaId)));
  if(!liste.length) return '<div class="empty"><h3>Nichts fällig</h3><p>Sobald ein Vorgang eine Wiedervorlage hat, steht er hier – die überfälligen zuerst.</p></div>';

  const heuteUeber = liste.filter(v=>tageBis(wvNaechste(v).datum)<=0);
  const spaeter    = liste.filter(v=>tageBis(wvNaechste(v).datum)>0);
  let h = "";
  const block = (titel, arr) => {
    if(!arr.length) return "";
    return '<div class="section"><div class="section-t">'+esc(titel)+' <span class="mono">'+arr.length+"</span></div>"+
      arr.map(v=>{
        const w=wvNaechste(v), dr=dringlichkeit(v);
        const fi = fristInfo(v);
        /* B37: Schnellknoepfe neben der Karte – ohne den Vorgang zu oeffnen */
        const knoepfe = '<span class="fz-knoepfe" style="display:flex;gap:6px;margin:-4px 0 10px 4px;flex-wrap:wrap">'+
          '<button class="btn sm" data-act="fz-plus14" data-id="'+v.id+'" title="Wiedervorlage um 14 Tage verschieben">+14 Tage</button>'+
          '<button class="btn sm" data-act="fz-erledigt" data-id="'+v.id+'" title="Diese Wiedervorlage abhaken">Erledigt</button>'+
          (v.ergebnis ? "" : '<button class="btn sm ghost" data-act="fz-absage" data-id="'+v.id+'" title="Absage buchen">Absage</button>')+
          "</span>";
        return '<div class="fz-zeile"><button class="vcard'+(dr?" u-"+dr:"")+(v.kontaktweg==="Passiv"?" passiv":"")+'" data-vorgang="'+v.id+'">'+
          '<span class="v-firma">'+esc(DB.firmaName(v.firmaId))+"</span>"+
          '<span class="v-titel">'+esc(v.titel||"Ohne Titel")+"</span>"+
          '<span class="v-meta">'+
            (fi && !v.angebotAm ? '<span class="chip '+fi.cls+' gross">'+esc(fi.kurz)+"</span>" : "")+
            '<span class="chip '+(dr==="crit"?"crit":dr==="warn"?"warn":"")+'">'+
            esc(fmtDatum(w.datum))+" · "+esc(relativ(w.datum))+"</span>"+
            (w.anlass?'<span class="tiny">'+esc(w.anlass)+"</span>":"")+
            '<span class="chip'+(v.ergebnis==="gewonnen"?" ok":"")+'">'+
              esc(v.ergebnis ? (v.ergebnis==="gewonnen" ? "Auftrag" : "Absage") : stufenName(v.stufe))+"</span>"+
          "</span></button>"+knoepfe+"</div>";
      }).join("")+"</div>";
  };
  h += block("Heute und überfällig", heuteUeber);
  h += block("Als Nächstes", spaeter);
  return h;
}

/* ---------- 7. Vorgang öffnen (B25) ---------------------------
   Aufbau wie Pipedrive: links Ansprechpartner, Firma, Objekt und Details,
   rechts „Jetzt dran“, Eingabe, Geplant, Verlauf. Die Feld-IDs (#vFrist,
   #vNotiz usw.) sind dieselben wie vorher – vorgangFelderLesen() und alle
   Knoepfe in aktion() arbeiten unveraendert weiter.
------------------------------------------------------------------- */
const ICO = {
  tel:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  mail:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  web:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>'
};

function telZeile(t){
  t = String(t||"").trim();
  return t ? '<a class="fx-tel" href="tel:'+esc(telUrl(t))+'">'+ICO.tel+esc(t)+"</a>"
           : '<div class="fx-fehlt">'+ICO.tel+"Keine Telefonnummer</div>";
}
function mailZeile(m){
  m = String(m||"").trim();
  return m ? '<a class="fx-link" href="mailto:'+esc(m)+'">'+ICO.mail+esc(m)+"</a>"
           : '<div class="fx-fehlt">'+ICO.mail+"Keine E-Mail-Adresse</div>";
}
function adresseHTML(x){
  const z2 = [x.plz, x.ort].filter(Boolean).join(" ");
  if(!x.strasse && !z2) return '<div class="fx-adr">keine Adresse</div>';
  return '<div class="fx-adr">'+esc(x.strasse||"")+(x.strasse&&z2?"<br>":"")+esc(z2)+"</div>";
}
function miniLinks(x){
  const t = [];
  if(x.website) t.push('<a href="'+esc(webUrl(x.website))+'" target="_blank" rel="noopener">↗ Web</a>');
  const k = kartenUrl(x);
  if(k) t.push('<a href="'+esc(k)+'" target="_blank" rel="noopener">⌖ Karte</a>');
  return t.length ? '<div class="fx-mini">'+t.join("")+"</div>" : "";
}

/* Welcher Reiter im Eingabefeld offen ist. Umschalten ohne Neuaufbau,
   damit getippter Text stehen bleibt. */
function vTabSetzen(tab){
  App.vTab = tab;
  document.querySelectorAll("[data-pane]").forEach(el =>
    el.classList.toggle("hidden", el.getAttribute("data-pane").split(" ").indexOf(tab) < 0));
  document.querySelectorAll(".fx-tabs [data-tab]").forEach(b =>
    b.classList.toggle("on", b.getAttribute("data-tab") === tab));
  const t = $("#aText");
  if(t) t.placeholder = tab === "anruf" ? "Was kam raus? (optional)" : "Was ist passiert? …";
}

function vAbschlussKnoepfe(v){
  /* B28: Kaltakquise-Kontakt – entweder will er ein Angebot (dann geht er
     in die Pipeline) oder er hat kein Interesse */
  if(!istDeal(v) && !v.ergebnis)
    return '<button class="btn won" data-act="akq-angebot">Will ein Angebot</button>'+
           '<button class="btn lost" data-act="leit-kein">Kein Interesse</button>';
  if(v.ergebnis)
    return '<span class="chip gross '+(v.ergebnis==="gewonnen"?"ok":"")+'">'+
      (v.ergebnis==="gewonnen" ? "Auftrag erhalten" : "Absage"+(v.absagegrund?" · "+esc(v.absagegrund):""))+"</span>"+
      '<button class="btn" data-act="abschluss-zuruck">Wieder öffnen</button>';
  return '<button class="btn won" data-act="gewonnen">Auftrag</button>'+
         '<button class="btn lost" data-act="verloren">Absage</button>';
}

function vStufenleiste(v){
  if(!istDeal(v)){
    /* B28: Kaltakquise – zwei Schritte, dann der Uebergang in die Pipeline */
    const k = v.stufe === "kontaktiert" ? 1 : 0;
    return '<div class="fx-stufen">'+AKQ_STUFEN.map((s,n) =>
      '<button type="button" class="'+(n<=k?"an":"")+(n===k?" jetzt-st":"")+'"'+
        (v.ergebnis ? "" : ' data-act="stufe-setzen" data-stufe="'+s.id+'"')+
        '><div class="bar"></div><div class="nm">'+esc(s.name)+"</div></button>").join("")+
      '<button type="button"'+(v.ergebnis ? "" : ' data-act="akq-angebot" title="Kontakt möchte ein Angebot – in die Pipeline übernehmen"')+
        '><div class="bar"></div><div class="nm">Angebot gewünscht → Pipeline</div></button>'+
    "</div>";
  }
  const i = stufenIndex(v), letzte = STUFEN.length - 1;
  return '<div class="fx-stufen">'+STUFEN.map((s,k) => {
    let c = "";
    if(k <= i) c = (v.ergebnis === "gewonnen" && k === letzte) ? "an ende" : "an";
    if(k === i) c += " jetzt-st";
    const abschluss = s.id === "abschluss";
    return '<button type="button" class="'+c+'"'+
      (abschluss ? ' title="Abschluss über Auftrag / Absage oben rechts"'
                 : ' data-act="stufe-setzen" data-stufe="'+s.id+'" title="Stufe setzen: '+esc(s.name)+'"')+
      '><div class="bar"></div><div class="nm">'+esc(s.name)+"</div></button>";
  }).join("")+"</div>";
}

function vKontaktKarte(f){
  if(!f) return '<section class="fx-card"><div class="fx-lbl">Ansprechpartner</div>'+
    '<div class="fx-fehlt">Noch keine Firma zugeordnet</div></section>';
  const roh   = String(f.ansprechpartner||"").trim();
  const name  = personKurz(roh);
  const teile = roh.split(",").map(s=>s.trim()).filter(Boolean);
  const funk  = (name && teile.length > 1) ? teile.slice(1).join(", ") : "";
  return '<section class="fx-card"><div class="fx-lbl">Ansprechpartner</div>'+
    (name ? '<div class="fx-name">'+esc(name)+"</div>"+(funk ? '<div class="fx-funk">'+esc(funk)+"</div>" : "")
          : '<div class="fx-fehlt">Kein Ansprechpartner <button class="linkbtn" data-act="zur-firma">eintragen</button></div>'+
            (roh ? '<div class="tiny muted">Im Feld steht: '+esc(roh)+"</div>" : ""))+
    telZeile(f.telefon)+mailZeile(f.email)+
  "</section>";
}

function vFirmaKarte(f){
  if(!f) return "";
  return '<section class="fx-card"><div class="fx-card-kopf"><div class="fx-lbl">Firma</div>'+
      '<button class="linkbtn" data-act="zur-firma">Firma öffnen</button></div>'+
    '<div style="font-size:14.5px;font-weight:650;overflow-wrap:anywhere">'+esc(f.name||"")+"</div>"+
    adresseHTML(f)+miniLinks(f)+
  "</section>";
}

function vObjektKarte(o){
  return '<section class="fx-card"><div class="fx-lbl">Objekt</div>'+
    '<div style="font-size:14.5px;font-weight:650;margin-top:6px;overflow-wrap:anywhere">'+esc(o.name||"Objekt ohne Namen")+"</div>"+
    adresseHTML(o)+miniLinks({ name:o.name, strasse:o.strasse, plz:o.plz, ort:o.ort })+
  "</section>";
}

/* Titel, Firma und Objekt aendert man selten – eingeklappt. Bei einem
   neuen Vorgang ist der Kasten offen und steht ganz oben. */
function vZuordnung(v, firmen, objekte, offen){
  return '<details class="fx-card stamm" style="margin:0;padding-top:13px"'+(offen?" open":"")+">"+
    '<summary><span class="pfeil">▸</span><span class="zeile fx-lbl">Titel, Firma, Objekt</span><span class="tu">ändern</span></summary>'+
    '<div class="inhalt" style="display:flex;flex-direction:column;gap:10px">'+
      '<div class="field"><label for="vTitel">Titel</label><input type="text" id="vTitel" value="'+esc(v.titel)+'" placeholder="z.B. Unterhaltsreinigung MVZ Nordend"></div>'+

}

  return '<section class="fx-card"><div class="fx-lbl" style="margin-bottom:4px">Details</div>'+

    z("Herkunft","vHerkunft",'<select id="vHerkunft">'+optionen(HERKUNFT, v.herkunft)+"</select>")+
    z("Kontaktweg","vWeg",'<select id="vWeg">'+optionen(WEGE, v.kontaktweg)+"</select>")+

    '<div class="field" style="margin-top:10px"><label for="vNotiz">Beschreibung</label>'+

        '<button class="btn" data-act="leit-nicht">Nicht erreicht</button>'+
        '<button class="btn" data-act="leit-termin">Termin vereinbart</button>'+
        '<button class="btn" data-act="leit-kein">Kein Interesse</button>'+

    "</div>"+
    '<div class="fx-pane'+zeig("wv")+'" data-pane="wv">'+
      '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">'+

        '<div class="field" style="flex:1;min-width:200px"><label for="wvAnlass">Anlass</label><input type="text" id="wvAnlass" placeholder="z.B. Nachfassen"></div>'+

function vGeplant(v){
  const alle = (v.wiedervorlagen||[]).slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
  const offen = alle.filter(x => !x.erledigt), erledigt = alle.filter(x => x.erledigt);
  const zeile = x => {
    const t = tageBis(x.datum);
    const cls = x.erledigt ? "" : (t!==null && t<0) ? "crit" : (t!==null && t<=3) ? "warn" : "";
    return '<div class="fx-plan'+(x.erledigt?" zu":"")+'">'+
      '<span class="dt">'+esc(fmtDatum(x.datum))+"</span>"+
      '<span class="an">'+esc(x.anlass||"Wiedervorlage")+"</span>"+
      (x.erledigt ? "" : '<span class="wann '+cls+'">'+esc(relativ(x.datum))+"</span>")+
      (x.erledigt ? '<span class="tiny muted">erledigt</span>'
                  : '<button class="btn sm" data-wv-done="'+x.id+'">Erledigt</button>')+
      '<button class="btn sm ghost" data-wv-del="'+x.id+'" aria-label="Termin entfernen">✕</button>'+
    "</div>";
  };
  let leer = "";
  if(!offen.length){
    const fi = fristInfo(v);
    leer = '<div class="fx-fehlt" style="margin-top:4px">Nichts geplant – ohne nächsten Termin geht der Vorgang unter.'+
      (fi && !v.angebotAm && !v.ergebnis ? ' <button class="linkbtn" data-act="wv-frist">Wiedervorlage vor der Frist</button>' : "")+
      "</div>";
  }
  return '<section class="fx-card"><div class="fx-card-kopf"><div class="fx-lbl">Geplant'+
      (offen.length ? ' <span class="chip">'+offen.length+"</span>" : "")+"</div>"+
      '<button class="linkbtn" data-act="vtab" data-tab="wv">+ Termin</button></div>'+
    offen.map(zeile).join("")+leer+
    (erledigt.length ? '<details class="fx-imp"><summary>'+erledigt.length+" erledigt</summary>"+erledigt.map(zeile).join("")+"</details>" : "")+
  "</section>";
}

}

/* ---------- 7a. Kopf des Vorgangsfensters ----------------------
   Statt einer Reihe gleichwertiger Chips: erst wo der Vorgang in der
   Pipeline steht, dann in einem Satz, was gerade brennt.
------------------------------------------------------------------- */

function stufenIndexAkq(v){ return v.stufe === "kontaktiert" ? 1 : 0; }
/* Position in der Pipeline. Alte Datenwerte werden mit übersetzt;
   kontaktiert/besichtigung zaehlen bei einem Angebot zur ersten Spalte. */
function stufenIndex(v){
  const id = v.stufe === "angebot_erstellt" ? "angebot_versendet" : v.stufe;
  const i = STUFEN.findIndex(s => s.id === id);
  return i < 0 ? 0 : i;
}

/* Der eine Satz, der zählt. Reihenfolge ist die Dringlichkeit:
   Abschluss schlägt Nachfassen, Nachfassen schlägt Abgabefrist. */
function vorgangStatus(v){
  if(v.ergebnis)
    return v.ergebnis === "gewonnen"
      ? { cls:"ok", text:"Auftrag erhalten" }
      : { cls:"",   text:"Absage"+(v.absagegrund ? " · "+v.absagegrund : "") };

  const nf = nachfassFaellig(v);
  if(nf){
    const t = tageBis(nf);
    if(t !== null && t < 0)
      return { cls:"crit", text:"Nachfassen seit "+Math.abs(t)+(Math.abs(t)===1?" Tag":" Tagen")+" überfällig" };
    if(t === 0) return { cls:"crit", text:"Nachfassen heute fällig" };
  }

  const fi = fristInfo(v);
  if(fi && !v.angebotAm) return { cls:fi.cls, text:fi.text };

  const w = wvNaechste(v);
  if(w){
    const t = tageBis(w.datum);
    return { cls: t<0 ? "crit" : t<=3 ? "warn" : "",
             text:(w.anlass||"Wiedervorlage")+" · "+relativ(w.datum) };
  }
  if(nf) return { cls:"", text:"Nachfassen am "+fmtDatum(nf) };
  if(v.angebotAm) return { cls:"ok", text:"Angebot raus am "+fmtDatum(v.angebotAm) };
  if(v.frist) return { cls:"", text:"Abgabe "+fmtDatum(v.frist) };
  return { cls:"", text:"Kein Termin gesetzt" };
}

/* ---------- 7a3. Verlauf – Chronik, Dateien und die Original-Mail
   in einer Spur, neueste oben.
------------------------------------------------------------------- */
function verlaufHTML(v, akt, anh){
  const posten = [];
  const hatMail = !!String(v.mailText||"").trim();
  let mailDran = false;

  for (const a of akt){
    const mailHier = hatMail && !mailDran && a.typ === "E-Mail" && /^Eingehende Anfrage/.test(a.text||"");
    if(mailHier) mailDran = true;
    const lang  = (a.text||"").length > 260;
    const offen = App.aktOffen.has(a.id);
    posten.push({ zeit:(a.datum||"")+" "+(a.angelegt||""), html:
      '<div class="akt">'+
        '<div class="k">'+esc(a.typ)+'<span class="d">'+esc(fmtDatum(a.datum))+"</span></div>"+
        '<div class="b'+(lang && !offen ? " zu" : "")+'">'+esc(a.text||"—")+"</div>"+
        '<div class="akt-tools">'+
          (mailHier ? '<button class="btn sm" data-act="mail-ansehen">Original-Mail</button>' : "")+
          (lang ? '<button class="btn sm ghost" data-akt-auf="'+a.id+'">'+(offen?"weniger":"ganzer Text")+"</button>" : "")+
          '<button class="btn sm ghost" data-akt-del="'+a.id+'" title="Eintrag löschen">Löschen</button>'+
        "</div>"+
      "</div>" });
  }

  for (const a of anh){
    const tag = (a.angelegt||"").slice(0,10);
    posten.push({ zeit:tag+" "+(a.angelegt||""), html:
      '<div class="akt zeile-datei">'+
        '<div class="k">Datei<span class="d">'+esc(fmtDatum(tag))+"</span></div>"+
        '<div class="b"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+
          esc(a.dateiname)+'">'+esc(a.dateiname)+'</span><span class="tiny muted">'+esc(groesseText(a.groesse))+"</span></div>"+
        '<div class="akt-tools">'+
          '<button class="btn sm" data-act="anh-oeffnen" data-anh="'+a.id+'">Öffnen</button>'+
          '<button class="btn sm ghost" data-act="anh-loeschen" data-anh="'+a.id+'">Löschen</button>'+
        "</div>"+
      "</div>" });
  }

  if(hatMail && !mailDran){
    const tag = v.anfrageAm || (v.angelegt||"").slice(0,10);
    posten.push({ zeit:tag+" 0", html:
      '<div class="akt">'+
        '<div class="k">E-Mail<span class="d">'+esc(fmtDatum(tag))+"</span></div>"+
        '<div class="b">Eingegangene Anfrage</div>'+
        '<div class="akt-tools"><button class="btn sm" data-act="mail-ansehen">Original-Mail</button></div>'+
      "</div>" });
  }

  posten.sort((x,y) => y.zeit.localeCompare(x.zeit));

  return '<section class="fx-card verlauf"><div class="fx-card-kopf"><div class="fx-lbl">Verlauf'+
      (posten.length ? ' <span class="chip">'+posten.length+"</span>" : "")+"</div></div>"+
    (posten.length ? posten.map(x=>x.html).join("")
      : '<div class="tiny muted">Noch nichts dokumentiert. Notizen und Anrufe oben über die Reiter eintragen.</div>')+
  "</section>";
}

/* ---------- 7b. Der Kasten "Jetzt dran" ------------------------
   Ein Vorgang hat immer genau einen nächsten Schritt. Der steht hier,
   mit dem passenden Knopf daneben – statt acht gleichwertiger
   Knöpfe über fünf Abschnitte verteilt.
------------------------------------------------------------------- */
function nachfassStufeWahl(v){
  const naechste = Math.min(3, (Number(v.nachfassStufe)||0) + 1);
  return '<select id="nfStufe">'+
    NACHFASS.map((n,i) => '<option value="'+(i+1)+'"'+((i+1)===naechste?" selected":"")+">"+
      "Stufe "+(i+1)+" · "+esc(n.kurz)+"</option>").join("")+"</select>";
}

/* Was ist der nächste Schritt? Von dringend nach entspannt geprüft. */
function naechsterSchritt(v){
  const mailen  = '<button class="btn primary sm" data-act="nachfass-los">Mail vorbereiten</button>'+nachfassStufeWahl(v);
  const anrufen = '<button class="btn sm" data-act="leitfaden">Anrufen mit Leitfaden</button>';

  if(v.ergebnis) return {
    ton: v.ergebnis==="gewonnen" ? "ok" : "",
    was: v.ergebnis==="gewonnen" ? "Auftrag erhalten" : "Abgesagt",
    warum: v.ergebnis==="gewonnen"
      ? "90-Tage-Check und Empfehlungstermin sind vorgemerkt."
      : "Wiedervorlage zur Reaktivierung ist gesetzt."+(v.absagegrund?" Grund: "+v.absagegrund+".":""),
    tasten: ""
  };

  /* B28: Kaltakquise-Kontakt bei einem Kunden – deutlich warnen */
  if(!istDeal(v)){
    const fk = DB.firma(v.firmaId);
    const zg = fk ? zielgruppe(fk) : "";
    if(zg === "Kunde") return {
      ton:"crit", was:"Aktueller Kunde – keine Kaltakquise",
      warum:"Diese Firma ist Kunde. Für einen neuen Auftrag „Will ein Angebot“ wählen, sonst den Kontakt löschen.",
      tasten:'<button class="btn" data-act="akq-angebot">Angebot anlegen</button>'
    };
    if(zg === "Ehemaliger Kunde" && stufenIndexAkq(v) === 0) return {
      ton:"warn", was:"Ehemaliger Kunde – zurückgewinnen",
      warum:"Nicht wie Kaltakquise ansprechen: an die frühere Zusammenarbeit anknüpfen und fragen, was heute fehlt.",
      tasten: anrufen
    };
  }

  /* B28: Dreimal nachgefasst ohne Antwort – jetzt entscheiden statt
     das Angebot still liegen zu lassen */
  if(istDeal(v) && v.angebotAm && Number(v.nachfassStufe) >= 3) {
    const w3 = wvNaechste(v);
    if(!w3 || tageBis(w3.datum) <= 0) return {
      ton:"crit", was:"Keine Rückmeldung nach 3× Nachfassen",
      warum:"Letztes Nachfassen am "+fmtDatum(v.nachfassLetzte||v.angebotAm)+". Absage mit Grund buchen, damit klar bleibt, warum es nichts wurde – oder anrufen und neu terminieren.",
      tasten:'<button class="btn primary sm" data-act="absage-keine-rm">Absage: keine Rückmeldung</button>'+anrufen+
        '<button class="btn sm" data-act="vtab" data-tab="wv">Neuer Termin</button>'
    };
  }

  const nf = nachfassFaellig(v);
  const tnf = nf ? tageBis(nf) : null;
  if(nf && tnf !== null && tnf <= 0) return {
    ton:"crit",
    was:"Nachfassen zum Angebot",
    warum:(tnf===0 ? "Heute fällig." : "Fällig war der "+fmtDatum(nf)+", also "+Math.abs(tnf)+
      (Math.abs(tnf)===1?" Tag":" Tage")+" überfällig.")+
      (v.angebotAm ? " Angebot ist am "+fmtDatum(v.angebotAm)+" rausgegangen." : ""),
    tasten: mailen+anrufen
  };

  const fi = fristInfo(v);
  if(fi && !v.angebotAm && fi.tage !== null && fi.tage <= 7) return {
    ton: fi.cls || "warn",
    was:"Angebot abgeben",
    warum: fi.text,
    tasten:'<button class="btn primary" data-act="angebot-heute">Angebot heute abgegeben</button>'
  };

  if(nf) return {
    ton:"ok",
    was:"Warten bis "+fmtDatum(nf),
    warum:"Angebot ist raus"+(v.angebotAm?" seit "+fmtDatum(v.angebotAm):"")+
      ". Nachfassen ist für "+relativ(nf)+" vorgemerkt.",
    tasten: mailen
  };

  if(!istDeal(v)){
    const k = stufenIndexAkq(v);
    const w0 = wvNaechste(v);
    return {
      ton: w0 ? (tageBis(w0.datum)<0 ? "crit" : tageBis(w0.datum)<=3 ? "warn" : "") : "",
      was: k===0 ? "Erstkontakt herstellen" : "Am Ball bleiben",
      warum:(w0 ? (w0.anlass||"Wiedervorlage")+" · "+fmtDatum(w0.datum)+" · "+relativ(w0.datum)+". " : "")+
        "Vorschlag: "+leitName(leitVorschlag(v)),
      tasten: anrufen
    };
  }

  /* B28: Angebot ist noch zu erstellen */
  if(stufenIndex(v) === 0 && !v.angebotAm) {
    const w1 = wvNaechste(v);
    return {
      ton: w1 ? (tageBis(w1.datum)<0 ? "crit" : tageBis(w1.datum)<=3 ? "warn" : "") : "warn",
      was: v.stufe === "besichtigung" ? "Besichtigung, dann Angebot erstellen" : "Angebot erstellen",
      warum: w1 ? (w1.anlass||"Wiedervorlage")+" · "+fmtDatum(w1.datum)+" · "+relativ(w1.datum)
                : "Noch kein Termin – bis wann soll das Angebot raus?",
      tasten:'<button class="btn primary sm" data-act="angebot-heute">Angebot heute abgegeben</button>'+
        '<button class="btn sm" data-act="vtab" data-tab="wv">Termin setzen</button>'
    };
  }

  const w = wvNaechste(v);
  if(w) return {
    ton: tageBis(w.datum)<0 ? "crit" : tageBis(w.datum)<=3 ? "warn" : "",
    was: w.anlass || "Wiedervorlage",
    warum: fmtDatum(w.datum)+" · "+relativ(w.datum),
    tasten: anrufen
  };

  return {
    ton:"",
    was:"Kein Termin gesetzt",
    warum:"Ohne Wiedervorlage geht der Vorgang unter. Termin setzen oder anrufen.",
    tasten:'<button class="btn sm" data-act="vtab" data-tab="wv">Wiedervorlage setzen</button>'+anrufen
  };
}

function jetztKasten(v){
  const s = naechsterSchritt(v);
  let fuss = "";
  if(v.angebotAm && !v.ergebnis)
    fuss = '<span>Nachfassen nach <input type="number" id="vNachfassTage" min="1" max="90" value="'+
      nachfassFrist(v)+'" style="width:52px;padding:2px 6px;display:inline-block"> Tagen</span>'+
      (Number(v.nachfassStufe) ? "<span>· zuletzt versendet: Stufe "+Number(v.nachfassStufe)+
        " – "+esc(NACHFASS[Number(v.nachfassStufe)-1].kurz)+"</span>" : "");
  return '<div class="jetzt '+s.ton+'">'+
    '<div class="kopf">Jetzt dran</div>'+
    '<div class="was">'+esc(s.was)+"</div>"+
    '<div class="warum">'+esc(s.warum)+"</div>"+

function vorgangFelderLesen(v){
  const altStufe = v.stufe, altFrist = v.frist, altAngebot = v.angebotAm;
  const g = s => { const el=$(s); return el?el.value:undefined; };
  const set = (k,s) => { const x=g(s); if(x!==undefined) v[k]=x; };
  set("titel","#vTitel"); set("stufe","#vStufe"); set("firmaId","#vFirma");
  set("objektId","#vObjekt"); set("kontaktweg","#vWeg"); set("herkunft","#vHerkunft");
  set("vertragsendeWettbewerb","#vVertragsende"); set("notiz","#vNotiz");
  set("anfrageAm","#vAnfrageAm"); set("frist","#vFrist"); set("angebotAm","#vAngebotAm");
  const nt = g("#vNachfassTage");
  if(nt!==undefined) v.nachfassTage = Math.min(90, Math.max(1, Number(nt)||14));
  /* B17: Automatik hier statt nur beim Speichern – egal, welcher Knopf
     die Felder zuerst uebernimmt, die Erinnerungen werden angelegt. */
  const m = [stufenAutomatik(v, altStufe), terminAutomatik(v, altFrist, altAngebot)].filter(Boolean).join(" · ");
  if(m){
    AutoMeldung = AutoMeldung ? AutoMeldung+" · "+m : m;
    setTimeout(() => { if(AutoMeldung) toast(""); }, 60);
  }
  return m;
}

/* ---------- 7d. Termine und Nachfass-Automatik -----------------
   Ein Abgabetermin ohne Erinnerung ist wertlos. Deshalb setzt das Tool
   die Wiedervorlagen selbst: 3 Tage vor der Frist ans Angebot denken,
   nach der Abgabe im eingestellten Abstand ans Nachfassen.
------------------------------------------------------------------- */
function nachfassFaellig(v){
  if(!v.angebotAm) return "";
  const tage = nachfassFrist(v);
  const stufe = Number(v.nachfassStufe)||0;
  if(stufe >= 3) return "";
  const ab = stufe ? (v.nachfassLetzte || v.angebotAm) : v.angebotAm;
  return plusTage(tage, ab);
}

function terminAutomatik(v, altFrist, altAngebot){
  const meldungen = [];
  if(v.frist && v.frist !== altFrist && !v.ergebnis && !v.angebotAm){
    const anlass = "Angebot vor Frist "+fmtDatum(v.frist)+" abgeben";
    const schon = (v.wiedervorlagen||[]).some(x => !x.erledigt && x.anlass === anlass);
    if(!schon){
      let tag = plusTage(-3, v.frist);
      if(tageBis(tag) < 0) tag = ISO(new Date());
      wvSetzen(v, tag, anlass);
      meldungen.push("Wiedervorlage 3 Tage vor der Frist");
    }
  }
  if(v.angebotAm && v.angebotAm !== altAngebot && !v.ergebnis){
    const ziel = STUFEN.findIndex(s => s.id === "angebot_versendet");
    if(v.stufe !== "abschluss" && stufenIndex(v) < ziel) v.stufe = "angebot_versendet";
    /* offene Frist-Erinnerungen abhaken, das Angebot ist ja raus
       (B37: auch „Anfrage bearbeiten“ – blieb sonst ewig in „Fällig“ stehen) */
    for (const x of (v.wiedervorlagen||[]))
      if(!x.erledigt && ((x.anlass||"").indexOf("Angebot vor Frist") === 0 || (x.anlass||"").indexOf("Anfrage bearbeiten") === 0)) x.erledigt = true;
    const tage = nachfassFrist(v);
    /* B24: Bei einer Versandkorrektur die bestehende(n) offene(n)
       Nachfassen-Wiedervorlage(n) mitverschieben statt sie stehen zu
       lassen oder die Automatik durch sie blockieren zu lassen. */
    const offeneNachfass = (v.wiedervorlagen||[]).filter(x => !x.erledigt && (x.anlass||"").indexOf("Nachfassen zum Angebot") === 0);
    if(offeneNachfass.length){
      const neuesDatum = plusTage(tage, v.angebotAm);
      for (const w of offeneNachfass) w.datum = neuesDatum;
      meldungen.push("Nachfasstermin an neues Versanddatum angepasst");
    } else {
      wvSetzen(v, plusTage(tage, v.angebotAm), "Nachfassen zum Angebot (Stufe 1)");
      meldungen.push("Nachfassen in "+tage+" Tagen vorgemerkt");
    }
  }
  return meldungen.join(" · ");
}

/* B28: Nachfassen nach 14 statt 10 Tagen. Einmalig: offene Angebote, bei
   denen noch nicht nachgefasst wurde, und deren automatischer
   Nachfasstermin (Abgabe + 10 Tage) ruecken auf Abgabe + 14 Tage.
   Selbst gesetzte Termine bleiben unberuehrt. */
function nachfass14Angebote(){
  try{ if(localStorage.getItem("aqt.b28nf14v")) return 0; }catch(_){ return 0; }
  let n = 0;
  for (const v of Store.data.vorgaenge){
    if(v.ergebnis || !istDeal(v) || Number(v.nachfassTage) !== 10 || Number(v.nachfassStufe)) continue;
    v.nachfassTage = 14; n++;
    if(!v.angebotAm) continue;
    const alt = plusTage(10, v.angebotAm), neu = plusTage(14, v.angebotAm);
    for (const w of (v.wiedervorlagen||[]))
      if(!w.erledigt && w.datum === alt && (w.anlass||"").indexOf("Nachfassen") === 0) w.datum = neu;
  }
  if(n) Store.save();
  try{ localStorage.setItem("aqt.b28nf14v", "1"); }catch(_){}
  return n;
}
/* Die Einstellung selbst: steht dort noch der alte Standard 10, wird 14
   daraus (einmal pro Browser, danach gilt, was eingestellt ist). */
function nachfass14Vorlage(){
  try{ if(localStorage.getItem("aqt.b28nf14")) return; }catch(_){ return; }
  const d = Vorlagen.aktuell();
  if(Number(d.nachfassTage) === 10){
    d.nachfassTage = 14;
    Vorlagen.sichern().catch(e => console.warn("Vorlage 14 Tage nicht gespeichert:", e));
  }
  try{ localStorage.setItem("aqt.b28nf14", "1"); }catch(_){}
}

/* Fristen bei alten Vorgängen aus der Notiz nachtragen, damit die
   Anzeige auch bei allem greift, was vor diesem Umbau angelegt wurde. */
function fristenNachtragen(){
  let n = 0;
  for (const v of Store.data.vorgaenge){
    if(!v.frist){
      const m = (v.notiz||"").match(/Angebotsfrist:\s*(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
      if(m){
        const jahr = m[3].length===2 ? "20"+m[3] : m[3];
        v.frist = jahr+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
        n++;
      }
    }
    if(!v.anfrageAm && v.herkunft === "Eingehende Anfrage"){
      const mails = DB.aktivitaetenVon(v.id).filter(a => a.typ === "E-Mail");
      const erste = mails.length ? mails[mails.length-1] : null;
      const tag = (erste && erste.datum) || (v.angelegt ? ISO(v.angelegt) : "");
      if(tag){ v.anfrageAm = tag; n++; }
    }
    if(!v.nachfassTage) v.nachfassTage = 14;
    /* Die frühere Spalte "Angebot erstellt" gibt es nicht mehr */
    if(v.stufe === "angebot_erstellt"){ v.stufe = "angebot_versendet"; n++; }
  }
  if(n) Store.save();
  return n;
}

   Der Text steht fertig da, wird aber nie automatisch verschickt –
   Romano liest gegen und schickt aus Outlook raus.
------------------------------------------------------------------- */
/* Im Feld Ansprechpartner steht nicht immer ein Mensch. Aus
   E-Mail-Anfragen landet dort auch "BV Frankfurt, Hain - Preisanfrage
   Bauendreinigung". So etwas darf nie in eine Anrede rutschen. */
const KEIN_NAME = /\d|@|https?:|\bbv\b|bauvorhaben|bauleitung|bauherr|gmbh|\bmbh|\bkg\b|\bag\b|\bohg\b|\be\.?\s?v\.?\b|anfrage|angebot|ausschreibung|vergabe|einreichung|reinigung|objekt|projekt|liegenschaft|str\.|stra(ss|\u00df)e|\bweg\b|\bplatz\b|leitung|einkauf|verwaltung|gesch\u00e4ftsf\u00fchr|sekretariat|hausmeister|facility|zentrale|empfang|abteilung|technik|personal|buchhalt|\binfo\b|\bteam\b|anlage|allee|chaussee|gerichtsstand|erf\u00fcllungsort|referent|informationen|disclaimer|copyright|impressum|\u00f6ffnungszeit|gesetzlich|rechtlich|prokurist|gesellschafter|\bz\.?\s?h(d|dn)?\.?/i;

/* Sieht der Eintrag nach einem Personennamen aus? Lieber einmal zu
   streng: eine neutrale Anrede ist besser als eine peinliche. */
function istPersonenname(s){
  const t = String(s||"").trim();
  if(!t || t.length > 40) return false;
  if(KEIN_NAME.test(t)) return false;
  const w = t.split(/\s+/);
  if(w.length < 2 || w.length > 4) return false;
  return w.every(x => /^[A-Z\u00c4\u00d6\u00dc][A-Za-z\u00c4\u00d6\u00dc\u00e4\u00f6\u00fc\u00df.\-']*$/.test(x));
}

/* "Frau Dr. Weber, Einkauf" -> "Frau Dr. Weber". Nichts Brauchbares -> "" */
function personKurz(ap){
  const s = String(ap||"").split(",")[0].trim().replace(/\s+/g," ");
  const m = s.match(/\b(Frau|Herrn?)\s+(.+)$/i);
  if(m && !KEIN_NAME.test(m[2])) return (/^f/i.test(m[1]) ? "Frau " : "Herr ")+m[2].trim();
  return istPersonenname(s) ? s : "";
}

function nachfassAnrede(ansprechpartner){
  const s = String(ansprechpartner||"").split(",")[0].trim();
  const m = s.match(/\b(Frau|Herrn?)\s+(.+)$/i);
  if(m && !KEIN_NAME.test(m[2]))
    return (/^f/i.test(m[1]) ? "Sehr geehrte Frau " : "Sehr geehrter Herr ")+m[2].trim()+",";
  if(istPersonenname(s)) return "Guten Tag, "+s+",";
  return "Sehr geehrte Damen und Herren,";
}

/* Objektnamen aus dem Mail-Import schleppen die ganze Betreffzeile mit:
   "Frankfurt, Hain - Preisanfrage Bauendreinigung". In einem Satz liest
   sich das furchtbar, also den Vorgangsteil abschneiden. */
const VORGANGSWORT = /anfrage|angebot|ausschreibung|vergabe|einreichung|preis|reinigung|frist|\blos\s?\d|leistungsverzeichnis|\blv\b/i;

function bezeichnungKuerzen(s){
  let t = String(s||"").trim().replace(/\s+/g," ");
  if(!t) return "";
  const teile = t.split(/\s+[-\u2013\u2014]\s+|_/);
  if(teile.length > 1){
    const kern = teile[0].trim();
    const rest = teile.slice(1).join(" ");
    if(kern.length >= 3 && VORGANGSWORT.test(rest)) t = kern;
  }
  return t.replace(/[,;.\s\-\u2013]+$/, "").trim();
}

/* Wie das Objekt in Betreff und Text genannt wird */
function objektText(v){

    const adr  = [o.strasse, o.ort].filter(Boolean).join(", ");
    if(name) return name;
    if(adr)  return adr;
  }
  return bezeichnungKuerzen(v.titel) || "Ihr Objekt";
}

const VORLAGEN_SCHLUESSEL = "nachfass_vorlagen";

/* Fingerabdruck der Vorlagen: greift die Felder in fester Reihenfolge ab.
   Nötig, weil Supabase den jsonb-Wert normalisiert und die Feldnamen dabei
   umsortiert – ein direkter Textvergleich der beiden JSON-Fassungen meldet
   sonst einen Unterschied, obwohl inhaltlich alles gleich ist. */
function vorlagenSignatur(d){
  d = d || {};
  const s = Array.isArray(d.stufen) ? d.stufen : [];
  const teile = [ String(d.ich||"").trim(), String(Number(d.nachfassTage)||14) ];
  for(let i=0;i<3;i++){
    const x = s[i] || {};
    teile.push(String(x.kurz||""), String(x.name||""), String(x.betreff||""), String(x.text||""));
  }
  return teile.join("\u0001");
}

const Vorlagen = {
  daten: null,

  /* Tiefe Kopie des Standards, damit Bearbeiten nichts kaputt macht */
  standard(){ return JSON.parse(JSON.stringify(VORLAGEN_STANDARD)); },

  aktuell(){
    if(!this.daten) this.daten = this.ausBrowser() || this.standard();
    return this.daten;
  },

    return (d.stufen && d.stufen[i]) || this.standard().stufen[i];
  },

  ausBrowser(){
    try{
      const roh = localStorage.getItem("aqt_vorlagen");
      if(!roh) return null;

      return (d && Array.isArray(d.stufen) && d.stufen.length===3) ? d : null;

     Browser-Stand bzw. der Standard stehen – die App läuft weiter. */
  async laden(){
    this.daten = this.ausBrowser() || this.standard();
    if(!Auth.eingeloggt()) return;
    try{

     gilt es als gespeichert – sonst stand hier vorher nur ein Toast,
     der weg war, bevor man ihn lesen konnte. */
  async sichern(){
    this.inBrowser();
    const browserOk = this.ausBrowser() !== null;
    const jetzt = new Date().toISOString();

    if(!Auth.eingeloggt()){
      this.status = { ort: browserOk ? "nur in diesem Browser" : "nur im Arbeitsspeicher",

      const gleich = !!zurueck && Array.isArray(zurueck.stufen) &&
        vorlagenSignatur(zurueck) === vorlagenSignatur(this.aktuell());
      this.status = {
        ort: "Supabase", zeit: jetzt,
        fehler: gleich ? "" : "geschrieben, aber beim Gegenlesen kam ein anderer Stand zurück"+

      };
      return this.status.fehler;
    }catch(e){
      console.error(e);
      this.status = { ort: browserOk ? "nur in diesem Browser" : "nur im Arbeitsspeicher",
                      zeit: jetzt, fehler: (e.message||String(e)) };
      return this.status.fehler;

/* Nur für die Fehlermeldung: welche Felder weichen ab? */
function vorlagenUnterschied(a, b){
  const namen = [];
  if(String((a||{}).ich||"").trim() !== String((b||{}).ich||"").trim()) namen.push("eigener Name");
  if((Number((a||{}).nachfassTage)||14) !== (Number((b||{}).nachfassTage)||14)) namen.push("Standardtage");
  const sa = Array.isArray((a||{}).stufen) ? a.stufen : [];
  const sb = Array.isArray((b||{}).stufen) ? b.stufen : [];
  for(let i=0;i<3;i++){
    for (const feld of ["kurz","name","betreff","text"])
      if(String((sa[i]||{})[feld]||"") !== String((sb[i]||{})[feld]||""))
        namen.push("Stufe "+(i+1)+" "+feld);
  }
  return namen.length ? namen.join(", ") : "kein Feld – nur die Speicherform";
}

/* Platzhalter ersetzen. Unbekannte Klammern bleiben stehen, damit ein
   Tippfehler in der Vorlage sofort auffällt und nicht still verschwindet. */
function vorlageFuellen(text, k){
  return String(text||"").replace(/\{(\w+)\}/g, (ganz, name) =>
    Object.prototype.hasOwnProperty.call(k, name) ? k[name] : ganz);
}

/* B35: gemeinsamer Teil von „Versendet – eintragen“ und der Rueckmeldung
   aus Outlook (NfExport.rueckmeldung) – Chronik, Stufe, naechste Wiedervorlage */
function nachfassVermerken(v, stufe, datum, txt){
  neueAktivitaet({
    vorgangId:v.id, typ:"E-Mail", datum:datum,
    text:"Nachfassen Stufe "+stufe+" ("+NACHFASS[stufe-1].kurz+") per E-Mail versendet\n\n"+txt
  });

  v.nachfassStufe = stufe;
  v.nachfassLetzte = datum;
  if(!v.ergebnis) v.stufe = "nachfass";
  for (const x of (v.wiedervorlagen||[]))
    if(!x.erledigt && (x.anlass||"").indexOf("Nachfassen") === 0) x.erledigt = true;

  const tage = nachfassFrist(v);
  if(stufe < 3){
    wvSetzen(v, plusTage(tage, datum), "Nachfassen zum Angebot (Stufe "+(stufe+1)+")");
    return "Stufe "+(stufe+1)+" in "+tage+" Tagen vorgemerkt";
  }
  wvSetzen(v, plusTage(14, datum), "Letzte Nachfassstufe ohne Antwort – Vorgang entscheiden");
  return "in 14 Tagen entscheiden";
}

/* ---------- 7c. Anhänge am Vorgang -----------------------------
   Die Datei geht sofort in die Supabase-Ablage, erst danach entsteht der
   Eintrag in der Tabelle – so gibt es keine Zeile ohne Datei dahinter.
   Der Dateiname wird für den Ablagepfad entschärft (keine Umlaute, keine
   Leerzeichen); angezeigt wird weiter der Originalname.
------------------------------------------------------------------- */
const ANH_MAX = 25 * 1024 * 1024;

function groesseText(n){
  n = Number(n)||0;
  if(n < 1024) return n+" B";
  if(n < 1024*1024) return (n/1024).toFixed(0)+" KB";
  return (n/1024/1024).toFixed(1).replace(".",",")+" MB";
}

function sicherName(name){
  const s = String(name||"datei")
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue")
    .replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss")
    .replace(/[^A-Za-z0-9._-]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
  return (s.length > 80 ? s.slice(-80) : s) || "datei";
}

async function anhaengeHochladen(vorgangId, dateien, danach){
  const liste = Array.prototype.slice.call(dateien||[]);
  if(!liste.length) return 0;
  if(!Auth.eingeloggt()){
    toast("Dateien brauchen die Supabase-Anmeldung – bitte anmelden");
    return 0;
  }
  let ok = 0; const fehler = [];
  for (const datei of liste){
    if(datei.size > ANH_MAX){
      fehler.push(datei.name+" ist zu gross ("+groesseText(datei.size)+", erlaubt sind 25 MB)");
      continue;
    }
    const id = uid();
    const pfad = vorgangId+"/"+id+"_"+sicherName(datei.name);
    ladeToast("Datei wird hochgeladen: "+datei.name+" …");
    try{
      await SB.dateiHoch(pfad, datei);
      neuerAnhang({ id, vorgangId, dateiname:datei.name, pfad,
        groesse:datei.size, typ:datei.type||"",
        hochgeladenVon:(Auth.user && Auth.user.email) || "" });
      ok++;
    }catch(e){
      console.error(e);
      fehler.push(datei.name+": "+(e.message||e));
    }
  }
  ladeToastWeg();
  if(ok) Store.save();
  if(fehler.length) toast("Nicht hochgeladen – "+fehler.join(" · "));
  else if(ok) toast(ok===1 ? "Datei angehängt" : ok+" Dateien angehängt");
  if(danach) danach(ok);
  return ok;
}

   Beim Übernehmen aus Outlook wird der komplette Text am Vorgang
   abgelegt, nicht in der Notiz. Hier steht er unverändert und lässt
   sich bei Altvorgängen auch von Hand einfügen. Oben die Eckdaten,
   darunter nach der Trennlinie die Mail, wie sie ankam.
------------------------------------------------------------------- */
const MAIL_TRENNER = "\u2500".repeat(30);

  const v = DB.vorgang(LayerCtx.vorgangId); if(!v) return;

  const i = txt.indexOf(MAIL_TRENNER);
  const eck  = i >= 0 ? txt.slice(0, i).trim() : "";
  const rest = i >= 0 ? txt.slice(i + MAIL_TRENNER.length).replace(/^\n/, "") : txt;

          "Mailtext hinterlegt. Die Mail in Outlook markieren, mit Strg+A und Strg+C kopieren und hier einfügen.</div>")+
        '<div class="field"><label>Originaltext der Mail</label>'+
          '<textarea id="mtText" style="min-height:420px;font-family:var(--mono);font-size:12.5px" '+
          'placeholder="Mailtext hier einfügen">'+esc(rest)+"</textarea></div>"+
      "</div>"+
      '<div class="drawer-foot">'+
        '<button class="btn primary" data-act="mail-ansicht-speichern">Speichern und zurück</button>'+
        '<button class="btn" data-act="mail-ansicht-kopieren">Text kopieren</button>'+

        '<button class="btn ghost" data-act="mail-ansicht-zurueck">Abbrechen</button>'+

    "</div>", { vorgangId:v.id, mailEck:eck }, true);

function mailAnsichtSpeichern(){
  const v = DB.vorgang(LayerCtx.vorgangId); if(!v) return;
  const rest = ($("#mtText")||{}).value || "";
  const eck  = LayerCtx.mailEck || "";
  const neu  = rest.trim() ? (eck ? eck+"\n"+MAIL_TRENNER+"\n"+rest : rest) : "";
  if(neu !== v.mailText){ v.mailText = neu; delete v.entwurf; }
  Store.save();
  vorgangOeffnen(v.id);

function leitKontext(v){
  const f = DB.firma(v.firmaId) || {};

  const akt = DB.aktivitaetenVon(v.id);
  const briefe = (f.briefe||[]).slice().sort((a,b)=>(a.datum||"").localeCompare(b.datum||""));
  const brief = briefe.length ? briefe[briefe.length-1] : null;
  const angebot = akt.find(a=>a.typ==="Angebot");
  const b = f.branche || "";
  return {
    ich: sprecherName(),
    firma: f.name || "die Firma",
    ap: personKurz(f.ansprechpartner),
    tel: (f.telefon||"").trim(),
    objekt: o ? bezeichnungKuerzen(o.name || o.strasse) : "",
    ort: (o && o.ort) || f.ort || "",
    briefDatum: brief ? fmtDatum(brief.datum) : "",
    angebotDatum: angebot ? fmtDatum(angebot.datum) : "",
    profil: b==="Medizin"          ? "wir sind auf Gebäudereinigung im medizinischen Bereich spezialisiert"

  };
}

function leitVorschlag(v){
  const f = DB.firma(v.firmaId) || {};
  if(v.ergebnis==="gewonnen") return "empfehlung";
  if(v.stufe==="angebot_versendet" || v.stufe==="nachfass") return "nachfass_angebot";
  if(v.stufe==="besichtigung" || v.stufe==="kontaktiert") return "besichtigung";
  if((f.briefe||[]).length) return "nachfass_brief";
  if((v.kontaktweg || f.kontaktweg) === "Passiv") return "nachfass_brief";
  return "erst_aktiv";
}

        "<div style='min-width:0'><div class=\"eyebrow\">Gesprächsleitfaden · "+esc(k.firma)+"</div>"+
        "<h2>"+esc(lf.name)+"</h2></div><div style='flex:1'></div>"+
        '<button class="btn ghost" data-act="leit-zurueck">Zurück zum Vorgang</button>'+
      "</div>"+
      '<div class="drawer-body"><div class="dlg2">'+

        "<div>"+
          '<div class="section"><div class="section-t">Situation</div>'+
            '<div class="grid2">'+
              '<div class="field"><label>Leitfaden</label><select id="leitTyp">'+
                optionen(LEITFAEDEN.map(x=>({id:x.id,name:x.name})), lf.id)+"</select></div>"+
              '<div class="field"><label>Ich melde mich als</label><input type="text" id="leitIch" value="'+esc(k.ich)+'"></div>'+
            "</div>"+
            '<div class="tiny muted" style="margin-top:10px;line-height:1.8">'+
              (k.ap ? "Ansprechpartner: <b>"+esc(k.ap)+"</b>" : "Kein Ansprechpartner hinterlegt")+" · "+
              (k.tel ? 'Telefon: <a href="tel:'+esc(telHref)+'">'+esc(k.tel)+"</a>" : "keine Telefonnummer")+
              (k.objekt ? " · Objekt: "+esc(k.objekt) : "")+
            "</div>"+
            '<div class="hint" style="margin-top:10px"><b>Ziel:</b> '+esc(lf.ziel)+"</div>"+
          "</div>"+

          '<div class="section"><div class="section-t">Einstieg'+
            '<span class="add"><button class="btn sm" data-act="leit-kopieren">Kopieren</button></span></div>'+
            '<div class="field"><textarea id="leitEinstieg" style="min-height:120px">'+esc(lf.einstieg(k))+"</textarea></div>"+
            '<div class="tiny muted" style="margin-top:6px">Text lässt sich hier ändern, bevor er kopiert wird.</div>'+
          "</div>"+

          '<div class="section"><div class="section-t">Das soll am Ende beantwortet sein</div>'+
            '<ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.9">'+
              lf.fragen.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ol>"+

          "</div>"+
        "</div>"+

        "<div>"+
          '<div class="section"><div class="section-t">Einwandbehandlung</div>'+
            EINWAENDE.map(x=>

              "</details>").join("")+

          '<div class="section"><div class="section-t">Ergebnis festhalten</div>'+
            '<div class="field"><label>Was kam raus</label>'+
              '<textarea id="leitNotiz" placeholder="Frau Weber ist zuständig, Ausschreibung im Herbst"></textarea></div>'+
            '<div class="field" style="margin-top:10px"><label>Nächster Kontakt am (optional)</label>'+
              '<input type="date" id="leitDatum"></div>'+
            '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+
              '<button class="btn primary sm" data-act="leit-erreicht">Erreicht</button>'+
              '<button class="btn sm" data-act="leit-nicht">Nicht erreicht</button>'+

            "erreicht in 14 Tagen, nicht erreicht in 3 Tagen, Termin in 7 Tagen. Steht oben ein Datum, gilt das stattdessen.</div>"+
          "</div>"+

      "</div></div>"+
